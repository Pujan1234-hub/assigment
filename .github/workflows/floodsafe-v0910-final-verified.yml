name: FloodSafe v0.9.10 FINAL VERIFIED

on:
  push:
    branches: [ fix/floodsafe-v0908-storm-events-compact-gauge ]
    paths:
      - '.github/workflows/floodsafe-v0910-final-verified.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Freeze protected official river sources
        shell: bash
        run: |
          set -euo pipefail
          J='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app'
          sha256sum "$J/BipadRealtimeStationFeed.java" "$J/OfficialRiverData.java" "$J/DhmRainMirror.java" "$J/FloodMonitorService.java" > /tmp/river.before

      - name: Rebuild verified v0.9.09 base
        shell: bash
        run: |
          set -euo pipefail
          python3 floodsafe-android-app/patch_native_language_safe.py
          python3 floodsafe-android-app/patch_native_weather_complete.py
          python3 floodsafe-android-app/patch_native_weather_station_correction.py
          python3 floodsafe-android-app/patch_native_v0906_district_196_rain.py
          python3 floodsafe-android-app/patch_native_v0907_district_click.py
          python3 floodsafe-android-app/patch_native_v0908_step1_river_click.py
          python3 floodsafe-android-app/patch_native_v0908_step2_compact_district.py
          python3 floodsafe-android-app/fix_v0908_step3_weather_refresh_anchor.py
          python3 floodsafe-android-app/patch_native_v0908_step3_storm_notifications.py
          python3 floodsafe-android-app/patch_native_v0909_sync_sathi_language.py
          python3 floodsafe-android-app/fix_v0909_district_lambda_compile.py
          grep -Fq "versionName '0.9.09-live77-sathi-fastlang'" floodsafe-android-app/app/build.gradle
          J='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app'
          sha256sum "$J/FloodSafeNativeMapView.java" "$J/WeatherMapOverlayController.java" > /tmp/mapweather.v0909
          gradle -p floodsafe-android-app :app:compileDebugJavaWithJavac --no-daemon

      - name: STEP 1 conversational SATHI only
        shell: bash
        run: |
          set -euo pipefail
          J='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app'
          UI="$J/NativeFullActivity.java"
          python3 floodsafe-android-app/patch_native_v0910_step1_sathi_chat.py
          grep -Fq 'V0910_SATHI_CONVERSATIONAL_CHAT' "$UI"
          grep -Fq 'V0910_SATHI_NATURAL_GROUNDED_ANSWERS' "$UI"
          grep -Fq 'appendSathiTurn' "$UI"
          grep -Fq 'For example: Will it rain today?' "$UI"
          ! grep -Fq 'recreate();' "$UI"
          sha256sum "$J/FloodSafeNativeMapView.java" "$J/WeatherMapOverlayController.java" > /tmp/mapweather.after_sathi
          cmp /tmp/mapweather.v0909 /tmp/mapweather.after_sathi
          sha256sum "$J/BipadRealtimeStationFeed.java" "$J/OfficialRiverData.java" "$J/DhmRainMirror.java" "$J/FloodMonitorService.java" > /tmp/river.after_sathi
          cmp /tmp/river.before /tmp/river.after_sathi
          sha256sum "$UI" > /tmp/ui.after_sathi
          gradle -p floodsafe-android-app :app:compileDebugJavaWithJavac --no-daemon

      - name: STEP 2 district and zoom place labels only
        shell: bash
        run: |
          set -euo pipefail
          J='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app'
          UI="$J/NativeFullActivity.java"; MAP="$J/FloodSafeNativeMapView.java"; WEATHER="$J/WeatherMapOverlayController.java"
          sha256sum "$WEATHER" > /tmp/weather.before_labels
          python3 floodsafe-android-app/patch_native_v0910_step2_map_labels.py
          grep -Fq 'V0910_ZOOM_PLACE_REFERENCE_LABELS' "$MAP"
          grep -Fq 'V0910_DISTRICT_LABEL_POINTS' "$MAP"
          grep -Fq 'V0910_DISTRICT_AND_PLACE_LABELS' "$MAP"
          grep -Fq 'World_Boundaries_and_Places' "$MAP"
          grep -Fq 'new SymbolLayer("fs-district-labels"' "$MAP"
          grep -Fq "versionName '0.9.10-sathi-chat-map-labels'" floodsafe-android-app/app/build.gradle
          sha256sum "$UI" > /tmp/ui.after_labels
          cmp /tmp/ui.after_sathi /tmp/ui.after_labels
          sha256sum "$WEATHER" > /tmp/weather.after_labels
          cmp /tmp/weather.before_labels /tmp/weather.after_labels
          sha256sum "$J/BipadRealtimeStationFeed.java" "$J/OfficialRiverData.java" "$J/DhmRainMirror.java" "$J/FloodMonitorService.java" > /tmp/river.after_labels
          cmp /tmp/river.before /tmp/river.after_labels
          gradle -p floodsafe-android-app :app:compileDebugJavaWithJavac --no-daemon

      - name: Verify complete 77 district source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          fs=json.loads(pathlib.Path('floodsafe-nepal/v24/nepal-districts.geojson').read_text()).get('features') or []
          names=[(f.get('properties') or {}).get('nameEn','').strip() for f in fs]
          assert len(fs)==77,len(fs)
          assert len(set(names))==77,len(set(names))
          assert all(names)
          print('DISTRICTS=77')
          PY

      - name: Test and assemble APK
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/v0910.log

      - name: Verify APK and stage files
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'
          OUT='FloodSafe-Nepal-v0.9.10-SATHI-CHAT-MAP-LABELS.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -Fq 'AndroidManifest.xml'
          unzip -l "$APK" | grep -Fq 'assets/floodsafe-nepal/v24/nepal-districts.geojson'
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-waterways-tiles/overview.json'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
          rm -f /tmp/dexstrings
          while IFS= read -r DEX; do unzip -p "$APK" "$DEX" | strings >> /tmp/dexstrings; done < <(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?\.dex$')
          grep -Fq 'fs-district-labels' /tmp/dexstrings
          grep -Fq 'World_Boundaries_and_Places' /tmp/dexstrings
          grep -Fq 'Will it rain today?' /tmp/dexstrings
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee FloodSafe-Nepal-v0.9.10-SHA256.txt
          printf '%s\n' \
            'FloodSafe Nepal v0.9.10 final verified build' \
            '- STEP 1 only: SATHI now keeps a visible conversation transcript, answers typed questions, supports voice, and uses natural grounded app-data responses' \
            '- STEP 2 only: district names are native map labels; zoomed map gets Esri reference place labels above imagery' \
            '- Existing 77-district source remains verified' \
            '- Existing v0.9.09 language no-recreate behavior remains' \
            '- BIPAD/DHM/river monitor source files unchanged' \
            '- Weather overlay unchanged' \
            > FloodSafe-Nepal-v0.9.10-NOTES.txt

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-v0910-FINAL-VERIFIED
          path: |
            FloodSafe-Nepal-v0.9.10-SATHI-CHAT-MAP-LABELS.apk
            FloodSafe-Nepal-v0.9.10-SHA256.txt
            FloodSafe-Nepal-v0.9.10-NOTES.txt
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-v0910-build-log
          path: /tmp/v0910.log
          if-no-files-found: ignore
          retention-days: 2
