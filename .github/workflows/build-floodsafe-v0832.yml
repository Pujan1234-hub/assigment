name: Build FloodSafe v0.8.32 Strict Blue Nepal Flow

on:
  push:
    branches: [ main ]
    paths:
      - 'floodsafe-android-app/patch_native_v0832_restore_strict_blue_flow.py'
      - '.github/workflows/build-floodsafe-v0832.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply FloodSafe patches through v0.8.32
        run: |
          set -euo pipefail
          python3 floodsafe-android-app/patch_webview_crash.py
          python3 floodsafe-android-app/patch_launcher_reopen_hard_reset.py
          python3 floodsafe-android-app/patch_auto_alerts.py
          python3 floodsafe-android-app/patch_river_waterlevel.py
          python3 floodsafe-android-app/patch_two_hour_weather.py
          python3 floodsafe-android-app/patch_cold_start_blank.py
          python3 floodsafe-android-app/patch_cross_device_navigation.py
          python3 floodsafe-android-app/patch_native_compat_fallback.py
          python3 floodsafe-android-app/patch_map_smooth_v075.py
          python3 floodsafe-android-app/patch_full_native_v080.py
          python3 floodsafe-android-app/patch_native_v081_polish.py
          python3 floodsafe-android-app/patch_native_v081_escape_fix.py
          python3 floodsafe-android-app/patch_native_maplibre_v082.py
          python3 floodsafe-android-app/patch_native_map_detail_v083.py
          python3 floodsafe-android-app/patch_native_v084_sathi_map.py
          python3 floodsafe-android-app/patch_native_v085_flow_sathi.py
          python3 floodsafe-android-app/patch_native_v086_full_waterways.py
          python3 floodsafe-android-app/patch_native_v087_runtime_rivers.py
          python3 floodsafe-android-app/patch_native_v088_restore_web_rivers.py
          python3 floodsafe-android-app/patch_native_v089_realtime_gauges.py
          python3 floodsafe-android-app/patch_native_v0810_live_source_colours.py
          python3 floodsafe-android-app/patch_native_v0810_compile_fix.py
          python3 floodsafe-android-app/patch_native_v0811_map_anr_fix.py
          python3 floodsafe-android-app/patch_native_v0812_trusted_latest_flow.py
          python3 floodsafe-android-app/patch_native_v0813_prep_truth_ui.py
          python3 floodsafe-android-app/patch_native_v0813_nepal_truth_map.py
          python3 floodsafe-android-app/patch_native_v0814_prep_runtime_counts.py
          python3 floodsafe-android-app/patch_native_v0814_source_exact_smooth.py
          python3 floodsafe-android-app/patch_native_v0814_compile_fix.py
          python3 floodsafe-android-app/patch_native_v0815_single_source_truth.py
          python3 floodsafe-android-app/patch_native_v0816_current_only_map.py
          python3 floodsafe-android-app/patch_native_v0817_clean_web_map.py
          python3 floodsafe-android-app/patch_native_v0817_compile_rain_fix.py
          python3 floodsafe-android-app/patch_native_v0818_direct_river_clean_flow.py
          python3 floodsafe-android-app/patch_native_v0819_web_live_master.py
          python3 floodsafe-android-app/patch_native_v0820_place_labels_prep.py
          python3 floodsafe-android-app/patch_native_v0820_nepal_mask_prep.py
          python3 floodsafe-android-app/patch_native_v0820_nepal_only_local_rivers.py
          python3 floodsafe-android-app/patch_native_v0821_actual_river_geometry.py
          python3 floodsafe-android-app/patch_native_v0822_viewport_rivers.py
          python3 floodsafe-android-app/patch_native_v0823_visible_bounds_rivers.py
          python3 floodsafe-android-app/patch_native_v0824_strict_nepal_source_truth.py
          python3 floodsafe-android-app/patch_native_v0825_segment_current_flow.py
          python3 floodsafe-android-app/patch_native_v0825_helper_restore.py
          python3 floodsafe-android-app/patch_native_v0826_video_map_ui.py
          python3 floodsafe-android-app/patch_native_v0827_compact_realtime_map.py
          python3 floodsafe-android-app/patch_native_v0828_finish_blue_nepal_map.py
          python3 floodsafe-android-app/patch_native_v0828_compile_fix.py
          python3 floodsafe-android-app/patch_native_v0829_flow_glow_dense_network.py
          python3 floodsafe-android-app/patch_native_v0830_visible_blue_glow_everywhere.py
          python3 floodsafe-android-app/patch_native_v0831_hard_nepal_clip.py
          python3 floodsafe-android-app/patch_native_v0832_restore_strict_blue_flow.py

      - name: Verify map truth and safety
        run: |
          set -euo pipefail
          M='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java'
          A='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/NativeFullActivity.java'
          G='floodsafe-android-app/app/build.gradle'
          grep -Fq 'List<RiverWay> chosen=clipWaysToNepalDense(candidates,nepal);' "$M"
          grep -Fq 'style.addSource(new GeoJsonSource("fs-rivers", emptyFeatureCollection()))' "$M"
          grep -Fq 'lineWidth((float)(7.4+2.4*wave))' "$M"
          grep -Fq 'lineWidth((float)(3.0+0.35*wave))' "$M"
          grep -Fq 'main.postDelayed(this::refreshVisibleRiverTiles,5200L)' "$M"
          grep -Fq 'latest reading "+latest' "$A"
          grep -Fq 'no latest "+missing' "$A"
          grep -Fq 'bestD<=2d&&best.fresh&&(best.stage.equals("warning")||best.stage.equals("danger"))' "$A"
          grep -Fq 'versionCode 52' "$G"
          grep -Fq "versionName '0.8.32'" "$G"
          if grep -Fq 'viewportInsideNepalStrict(fw,fs,fe,fn,nepal)?copyWaysExact(candidates)' "$M"; then exit 1; fi

      - name: Bundle assets
        run: gradle -p floodsafe-android-app clean :app:bundleFloodSafe --no-daemon

      - name: Optimize retained web assets
        run: |
          python3 floodsafe-android-app/patch_low_end_sathi.py
          python3 floodsafe-android-app/patch_low_end_map.py

      - name: Build and unit test APK
        run: gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug -x bundleFloodSafe --no-daemon --stacktrace

      - name: Rename APK
        run: cp floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk FloodSafe-Nepal-v0.8.32-STRICT-BLUE-FLOW.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-v0832-STRICT-BLUE-FLOW-APK
          path: FloodSafe-Nepal-v0.8.32-STRICT-BLUE-FLOW.apk
          retention-days: 14
