name: FloodSafe 10m Freshness Smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'floodsafe-nepal/v25/**'
      - 'tests/floodsafe-refresh.test.cjs'
      - '.github/workflows/v25-freshness-10m-smoke.yml'
permissions:
  contents: read
concurrency:
  group: floodsafe-10m-freshness
  cancel-in-progress: true
jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce 10-minute freshness windows
        run: |
          set -euo pipefail
          grep -Fq 'FRESH_MS=10*60*1000' floodsafe-nepal/v25/trusted-river-runtime-v3.js
          grep -Fq 'MAX=10*60*1000' floodsafe-nepal/v25/trusted-rain-runtime-v1.js
          grep -Fq 'MAX=10*60*1000' floodsafe-nepal/v25/news-live-v5.js
          grep -Fq 'FRESH_MS=10*60*1000' floodsafe-nepal/v25/impact-live-v1.js
          grep -Fq 'FRESH10_MS=10*60*1000' floodsafe-nepal/v25/realtime-guard-v1.js
          grep -Fq 'CURRENT_MS=10*60*1000' floodsafe-nepal/v25/official-stale-safety-v1.js
      - name: Verify freshness boundaries, empty states, new arrivals and retention
        run: node --test tests/floodsafe-refresh.test.cjs
