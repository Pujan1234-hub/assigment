name: V24 Map Browser Smoke
on:
  push:
    branches: ["main"]
    paths:
      - "floodsafe-nepal/v24/**"
      - ".github/workflows/v24-browser-smoke.yml"
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Verify V24 real map runtime
        run: |
          set -e
          URL='https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v24/'
          mustgrep(){ grep -q "$1" "$2" || { echo "ASSERT FAIL: $1 in $2"; exit 20; }; echo "PASS: $1"; }
          ok=0
          for i in $(seq 1 40); do
            if curl -fsSL "$URL" -o /tmp/v24.html && grep -q 'बाढी सुरक्षा नेपाल • V24' /tmp/v24.html && curl -fsSL "${URL}nepal-districts.geojson" -o /tmp/nepal.json; then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1
          echo 'PASS: public V24 and Nepal GeoJSON reachable'
          python - <<'PY'
          import json,re
          from pathlib import Path
          j=json.load(open('/tmp/nepal.json'))
          assert j['type']=='FeatureCollection' and len(j['features'])>=77, len(j.get('features',[]))
          s=Path('/tmp/v24.html').read_text()
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S)
          assert blocks
          for i,b in enumerate(blocks):Path(f'/tmp/inline-{i}.js').write_text(b)
          print('PASS: districts',len(j['features']),'inline scripts',len(blocks))
          PY
          for f in /tmp/inline-*.js; do node --check "$f"; done
          echo 'PASS: inline JS syntax'
          curl -fsSL "${URL}v23-upgrade.js?v=1" -o /tmp/v23copy.js
          curl -fsSL "${URL}v24-upgrade.js?v=1" -o /tmp/v24.js
          node --check /tmp/v23copy.js
          node --check /tmp/v24.js
          echo 'PASS: upgrade JS syntax'
          mustgrep "fetchJSON('./nepal-districts.geojson'" /tmp/v24.html
          mustgrep 'renderDistricts()' /tmp/v24.html
          mustgrep 'setInterval(refreshSlow' /tmp/v24.html
          mustgrep 'showRiverStatus' /tmp/v24.html
          mustgrep 'const POLL=5000' /tmp/v23copy.js
          mustgrep 'FS24_API_CACHE_MS=30000' /tmp/v24.js
          mustgrep '__floodsafeScaleBridge' /tmp/v24.js
          mkdir -p /tmp/v24-smoke && cd /tmp/v24-smoke
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24.31.0 >/dev/null 2>&1
          URL="$URL" node <<'JS'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:'/usr/bin/chromium',headless:true,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage']});
            try{
              const page=await browser.newPage();
              page.setDefaultTimeout(35000);
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              await page.goto(process.env.URL,{waitUntil:'domcontentloaded',timeout:35000});
              await page.waitForSelector('.leaflet-container',{timeout:25000});
              await page.waitForFunction(()=>{const x=document.getElementById('loading');return x&&getComputedStyle(x).display==='none'},{timeout:25000});
              await page.waitForSelector('#fs24riverFloat',{timeout:25000});
              const state=await page.evaluate(()=>({
                title:document.title,
                loading:getComputedStyle(document.getElementById('loading')).display,
                map:!!document.querySelector('.leaflet-container'),
                riverPanel:!!document.getElementById('fs24riverFloat'),
                reportedFailure:document.body.innerText.includes('नक्सा लोड असफल'),
                scale:!!window.__floodsafeScaleBridge,
                feed:document.getElementById('feedState')?.textContent||''
              }));
              console.log('BROWSER STATE',JSON.stringify(state));
              if(!state.map||state.loading!=='none'||!state.riverPanel||state.reportedFailure||!state.scale)process.exitCode=2;
              if(errors.length)console.log('PAGE ERRORS',errors.slice(0,8));
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(3)});
          JS
          echo 'V24 real map browser smoke passed'
