name: FloodSafe Nepal Police Sync

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh verified Nepal Police flood fatalities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from urllib.request import Request,urlopen
          from html import unescape
          import re,json,pathlib
          url='https://www.nepalpolice.gov.np/news/10245/'
          req=Request(url,headers={'User-Agent':'Mozilla/5.0 FloodSafeNepal/1.0'})
          raw=urlopen(req,timeout=25).read().decode('utf-8','ignore')
          txt=unescape(re.sub(r'<[^>]+>',' ',raw))
          txt=re.sub(r'\s+',' ',txt)
          trans=str.maketrans('०१२३४५६७८९','0123456789')
          asc=txt.translate(trans)
          names=[('Rasuwa','रसुवा'),('Nuwakot','नुवाकोट'),('Dhading','धादिङ'),('Chitwan','चितवन'),('Gorkha','गोरखा'),('Tanahun','तनहुँ'),('Nawalparasi East','नवलपरासी पूर्व')]
          districts=[]
          for en,ne in names:
              m=re.search(re.escape(ne)+r'मा\s*([0-9]+)\s*जना',asc)
              if m: districts.append({'name':en,'name_ne':ne,'deaths':int(m.group(1))})
          total=sum(x['deaths'] for x in districts)
          if total<=0:
              m=re.search(r'([0-9]+)\s*जनाको\s*(?:शव|मृत्यु)',asc)
              if m: total=int(m.group(1))
          tm=re.findall(r'([0-9]{1,2})\s*:\s*([0-9]{2})\s*बजे',asc)
          time=':'.join(tm[-1]) if tm else '—'
          if total<=0: raise SystemExit('Could not parse verified Nepal Police death total')
          data={
            'source':'Nepal Police','source_url':url,'event':'Rasuwa flood','event_ne':'रसुवा बाढी',
            'cause':'Flood','cause_ne':'बाढी','total_deaths':total,'official_update_bs':'2083-05-10',
            'official_update_time':time,'districts':districts,'status':'verified',
            'note':'Latest verified Nepal Police update available to FloodSafe.'
          }
          p=pathlib.Path('data/floodsafe-police.json');p.parent.mkdir(parents=True,exist_ok=True)
          old=json.loads(p.read_text()) if p.exists() else None
          if old!=data:p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          if git diff --quiet -- data/floodsafe-police.json; then
            echo 'No Nepal Police change'
            exit 0
          fi
          git config user.name 'FloodSafe Police Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add data/floodsafe-police.json
          git commit -m 'Update verified Nepal Police fatalities'
          git push
