name: FloodSafe v0.9.11 SATHI LIVE DATA + SAFE ALERTS v3

on:
  push:
    branches: [ fix/floodsafe-v0908-storm-events-compact-gauge ]
    paths:
      - '.github/workflows/floodsafe-v0911-sathi-alert-final-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Rebuild verified v0.9.10 base
        shell: bash
        run: |
          set -euo pipefail
          python3 floodsafe-android-app/patch_native_language_safe.py
          python3 floodsafe-android-app/patch_native_weather_complete.py
          python3 floodsafe-android-app/patch_native_weather_station_correction.py
          python3 floodsafe-android-app/patch_native_v0906_district_196_rain.py
          python3 floodsafe-android-app/patch_native_v0907_district_click.py
          python3 floodsafe-android-app/patch_native_v0908_step1_river_click.py
          python3 floodsafe-android-app/patch_native_v0908_step2_compact_district.py
          python3 floodsafe-android-app/fix_v0908_step3_weather_refresh_anchor.py
          python3 floodsafe-android-app/patch_native_v0908_step3_storm_notifications.py
          python3 floodsafe-android-app/patch_native_v0909_sync_sathi_language.py
          python3 floodsafe-android-app/fix_v0909_district_lambda_compile.py
          python3 floodsafe-android-app/patch_native_v0910_step1_sathi_chat.py
          python3 floodsafe-android-app/patch_native_v0910_step2_map_labels.py
          grep -Fq "versionName '0.9.10-sathi-chat-map-labels'" floodsafe-android-app/app/build.gradle
          J='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app'
          sha256sum "$J/FloodSafeNativeMapView.java" "$J/WeatherMapOverlayController.java" "$J/BipadRealtimeStationFeed.java" "$J/OfficialRiverData.java" "$J/DhmRainMirror.java" "$J/FloodMonitorService.java" "$J/RiverAlertWorker.java" > /tmp/protected.v0910
          sha256sum "$J/FloodLiveGaugeMonitor.java" > /tmp/fastalert.v0910
          gradle -p floodsafe-android-app :app:compileDebugJavaWithJavac --no-daemon

      - name: STEP 1 SATHI live bilingual app data and Nepal place weather
        shell: bash
        run: |
          set -euo pipefail
          J='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app'; UI="$J/NativeFullActivity.java"
          python3 floodsafe-android-app/patch_native_v0911_sathi_live_data.py
          python3 floodsafe-android-app/fix_v0911_version_code.py
          grep -Fq 'V0911_SATHI_LIVE_DATA_CHAT' "$UI"
          grep -Fq 'V0911_SATHI_BILINGUAL_LOCAL_KNOWLEDGE' "$UI"
          grep -Fq 'V0911_SATHI_PLACE_WEATHER' "$UI"
          grep -Fq 'geocoding-api.open-meteo.com' "$UI"
          grep -Fq 'Jhapa' "$UI"
          grep -Fq 'Kathmandu' "$UI"
          grep -Fq "versionCode 28" floodsafe-android-app/app/build.gradle
          grep -Fq "versionName '0.9.11-sathi-live-all-data-alert-safe'" floodsafe-android-app/app/build.gradle
          sha256sum "$J/FloodSafeNativeMapView.java" "$J/WeatherMapOverlayController.java" "$J/BipadRealtimeStationFeed.java" "$J/OfficialRiverData.java" "$J/DhmRainMirror.java" "$J/FloodMonitorService.java" "$J/RiverAlertWorker.java" > /tmp/protected.after_sathi
          cmp /tmp/protected.v0910 /tmp/protected.after_sathi
          sha256sum "$J/FloodLiveGaugeMonitor.java" > /tmp/fastalert.after_sathi
          cmp /tmp/fastalert.v0910 /tmp/fastalert.after_sathi
          gradle -p floodsafe-android-app :app:compileDebugJavaWithJavac --no-daemon

      - name: STEP 2 fast emergency alert uses actual matched river geometry
        shell: bash
        run: |
          set -euo pipefail
          J='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app'; FAST="$J/FloodLiveGaugeMonitor.java"
          python3 floodsafe-android-app/patch_native_v0911_fast_alert_geometry.py
          python3 floodsafe-android-app/fix_v0911_alert_imports.py
          grep -Fq 'V0911_FAST_ALERT_ACTUAL_RIVER_GEOMETRY' "$FAST"
          grep -Fq 'V0911_FAST_ALERT_FRESH_ONLY' "$FAST"
          grep -Fq 'distanceToRiverKm(homeLat,homeLon,affected)' "$FAST"
          grep -Fq 'import java.util.List;' "$FAST"
          grep -Fq 'import java.util.ArrayList;' "$FAST"
          ! grep -Fq 'double distance=haversineKm(homeLat,homeLon,la,lo)' "$FAST"
          sha256sum "$J/FloodSafeNativeMapView.java" "$J/WeatherMapOverlayController.java" "$J/BipadRealtimeStationFeed.java" "$J/OfficialRiverData.java" "$J/DhmRainMirror.java" "$J/FloodMonitorService.java" "$J/RiverAlertWorker.java" > /tmp/protected.after_alert
          cmp /tmp/protected.v0910 /tmp/protected.after_alert
          gradle -p floodsafe-android-app :app:compileDebugJavaWithJavac --no-daemon

      - name: Verify complete 77 districts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          fs=json.loads(pathlib.Path('floodsafe-nepal/v24/nepal-districts.geojson').read_text()).get('features') or []
          names=[(f.get('properties') or {}).get('nameEn','').strip() for f in fs]
          assert len(fs)==77 and len(set(names))==77 and all(names)
          print('DISTRICTS=77')
          PY

      - name: Test and assemble APK
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/v0911-v3.log

      - name: Verify APK and stage files
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'
          OUT='FloodSafe-Nepal-v0.9.11-SATHI-LIVE-DATA-SAFE-ALERTS.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-waterways-tiles/overview.json'
          unzip -l "$APK" | grep -Fq 'assets/floodsafe-nepal/v24/nepal-districts.geojson'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
          rm -f /tmp/dexstrings
          while IFS= read -r DEX; do unzip -p "$APK" "$DEX" | strings >> /tmp/dexstrings; done < <(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?\.dex$')
          grep -Fq 'geocoding-api.open-meteo.com' /tmp/dexstrings
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee FloodSafe-Nepal-v0.9.11-SHA256.txt
          printf '%s\n' \
            'FloodSafe Nepal v0.9.11 final verified build' \
            '- SATHI understands Nepali/English weather, river/station, district, notification, GPS and app-feature questions' \
            '- Named Nepal place weather uses Open-Meteo geocoding + live forecast; examples include Jhapa temperature and Kathmandu rain today' \
            '- SATHI river/district answers are grounded in the current in-app official station set' \
            '- Fast background Warning/Danger path uses fresh measurement + safely matched actual river geometry within 2 km, not station-dot distance' \
            '- Existing native river map, river mapping, weather overlay, BIPAD feed, DHM mirror, FloodMonitorService and RiverAlertWorker are unchanged' \
            '- Existing 77 districts, map labels and fast language switch remain' \
            > FloodSafe-Nepal-v0.9.11-NOTES.txt

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-v0911-FINAL-VERIFIED-v3
          path: |
            FloodSafe-Nepal-v0.9.11-SATHI-LIVE-DATA-SAFE-ALERTS.apk
            FloodSafe-Nepal-v0.9.11-SHA256.txt
            FloodSafe-Nepal-v0.9.11-NOTES.txt
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-v0911-v3-build-log
          path: /tmp/v0911-v3.log
          if-no-files-found: ignore
          retention-days: 2
