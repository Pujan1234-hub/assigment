name: PJBUILTS Vault Android APK
on:
  push:
    branches:
      - pjbuilts-vault-secure-build
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ensure SDK platform 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' || true
      - name: Unpack secure vault source
        run: |
          mkdir -p vault-android
          base64 -d vault-project.tar.gz.b64 | tar -xz -C vault-android
      - name: Apply Android platform compatibility correction
        run: |
          sed -i 's/BiometricPrompt.BIOMETRIC_ERROR_NEGATIVE_BUTTON/BiometricPrompt.BIOMETRIC_ERROR_USER_CANCELED/g' vault-android/app/src/main/java/com/pjbuilts/vault/MainActivity.java
      - name: Require PIN + strong biometric on every unlock
        run: python vault-2fa-patch.py
      - name: Build installable APK
        run: cd vault-android && gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PJBUILTS-Vault-v2.1.0-2FA-APK
          path: vault-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Publish compiled beta APK for direct retrieval
        if: success()
        run: |
          base64 -w0 vault-android/app/build/outputs/apk/debug/app-debug.apk > PJBUILTS-Vault-v2.1.0-2FA.apk.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PJBUILTS-Vault-v2.1.0-2FA.apk.b64
          git commit -m 'Publish Vault 2FA APK [skip ci]'
          git push origin HEAD:pjbuilts-vault-secure-build
