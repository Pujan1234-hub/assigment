name: Build FloodSafe Full Native APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'floodsafe-android-app/**'
      - 'floodsafe-nepal/**'
      - 'data/**'
      - '.github/workflows/package-floodsafe-native-apk.yml'
permissions:
  contents: read
jobs:
  native-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Convert launcher to full native Android
        run: python3 floodsafe-android-app/patch_native_full.py

      - name: Native-only source gate
        shell: bash
        run: |
          set -euo pipefail
          NATIVE='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/NativeFullActivity.java'
          VOICE='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/VoiceMainActivity.java'
          SPLASH='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/PJBuiltsSplashActivity.java'
          SATHI='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/SathiWakeService.java'
          PUSH='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeMessagingService.java'
          grep -Fq 'public final class VoiceMainActivity extends NativeFullActivity' "$VOICE"
          grep -Fq 'public class NativeFullActivity extends Activity implements LocationListener' "$NATIVE"
          grep -Fq 'new Intent(this, VoiceMainActivity.class)' "$SPLASH"
          grep -Fq 'new Intent(this, VoiceMainActivity.class)' "$SATHI"
          grep -Fq 'new Intent(this,VoiceMainActivity.class)' "$PUSH"
          grep -Fq 'case"normal":return"🔵";' "$NATIVE"
          grep -Fq 'Source: BIPAD official' "$NATIVE"
          grep -Fq 'private final Runnable riverPoll=' "$NATIVE"
          grep -Fq "versionName '0.8.0'" floodsafe-android-app/app/build.gradle
          grep -Fq 'versionCode 15' floodsafe-android-app/app/build.gradle
          if grep -Fq 'extends MainActivity' "$VOICE"; then echo 'WebView launcher inheritance still active'; exit 1; fi
          if grep -Fq 'android.webkit' "$VOICE"; then echo 'Voice launcher still imports WebView APIs'; exit 1; fi
          if grep -Fq 'import android.webkit.WebView' "$NATIVE"; then echo 'NativeFullActivity imports WebView'; exit 1; fi
          echo 'FloodSafe native source gate PASS'

      - name: Unit tests and native APK build
        run: gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Verify native APK package
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -Eq 'classes[0-9]*\.dex'
          unzip -l "$APK" | grep -Fq 'assets/floodsafe-nepal/v24/nepal-districts'
          unzip -p "$APK" classes.dex | strings | grep -Fq 'NativeFullActivity'
          unzip -p "$APK" classes.dex | strings | grep -Fq 'VoiceMainActivity'
          unzip -p "$APK" classes.dex | strings | grep -Fq 'FloodSafe full native'
          cp "$APK" /tmp/FloodSafe-Nepal-Native-0.8.0.apk
          sha256sum /tmp/FloodSafe-Nepal-Native-0.8.0.apk
          echo 'FloodSafe full native APK package verification PASS'

      - name: Upload full native APK
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-Native-0.8.0-APK
          path: /tmp/FloodSafe-Nepal-Native-0.8.0.apk
          if-no-files-found: error
          retention-days: 14
