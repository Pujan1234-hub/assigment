name: Package FloodSafe FULL Cream-Gold Test APK

on:
  push:
    paths:
      - '.github/workflows/package-floodsafe-full-creamgold.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-full:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore original full asset pack (NOT native-only)
        shell: bash
        run: |
          set -euo pipefail
          ASSETS='floodsafe-android-app/app/src/main/assets'
          mkdir -p "$ASSETS/data" "$ASSETS/floodsafe-nepal"
          cp -a data/. "$ASSETS/data/"
          cp -a floodsafe-nepal/. "$ASSETS/floodsafe-nepal/"
          test -s "$ASSETS/data/nepal-waterways-snapshot.json"
          test -s "$ASSETS/data/nepal-waterways-tiles/overview.json"
          test -s "$ASSETS/floodsafe-nepal/v25/index.html"
          test -s "$ASSETS/floodsafe-nepal/v24/nepal-districts.geojson"
          du -sh "$ASSETS"

      - name: Verify original cream-gold PJBUILTS intro and proven launcher
        shell: bash
        run: |
          set -euo pipefail
          SPLASH='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/PJBuiltsSplashActivity.java'
          grep -Fq 'Color.rgb(252, 247, 236)' "$SPLASH"
          grep -Fq 'label("PUJAN"' "$SPLASH"
          grep -Fq 'label("BUILTS"' "$SPLASH"
          grep -Fq 'new Intent(this, NativeFullActivity.class)' "$SPLASH"
          grep -Fq 'RADIUS_KM = 2d' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/RiverAlertWorker.java
          grep -Fq 'POST_NOTIFICATIONS' floodsafe-android-app/app/src/main/AndroidManifest.xml

      - name: Build full native APK and run unit tests
        run: gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Verify complete APK assets, signing and integrity
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -F 'assets/data/nepal-waterways-snapshot.json'
          unzip -l "$APK" | grep -F 'assets/data/nepal-waterways-tiles/overview.json'
          unzip -l "$APK" | grep -F 'assets/floodsafe-nepal/v25/index.html'
          unzip -l "$APK" | grep -F 'assets/floodsafe-nepal/v24/nepal-districts.geojson'
          unzip -l "$APK" | grep -F 'assets/floodsafe-nepal/monitor/satellite.html' || true
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Android 15 emulator start and splash-to-dashboard crash smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 540
          script: |
            set -e
            APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -W -n 'io.github.pujan1234hub.floodsafe.app/.PJBuiltsSplashActivity'
            sleep 14
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|ResumedActivity' | head -10 || true
            adb shell pidof io.github.pujan1234hub.floodsafe.app
            if adb logcat -d -v brief | grep -A 9 -F 'FATAL EXCEPTION' | grep -Fq 'io.github.pujan1234hub.floodsafe.app'; then
              echo 'APK_STARTUP_CRASH_DETECTED'
              exit 1
            fi
            echo 'APK_FULL_STARTUP_SMOKE_PASS'

      - name: Upload verified FULL APK for private testing only
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-FULL-CreamGold-Test-APK
          path: floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
