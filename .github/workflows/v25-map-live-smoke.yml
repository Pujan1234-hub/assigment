name: V25 Map Live Verification
on:
  push:
    branches: [main]
    paths:
      - 'floodsafe-nepal/v25/index.html'
      - 'floodsafe-nepal/v25/map-*.js'
      - 'floodsafe-nepal/v25/river-*.js'
      - 'floodsafe-nepal/v25/gauge-bridge.js'
      - 'floodsafe-nepal/v25/flood-only.js'
      - 'data/floodsafe-core.json'
      - '.github/workflows/v25-map-live-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v25-map-live-verification
  cancel-in-progress: true
jobs:
  map-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE: https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/
    steps:
      - name: Wait for deployed map build
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 50); do
            html="$(curl --max-time 12 -fsSL "${BASE}?mapci=${GITHUB_SHA}-${i}" || true)"
            if printf '%s' "$html" | grep -Fq 'river-status-ui.js?v=2' && ! printf '%s' "$html" | grep -Fq 'official-realtime-v1.js'; then
              ok=1
              break
            fi
            sleep 4
          done
          test "$ok" = 1

      - name: Verify live map, gauges and Nepal GPS
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          mkdir -p /tmp/mapgate && cd /tmp/mapgate
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24.31.0 >/dev/null 2>&1
          BASE="$BASE" CHROME="$CHROME" node <<'JS'
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:412,height:915,deviceScaleFactor:1});
            const origin=new URL(process.env.BASE).origin;
            await browser.defaultBrowserContext().overridePermissions(origin,['geolocation']);
            await page.setGeolocation({latitude:27.7172,longitude:85.3240,accuracy:20});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error') console.log('BROWSER ERROR',m.text())});
            await page.goto(process.env.BASE+'?mapci='+Date.now(),{waitUntil:'domcontentloaded',timeout:65000});
            await page.waitForFunction(()=>window.FloodSafeMap?.map && document.getElementById('riverMapGL'),{timeout:65000});
            await page.waitForFunction(()=>{try{return window.FloodSafeMap.map.isStyleLoaded()}catch{return false}},{timeout:65000});
            await page.waitForFunction(()=>Array.isArray(window.FloodSafe?.state?.stations),{timeout:65000});
            await page.waitForFunction(()=>{
              const s=window.FloodSafe?.state?.stations||[];
              const now=Date.now();
              return s.some(r=>{const t=Date.parse(r.waterLevelOn||r.water_level_on||r.measuredOn||r.updatedOn||r.updated_at||r.retrievedAt||'');return Number.isFinite(t)&&now-t<=20*60*1000&&now-t>=-5*60*1000});
            },{timeout:65000});
            await sleep(7000);
            const before=await page.evaluate(()=>{
              const map=window.FloodSafeMap.map;
              const src=map.getSource('gauges');
              const d=src?._data;
              const features=Array.isArray(d?.features)?d.features:[];
              return {gauges:features.length,hint:document.getElementById('mapHint')?.textContent||'',stationState:(window.FloodSafe?.state?.stations||[]).length,center:map.getCenter().toArray(),zoom:map.getZoom()};
            });
            if(before.gauges<1) throw Error('No current official gauge rendered: '+JSON.stringify(before));
            if(!/official gauges ≤20 min/i.test(before.hint)) throw Error('Map freshness hint missing: '+before.hint);
            await page.click('#locateBtn');
            await sleep(3500);
            const after=await page.evaluate(()=>{const m=window.FloodSafeMap.map,c=m.getCenter();return{lat:c.lat,lng:c.lng,zoom:m.getZoom(),outside:!document.getElementById('outsideNotice')?.hidden}});
            if(Math.abs(after.lat-27.7172)>0.8 || Math.abs(after.lng-85.3240)>0.8) throw Error('GPS did not center Nepal location: '+JSON.stringify(after));
            if(after.outside) throw Error('Nepal GPS incorrectly marked outside Nepal');
            if(errors.length) throw Error('Page errors: '+JSON.stringify(errors.slice(0,6)));
            console.log('PASS MAP LIVE',JSON.stringify({before,after}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(3)});
          JS
