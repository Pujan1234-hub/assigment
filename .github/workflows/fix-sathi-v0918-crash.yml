name: Fix SATHI v0.9.18 crash and build tested APK

on:
  push:
    branches:
      - fix/v0-9-18-sathi-next-level
    paths:
      - 'floodsafe-android-app/**'
      - 'floodsafe-nepal/**'
      - '.github/workflows/fix-sathi-v0918-crash.yml'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build current native APK exactly from this branch
        run: gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -Eq 'classes[0-9]*\.dex'
          echo 'native package PASS'

      - name: Android real-launcher reopen and crash smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-boot-timeout: 900
          script: bash floodsafe-android-app/ci_reopen_smoke.sh

      - name: Upload crash diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SATHI-v0918-crash-diagnostics
          path: |
            /tmp/reopen-test.txt
            /tmp/floodsafe-logcat.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Upload tested APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-SATHI-v0.9.18-CRASHFIX-APK
          path: floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
