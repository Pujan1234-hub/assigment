name: Build ScamLens v0.8 Real Protection

on:
  push:
    branches: [scamlens-v08-real-protection]
    paths:
      - 'scamlens-build/source-b64/**'
      - '.github/workflows/build-scamlens-v08.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android SDK
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Reconstruct verified ScamLens source
        run: |
          set -euxo pipefail
          rm -rf scamlens-build/unpacked
          mkdir -p scamlens-build/unpacked
          cat scamlens-build/source-b64/part* | base64 -d > scamlens-build/ScamLens-PJBUILTS-v0.8-RealProtection-source-verified.zip
          echo "926a68164af8f8a193691d8f96ef6e1eb18312b2bf7ca392766eb7abe5958bfe  scamlens-build/ScamLens-PJBUILTS-v0.8-RealProtection-source-verified.zip" | sha256sum -c -
          unzip -q scamlens-build/ScamLens-PJBUILTS-v0.8-RealProtection-source-verified.zip -d scamlens-build/unpacked
          echo "sdk.dir=$ANDROID_HOME" > scamlens-build/unpacked/ScamLens-v0.8-real-protection/local.properties

      - name: Build debug APK
        working-directory: scamlens-build/unpacked/ScamLens-v0.8-real-protection
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          set -euxo pipefail
          cp scamlens-build/unpacked/ScamLens-v0.8-real-protection/app/build/outputs/apk/debug/app-debug.apk scamlens-build/ScamLens-PJBUILTS-v0.8-RealProtection-debug.apk
          sha256sum scamlens-build/ScamLens-PJBUILTS-v0.8-RealProtection-debug.apk
          rm -f scamlens-build/ScamLens-PJBUILTS-v0.8-RealProtection-source.zip
          (cd scamlens-build/unpacked && zip -qr ../ScamLens-PJBUILTS-v0.8-RealProtection-source.zip ScamLens-v0.8-real-protection -x '*/build/*' '*/local.properties')
          sha256sum scamlens-build/ScamLens-PJBUILTS-v0.8-RealProtection-source.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ScamLens-PJBUILTS-v0.8-RealProtection
          path: |
            scamlens-build/ScamLens-PJBUILTS-v0.8-RealProtection-debug.apk
            scamlens-build/ScamLens-PJBUILTS-v0.8-RealProtection-source.zip
          if-no-files-found: error
          retention-days: 14
