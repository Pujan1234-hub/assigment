name: Build FloodSafe v0.8.97 BIPAD Mirror APK

on:
  push:
    branches: [ fix/floodsafe-full-river-detail-v0879 ]
    paths:
      - '.github/workflows/build-floodsafe-v0897-bipad-mirror.yml'
      - 'floodsafe-android-app/patch_native_v0897_bipad_mirror.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply native baseline through v0.8.97
        run: |
          python3 floodsafe-android-app/run_patch_native_v0877.py
          python3 floodsafe-android-app/patch_native_v0878_station_resilience.py
          python3 floodsafe-android-app/patch_native_v0879_full_river_geometry.py
          python3 floodsafe-android-app/patch_native_v0896_station_rivers_truth.py
          python3 floodsafe-android-app/patch_native_v0896_compile_repair.py
          python3 floodsafe-android-app/patch_native_v0896_compile_repair2.py
          python3 floodsafe-android-app/patch_native_v0897_bipad_mirror.py

      - name: Verify BIPAD mirror source contract
        shell: bash
        run: |
          set -euo pipefail
          A='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/NativeFullActivity.java'
          M='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java'
          L='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodLiveGaugeMonitor.java'
          G='floodsafe-android-app/app/build.gradle'
          grep -Fq 'V0897_OFFICIAL_POINT_AND_CURRENT_TRUTH' "$A"
          grep -Fq 'double[] c=v870OfficialCoord(r)' "$A"
          grep -Fq 'V0897_BIPAD_WATER_LEVEL_ON_TIME' "$A"
          grep -Fq '"waterLevelOn"' "$A"
          grep -Fq 'V0897_MIRROR_BIPAD_CURRENT_COUNT' "$A"
          grep -Fq 'V0897_SOURCE_COUNT_NOT_20M' "$A"
          grep -Fq 'V0896_BIND_RIVERS_FROM_STATIONS' "$M"
          grep -Fq 'V0896_NONEMPTY_STATION_RIVER_SOURCE' "$M"
          grep -Fq 'V0897_DIRECT_BIPAD_BACKGROUND' "$L"
          grep -Fq '60_000L' "$L"
          ! grep -Fq 'LIVE (≤20m)' "$A"
          ! grep -Fq 'LIVE (<=20m)' "$A"
          grep -Fq "versionName '0.8.97'" "$G"
          grep -Fq 'versionCode 117' "$G"
          echo 'V0897_BIPAD_MIRROR_SOURCE PASS'

      - name: Bundle assets
        run: gradle -p floodsafe-android-app clean :app:bundleFloodSafe --no-daemon

      - name: Rebuild real Nepal river assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet shapely
          python3 floodsafe-android-app/preclip_nepal_waterways.py
          python3 floodsafe-android-app/rebalance_nepal_overview_v0839.py
          python3 floodsafe-android-app/build_regional_river_tiles_v0840.py
          python3 floodsafe-android-app/build_national_river_network_v0841.py
          python3 floodsafe-android-app/build_progressive_river_tiers_v0842.py
          python3 floodsafe-android-app/build_progressive_river_names_v0863.py
          python3 floodsafe-android-app/postclip_nepal_display_rivers_v0874.py

      - name: Verify station-linked real river geometry
        run: python3 floodsafe-android-app/verify_v0896_station_river_assets.py

      - name: Audit river asset inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          b=Path('floodsafe-android-app/app/build'); mans=list(b.rglob('data/nepal-waterways-tiles/manifest.json'))
          if not mans: raise SystemExit('manifest missing')
          d=mans[0].parent;m=json.loads(mans[0].read_text())
          count=int(m.get('count',0));overview=int(m.get('overview_count',0))
          tiles=[p for p in d.glob('*.json') if re.fullmatch(r'\d+-\d+\.json',p.name)]
          if count<60000 or overview<4000 or len(tiles)<90: raise SystemExit((count,overview,len(tiles)))
          print('V0897_RIVER_ASSET PASS',count,overview,len(tiles))
          PY

      - name: Unit test and compile APK
        run: gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug -x bundleFloodSafe --no-daemon --stacktrace

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-waterways-tiles/overview.json'
          unzip -l "$APK" | grep -Fq 'classes.dex'
          cp "$APK" FloodSafe-Nepal-v0.8.97-BIPAD-MIRROR.apk
          sha256sum FloodSafe-Nepal-v0.8.97-BIPAD-MIRROR.apk | tee FloodSafe-Nepal-v0.8.97-SHA256.txt
          stat -c '%n %s bytes' FloodSafe-Nepal-v0.8.97-BIPAD-MIRROR.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-v0897-BIPAD-MIRROR
          path: |
            FloodSafe-Nepal-v0.8.97-BIPAD-MIRROR.apk
            FloodSafe-Nepal-v0.8.97-SHA256.txt
          retention-days: 14
