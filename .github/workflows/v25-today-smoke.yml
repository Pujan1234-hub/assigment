name: V25 Complete Live Safety Gate
on:
  push:
    branches: ["main"]
    paths:
      - "floodsafe-nepal/v25/**"
      - "data/**"
      - ".github/workflows/v25-today-smoke.yml"
permissions:
  contents: read
concurrency:
  group: v25-complete-live-gate
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE: https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/
      ROOT: https://pujan1234-hub.github.io/assigment/
    steps:
      - name: Wait for shell 41
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 40); do
            good=1
            for f in index.html people.html alerts.html news.html human-final-v2.js flood-live-v2.js road-live-v3.js district-live-v4.js language-v2.js language-runtime.js national-news.js news-stability.js sw.js; do curl --max-time 8 -fsSL "${BASE}${f}?ci=${GITHUB_SHA}-${i}" -o "/tmp/$f" || good=0; done
            curl --max-time 8 -fsSL "${ROOT}data/floodsafe-people-status.json?ci=${GITHUB_SHA}-${i}" -o /tmp/people.json || good=0
            curl --max-time 8 -fsSL "${ROOT}data/floodsafe-police.json?ci=${GITHUB_SHA}-${i}" -o /tmp/police.json || good=0
            grep -Fq 'shell-41' /tmp/sw.js || good=0
            grep -Fq 'homeDeathsLive' /tmp/index.html || good=0
            grep -Fq 'peopleBodiesLive' /tmp/people.html || good=0
            grep -Fq 'floodAlertsListLive' /tmp/alerts.html || good=0
            grep -Fq 'roadCurrentListLive' /tmp/alerts.html || good=0
            if [ "$good" = 1 ]; then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1
          for f in human-final-v2.js flood-live-v2.js road-live-v3.js district-live-v4.js language-v2.js language-runtime.js national-news.js news-stability.js sw.js; do node --check "/tmp/$f"; done
          grep -Fq 'FLASH_MS=60*60*1000' /tmp/national-news.js
          grep -Fq 'RECENT_MS=6*60*60*1000' /tmp/national-news.js
          python3 - <<'PY'
          import json,datetime
          p=json.load(open('/tmp/people.json')); po=json.load(open('/tmp/police.json'))
          def ts(v):
              if not v:return 0
              try:return datetime.datetime.fromisoformat(str(v).replace('Z','+00:00')).timestamp()
              except:return 0
          pd=ts(p.get('recovered_update_iso') or p.get('recovered_update_time') or p.get('updated_date')); pp=ts(po.get('official_update_iso'))
          d=p.get('recovered_bodies') if pd>=pp else po.get('total_deaths')
          open('/tmp/expected.txt','w').write(f"{d}|{p['missing_minimum']}|{p['rescued_alive']}")
          PY

      - name: Browser complete gate
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"; test -n "$CHROME"
          mkdir -p /tmp/gate && cd /tmp/gate; npm init -y >/dev/null 2>&1; npm install --no-save puppeteer-core@24.31.0 >/dev/null 2>&1
          EXPECTED="$(cat /tmp/expected.txt)" BASE="$BASE" CHROME="$CHROME" node <<'JS'
          const puppeteer=require('puppeteer-core'),wait=ms=>new Promise(r=>setTimeout(r,ms)),dev=/[\u0900-\u097F]/;
          (async()=>{const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage']});const p=await b.newPage();await p.setViewport({width:412,height:915});p.setDefaultTimeout(65000);const errors=[];p.on('pageerror',e=>errors.push(String(e)));const exp=process.env.EXPECTED.split('|').map(Number);
            await p.goto(process.env.BASE+'?ci='+Date.now(),{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>window.__fsUnifiedHuman?.owner==='human-final-v2');await wait(15000);let h=await p.evaluate(()=>({v:['homeDeathsLive','homeMissingLive','homeRescuedLive'].map(id=>Number(document.getElementById(id).textContent)),legacy:['homeDeaths','homeMissing','homeRescued'].some(id=>!!document.getElementById(id))}));if(h.legacy||h.v.join('|')!==exp.join('|'))throw Error('Human '+JSON.stringify({h,exp}));
            await p.waitForSelector('#fsLangToggle');let t=await p.$eval('#fsLangToggle',e=>e.textContent.trim());if(t!=='Nepali'){await p.click('#fsLangToggle');await wait(700)}t=await p.$eval('#fsLangToggle',e=>e.textContent.trim());if(t!=='Nepali')throw Error('English toggle '+t);let core=await p.evaluate(()=>[...document.querySelectorAll('header,.pageHead,.grid,#humanStatsSection')].map(x=>x.innerText).join(' '));if(dev.test(core))throw Error('English mix '+core);
            await p.goto(process.env.BASE+'alerts.html?ci='+Date.now(),{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>window.__fsFloodState?.owner==='flood-v2'&&window.__fsRoadState?.owner==='road-v3'&&window.__fsDistrictState?.districts===77);await p.waitForFunction(()=>document.querySelectorAll('#districtFilter option').length===78);await wait(7000);const a=await p.evaluate(()=>{const q=id=>document.getElementById(id),rs=window.__fsRoadState;return{legacy:!!q('alertsList')||!!q('roadCurrentList')||!!q('alertCount')||!!q('roadAlertCount'),f:[...q('floodAlertsListLive').querySelectorAll('.item')].every(x=>x.dataset.floodOwner==='2'),r:[...q('roadCurrentListLive').querySelectorAll('.item')].every(x=>x.dataset.roadOwner==='3'),opts:q('districtFilter').options.length,cards:q('districtStatusList').querySelectorAll('.item').length,road:Number(q('roadAlertCountLive').textContent),expected:rs.dor&&Number.isFinite(rs.dor.closed)?rs.dor.closed:rs.bipad.closed}});if(a.legacy||!a.f||!a.r||a.opts!==78||a.cards>20||a.road!==a.expected)throw Error('Alerts '+JSON.stringify(a));
            await p.goto(process.env.BASE+'news.html?ci='+Date.now(),{waitUntil:'domcontentloaded'});await wait(7000);const n=await p.evaluate(()=>[...document.querySelectorAll('#newsList .item h4')].map(x=>x.textContent.trim()));if(new Set(n).size!==n.length)throw Error('News repeat '+JSON.stringify(n));
            if(errors.length)throw Error('page errors '+JSON.stringify(errors.slice(0,8)));console.log('PASS complete live safety gate',{human:h,alerts:a,news:n.length});await b.close()})().catch(e=>{console.error(e);process.exit(3)});
          JS
