name: Build SATHI AI APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'sathi-ai-personal/**'
      - '.github/workflows/build-sathi-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sathi-ai-personal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SATHI-AI-debug-apk
          path: sathi-ai-personal/app/build/outputs/apk/debug/app-debug.apk
