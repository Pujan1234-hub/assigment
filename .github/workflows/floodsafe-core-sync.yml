name: FloodSafe core official feed sync

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/floodsafe-core-sync.yml'
      - 'scripts/floodsafe-core-sync.py'
      - 'scripts/update_floodsafe_people_v2.py'
      - 'data/floodsafe-police.json'
      - 'floodsafe-nepal/v25/resilience.js'

permissions:
  contents: write

concurrency:
  group: floodsafe-core-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch official core feeds
        run: python scripts/floodsafe-core-sync.py

      - name: Fetch latest Human Status from credible Nepal sources
        run: python scripts/update_floodsafe_people_v2.py

      - name: Validate live snapshot contracts
        run: |
          python -m json.tool data/floodsafe-core.json >/dev/null
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          j=json.load(open('data/floodsafe-people-status.json'))
          for k in ('recovered_bodies','missing_minimum','rescued_alive'):
              assert isinstance(j.get(k),int) and j[k]>0, (k,j.get(k))
          for k in ('recovered_source','missing_source','rescued_source'):
              assert str(j.get(k,'')).strip(), k
          checked=str(j.get('last_checked_utc','')).strip()
          assert checked, 'last_checked_utc'
          t=datetime.fromisoformat(checked.replace('Z','+00:00'))
          age=(datetime.now(timezone.utc)-t).total_seconds()
          assert age < 900, ('Human Status source scan too old',age,checked)
          print('Human Status',j['recovered_bodies'],j['missing_minimum'],j['rescued_alive'],'checked',checked)
          PY

      - name: Commit refreshed live snapshots
        shell: bash
        run: |
          if git diff --quiet -- data/floodsafe-core.json data/floodsafe-people-status.json; then
            echo 'No live snapshot changes.'
            exit 0
          fi
          git config user.name 'FloodSafe live sync'
          git config user.email 'actions@users.noreply.github.com'
          git add data/floodsafe-core.json data/floodsafe-people-status.json
          git commit -m '[auto] refresh FloodSafe core and Human Status'
          git pull --rebase origin main
          git push origin HEAD:main
