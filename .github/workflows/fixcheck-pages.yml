name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - sw.js
      - auto-update.js
      - portfolio-floodsafe.js
      - portfolio-motion.js
      - portfolio-i18n.js
      - fixcheck/**
      - team-tracker/**
      - floodsafe-nepal/**
      - data/**
      - assets/**
      - .github/workflows/fixcheck-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare public site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          cp index.html _site/index.html
          cp sw.js _site/sw.js
          cp auto-update.js _site/auto-update.js
          cp portfolio-floodsafe.js _site/portfolio-floodsafe.js
          cp portfolio-motion.js _site/portfolio-motion.js
          cp portfolio-i18n.js _site/portfolio-i18n.js
          cp -R fixcheck _site/fixcheck
          cp -R team-tracker _site/team-tracker
          cp -R floodsafe-nepal _site/floodsafe-nepal
          if [ -d data ]; then cp -R data _site/data; fi
          if [ -d assets ]; then cp -R assets _site/assets; fi

          test -s _site/data/nepal-waterways-seed.json
          test -s _site/assets/portfolio/datemate-home.svg
          test -s _site/assets/portfolio/datemate-archive.svg
          test -s _site/assets/portfolio/floodsafe-map.svg
          test -s _site/assets/portfolio/floodsafe-poster.svg
          test -s _site/portfolio-i18n.js

          python3 -c "import json; j=json.load(open('_site/data/nepal-waterways-seed.json')); assert j.get('count',0)>=100; assert len(j.get('waterways',[]))==j['count']; print('packaging river routes',j['count'])"
          printf '%s' "$GITHUB_SHA" > _site/build-version.txt

          # Curated project registry only. Generic folders/platform builds NEVER become products.
          # When a real named project is deliberately started, this registry is updated as part of that project start.
          python3 - <<'PY'
          from pathlib import Path
          import json
          projects=[
            {'slug':'team-tracker','title':'Team Tracker','started':True,'portfolio':True,'status_en':'Working web app','status_np':'चलिरहेको वेब एप','link':'./team-tracker/'},
            {'slug':'fixcheck','title':'FixCheck','started':True,'portfolio':True,'status_en':'In development','status_np':'विकासमा','link':'./fixcheck/'},
            {'slug':'datemate','title':'DateMate','started':True,'portfolio':True,'status_en':'Active development','status_np':'सक्रिय विकास','link':None},
            {'slug':'floodsafe-nepal','title':'FloodSafe Nepal','started':True,'portfolio':True,'status_en':'Active development','status_np':'सक्रिय विकास','link':'./floodsafe-nepal/'}
          ]
          payload={'version':3,'mode':'curated-started-projects-only','project_count':len(projects),'projects':projects}
          Path('_site/projects-manifest.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('_site/index.html');s=p.read_text()
          s=s.replace('AI-assisted development helps move from idea to prototype quickly, but product quality still depends on the problem definition, user flow, testing and honest limitations.','I develop each product through hands-on design, building, testing and repeated refinement, with the focus on solving the problem clearly and making each version more useful.')
          s=s.replace('I use modern web tools and AI-assisted workflows to move from idea to testable prototype quickly.','I turn ideas into testable prototypes through hands-on design, building, testing and iteration.')
          s=s.replace('AI-assisted development','hands-on development').replace('AI-assisted workflows','hands-on development workflows').replace('AI-assisted','hands-on')
          s=re.sub(r'\bAI\b','software',s);p.write_text(s)
          PY

          sed -i 's#</head>#<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"></head>#' _site/index.html
          sed -i 's#</body>#<script src="./portfolio-floodsafe.js?v=3"></script><script src="./portfolio-motion.js?v=2"></script><script src="./portfolio-i18n.js?v=3"></script><script src="./auto-update.js?v=2"></script></body>#' _site/index.html

          python - <<'PY'
          from pathlib import Path
          import re
          for ver in ('v23','v24'):
              p=Path('_site/floodsafe-nepal')/ver/'index.html'
              if not p.exists(): continue
              s=p.read_text()
              for old in ('v23-gateway.js','v23-upgrade.js','v23-hotfix.js','v23-ux.js','v23-river-map-v2.js','v23-river-name.js','v23-river-map.js','v23-river-map-v3.js','v23-location.js','v23-lang-police.js','v23-live-2s.js','v23-active-hazards.js','v23-map-guard.js'):
                  s=re.sub(rf'<script[^>]+{re.escape(old)}[^>]*></script>','',s)
              for fn,vernum in [('v23-gateway.js','1'),('v23-upgrade.js','5'),('v23-hotfix.js','4'),('v23-ux.js','2'),('v23-river-map-v3.js','3'),('v23-location.js','1'),('v23-lang-police.js','1'),('v23-live-2s.js','1'),('v23-active-hazards.js','1'),('v23-map-guard.js','1')]:
                  f=p.parent/fn
                  if f.exists(): s=s.replace('</body>',f'<script src="./{fn}?v={vernum}"></script></body>')
              p.write_text(s)
          PY

          # Public-root privacy and attribution guard.
          python3 - <<'PY'
          from pathlib import Path
          import re,sys
          files=[Path('_site/index.html'),Path('_site/portfolio-floodsafe.js'),Path('_site/portfolio-motion.js'),Path('_site/portfolio-i18n.js'),Path('_site/projects-manifest.json')]
          forbidden=re.compile(r'\b(?:Princesshay|Suroj|Tango|Victor|Chiraag|hotel|siyara|mic|security|cleaner|Exeter|employment|badge|Bedford|Catherine)\b|Roman\s+Walk',re.I)
          ai=re.compile(r'\bAI\b|AI-assisted|artificial intelligence',re.I)
          for p in files:
              text=p.read_text(encoding='utf-8',errors='ignore')
              if forbidden.search(text): print('Blocked private/internal wording in',p);sys.exit(2)
              if ai.search(text): print('Blocked unwanted attribution wording in',p);sys.exit(2)
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with: {enablement: true}

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Verify exact deployed build
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://pujan1234-hub.github.io/assigment
          for i in $(seq 1 30); do
            deployed="$(curl --max-time 10 -fsSL "$BASE/build-version.txt?check=$GITHUB_SHA-$i" || true)"
            if [ "$deployed" = "$GITHUB_SHA" ]; then
              curl --max-time 15 -fsSL "$BASE/floodsafe-nepal/v25/?check=$GITHUB_SHA" -o /tmp/v25.html
              grep -Fq 'trusted-river-runtime-v3.js?v=36' /tmp/v25.html
              grep -Fq 'impact-live-v1.js?v=6' /tmp/v25.html
              ! grep -Fq 'flood-freshness.js' /tmp/v25.html

              curl --max-time 15 -fsSL "$BASE/?check=$GITHUB_SHA" -o /tmp/home.html
              grep -Fq 'portfolio-motion.js?v=2' /tmp/home.html
              grep -Fq 'portfolio-i18n.js?v=3' /tmp/home.html

              curl --max-time 15 -fsSL "$BASE/portfolio-i18n.js?check=$GITHUB_SHA" -o /tmp/i18n.js
              grep -Fq '__pcPortfolioI18nV3' /tmp/i18n.js
              grep -Fq 'नेपाली' /tmp/i18n.js
              ! grep -Fq 'Auto-detected project' /tmp/i18n.js
              ! grep -Fq 'SATHI' /tmp/i18n.js

              curl --max-time 15 -fsSL "$BASE/projects-manifest.json?check=$GITHUB_SHA" -o /tmp/projects.json
              python3 -c "import json; j=json.load(open('/tmp/projects.json')); assert j['mode']=='curated-started-projects-only'; assert j['project_count']==4; assert [x['title'] for x in j['projects']]==['Team Tracker','FixCheck','DateMate','FloodSafe Nepal']; assert all(x['started'] and x['portfolio'] for x in j['projects'])"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Verify stable FloodSafe scripts
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://pujan1234-hub.github.io/assigment
          for i in $(seq 1 25); do
            if curl -fsSL "$BASE/floodsafe-nepal/v23/?t=$RANDOM" -o /tmp/v23.html; then
              if grep -q 'v23-gateway.js?v=1' /tmp/v23.html && grep -q 'v23-upgrade.js?v=5' /tmp/v23.html && grep -q 'v23-hotfix.js?v=4' /tmp/v23.html && grep -q 'v23-ux.js?v=2' /tmp/v23.html && grep -q 'v23-river-map-v3.js?v=3' /tmp/v23.html && grep -q 'v23-location.js?v=1' /tmp/v23.html && grep -q 'v23-lang-police.js?v=1' /tmp/v23.html && grep -q 'v23-live-2s.js?v=1' /tmp/v23.html && grep -q 'v23-active-hazards.js?v=1' /tmp/v23.html && grep -q 'v23-map-guard.js?v=1' /tmp/v23.html && ! grep -q 'v23-river-map-v2.js' /tmp/v23.html; then exit 0; fi
            fi
            sleep 3
          done
          exit 1
