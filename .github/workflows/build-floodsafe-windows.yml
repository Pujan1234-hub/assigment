name: Build FloodSafe Nepal Windows app

on:
  workflow_dispatch:
  push:
    paths:
      - 'floodsafe-nepal/**'
      - 'windows-app/**'
      - '.github/workflows/build-floodsafe-windows.yml'

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows-app/package.json
      - name: Copy FloodSafe app files into desktop package
        run: Copy-Item -Recurse floodsafe-nepal windows-app/floodsafe-nepal
      - name: Install desktop build tools
        working-directory: windows-app
        run: npm install
      - name: Package Windows installer
        working-directory: windows-app
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-Windows-Setup
          path: windows-app/release/*.exe
          if-no-files-found: error
