name: Preserve FloodSafe Nepal Beta APK filename
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/floodsafe-beta-original-filename.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-identical-beta-alias:
    runs-on: ubuntu-latest
    steps:
      - name: Verify original APK SHA256 and publish filename-only alias
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="floodsafe-v0921-ota-location-flicker-test-20261029"
          SOURCE="FloodSafe-Nepal-v0.9.21-OTA-LOCATION-FLICKER-FIX-TEST.apk"
          BETA="FloodSafe-Nepal-Android-Beta.apk"
          EXPECTED_SHA="8364b27a9090ec1c0b17896ec2c350ffe631c1c19b969d01cb0ca0a19a48e1fa"
          mkdir -p original alias
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$SOURCE" --dir original
          echo "$EXPECTED_SHA  original/$SOURCE" | sha256sum --check --status
          cp "original/$SOURCE" "alias/$BETA"
          echo "$EXPECTED_SHA  alias/$BETA" | sha256sum --check
          gh release upload "$TAG" "alias/$BETA" --clobber --repo "$GITHUB_REPOSITORY"
          echo "Published unchanged APK as $BETA (Beta display filename)."
