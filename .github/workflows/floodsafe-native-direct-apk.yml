name: FloodSafe v0.9.21 TRUE NATIVE Direct APK Test
on:
  push:
    branches:
      - repair/floodsafe-v0921-true-native-direct-20261029
    paths:
      - '.github/workflows/floodsafe-native-direct-apk.yml'
      - 'floodsafe-android-app/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Package full v0.9.21 native content, separate install identity
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=floodsafe-android-app/app/src/main/assets
          mkdir -p "$ASSETS/data" "$ASSETS/floodsafe-nepal"
          cp -a data/. "$ASSETS/data/"
          cp -a floodsafe-nepal/. "$ASSETS/floodsafe-nepal/"
          python3 - <<'PY'
          import json,copy,pathlib
          p=pathlib.Path('floodsafe-android-app/app/google-services.json')
          data=json.loads(p.read_text())
          client=copy.deepcopy(data['client'][0])
          client['client_info']['android_client_info']['package_name']='io.github.pujan1234hub.floodsafe.app.preview'
          data['client'].append(client)
          p.write_text(json.dumps(data))
          PY
      - name: Verify only real native UI launches after original shiny splash
        shell: bash
        run: |
          set -euo pipefail
          JAVA=floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app
          grep -Fq 'new Intent(this, NativeFullActivity.class)' "$JAVA/PJBuiltsSplashActivity.java"
          grep -Fq 'AnimatedNepalWeatherOverlay' "$JAVA/NativeFullActivity.java"
          grep -Fq 'new AnimatedNepalWeatherOverlay(this)' "$JAVA/NativeFullActivity.java"
          grep -Fq 'new NativeRiverMap()' "$JAVA/NativeFullActivity.java"
          grep -Fq 'new Intent(this,FloodSafeAdvancedActivity.class)' "$JAVA/NativeFullActivity.java"
          grep -Fq 'new Intent(this,FloodSafeNativeActivity.class)' "$JAVA/NativeFullActivity.java"
          grep -Fq 'EMERGENCY_FRESH_MS=10L' "$JAVA/NativeFullActivity.java"
          test -s floodsafe-android-app/app/src/main/assets/pjbuilts-original-splash.html
      - name: Android native unit tests and compile
        run: gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Validate complete APK file and original river geometry
        shell: bash
        run: |
          set -euo pipefail
          APK=floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK" >/dev/null
          for asset in assets/pjbuilts-original-splash.html assets/data/nepal-waterways-snapshot.json assets/floodsafe-nepal/v25/index.html; do
            unzip -Z -1 "$APK" | grep -Fxq "$asset"
          done
          test "$(stat -c %s "$APK")" -gt 85000000
          cp "$APK" FloodSafe-Nepal-v0.9.21-NATIVE-TEST.apk
          sha256sum FloodSafe-Nepal-v0.9.21-NATIVE-TEST.apk
          stat -c 'NATIVE_APK_BYTES=%s' FloodSafe-Nepal-v0.9.21-NATIVE-TEST.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-v0921-NATIVE-direct-test
          path: FloodSafe-Nepal-v0.9.21-NATIVE-TEST.apk
          retention-days: 14
          if-no-files-found: error
      - name: Create public prerelease with a DIRECT APK file link (website untouched)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="floodsafe-v0921-NATIVE-TEST-20261029"
          gh release view "$TAG" >/dev/null 2>&1 && {
             gh release upload "$TAG" FloodSafe-Nepal-v0.9.21-NATIVE-TEST.apk --clobber
          } || gh release create "$TAG" FloodSafe-Nepal-v0.9.21-NATIVE-TEST.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "FloodSafe Nepal v0.9.21 Original Native Test" \
            --notes "Native Android UI from original v0.9.21 repair branch, with original cream-gold intro and native sun/cloud/rain/storm, current DHM river data, 7-day GPS forecast. TEST build only. Does not replace production APK or site."
