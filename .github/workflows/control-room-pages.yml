name: Deploy Control Room to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'team-tracker-control-room/**'
      - '.github/workflows/control-room-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Enable control-room patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('team-tracker-control-room/index.html')
          s = p.read_text()
          tags = [
            '<script src="map-patch.js?v=1a21411"></script>',
            '<script src="task-input-patch.js?v=c271d34"></script>',
            '<script src="dashboard-fix.js?v=1f5dad5"></script>'
          ]
          for tag in tags:
            if tag not in s:
              s = s.replace('</body>', tag + '</body>')
          p.write_text(s)
          PY
      - name: Upload control room site
        uses: actions/upload-pages-artifact@v4
        with:
          path: './team-tracker-control-room'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
