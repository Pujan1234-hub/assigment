name: Package FloodSafe v0.8.90 Native Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'floodsafe-android-app/**'
      - '.github/workflows/package-floodsafe-apk.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Bundle Nepal-only native map data
        shell: bash
        run: |
          set -euo pipefail
          DIR='floodsafe-android-app/app/src/main/assets/data'
          mkdir -p "$DIR/nepal-waterways-tiles"
          cp floodsafe-nepal/v24/nepal-districts.geojson "$DIR/nepal-districts.geojson"
          cp data/nepal-waterways-tiles/overview.json "$DIR/nepal-waterways-tiles/overview.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('floodsafe-android-app/app/src/main/assets/data')
          districts = json.loads((root/'nepal-districts.geojson').read_text())
          rivers = json.loads((root/'nepal-waterways-tiles/overview.json').read_text())
          assert len(districts.get('features', [])) >= 70, 'Nepal boundary missing'
          assert len(rivers.get('waterways', [])) >= 50, 'River overview missing'
          print('Nepal border and rivers ready for packaging')
          PY

      - name: Unit tests and native APK build
        run: gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Verify native APK and warning guards
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'
          G='floodsafe-android-app/app/build.gradle'
          grep -Fq 'versionCode 110' "$G"
          grep -Fq "versionName '0.8.90-native'" "$G"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -Eq 'classes[0-9]*[.]dex'
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-districts.geojson'
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-waterways-tiles/overview.json'
          grep -Fq 'RADIUS_KM = 2d' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/RiverAlertWorker.java
          grep -Fq 'MAX_AGE_MS = 10L * 60L * 1000L' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/RiverAlertWorker.java
          grep -Fq 'POST_NOTIFICATIONS' floodsafe-android-app/app/src/main/AndroidManifest.xml
          grep -Fq 'manager.notify(requestCode, notification)' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/RiverAlertWorker.java
          if unzip -l "$APK" | grep -Eq 'assets/floodsafe-nepal|[.]html$|[.]js$'; then
            echo 'ERROR: web assets found in native-only APK'
            exit 1
          fi
          sha256sum "$APK" | tee /tmp/floodsafe-native-apk-sha256.txt
          stat -c '%s' "$APK" | tee /tmp/floodsafe-native-apk-size.txt
          echo 'FloodSafe native river boundary + warning-source checks PASS'

      - name: Upload tested native APK
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-v0.8.90-NativeOnly-APK
          path: |
            floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk
            /tmp/floodsafe-native-apk-sha256.txt
            /tmp/floodsafe-native-apk-size.txt
          if-no-files-found: error
          retention-days: 14
