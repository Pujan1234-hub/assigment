name: FloodSafe FULL APK Download Recovery

on:
  push:
    paths:
      - '.github/workflows/floodsafe-full-download-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Include every original offline and native asset
        run: |
          set -euo pipefail
          mkdir -p floodsafe-android-app/app/src/main/assets/{data,floodsafe-nepal}
          cp -a data/. floodsafe-android-app/app/src/main/assets/data/
          cp -a floodsafe-nepal/. floodsafe-android-app/app/src/main/assets/floodsafe-nepal/
      - name: Build and unit test full-size cream-gold APK
        run: gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Verify complete APK assets
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -F 'assets/data/nepal-waterways-snapshot.json'
          unzip -l "$APK" | grep -F 'assets/floodsafe-nepal/v25/index.html'
          unzip -l "$APK" | grep -F 'assets/data/nepal-waterways-tiles/overview.json'
          sha256sum "$APK"
          stat -c 'FINAL_FULL_APK_BYTES=%s' "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-FULL-Test-APK-Download
          path: floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
