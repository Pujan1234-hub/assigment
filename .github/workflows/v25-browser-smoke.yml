name: FloodSafe V25 Nepal Map Gate
on:
  push:
    branches: ["main"]
    paths:
      - "floodsafe-nepal/v25/**"
      - "data/nepal-waterways-tiles/**"
      - ".github/workflows/v25-browser-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: floodsafe-v25-nepal-map-gate
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check current mobile runtimes
        run: |
          set -euo pipefail
          node --check floodsafe-nepal/v25/map-loader-v3.js
          node --check floodsafe-nepal/v25/map-mobile-recovery-v1.js
          node --check floodsafe-nepal/v25/trusted-river-runtime-v3.js
          node --check floodsafe-nepal/v25/trusted-rain-runtime-v1.js
          node --check floodsafe-nepal/v25/news-live-v5.js
          node --check floodsafe-nepal/v25/user-facing-ui-v1.js
          node --check floodsafe-nepal/v25/official-stale-safety-v1.js
      - name: Wait for current GitHub Pages build
        run: |
          set -euo pipefail
          BASE='https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/'
          ok=0
          for i in $(seq 1 80); do
            curl --max-time 15 -fsSL "${BASE}?ci=${GITHUB_SHA}-${i}" -o /tmp/index.html || true
            if grep -Fq 'map-loader-v3.js?v=27' /tmp/index.html && \
               grep -Fq 'map-mobile-recovery-v1.js?v=2' /tmp/index.html && \
               grep -Fq 'user-facing-ui-v1.js?v=2' /tmp/index.html && \
               grep -Fq 'official-stale-safety-v1.js?v=3' /tmp/index.html; then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1
      - name: Verify Supabase official station mirror responds fast
        run: |
          set -euo pipefail
          curl --max-time 8 -fsSL 'https://camkoacuokffryyrygda.supabase.co/functions/v1/sync-bipad-rivers?ci=1' -o /tmp/rivers.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/rivers.json'))
          assert j.get('count',0)>=281, j
          assert isinstance(j.get('results'),list) and len(j['results'])>=281
          print('official mirror',j.get('count'),'latest',j.get('latest_count'),'fetched',j.get('fetched_at'))
          PY
      - name: Browser verify mobile map never stays blank
        env:
          BASE: https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"; test -n "$CHROME"
          mkdir -p /tmp/floodsafe && cd /tmp/floodsafe
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24.31.0 >/dev/null 2>&1
          BASE="$BASE" CHROME="$CHROME" node <<'JS'
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:412,height:915,deviceScaleFactor:2});
            page.setDefaultTimeout(60000);
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));page.on('requestfailed',r=>errors.push('REQ '+r.url()+' '+r.failure()?.errorText));
            await page.goto(process.env.BASE+'?restore='+Date.now()+'#map',{waitUntil:'domcontentloaded',timeout:15000});
            await page.waitForFunction(()=>Number(window.__fsRiverRealtimeState?.catalogCount||0)>=281,{timeout:30000});
            await page.waitForFunction(()=>{
              const real=!!(window.FloodSafeMap?.initialized&&window.FloodSafeMap?.districtCount===77&&window.FloodSafeMap?.map?.getLayer?.('district-lines'));
              const fb=!!window.__fsStaticMapFallback?.active;
              return real||fb;
            },{timeout:30000});
            await sleep(5000);
            const result=await page.evaluate(()=>({
              catalog:Number(window.__fsRiverRealtimeState?.catalogCount||0),
              current:Number(window.__fsRiverRealtimeState?.currentCount||0),
              stateRows:Array.isArray(window.FloodSafe?.state?.allRiverStations)?window.FloodSafe.state.allRiverStations.length:0,
              real:!!(window.FloodSafeMap?.initialized&&window.FloodSafeMap?.districtCount===77&&window.FloodSafeMap?.map?.getLayer?.('district-lines')),
              hydroLayer:!!window.FloodSafeMap?.map?.getLayer?.('hydro-complete-lines'),
              hydroFeatures:Number(window.__fsHydroMatchState?.features||0),
              fallback:window.__fsStaticMapFallback||null,
              canvas:!!document.querySelector('#riverMapGL canvas.maplibregl-canvas'),
              svg:!!document.querySelector('#fsStaticMapFallback svg'),
              uiV2:!!window.__fsUserFacingUIV2,
              staleV3:!!window.__fsOfficialStaleSafetyV3
            }));
            if(result.catalog<281||result.stateRows<281)throw Error('Official station catalogue missing '+JSON.stringify(result));
            if(!result.uiV2||!result.staleV3)throw Error('Latest anti-freeze UI guards missing '+JSON.stringify(result));
            if(!result.real && !(result.fallback?.active&&result.svg&&result.fallback.stations>=200))throw Error('Mobile map blank '+JSON.stringify(result));
            if(result.real && (!result.hydroLayer||result.hydroFeatures<5000))throw Error('River network missing '+JSON.stringify(result));
            if(result.fallback?.active&&Number(result.fallback.rivers||0)<5000)throw Error('Fallback river network missing '+JSON.stringify(result));
            console.log('PASS restored mobile map + 281 stations + river network',result,'requestErrors',errors.filter(x=>!x.includes('MapServer')).slice(0,8));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(3)});
          JS
