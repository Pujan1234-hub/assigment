name: FloodSafe Nepal - Kukur Tihar and Laxmi Puja 2083 messages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/floodsafe-kukur-laxmi-2083-on-demand.yml'
  schedule:
    # 8 November 2026, Nepal local 06:30, 10:30, 15:00 and 17:15 respectively
    - cron: '45 0 8 11 *'
    - cron: '45 4 8 11 *'
    - cron: '15 9 8 11 *'
    - cron: '30 11 8 11 *'

permissions:
  contents: read

concurrency:
  group: floodsafe-kukur-laxmi-2083
  cancel-in-progress: false

jobs:
  notify:
    if: github.run_attempt == 1 && (github.event_name == 'schedule' || github.event.head_commit.message == 'Send correct Laxmi Puja greeting now and schedule reminder at 17:15 NPT')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Send correct festival message through Firebase Cloud Messaging
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EVENT_NAME: ${{ github.event_name }}
          CRON_EXPRESSION: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet google-auth requests
          python3 - <<'PY'
          import json, os, sys
          from datetime import date, datetime, timedelta
          from zoneinfo import ZoneInfo
          import requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          tz = ZoneInfo("Asia/Kathmandu")
          now = datetime.now(tz)
          if now.date() != date(2026, 11, 8):
              print("SKIPPED: Only valid on 8 November 2026 in Nepal.")
              sys.exit(0)

          deadline = datetime(2026, 11, 8, 19, 52, tzinfo=tz)
          if now >= deadline:
              print("SKIPPED: Festival notifications end at 19:52 NPT.")
              sys.exit(0)

          event = os.environ.get("EVENT_NAME", "")
          if event == "push":
              slot = "immediate"
              if now >= datetime(2026, 11, 8, 6, 30, tzinfo=tz):
                  print("SKIPPED: Immediate greeting is only for before 06:30 NPT.")
                  sys.exit(0)
          elif event == "schedule":
              schedule_slots = {
                  "45 0 8 11 *": ("06:30", 6, 30),
                  "45 4 8 11 *": ("10:30", 10, 30),
                  "15 9 8 11 *": ("15:00", 15, 0),
                  "30 11 8 11 *": ("17:15", 17, 15),
              }
              expr = os.environ.get("CRON_EXPRESSION", "")
              if expr not in schedule_slots:
                  print("SKIPPED: Unknown schedule expression.")
                  sys.exit(0)
              slot, hour, minute = schedule_slots[expr]
              planned = datetime(2026, 11, 8, hour, minute, tzinfo=tz)
              expires = min(planned + timedelta(minutes=30), deadline)
              if slot == "17:15":
                  expires = datetime(2026, 11, 8, 17, 38, tzinfo=tz)
              if not planned <= now < expires:
                  print(f"SKIPPED: late/early job {slot} at {now.isoformat()}.")
                  sys.exit(0)
          else:
              print("SKIPPED: Unauthorised event.")
              sys.exit(0)

          if slot == "17:15":
              title = "🪔🙏 लक्ष्मीपूजाको शुभमुहूर्त सुरु हुँदैछ 🪔🙏"
              body = (
                  "माता लक्ष्मीको पूजा–आराधनाका लागि शुभमुहूर्त साँझ ५:३८ बजेदेखि सुरु हुँदैछ।\n\n"
                  "🇳🇵 नेपालको समयअनुसार:\n"
                  "🌸 शुभमुहूर्त: साँझ ५:३८ देखि ७:३४ बजेसम्म\n"
                  "🌅 प्रदोषकाल: साँझ ५:१५ देखि ७:५२ बजेसम्म\n\n"
                  "सम्पूर्ण भक्तजनहरूलाई समयमै पूजाको तयारी गरी श्रद्धा र भक्तिपूर्वक "
                  "माता लक्ष्मीको आराधना गर्न हार्दिक शुभकामना।\n"
                  "माता लक्ष्मीले तपाईंको परिवारमा सुख, शान्ति र समृद्धि प्रदान गरून्। 🙏🌼\n\n"
                  "शुभ लक्ष्मीपूजा! 🪔\n— FloodSafe Nepal परिवार"
              )
          else:
              title = "🐕 कुकुर तिहार तथा लक्ष्मीपूजाको हार्दिक शुभकामना! 🪔"
              body = (
                  "विश्वास र निःस्वार्थ प्रेमको प्रतीक कुकुरप्रति सम्मान, "
                  "अनि माता लक्ष्मीको आशीर्वादले सबैका घरमा सुख, शान्ति र समृद्धि छाओस्।\n\n"
                  "🇳🇵 नेपालको समयअनुसार लक्ष्मीपूजाको शुभमुहूर्त: "
                  "साँझ ५:३८ देखि ७:३४ बजेसम्म।\n\n"
                  "शुभ तिहार! 🌼\n— FloodSafe Nepal परिवार"
              )

          raw = os.environ.get("FIREBASE_SERVICE_ACCOUNT", "").strip()
          if not raw:
              sys.exit("FAILED: FIREBASE_SERVICE_ACCOUNT secret is missing.")
          account = json.loads(raw)
          if account.get("project_id") != "floodsafe-nepal":
              sys.exit("FAILED: Firebase project mismatch. No notification sent.")
          credentials = service_account.Credentials.from_service_account_info(
              account, scopes=["https://www.googleapis.com/auth/firebase.messaging"]
          )
          credentials.refresh(Request())

          ttl_seconds = max(1, int((deadline - datetime.now(tz)).total_seconds()))
          payload = {
              "message": {
                  "topic": "nepal-alerts",
                  "notification": {"title": title, "body": body},
                  "android": {"priority": "high", "ttl": f"{ttl_seconds}s"},
                  "data": {
                      "type": "festival",
                      "festival": "kukur_tihar_laxmi_puja_2083",
                      "sender": "FloodSafe Nepal",
                      "time_zone": "Asia/Kathmandu",
                      "slot": slot,
                      "end_time": "2026-11-08T19:52:00+05:45"
                  }
              }
          }
          response = requests.post(
              "https://fcm.googleapis.com/v1/projects/floodsafe-nepal/messages:send",
              headers={"Authorization": f"Bearer {credentials.token}", "Content-Type": "application/json"},
              json=payload, timeout=30
          )
          print("Festival notification:", slot, "; Nepal time:", now.isoformat())
          print("FCM HTTP status:", response.status_code)
          print("FCM result:", response.text)
          response.raise_for_status()
          PY
