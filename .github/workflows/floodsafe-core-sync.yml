name: FloodSafe core official feed sync

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/floodsafe-core-sync.yml'
      - 'scripts/floodsafe-core-sync.py'
      - 'scripts/floodsafe-core-sync-v2.py'
      - 'scripts/floodsafe-core-sync-v3.py'
      - 'scripts/floodsafe-river-sanitize.py'

permissions:
  contents: write

concurrency:
  group: floodsafe-core-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest official DHM and BIPAD river feeds
        run: python scripts/floodsafe-core-sync-v3.py

      - name: Normalize latest official observations
        run: python scripts/floodsafe-river-sanitize.py

      - name: Validate latest official snapshot and full station catalogue
        run: |
          python -m json.tool data/floodsafe-core.json >/dev/null
          python - <<'PY'
          import json
          j=json.load(open('data/floodsafe-core.json'))
          src=j.get('sources',{}).get('rivers',{})
          rivers=j.get('rivers',[])
          stations=j.get('river_stations',[])

          def measured(row):
              return any(row.get(k) not in (None,'') for k in (
                  'waterLevel','water_level','currentWaterLevel','current_water_level',
                  'currentLevel','current_level','level'))

          current=[r for r in rivers if isinstance(r,dict) and measured(r)]
          assert j.get('schema_version',0) >= 5, j.get('schema_version')
          assert isinstance(stations,list) and len(stations) >= 100, len(stations)
          assert src.get('station_catalog_count') == len(stations), (src.get('station_catalog_count'),len(stations))
          assert src.get('station_catalog_with_coordinates',0) >= 80, src
          assert len(current) >= 50, len(current)
          assert src.get('current_official_count') == len(current), (src.get('current_official_count'),len(current))
          assert src.get('mirror_health') == 'current', src
          print('official stations',len(stations),'latest values',len(current),'live-page rows',src.get('official_live_page_row_count',0))
          for r in current[:12]:
              print('OFFICIAL',r.get('title') or r.get('river_name') or r.get('name'),r.get('waterLevel') or r.get('water_level'),r.get('_measurementTime'),r.get('_officialStatus'),r.get('_officialLivePage'))
          PY

      - name: Commit refreshed river snapshot immediately
        shell: bash
        run: |
          if git diff --quiet -- data/floodsafe-core.json; then
            echo 'No river snapshot change.'
            exit 0
          fi
          git config user.name 'FloodSafe live sync'
          git config user.email 'actions@users.noreply.github.com'
          git add data/floodsafe-core.json
          git commit -m '[auto] refresh FloodSafe latest official rivers'
          git pull --rebase origin main
          git push origin HEAD:main
