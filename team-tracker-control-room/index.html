<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06101b"><title>Team Tracker — Control Room</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--bg:#06101b;--card:#0d1d2c;--line:#263d53;--text:#f6f9fc;--muted:#93a7b9;--gold:#efb632;--green:#58d98a;--blue:#48a9e6;--red:#ff9b9b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#102c42 0,transparent 32%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}.wrap{max-width:1200px;margin:auto;padding:14px}.brand{display:flex;justify-content:space-between;align-items:center;margin:8px 0 15px}.brand b{color:var(--gold);letter-spacing:.14em}.pill{font-size:11px;border:1px solid #59461a;border-radius:99px;padding:6px 9px;color:#f6cd70}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:13px}.login{max-width:430px;margin:45px auto}.field{width:100%;padding:13px;background:#07131f;color:#fff;border:1px solid #38516a;border-radius:11px;margin:6px 0 11px}.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.full{width:100%}.gold{background:var(--gold);color:#191207}.dark{background:#13283b;color:#eef7ff;border:1px solid #38516a}.hidden{display:none!important}.muted{color:var(--muted)}.msg{font-size:13px;margin-top:10px;min-height:18px}.bad{color:var(--red)}.good{color:var(--green)}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}.stat{background:#0a1926;border:1px solid var(--line);border-radius:12px;padding:11px}.stat small{color:var(--muted)}.stat b{display:block;font-size:22px;margin-top:2px}#map{height:390px;border-radius:14px;background:#dfe5e7}.staff{margin-top:12px}.row{border:1px solid #233d54;border-radius:13px;padding:12px;margin:9px 0;background:#091724}.rowtop{display:flex;justify-content:space-between;gap:10px}.badge{font-weight:900}.live{color:var(--green);font-weight:900}.stale{color:#f0c965;font-weight:900}.sub{font-size:12px;color:var(--muted);margin-top:3px}.assign{display:grid;grid-template-columns:1fr 1.35fr .7fr auto;gap:7px;margin-top:10px}.assign input,.assign select{background:#06131f;color:#fff;border:1px solid #34506a;border-radius:9px;padding:9px}.assign button{background:#2b230d;border:1px solid #7c6120;color:#f5ce72;border-radius:9px;padding:9px;font-weight:900;cursor:pointer}.tasks{margin-top:14px}.task{display:grid;grid-template-columns:1fr 1.5fr auto;gap:8px;border-top:1px solid #20364a;padding:10px 0;font-size:13px}.status{font-weight:900}.assigned{color:#efca69}.acknowledged{color:#65bfff}.completed{color:#78e0a5}.declined,.cancelled{color:#f2a2a2}.toast{position:fixed;right:12px;top:12px;z-index:9999;background:#0c2234;border:1px solid #486b86;border-radius:12px;padding:12px 14px;max-width:330px;display:none}.label{background:#071826;color:#fff;border:1px solid #577792;border-radius:7px;padding:2px 6px;font-size:10px;font-weight:900}.debug{font-size:11px;color:#74899e;text-align:center;margin-top:12px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}#map{height:300px}.assign,.task{grid-template-columns:1fr}.head{align-items:flex-start}.wrap{padding:10px}}
</style></head><body><div class="wrap"><div class="brand"><b>TEAM TRACKER | CONTROL ROOM</b><span class="pill">WEB LIVE</span></div><section id="login" class="card login"><h2>Authorised access</h2><p class="muted">Control Room / Admin account only.</p><input id="email" class="field" type="email" autocomplete="username" placeholder="Email"><input id="pass" class="field" type="password" autocomplete="current-password" placeholder="Password"><button id="signin" class="btn gold full">SIGN IN</button><div id="msg" class="msg"></div><div id="boot" class="debug">Loading secure sign-in…</div></section><main id="app" class="hidden"><section class="card"><div class="head"><div><h2 style="margin:0">Live Operations</h2><div id="who" class="muted"></div></div><button id="signout" class="btn dark">SIGN OUT</button></div><div class="stats"><div class="stat"><small>ON SHIFT</small><b id="onCount">0</b></div><div class="stat"><small>GPS LIVE</small><b id="gpsCount">0</b></div><div class="stat"><small>HOTEL</small><b id="hotelCount">0</b></div><div class="stat"><small>WAITING</small><b id="waitCount">0</b></div></div><div id="map"></div><div id="staff" class="staff"></div></section><section class="card"><h3 style="margin-top:0">Task Responses</h3><div id="tasks" class="tasks"></div></section></main></div><div id="toast" class="toast"></div>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const URL='https://kkvtspbmawxhwyadafyd.supabase.co',KEY='sb_publishable_v0Alfzh0oA5hfHkO7mzDZw_sEsDCQ3U',$=id=>document.getElementById(id);let sb=null,profile=null,rows=[],taskRows=[],map=null,markers=[],chan=null,poll=null,busy=false;
function setMsg(t,kind=''){const e=$('msg');e.textContent=t;e.className='msg '+kind}function badge(r){if(r.team_code==='control_room')return'CONTROL ROOM';return`${String(r.team_code||'STAFF').toUpperCase()} ${r.badge_number??''}`.trim()}function tm(x){if(!x)return'—';return new Date(x).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2500)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function taskBadge(id){const r=rows.find(x=>x.staff_id===id);return r?badge(r):'STAFF'}
function boot(){if(!window.supabase){$('boot').textContent='Sign-in library failed to load. Refresh the page or try another browser/network.';$('boot').className='debug bad';$('signin').disabled=true;return}sb=window.supabase.createClient(URL,KEY);$('boot').textContent='Secure sign-in ready.';$('boot').className='debug good';$('signin').onclick=signin;$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')signin()});$('signout').onclick=signout;sb.auth.getSession().then(({data})=>{if(data?.session)enter()})}
async function signin(){if(!sb)return;const email=$('email').value.trim(),password=$('pass').value;if(!email||!password){setMsg('Enter email and password.','bad');return}$('signin').disabled=true;setMsg('Signing in…');try{const{error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;setMsg('Account accepted. Loading profile…','good');await enter()}catch(e){setMsg(e?.message||'Sign-in failed.','bad')}finally{$('signin').disabled=false}}
async function enter(){try{const{data,error}=await sb.rpc('my_app_profile');if(error)throw error;const p=Array.isArray(data)?data[0]:data;if(!p)throw new Error('Profile not found for this account.');if(!['control_room','admin'].includes(p.access_level)){await sb.auth.signOut();throw new Error('Control Room/Admin access required.')}profile=p;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=`${badge(p)} • ${String(p.access_level).toUpperCase()}`;initMap();await refresh();listen();startPoll()}catch(e){setMsg(e?.message||'Could not load control-room profile.','bad')}}
async function signout(){stop();if(sb)await sb.auth.signOut();profile=null;$('app').classList.add('hidden');$('login').classList.remove('hidden');setMsg('Signed out.','good')}
function initMap(){if(map||!window.L)return;map=L.map('map').setView([50.722,-3.533],16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap'}).addTo(map);setTimeout(()=>map.invalidateSize(),100)}
async function refresh(){if(!profile||busy)return;busy=true;try{await Promise.all([fetchStaff(),fetchTasks()]);render()}finally{busy=false}}
async function fetchStaff(){const{data,error}=await sb.from('manager_live_locations').select('*').eq('is_on_shift',true).order('updated_at',{ascending:false});if(error){toast('Live staff: '+error.message);return}rows=data||[]}
async function fetchTasks(){const{data,error}=await sb.from('task_assignments').select('*').order('created_at',{ascending:false}).limit(50);if(error){toast('Tasks: '+error.message);return}taskRows=data||[]}
function render(){const now=Date.now();$('onCount').textContent=rows.length;$('gpsCount').textContent=rows.filter(r=>r.latitude!=null&&r.longitude!=null&&now-new Date(r.updated_at).getTime()<180000).length;$('hotelCount').textContent=rows.filter(r=>r.team_code==='hotel').length;$('waitCount').textContent=taskRows.filter(t=>['assigned','acknowledged'].includes(t.status)).length;renderMap();renderStaff();renderTasks()}
function renderMap(){if(!map)return;markers.forEach(m=>m.remove());markers=[];const pts=[];rows.forEach(r=>{const lat=Number(r.latitude),lon=Number(r.longitude);if(!Number.isFinite(lat)||!Number.isFinite(lon))return;const m=L.marker([lat,lon]).addTo(map).bindTooltip(badge(r),{permanent:true,direction:'top',className:'label'}).bindPopup(`<b>${esc(badge(r))}</b><br>${esc(r.real_name||'Name not added')}<br>${esc(r.area||'—')}<br>${esc(r.task||'—')}<br>${esc(tm(r.updated_at))}`);markers.push(m);pts.push([lat,lon])});if(pts.length===1)map.setView(pts[0],17);else if(pts.length>1)map.fitBounds(pts,{padding:[35,35],maxZoom:18})}
function renderStaff(){$('staff').innerHTML=rows.length?rows.map(r=>{const stale=Date.now()-new Date(r.updated_at).getTime()>180000,latest=taskRows.find(t=>t.staff_id===r.staff_id);return`<div class="row"><div class="rowtop"><div><span class="badge">${esc(badge(r))}</span><div class="sub">${esc(r.real_name||'Name not added')} • ${esc(r.area||'Area not set')}</div></div><span class="${stale?'stale':'live'}">${stale?'STALE GPS':'LIVE'}</span></div><div class="sub">Current: ${esc(r.task||'No task')} • updated ${esc(tm(r.updated_at))}${latest?` • last response: ${esc(latest.status||'assigned')}`:''}</div><div class="assign"><input id="a_${r.staff_id}" value="${esc(r.area||'')}" placeholder="Area / checkpoint"><input id="t_${r.staff_id}" placeholder="Task for ${esc(badge(r))}"><select id="p_${r.staff_id}"><option value="normal">normal</option><option value="high">high</option><option value="urgent">urgent</option></select><button onclick="assignTask('${r.staff_id}')">ASSIGN</button></div></div>`}).join(''):'<div class="muted" style="padding:18px">No staff currently on shift.</div>'}
function renderTasks(){$('tasks').innerHTML=taskRows.length?taskRows.slice(0,20).map(t=>`<div class="task"><div><b>${esc(taskBadge(t.staff_id))}</b><div class="sub">${esc(tm(t.created_at))}</div></div><div>${esc(t.task_text||'Task')}<div class="sub">${esc(t.area||'')} • ${esc(t.priority||'normal')}</div></div><div class="status ${esc(t.status||'assigned')}">${esc(String(t.status||'assigned').toUpperCase())}</div></div>`).join(''):'<div class="muted">No task responses yet.</div>'}
window.assignTask=async staffId=>{if(!profile||!['control_room','admin'].includes(profile.access_level))return;const task=$('t_'+staffId)?.value.trim(),area=$('a_'+staffId)?.value.trim(),priority=$('p_'+staffId)?.value||'normal';if(!task){toast('Enter a task first.');return}const{error}=await sb.rpc('control_room_assign_task',{p_staff_id:staffId,p_task_text:task,p_area:area||null,p_priority:priority});if(error){toast(error.message);return}$('t_'+staffId).value='';toast('Task assigned.');await refresh()}
function listen(){if(chan)sb.removeChannel(chan);chan=sb.channel('control_room_web_live_'+Date.now()).on('postgres_changes',{event:'*',schema:'public',table:'current_locations'},refresh).on('postgres_changes',{event:'*',schema:'public',table:'shifts'},refresh).on('postgres_changes',{event:'*',schema:'public',table:'task_assignments'},refresh).subscribe()}
function startPoll(){if(poll)return;poll=setInterval(()=>{if(!document.hidden)refresh()},1000)}function stop(){if(poll){clearInterval(poll);poll=null}if(chan&&sb){sb.removeChannel(chan);chan=null}markers.forEach(m=>m.remove());markers=[]}
window.addEventListener('load',boot);window.addEventListener('focus',()=>{if(profile)refresh()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&profile)refresh()});
</script></body></html>
