name: FloodSafe approved PJBUILTS intro source-only test

on:
  push:
    branches:
      - intro/floodsafe-approved-pjbuilts-20261006
    paths:
      - '.github/workflows/build-floodsafe-approved-intro-source-only.yml'
      - '.github/intro/PJBuiltsSplashActivity-approved.java'
      - '.github/scripts/patch_v0919_notifications_reliable.py'
      - '.github/scripts/patch_v0920_current_location_reliable.py'
      - '.github/scripts/patch_v0921_district_language_text_only.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Load exact approved animated-cloud v0.9.18 build recipe
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin e6e161a01196dea68d3ce68dcd928665c61f0a83
          git checkout e6e161a01196dea68d3ce68dcd928665c61f0a83 -- \
            .github/scripts/patch_v0919_notifications_reliable.py \
            .github/scripts/patch_v0920_current_location_reliable.py \
            .github/scripts/patch_v0921_district_language_text_only.py
          cp .github/scripts/patch_v0919_notifications_reliable.py /tmp/notification-only.py
          cp .github/scripts/patch_v0920_current_location_reliable.py /tmp/location-only.py
          cp .github/scripts/patch_v0921_district_language_text_only.py /tmp/district-language-only.py
          git fetch --no-tags --depth=1 origin 30d43675232e425773649d09edda10d5ca8321a5
          git checkout 30d43675232e425773649d09edda10d5ca8321a5 -- floodsafe-android-app .github/scripts
          cp /tmp/notification-only.py .github/scripts/patch_v0919_notifications_reliable.py
          cp /tmp/location-only.py .github/scripts/patch_v0920_current_location_reliable.py
          cp /tmp/district-language-only.py .github/scripts/patch_v0921_district_language_text_only.py

      - name: Recreate exact approved animated-cloud app
        shell: bash
        run: |
          set -euo pipefail
          J='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app'
          mkdir -p /tmp/current-v0918-overlay
          cp "$J/PJBuiltsSplashActivity.java" /tmp/current-v0918-overlay/
          cp "$J/MonitoringSafetyProvider.java" /tmp/current-v0918-overlay/
          cp "$J/SathiNextLevelV0918.java" /tmp/current-v0918-overlay/
          cp floodsafe-android-app/app/src/main/AndroidManifest.xml /tmp/current-v0918-overlay/AndroidManifest.xml

          git fetch --no-tags --depth=1 origin 00eab9a3d2a5256bcb353a24b39b549182367696
          git checkout 00eab9a3d2a5256bcb353a24b39b549182367696 -- floodsafe-android-app
          git fetch --no-tags --depth=1 origin 50a2f51b1dd1427c1f5ed0e78cdc5f6272c791f4
          git checkout 50a2f51b1dd1427c1f5ed0e78cdc5f6272c791f4 -- floodsafe-android-app/patch_native_v0918_stability_performance.py

          cp /tmp/current-v0918-overlay/PJBuiltsSplashActivity.java "$J/PJBuiltsSplashActivity.java"
          cp /tmp/current-v0918-overlay/MonitoringSafetyProvider.java "$J/MonitoringSafetyProvider.java"
          cp /tmp/current-v0918-overlay/SathiNextLevelV0918.java "$J/SathiNextLevelV0918.java"

          python3 floodsafe-android-app/patch_native_language_safe.py
          python3 floodsafe-android-app/patch_native_weather_complete.py
          python3 floodsafe-android-app/patch_native_weather_station_correction.py
          python3 floodsafe-android-app/patch_native_v0906_district_196_rain.py
          python3 floodsafe-android-app/patch_native_v0907_district_click.py
          python3 floodsafe-android-app/patch_native_v0908_step1_river_click.py
          python3 floodsafe-android-app/patch_native_v0908_step2_compact_district.py
          python3 floodsafe-android-app/fix_v0908_step3_weather_refresh_anchor.py
          python3 floodsafe-android-app/patch_native_v0908_step3_storm_notifications.py
          python3 floodsafe-android-app/patch_native_v0909_sync_sathi_language.py
          python3 floodsafe-android-app/fix_v0909_district_lambda_compile.py
          python3 floodsafe-android-app/patch_native_v0910_step1_sathi_chat.py
          python3 floodsafe-android-app/patch_native_v0910_step2_map_labels.py
          python3 floodsafe-android-app/run_v0911_patch_fixed.py
          python3 floodsafe-android-app/fix_v0911_threshold_order.py
          python3 floodsafe-android-app/patch_native_v0912_weather_rain_parity.py
          python3 floodsafe-android-app/patch_native_v0913_dhm_rain_overlay.py
          python3 floodsafe-android-app/patch_native_v0914_current_rain_only.py
          python3 floodsafe-android-app/fix_v0915_weather_icon_patch_script.py
          python3 floodsafe-android-app/patch_native_v0915_weather_icons.py
          python3 floodsafe-android-app/fix_v0916_patch_script.py
          python3 floodsafe-android-app/fix_v0916_patch_script_v2.py
          python3 floodsafe-android-app/fix_v0916_patch_script_v3.py
          python3 floodsafe-android-app/patch_native_v0916_sathi_knowledge.py
          python3 floodsafe-android-app/fix_v0917_marker_comments.py
          python3 floodsafe-android-app/patch_native_v0917_weather_runtime.py
          python3 floodsafe-android-app/patch_native_v0918_stability_performance.py
          python3 .github/scripts/patch_v0918_userfix.py
          python3 .github/scripts/patch_v0918_sathi_visual_text_only.py
          python3 .github/scripts/patch_v0918_language_no_map_reload.py
          python3 .github/scripts/patch_v0918_animated_cloud_marker_only.py

          cp /tmp/current-v0918-overlay/AndroidManifest.xml floodsafe-android-app/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('floodsafe-android-app/app/build.gradle')
          s=p.read_text()
          s=s.replace("versionCode 35", "versionCode 120")
          s=s.replace("versionName '0.9.18-stability-performance'", "versionName '0.9.21-district-language-text-test'")
          if "androidx.webkit:webkit:1.12.1" not in s:
              s=s.replace("dependencies {\n", "dependencies {\n    implementation 'androidx.webkit:webkit:1.12.1'\n")
          p.write_text(s)
          PY

      - name: Freeze unrelated app files
        shell: bash
        run: |
          set -euo pipefail
          find floodsafe-android-app/app/src/main -type f \
            ! -path '*/FloodMonitorService.java' \
            ! -path '*/ReliableNotificationMonitor.java' \
            ! -path '*/NativeFullActivity.java' \
            -print0 | sort -z | xargs -0 sha256sum > /tmp/protected-before.sha256
          sha256sum floodsafe-android-app/app/build.gradle > /tmp/build-before.sha256

      - name: Apply notification reliability change
        run: python3 .github/scripts/patch_v0919_notifications_reliable.py

      - name: Apply current location reliability change
        run: python3 .github/scripts/patch_v0920_current_location_reliable.py

      - name: Apply district language text change only
        run: python3 .github/scripts/patch_v0921_district_language_text_only.py

      - name: Prove unrelated systems unchanged
        shell: bash
        run: |
          set -euo pipefail
          find floodsafe-android-app/app/src/main -type f \
            ! -path '*/FloodMonitorService.java' \
            ! -path '*/ReliableNotificationMonitor.java' \
            ! -path '*/NativeFullActivity.java' \
            -print0 | sort -z | xargs -0 sha256sum > /tmp/protected-after.sha256
          diff -u /tmp/protected-before.sha256 /tmp/protected-after.sha256
          sha256sum -c /tmp/build-before.sha256
          J='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app'
          grep -Fq 'V0918_ANIMATED_CLOUD_MARKER_ONLY' "$J/WeatherMapOverlayController.java"
          grep -Fq 'cloudMarkerTick' "$J/WeatherMapOverlayController.java"
          grep -Fq 'applyCloudMarkerAnimation' "$J/WeatherMapOverlayController.java"
          grep -Fq 'V0918_LANGUAGE_KEEP_MAP_VISIBLE' "$J/NativeFullActivity.java"
          grep -Fq 'V0920_CURRENT_LOCATION_RETRY' "$J/NativeFullActivity.java"
          grep -Fq 'V0921_DISTRICT_LANGUAGE_TEXT_ONLY' "$J/NativeFullActivity.java"
          grep -Fq 'V0921_DISTRICT_HINT_LANGUAGE_SYNC' "$J/NativeFullActivity.java"
          ! grep -Fq 'the long district list is no longer shown here' "$J/NativeFullActivity.java"
          ! grep -Fq 'लामो ७७-जिल्ला सूची अब यहाँ देखिँदैन' "$J/NativeFullActivity.java"
          grep -Fq 'V0919_NOTIFICATION_ONLY_START' "$J/FloodMonitorService.java"
          echo 'PASS: district language/text fix only; map/cloud/river/SATHI/location/notification systems preserved'

      - name: Snapshot reproduced app before intro-only change
        shell: bash
        run: |
          set -euo pipefail
          SPLASH='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/PJBuiltsSplashActivity.java'
          find floodsafe-android-app/app/src/main -type f ! -path "$SPLASH" -print0 | sort -z | xargs -0 sha256sum > /tmp/floodsafe-before-intro.sha256
          sha256sum floodsafe-android-app/app/build.gradle > /tmp/floodsafe-build-before-intro.sha256
          grep -Fq 'new Intent(this, NativeFullActivity.class)' "$SPLASH"

      - name: Replace PJBUILTS splash source only
        shell: bash
        run: |
          set -euo pipefail
          SPLASH='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/PJBuiltsSplashActivity.java'
          cp .github/intro/PJBuiltsSplashActivity-approved.java "$SPLASH"
          grep -Fq 'PUJAN' "$SPLASH"
          grep -Fq 'IDEA  •  BUILD  •  INNOVATE' "$SPLASH"
          grep -Fq 'new Intent(this, NativeFullActivity.class)' "$SPLASH"

      - name: Prove FloodSafe source unchanged outside intro
        shell: bash
        run: |
          set -euo pipefail
          SPLASH='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/PJBuiltsSplashActivity.java'
          find floodsafe-android-app/app/src/main -type f ! -path "$SPLASH" -print0 | sort -z | xargs -0 sha256sum > /tmp/floodsafe-after-intro.sha256
          diff -u /tmp/floodsafe-before-intro.sha256 /tmp/floodsafe-after-intro.sha256
          sha256sum -c /tmp/floodsafe-build-before-intro.sha256
          echo 'PASS: only PJBuiltsSplashActivity.java changed after exact v0.9.21 reproduction'

      - name: Build and unit test native APK
        run: gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" > /tmp/apk-list.txt
          grep -Eq 'classes[0-9]*\.dex' /tmp/apk-list.txt
          grep -Fq 'AndroidManifest.xml' /tmp/apk-list.txt
          grep -Fq 'assets/floodsafe-nepal/v24/nepal-districts.geojson' /tmp/apk-list.txt
          grep -Fq 'assets/data/nepal-waterways-tiles/overview.json' /tmp/apk-list.txt
          if grep -Eq 'assets/.*\.(html|js|mjs|webmanifest)$' /tmp/apk-list.txt; then exit 1; fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" FloodSafe-Nepal-v0.9.21-PJBUILTS-INTRO-ONLY.apk
          sha256sum FloodSafe-Nepal-v0.9.21-PJBUILTS-INTRO-ONLY.apk > FloodSafe-Nepal-v0.9.21-PJBUILTS-INTRO-ONLY-SHA256.txt

      - name: Upload private test APK artifact only
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-v0.9.21-PJBUILTS-INTRO-SOURCE-ONLY-APK
          path: |
            FloodSafe-Nepal-v0.9.21-PJBUILTS-INTRO-ONLY.apk
            FloodSafe-Nepal-v0.9.21-PJBUILTS-INTRO-ONLY-SHA256.txt
          if-no-files-found: error
          retention-days: 14
