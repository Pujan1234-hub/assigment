plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'io.github.pujan1234hub.floodsafe.app'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.pujan1234hub.floodsafe.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/floodsafe-assets'))
    lint { abortOnError = true }
}

def bundleWeb = tasks.register('bundleFloodSafe', Copy) {
    // Bundle the UI/data inside the APK; no Python, Node or browser server required.
    from(rootProject.file('../floodsafe-nepal')) {
        into 'floodsafe-nepal'
        exclude 'v25/rain-push-v1.js'
    }
    from(rootProject.file('../data')) { into 'data' }
    from(rootProject.file('android-web')) { into 'floodsafe-nepal/v25' }
    includeEmptyDirs = false
    into(layout.buildDirectory.dir('generated/floodsafe-assets'))
}
tasks.named('preBuild').configure { dependsOn bundleWeb }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.firebase:firebase-messaging:24.1.1'
    implementation 'androidx.work:work-runtime:2.9.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
