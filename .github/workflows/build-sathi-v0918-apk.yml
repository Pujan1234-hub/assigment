name: Build SATHI v0.9.18 APK

on:
  push:
    branches:
      - fix/v0-9-18-sathi-next-level
    paths:
      - 'floodsafe-android-app/**'
      - 'floodsafe-nepal/v25/sathi-flood-ai/**'
      - 'floodsafe-nepal/v25/index.html'
      - '.github/workflows/build-sathi-v0918-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check web SATHI syntax
        run: node --check floodsafe-nepal/v25/sathi-flood-ai/voice-human-v0918.js
      - name: Build native debug APK
        run: gradle -p floodsafe-android-app :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -Eq 'classes[0-9]*\.dex'
          cp "$APK" FloodSafe-Nepal-SATHI-v0.9.18-test.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-SATHI-v0.9.18-test-APK
          path: FloodSafe-Nepal-SATHI-v0.9.18-test.apk
          if-no-files-found: error
          retention-days: 14
