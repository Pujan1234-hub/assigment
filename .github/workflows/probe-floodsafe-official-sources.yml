name: Probe FloodSafe Official Sources

on:
  push:
    branches: [ fix/floodsafe-v0882-realtime-river-rain ]
    paths: [ '.github/workflows/probe-floodsafe-official-sources.yml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe BIPAD River Watch and DHM rainfall map API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request,urllib.parse,http.cookiejar,re,datetime,time
          # BIPAD River Watch parity
          u='https://bipadportal.gov.np/api/v1/river-stations/?format=json&limit=5000&_fs='+str(time.time_ns())
          req=urllib.request.Request(u,headers={'User-Agent':'FloodSafe-Nepal/source-probe','Accept':'application/json','Cache-Control':'no-cache,no-store'})
          with urllib.request.urlopen(req,timeout=30) as r:j=json.load(r)
          rows=j.get('results') or [];now=time.time();active=[]
          for x in rows:
            t=x.get('waterLevelOn') or x.get('water_level_on');lvl=x.get('waterLevel') if x.get('waterLevel') is not None else x.get('water_level')
            if not t or lvl is None:continue
            try:
              dt=datetime.datetime.fromisoformat(str(t).replace('Z','+00:00'));dt=dt if dt.tzinfo else dt.replace(tzinfo=datetime.timezone(datetime.timedelta(hours=5,minutes=45)));age=now-dt.timestamp()
            except:continue
            if -300<=age<=24*3600:active.append(x)
          print('BIPAD_CATALOG',len(rows),'BIPAD_24H_RIVER_WATCH',len(active))
          # DHM rainfall map API: same POST the official page uses.
          jar=http.cookiejar.CookieJar();op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          page=op.open(urllib.request.Request('https://dhm.gov.np/hydrology/rainfall-watch-map',headers={'User-Agent':'Mozilla/5.0 FloodSafe'}),timeout=30).read().decode('utf-8','ignore')
          token=re.search(r'name="csrf_test_name"\s+value="([^"]+)"',page);token=token.group(1) if token else ''
          assert token,'DHM CSRF token missing'
          for hour in [1,3,6,12,24]:
            body=urllib.parse.urlencode({'csrf_test_name':token,'type':'0','mapValue':'all','hour':str(hour)}).encode()
            req=urllib.request.Request('https://dhm.gov.np/hydrology/getRainfallFilter',data=body,headers={'User-Agent':'Mozilla/5.0 FloodSafe','Accept':'application/json','Content-Type':'application/x-www-form-urlencoded; charset=UTF-8','X-Requested-With':'XMLHttpRequest','Referer':'https://dhm.gov.np/hydrology/rainfall-watch-map'})
            raw=op.open(req,timeout=30).read().decode('utf-8','ignore');obj=json.loads(raw)
            data=obj.get('data');arr=data[0] if isinstance(data,list) and data and isinstance(data[0],list) else []
            updated=data.get('rainfall_date_time') if isinstance(data,dict) else (None)
            if isinstance(data,list) and hasattr(data,'__len__'): updated=None
            print('DHM_RAIN',hour,'status=',obj.get('status'),'stations=',len(arr),'sample=',arr[0] if arr else None,'updated=',updated)
            assert obj.get('status')=='success' and arr,'DHM rainfall map returned empty for hour '+str(hour)
          PY
