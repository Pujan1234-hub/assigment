name: Build Nepal Waterways Snapshot
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-nepal-waterways.yml"
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
concurrency:
  group: nepal-waterways-snapshot
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Nepal river and stream geometry in tiles
        run: |
          set -euo pipefail
          mkdir -p /tmp/waterways data
          python3 - <<'PY'
          import subprocess, json, time, os
          tiles=[]
          lons=[80.0,82.1,84.2,86.3,88.35]
          lats=[26.2,28.35,30.5]
          for yi in range(2):
            for xi in range(4):
              s,n=lats[yi],lats[yi+1]; w,e=lons[xi],lons[xi+1]
              tiles.append((s,w,n,e))
          eps=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']
          for i,(s,w,n,e) in enumerate(tiles):
            q=f'[out:json][timeout:90];(way["waterway"="river"]({s},{w},{n},{e});way["waterway"="stream"]({s},{w},{n},{e}););out tags geom;'
            ok=False
            for ep in eps:
              try:
                p=subprocess.run(['curl','--retry','2','--retry-delay','2','--max-time','110','-fsSL','-X','POST',ep,'--data-urlencode','data='+q],capture_output=True,text=True,check=True)
                j=json.loads(p.stdout)
                if isinstance(j.get('elements'),list):
                  json.dump(j,open(f'/tmp/waterways/{i}.json','w'))
                  print('tile',i,'elements',len(j['elements']))
                  ok=True; break
              except Exception as ex:
                print('retry tile',i,ep,ex)
                time.sleep(2)
            if not ok:
              raise SystemExit(f'tile {i} failed')
          PY
      - name: Merge and simplify snapshot
        run: |
          python3 - <<'PY'
          import json,glob,math,datetime,os
          out=[]; seen=set()
          for fn in glob.glob('/tmp/waterways/*.json'):
            j=json.load(open(fn))
            for e in j.get('elements',[]):
              if e.get('type')!='way' or e.get('id') in seen: continue
              geom=e.get('geometry') or []
              if len(geom)<2: continue
              seen.add(e.get('id'))
              step=max(1,math.ceil(len(geom)/45))
              pts=[[round(p['lon'],6),round(p['lat'],6)] for p in geom[::step]]
              last=[round(geom[-1]['lon'],6),round(geom[-1]['lat'],6)]
              if pts[-1]!=last: pts.append(last)
              tags=e.get('tags') or {}
              out.append({'id':e.get('id'),'type':tags.get('waterway','stream'),'name':tags.get('name') or '', 'name_ne':tags.get('name:ne') or tags.get('name_ne') or '', 'name_en':tags.get('name:en') or '', 'pts':pts})
          payload={'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'source':'OpenStreetMap via Overpass','license':'ODbL','count':len(out),'waterways':out}
          os.makedirs('data',exist_ok=True)
          json.dump(payload,open('data/nepal-waterways-snapshot.json','w'),ensure_ascii=False,separators=(',',':'))
          print('snapshot waterways',len(out),'bytes',os.path.getsize('data/nepal-waterways-snapshot.json'))
          assert len(out)>100
          PY
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nepal-waterways-snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh Nepal waterways snapshot"
          git push
