name: Build FloodSafe v0.8.80 River Status APK

on:
  push:
    branches: [ fix/floodsafe-v0880-river-status ]
    paths:
      - '.github/workflows/build-floodsafe-v0880-river-status.yml'
      - 'floodsafe-android-app/patch_native_v0880_river_status_color.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply known-good v0.8.77 baseline
        run: python3 floodsafe-android-app/run_patch_native_v0877.py

      - name: Apply v0.8.78 station resilience
        run: python3 floodsafe-android-app/patch_native_v0878_station_resilience.py

      - name: Apply v0.8.79 full river geometry
        run: python3 floodsafe-android-app/patch_native_v0879_full_river_geometry.py

      - name: Apply v0.8.80 live river status colours
        run: python3 floodsafe-android-app/patch_native_v0880_river_status_color.py

      - name: Verify native contracts
        shell: bash
        run: |
          set -euo pipefail
          M='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java'
          G='floodsafe-android-app/app/build.gradle'
          grep -Fq 'V0879_FULL_RIVER_TILE_RUNTIME' "$M"
          grep -Fq 'V0880_RIVER_STATUS_OVERLAY' "$M"
          grep -Fq 'V0880_LIVE_RIVER_STATUS_REFRESH' "$M"
          grep -Fq 'V0880_HIGHEST_SEVERITY_WINS' "$M"
          ! grep -Fq 'android.webkit.WebView' "$M"
          grep -Fq 'versionCode 100' "$G"
          grep -Fq "versionName '0.8.80'" "$G"
          echo 'V0880_NATIVE_STATUS_CONTRACT PASS'

      - name: Bundle source assets
        run: gradle -p floodsafe-android-app clean :app:bundleFloodSafe --no-daemon

      - name: Rebuild all Nepal river assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet shapely
          python3 floodsafe-android-app/preclip_nepal_waterways.py
          python3 floodsafe-android-app/rebalance_nepal_overview_v0839.py
          python3 floodsafe-android-app/build_regional_river_tiles_v0840.py
          python3 floodsafe-android-app/build_national_river_network_v0841.py
          python3 floodsafe-android-app/build_progressive_river_tiers_v0842.py
          python3 floodsafe-android-app/build_progressive_river_names_v0863.py
          python3 floodsafe-android-app/postclip_nepal_display_rivers_v0874.py

      - name: Audit full Nepal river package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          build=Path('floodsafe-android-app/app/build')
          mans=list(build.rglob('data/nepal-waterways-tiles/manifest.json'))
          if not mans: raise SystemExit('river manifest missing')
          wd=mans[0].parent
          m=json.loads(mans[0].read_text(encoding='utf-8'))
          count=int(m.get('count',0)); overview=int(m.get('overview_count',0))
          tiles=[p for p in wd.glob('*.json') if re.fullmatch(r'\d+-\d+\.json',p.name)]
          regional=wd.parent/'nepal-waterways-tiles-regional'
          rtiles=[p for p in regional.glob('*.json') if re.fullmatch(r'\d+-\d+\.json',p.name)]
          if count < 60000: raise SystemExit(f'expected >=60000 waterways, got {count}')
          if overview < 4000: raise SystemExit(f'expected >=4000 overview waterways, got {overview}')
          if len(tiles) < 90 or len(rtiles) < 90: raise SystemExit('river tile coverage too sparse')
          print('V0880_FULL_RIVER_PACKAGE PASS', count, overview, len(tiles), len(rtiles))
          PY

      - name: Unit test and build APK
        run: gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug -x bundleFloodSafe --no-daemon --stacktrace

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-waterways-tiles/overview.json'
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-waterways-tiles/7-2.json'
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-waterways-tiles-regional/7-2.json'
          cp "$APK" FloodSafe-Nepal-v0.8.80-FULL-RIVER-STATUS.apk
          stat -c '%n %s bytes' FloodSafe-Nepal-v0.8.80-FULL-RIVER-STATUS.apk
          sha256sum FloodSafe-Nepal-v0.8.80-FULL-RIVER-STATUS.apk | tee FloodSafe-Nepal-v0.8.80-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-v0880-FULL-RIVER-STATUS
          path: |
            FloodSafe-Nepal-v0.8.80-FULL-RIVER-STATUS.apk
            FloodSafe-Nepal-v0.8.80-SHA256.txt
          retention-days: 14

      - name: Publish direct-download prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='floodsafe-v0.8.80-full-river-status'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'FloodSafe Nepal v0.8.80 — Full River Status' --prerelease --notes 'Full v0.8.79 native river package plus live station-driven river status colours: Danger red, Warning orange, Alert yellow, Normal cyan/blue.'
          gh release upload "$TAG" FloodSafe-Nepal-v0.8.80-FULL-RIVER-STATUS.apk FloodSafe-Nepal-v0.8.80-SHA256.txt --repo "$GITHUB_REPOSITORY" --clobber
