name: FloodSafe V25 Realtime Gate
on:
  push:
    branches: ["main"]
    paths:
      - "floodsafe-nepal/v25/**"
      - "data/nepal-waterways-snapshot.json"
      - "data/nepal-waterways-seed.json"
      - "data/nepal-waterways-last-good.json"
      - "data/floodsafe-people-status.json"
      - ".github/workflows/v25-browser-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: floodsafe-v25-realtime-gate
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for production app and live data contracts
        run: |
          set -euo pipefail
          BASE='https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/'
          HUMAN='https://raw.githubusercontent.com/Pujan1234-hub/assigment/main/data/floodsafe-people-status.json'
          WATER='https://raw.githubusercontent.com/Pujan1234-hub/assigment/main/data/nepal-waterways-seed.json'
          ok=0
          for i in $(seq 1 100); do
            curl --max-time 12 -fsSL "${BASE}?ci=${GITHUB_SHA}-${i}" -o /tmp/index.html || true
            curl --max-time 20 -fsSL "${WATER}?ci=${GITHUB_SHA}-${i}" -o /tmp/seed.json || true
            if grep -Fq 'map-v9.js?v=1' /tmp/index.html && grep -Fq 'map-v3.css?v=10' /tmp/index.html && grep -Fq 'gauge-bridge.js?v=2' /tmp/index.html && grep -Fq 'satellite-layer.js?v=2' /tmp/index.html && grep -Fq 'flood-freshness.js?v=8' /tmp/index.html && grep -Fq 'river-status-ui.js?v=1' /tmp/index.html && grep -Fq 'language-pure.js?v=5' /tmp/index.html && grep -Fq 'id="map3D"' /tmp/index.html && python3 -c "import json; j=json.load(open('/tmp/seed.json')); assert j.get('count',0)>=100; assert len(j.get('waterways',[]))==j['count']" 2>/dev/null; then
              ok=1
              break
            fi
            sleep 3
          done
          test "$ok" = 1
          for f in map-v9.js gauge-bridge.js satellite-layer.js flood-freshness.js river-status-ui.js language-pure.js rain-timing.js; do curl --max-time 12 -fsSL "${BASE}${f}?ci=${GITHUB_SHA}" -o "/tmp/${f}"; node --check "/tmp/${f}"; done
          curl --max-time 12 -fsSL "${BASE}map-v3.css?ci=${GITHUB_SHA}" -o /tmp/map.css
          curl --max-time 12 -fsSL "${HUMAN}?ci=${GITHUB_SHA}" -o /tmp/human.json
          grep -Fq '__fsMapV9' /tmp/map-v9.js
          grep -Fq 'riverFlowV9' /tmp/map-v9.js
          grep -Fq "addEventListener('fsriverupdate'" /tmp/map-v9.js
          grep -Fq '__fsGaugeBridgeV2' /tmp/gauge-bridge.js
          grep -Fq '__fsSatelliteV2' /tmp/satellite-layer.js
          grep -Fq '.riverFlowV9' /tmp/map.css
          ! grep -Fq '.riverArrowV8' /tmp/map.css
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/human.json'))
          current=(j.get('recovered_bodies'),j.get('missing_minimum'),j.get('rescued_alive'))
          assert current != (675,2426,2301), current
          assert all(isinstance(v,int) and v>0 for v in current), current
          for k in ('recovered_source','missing_source','rescued_source','last_checked_utc'):
              assert str(j.get(k,'')).strip(), k
          print('Human Status contract',current,j.get('recovered_source'),j.get('rescued_source'))
          PY
      - name: Browser clean river flow 3D status and auto-refresh regression
        env:
          BASE: https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"; test -n "$CHROME"
          mkdir -p /tmp/floodsafe && cd /tmp/floodsafe
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24.31.0 >/dev/null 2>&1
          BASE="$BASE" CHROME="$CHROME" node <<'JS'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage']});
            const context=browser.defaultBrowserContext();
            await context.overridePermissions('https://pujan1234-hub.github.io',['geolocation','notifications']);
            const page=await browser.newPage();
            await page.setViewport({width:1365,height:820,deviceScaleFactor:1});
            await page.setGeolocation({latitude:51.5074,longitude:-0.1278});
            page.setDefaultTimeout(75000);page.setDefaultNavigationTimeout(75000);
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(process.env.BASE+'?ci='+Date.now(),{waitUntil:'networkidle2'});
            await page.waitForSelector('#riverMapV3');
            await page.waitForFunction(()=>window.FloodSafeMap&&window.__fsMapV9&&window.__fsGaugeBridgeV2&&window.__fsSatelliteV2,{timeout:30000});
            if(await page.evaluate(()=>document.documentElement.lang)!=='en')await page.click('#langBtn');
            await page.waitForFunction(()=>document.documentElement.lang==='en');

            // Human Impact: distinguish figure time from automatic source scan and show each source.
            await page.waitForFunction(()=>document.querySelector('#impactDeaths')?.textContent!=='—'&&document.querySelectorAll('.impactSource').length===3,{timeout:25000});
            const human=await page.evaluate(()=>({d:Number(document.querySelector('#impactDeaths')?.textContent),m:Number(document.querySelector('#impactMissing')?.textContent),r:Number(document.querySelector('#impactRescued')?.textContent),fresh:document.querySelector('#impactFresh')?.textContent||'',sources:[...document.querySelectorAll('.impactSource')].map(x=>x.innerText)}));
            if(human.d===675&&human.m===2426&&human.r===2301)throw Error('Stale Human Impact tuple '+JSON.stringify(human));
            if(!/Latest verified figures:/i.test(human.fresh)||!/source scan:/i.test(human.fresh))throw Error('Impact time/source-scan distinction missing '+JSON.stringify(human));
            if(human.sources.some(x=>!/Source:/i.test(x)))throw Error('Human source labels missing '+JSON.stringify(human));

            // Nationwide list: status must be a visible right-side badge.
            await page.waitForFunction(()=>document.querySelectorAll('#nationalRiverList .riverStatusPill').length>3,{timeout:25000});
            const national=await page.evaluate(()=>[...document.querySelectorAll('#nationalRiverList .nationalRiver')].slice(0,8).map(r=>({name:r.querySelector('strong')?.textContent||'',status:r.querySelector('.riverStatusPill')?.textContent||'',cls:r.querySelector('.riverStatusPill')?.className||'',display:getComputedStyle(r.querySelector('.nationalStatusRow')).display})));
            if(national.some(x=>!x.status||x.display!=='flex'||!/normal|watch|warning|danger/.test(x.cls)))throw Error('National status badge failed '+JSON.stringify(national));

            const tests=[['Jhapa',26.5763,87.9019],['Sindhuli',27.164,86.328],['Myagdi',28.5782,83.5343],['Dolpa',29.2623,83.0371]];
            const results=[];
            for(let ti=0;ti<tests.length;ti++){
              const [name,la,lo]=tests[ti];
              await page.evaluate(([la,lo])=>window.FloodSafeMap.select(la,lo),[la,lo]);
              await page.waitForFunction(()=>document.querySelectorAll('.riverRouteV9').length>0&&document.querySelectorAll('.riverFlowV9').length>0,{timeout:30000});
              const r=await page.evaluate(()=>{
                const routes=[...document.querySelectorAll('.riverRouteV9')],flows=[...document.querySelectorAll('.riverFlowV9')],cs=getComputedStyle(routes[0]),fs=getComputedStyle(flows[0]),labels=[...document.querySelectorAll('.districtLabelV9')].filter(x=>getComputedStyle(x).display!=='none');
                return{routes:routes.length,flows:flows.length,width:parseFloat(cs.strokeWidth),stroke:cs.stroke,animation:fs.animationName,dash:fs.strokeDasharray,focus:window.FloodSafe?.state?.kind,hint:document.querySelector('#mapHint')?.textContent||'',visibleDistrictLabels:labels.length,oldArrows:document.querySelectorAll('.riverArrowV8').length};
              });
              if(r.routes<1||r.routes>24)throw Error(name+' route count invalid '+JSON.stringify(r));
              if(r.flows!==r.routes)throw Error(name+' flow trace count invalid '+JSON.stringify(r));
              if(r.oldArrows!==0)throw Error(name+' giant legacy arrows still present '+JSON.stringify(r));
              if(r.width<2||r.width>5)throw Error(name+' route width invalid '+JSON.stringify(r));
              if(!r.stroke||r.stroke==='none')throw Error(name+' route invisible '+JSON.stringify(r));
              if(!r.animation||r.animation==='none')throw Error(name+' moving flow trace missing '+JSON.stringify(r));
              if(r.visibleDistrictLabels!==0)throw Error(name+' cluttered district labels remain after focus '+JSON.stringify(r));
              if(r.focus!=='map')throw Error(name+' map focus failed '+JSON.stringify(r));
              await page.$eval('.riverHitV9',el=>el.dispatchEvent(new MouseEvent('click',{bubbles:true})));
              await page.waitForFunction(()=>{const s=document.querySelector('#riverSheet');return s&&!s.hidden&&getComputedStyle(s).display!=='none'});
              const sheet=await page.evaluate(()=>{const s=document.querySelector('#riverSheet'),sr=s.getBoundingClientRect();return{text:s.innerText||'',selected:document.querySelectorAll('.riverRouteV9.selected').length,width:sr.width,position:getComputedStyle(s).position}});
              for(const word of['Water level','Warning level','Danger level','Measured','Source','auto-refreshes every 5 seconds'])if(!sheet.text.includes(word))throw Error(name+' detail missing '+word+' '+sheet.text);
              if(!(/Official gauge|Nearest official reference gauge/.test(sheet.text)))throw Error(name+' gauge attribution missing '+sheet.text);
              if(sheet.selected<1||sheet.position!=='fixed'||sheet.width>420)throw Error(name+' detail sheet failed '+JSON.stringify(sheet));
              if(/[\u0900-\u097F]/.test(sheet.text))throw Error(name+' Nepali mixed into English sheet '+sheet.text);

              // First location: prove an fsriverupdate event refreshes the open detail automatically.
              if(ti===0){
                await page.evaluate(()=>{window.__origGaugeForWaterway=window.FloodSafeGauge.forWaterway;window.FloodSafeGauge.forWaterway=()=>({sameRiver:true,reference:false,status:'warning',statusLabel:'WARNING',level:12.34,warning:10,danger:15,name:'AUTOMATIC TEST GAUGE',distanceKm:1.2,time:new Date().toISOString()});window.dispatchEvent(new CustomEvent('fsriverupdate',{detail:{test:true}}))});
                await page.waitForFunction(()=>document.querySelector('#riverSheet')?.innerText.includes('12.34')&&document.querySelector('#riverSheet')?.innerText.includes('AUTOMATIC TEST GAUGE'));
                await page.evaluate(()=>{window.FloodSafeGauge.forWaterway=window.__origGaugeForWaterway;delete window.__origGaugeForWaterway});
              }
              await page.click('#riverSheetClose');
              results.push({name,...r});
            }

            // Deep zoom must go well beyond the old limit, without bringing giant labels/arrows back.
            await page.evaluate(()=>window.FloodSafeMap.select(26.5763,87.9019));
            for(let i=0;i<4;i++)await page.click('#mapZoomIn');
            const zoom=await page.evaluate(()=>({width:document.querySelector('#riverMapV3').viewBox.baseVal.width,arrows:document.querySelectorAll('.riverArrowV8').length,labels:[...document.querySelectorAll('.districtLabelV9')].filter(x=>getComputedStyle(x).display!=='none').length}));
            if(zoom.width>=100||zoom.arrows||zoom.labels)throw Error('Deep zoom clutter regression '+JSON.stringify(zoom));

            // 3D terrain toggle must add terrain shading and preserve overlay alignment layer.
            await page.click('#map3D');
            await page.waitForFunction(()=>document.querySelector('.mapCanvas')?.classList.contains('terrain3d'));
            const terrain=await page.evaluate(()=>({on:window.FloodSafeMap.is3D,shade:parseFloat(getComputedStyle(document.querySelector('#terrainShade')).opacity||'0'),button:document.querySelector('#map3D')?.textContent||''}));
            if(!terrain.on||terrain.shade<.2||!/3D Off/.test(terrain.button))throw Error('3D terrain toggle failed '+JSON.stringify(terrain));

            if(errors.length)throw Error('Page errors '+JSON.stringify(errors.slice(0,8)));
            console.log('PASS clean realtime flow + status badges + auto gauge refresh + 3D', {human,national,results,zoom,terrain});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(3)});
          JS
