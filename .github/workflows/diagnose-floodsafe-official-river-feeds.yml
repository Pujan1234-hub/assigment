name: Diagnose FloodSafe Official River Feeds

on:
  push:
    branches: [ fix/floodsafe-v0882-realtime-river-rain ]
    paths:
      - '.github/workflows/diagnose-floodsafe-official-river-feeds.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Trace DHM River Watch inline current-data request
        shell: bash
        run: |
          python3 - <<'PY'
          import re,urllib.request,html
          URL='https://www.dhm.gov.np/hydrology/river-watch'
          req=urllib.request.Request(URL,headers={'User-Agent':'Mozilla/5.0 FloodSafeNepal/0.8.85','Accept':'text/html,*/*','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,timeout=35) as r:s=r.read().decode('utf-8','replace')
          print('PAGE_BYTES',len(s))
          needles=['getApiFilter','frontend_dhm','hydrology/get','Loading data','water_level','warning_level','danger_level','station_no','axios','$.ajax','fetch(']
          for needle in needles:
              print('\n===== NEEDLE',needle,'=====')
              hits=list(re.finditer(re.escape(needle),s,re.I))
              print('HITS',len(hits))
              for m in hits[:12]:
                  x=html.unescape(s[max(0,m.start()-1300):min(len(s),m.end()+2200)])
                  x=re.sub(r'\s+',' ',x)
                  print(x[:3500])
          print('\n===== FORMS =====')
          for x in re.findall(r'<form[^>]*>',s,re.I)[:20]:print(re.sub(r'\s+',' ',x))
          print('\n===== XHR-LIKE URLS =====')
          found=[]
          for pat in [r'url\s*:\s*[\"\']([^\"\']+)',r'fetch\s*\(\s*[\"\']([^\"\']+)',r'axios\.[a-z]+\s*\(\s*[\"\']([^\"\']+)']:
              for x in re.findall(pat,s,re.I):
                  x=html.unescape(x)
                  if x not in found:found.append(x)
          for x in found:print(x)
          PY
