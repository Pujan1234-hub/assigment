name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "sw.js"
      - "fixcheck/**"
      - "team-tracker/**"
      - "floodsafe-nepal/**"
      - ".github/workflows/fixcheck-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare public site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp sw.js _site/sw.js
          cp -R fixcheck _site/fixcheck
          cp -R team-tracker _site/team-tracker
          cp -R floodsafe-nepal _site/floodsafe-nepal

          # V21 remains exactly as before: V2 core + existing pro-upgrade.js.
          if [ -d "floodsafe-nepal/v2" ] && [ -f "floodsafe-nepal/v2/pro-upgrade.js" ]; then
            rm -rf _site/floodsafe-nepal/v21
            cp -R floodsafe-nepal/v2 _site/floodsafe-nepal/v21
            python - <<'PY'
          from pathlib import Path
          p=Path('_site/floodsafe-nepal/v21/index.html')
          s=p.read_text()
          tag='<script src="./pro-upgrade.js?v=1"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s)
          PY
          fi

          # V22 is a separate lightweight build. V2 and V21 source are not modified.
          if [ -d "floodsafe-nepal/v2" ] && [ -f "floodsafe-nepal/v22-upgrade.js" ]; then
            rm -rf _site/floodsafe-nepal/v22
            cp -R floodsafe-nepal/v2 _site/floodsafe-nepal/v22
            cp floodsafe-nepal/v22-upgrade.js _site/floodsafe-nepal/v22/v22-upgrade.js
            rm -f _site/floodsafe-nepal/v22/pro-upgrade.js
            python - <<'PY'
          from pathlib import Path
          p=Path('_site/floodsafe-nepal/v22/index.html')
          s=p.read_text()
          s=s.replace('<title>बाढी सुरक्षा नेपाल • V2</title>','<title>बाढी सुरक्षा नेपाल • V22</title>')
          s=s.replace('Web/PWA खुला हुँदा polling सक्रिय रहन्छ; पूर्ण background 24/7 alert native app चरणमा हुनेछ।','')
          s=s.replace('नयाँ नजिकको आधिकारिक चेतावनी/सडक बन्द भेटिएपछि नरम तर चिनिने ध्वनि बज्छ।  alert','नजिकको आधिकारिक चेतावनी वा बढ्दो नदी जोखिम भेटिँदा सूचना र चिनिने नरम ध्वनि आउँछ।')
          s=s.replace("async function boot(){try{await initMap();", "window.__fs={get map(){return map},getFocus:()=>focus,setFocus,insideNepal,districtFor};\nasync function boot(){try{await initMap();")
          old="const saved=localStorage.getItem('floodsafe-focus');if(saved){try{const c=JSON.parse(saved);if(Array.isArray(c)&&insideNepal(c))setFocus(c,'saved',false)}catch{}}else{renderOfficial();renderDistricts()}"
          s=s.replace(old,"localStorage.removeItem('floodsafe-focus');renderOfficial();renderDistricts()")
          s=s.replace(".slice(0,800)}draw.forEach", ".slice(0,300)}draw.forEach")
          tag='<script src="./v22-upgrade.js?v=1"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s)
          PY
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload portfolio
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test FloodSafe Nepal
        run: |
          set -e
          URL="https://pujan1234-hub.github.io/assigment/floodsafe-nepal/"
          ok=0
          for i in $(seq 1 15); do
            if curl -fsSL "$URL" -o /tmp/floodsafe.html && grep -q "बाढी सुरक्षा नेपाल" /tmp/floodsafe.html; then
              ok=1
              break
            fi
            sleep 3
          done
          test "$ok" = "1"
          grep -q "leaflet@1.9.4" /tmp/floodsafe.html
          curl -fsSL "https://raw.githubusercontent.com/l3lackcurtains/nepali-geo-pro-max/117fd0f3d2dabae3bd86bfe9e4c57098ffe56669/src/geo/districts.geo.ts" -o /tmp/nepal-boundary.ts
          grep -q "NEPAL_DISTRICTS_GEO" /tmp/nepal-boundary.ts
          curl -fsSL -D /tmp/bipad.headers -H "Origin: https://pujan1234-hub.github.io" "https://bipadportal.gov.np/api/v1/river/?limit=1" -o /tmp/bipad.json
          python - <<'PY'
          import json
          json.load(open('/tmp/bipad.json'))
          print('BIPAD JSON valid')
          PY
          if ! grep -qi '^access-control-allow-origin:' /tmp/bipad.headers; then
            echo 'BIPAD API missing Access-Control-Allow-Origin header'
            exit 2
          fi
          curl -fsSL "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" -o /tmp/leaflet.js
          test -s /tmp/leaflet.js
          echo "FloodSafe smoke test passed"
      - name: Smoke test FloodSafe V21 PRO
        run: |
          set -e
          URL="https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v21/"
          ok=0
          for i in $(seq 1 20); do
            if curl -fsSL "$URL" -o /tmp/v21.html && grep -q 'pro-upgrade.js?v=1' /tmp/v21.html && curl -fsSL "${URL}pro-upgrade.js?v=1" -o /tmp/pro.js; then
              ok=1
              break
            fi
            sleep 3
          done
          test "$ok" = "1"
          node --check /tmp/pro.js
          grep -q 'POLL_STATION=10000' /tmp/pro.js
          curl -fsSL --max-time 20 'https://bipadportal.gov.np/api/v1/river-stations/?limit=1' -o /tmp/riverstation.json
          python -m json.tool /tmp/riverstation.json >/dev/null
          echo "FloodSafe V21 PRO smoke test passed"
      - name: Smoke test FloodSafe V22 lightweight
        run: |
          set -e
          URL="https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v22/"
          ok=0
          for i in $(seq 1 25); do
            if curl -fsSL "$URL" -o /tmp/v22.html && grep -q 'V22' /tmp/v22.html && grep -q 'v22-upgrade.js?v=1' /tmp/v22.html && curl -fsSL "${URL}v22-upgrade.js?v=1" -o /tmp/v22.js; then
              ok=1
              break
            fi
            sleep 3
          done
          test "$ok" = "1"
          node --check /tmp/v22.js
          grep -q 'window.__fs' /tmp/v22.html
          grep -q 'STATION_POLL=15000' /tmp/v22.js
          grep -q 'Nepal Police' /tmp/v22.js
          grep -q 'Tsho Rolpa Lake' /tmp/v22.js
          if grep -q 'native app चरण' /tmp/v22.html; then
            echo 'Internal developer note leaked into V22 UI'
            exit 3
          fi
          curl -fsSL --max-time 20 'https://bipadportal.gov.np/api/v1/river-stations/?limit=1' -o /tmp/v22station.json
          python -m json.tool /tmp/v22station.json >/dev/null
          echo "FloodSafe V22 lightweight smoke test passed"
