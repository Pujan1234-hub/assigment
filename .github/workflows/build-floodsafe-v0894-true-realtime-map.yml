name: Build FloodSafe v0.8.94b BIPAD River Watch Mirror APK

on:
  push:
    branches: [ fix/floodsafe-v0882-realtime-river-rain ]
    paths:
      - '.github/workflows/build-floodsafe-v0894-true-realtime-map.yml'
      - '.github/scripts/patch_floodsafe_v0894_true_realtime_map_stability.py'
      - '.github/scripts/patch_floodsafe_v0894b_current_riverwatch.py'
      - '.github/scripts/repair_v0894_loader_anchor.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Probe current BIPAD River Watch rows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request,time,datetime
          u='https://bipadportal.gov.np/api/v1/river-stations/?limit=5000&_fs='+str(time.time_ns())
          req=urllib.request.Request(u,headers={'User-Agent':'FloodSafe-Nepal/0.8.94b','Accept':'application/json','Cache-Control':'no-cache, no-store','Pragma':'no-cache'})
          with urllib.request.urlopen(req,timeout=45) as r: obj=json.load(r)
          rows=obj.get('results') or []
          now=time.time(); current=[]; stale=[]
          def pt(v):
            if not v:return 0
            try:return datetime.datetime.fromisoformat(str(v).replace('Z','+00:00').replace(' ','T')).timestamp()
            except:return 0
          for x in rows:
            lv=x.get('waterLevel'); at=pt(x.get('waterLevelOn'))
            if lv is None or not at:continue
            age=now-at
            (current if -300<=age<=86400 else stale).append(x)
          print('V0894B_RIVERWATCH catalog=',len(rows),'current_24h=',len(current),'stale=',len(stale))
          for x in sorted(current,key=lambda z:pt(z.get('waterLevelOn')),reverse=True)[:8]:
            print('V0894B_CURRENT_SAMPLE',x.get('title'),x.get('status'),x.get('waterLevel'),x.get('waterLevelOn'))
          assert len(rows)>=250, len(rows)
          assert current, 'No current BIPAD River Watch rows found'
          PY

      - name: Apply native chain through v0.8.94b
        run: |
          python3 floodsafe-android-app/run_patch_native_v0877.py
          python3 floodsafe-android-app/patch_native_v0878_station_resilience.py
          python3 floodsafe-android-app/patch_native_v0879_full_river_geometry.py
          python3 floodsafe-android-app/patch_native_v0880_viewport_same_river_detail.py
          python3 floodsafe-android-app/run_patch_native_v0881.py
          python3 floodsafe-android-app/patch_native_v0883_map_camera_river_tap.py
          python3 floodsafe-android-app/run_patch_native_v0884.py
          python3 floodsafe-android-app/patch_native_v0885_official_parity_river_network.py
          python3 floodsafe-android-app/patch_native_v0885b_compile_fix.py
          python3 floodsafe-android-app/patch_native_v0886_same_river_official_station_join.py
          python3 floodsafe-android-app/patch_native_v0887_preflight.py
          python3 floodsafe-android-app/patch_native_v0887_monitored_rivers_instant_stations.py
          python3 floodsafe-android-app/patch_native_v0887_postflight.py
          python3 floodsafe-android-app/patch_native_v0887_compile_fix.py
          python3 floodsafe-android-app/patch_native_v0888_startup_crash_fast_rivers.py
          python3 floodsafe-android-app/patch_native_v0889_persistent_stations_rivers.py
          python3 .github/scripts/patch_floodsafe_v0890_risk_lines.py
          python3 .github/scripts/patch_floodsafe_v0891_fresh_visual_truth.py
          python3 .github/scripts/patch_floodsafe_v0892_clear_map_fresh_source.py
          python3 .github/scripts/patch_floodsafe_v0893_bipad_display_parity.py
          python3 .github/scripts/repair_v0894_loader_anchor.py
          python3 .github/scripts/patch_floodsafe_v0894_true_realtime_map_stability.py
          python3 .github/scripts/patch_floodsafe_v0894b_current_riverwatch.py

      - name: Verify realtime/map/background contracts
        shell: bash
        run: |
          set -euo pipefail
          M='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java'
          A='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/NativeFullActivity.java'
          S='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodMonitorService.java'
          L='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodLiveGaugeMonitor.java'
          G='floodsafe-android-app/app/build.gradle'
          grep -Fq 'V0894B_CURRENT_RIVER_STATIONS_ARE_VALID_WHEN_RECENT' "$A"
          grep -Fq 'V0894B_BIPAD_RIVERWATCH_MIRROR_RECENT_ROWS_ONLY' "$A"
          grep -Fq 'V0894_BIPAD_EVENTON_WATERLEVELON' "$A"
          grep -Fq 'V0894_REAL_NEPAL_CAMERA_BOUNDS' "$M"
          grep -Fq 'V0894_NEPAL_FIT_CAMERA' "$M"
          grep -Fq 'V0894_HIDE_CATALOG_AND_OLD_STATION_DOTS' "$M"
          grep -Fq 'V0894_NO_STARTUP_GEOMETRY_FREEZE' "$M"
          grep -Fq 'START_STICKY' "$S"
          grep -Fq 'follow_device' "$S"
          grep -Fq 'V0872_ONE_SECOND_BACKGROUND_RECHECK' "$L"
          grep -Fq 'versionCode 114' "$G"
          grep -Fq "versionName '0.8.94'" "$G"
          echo 'V0894B_CONTRACT PASS'

      - name: Bundle source assets
        run: gradle -p floodsafe-android-app clean :app:bundleFloodSafe --no-daemon

      - name: Rebuild river assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet shapely
          python3 floodsafe-android-app/preclip_nepal_waterways.py
          python3 floodsafe-android-app/rebalance_nepal_overview_v0839.py
          python3 floodsafe-android-app/build_regional_river_tiles_v0840.py
          python3 floodsafe-android-app/build_national_river_network_v0841.py
          python3 floodsafe-android-app/build_progressive_river_tiers_v0842.py
          python3 floodsafe-android-app/build_progressive_river_names_v0863.py
          python3 floodsafe-android-app/postclip_nepal_display_rivers_v0874.py

      - name: Unit test and build APK
        run: gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug -x bundleFloodSafe --no-daemon --stacktrace

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          cp "$APK" FloodSafe-Nepal-v0.8.94b-BIPAD-RIVERWATCH-MIRROR-FIELD-TEST.apk
          sha256sum FloodSafe-Nepal-v0.8.94b-BIPAD-RIVERWATCH-MIRROR-FIELD-TEST.apk | tee FloodSafe-Nepal-v0.8.94b-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-v0894b-BIPAD-RIVERWATCH-MIRROR-FIELD-TEST
          path: |
            FloodSafe-Nepal-v0.8.94b-BIPAD-RIVERWATCH-MIRROR-FIELD-TEST.apk
            FloodSafe-Nepal-v0.8.94b-SHA256.txt
          retention-days: 1
