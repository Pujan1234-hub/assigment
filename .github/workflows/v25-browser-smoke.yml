name: FloodSafe V25 Nepal Map Gate
on:
  push:
    branches: ["main"]
    paths:
      - "floodsafe-nepal/v25/**"
      - "data/**"
      - ".github/workflows/v25-browser-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: floodsafe-v25-nepal-map-gate
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for Nepal 3D production build
        run: |
          set -euo pipefail
          BASE='https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/'
          WATER='https://raw.githubusercontent.com/Pujan1234-hub/assigment/main/data/nepal-waterways-seed.json'
          ok=0
          for i in $(seq 1 100); do
            curl --max-time 15 -fsSL "${BASE}?ci=${GITHUB_SHA}-${i}" -o /tmp/index.html || true
            if grep -Fq 'map-gl-v3.js?v=1' /tmp/index.html && grep -Fq 'map-gl-v1.css?v=2' /tmp/index.html && grep -Fq 's3.amazonaws.com' /tmp/index.html; then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1
          curl --max-time 20 -fsSL "${BASE}map-gl-v3.js?ci=${GITHUB_SHA}" -o /tmp/map-gl-v3.mjs
          node --check /tmp/map-gl-v3.mjs
          grep -Fq "nationalWater" /tmp/map-gl-v3.mjs
          grep -Fq "districtLabelGL" /tmp/map-gl-v3.mjs
          grep -Fq "nepal-border" /tmp/map-gl-v3.mjs
          grep -Fq "maxZoom:19.5" /tmp/map-gl-v3.mjs
          grep -Fq "encoding:'terrarium'" /tmp/map-gl-v3.mjs
          curl --max-time 25 -fsSL "$WATER?ci=$GITHUB_SHA" -o /tmp/water.json
          python3 -c "import json; j=json.load(open('/tmp/water.json')); assert j.get('count',0)>=10000"
      - name: Browser Nepal outline districts rivers terrain and deep zoom
        env:
          BASE: https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"; test -n "$CHROME"
          mkdir -p /tmp/floodsafe && cd /tmp/floodsafe
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24.31.0 >/dev/null 2>&1
          BASE="$BASE" CHROME="$CHROME" node <<'JS'
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist','--use-gl=swiftshader']});
            const page=await browser.newPage();
            await page.setViewport({width:1280,height:900,deviceScaleFactor:1});
            page.setDefaultTimeout(90000);page.setDefaultNavigationTimeout(90000);
            const pageErrors=[];page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto(process.env.BASE+'?ci='+Date.now(),{waitUntil:'domcontentloaded'});
            await page.waitForSelector('#riverMapGL .maplibregl-canvas');
            await page.waitForFunction(()=>window.FloodSafeMap?.map&&window.FloodSafeMap.districtCount===77&&window.FloodSafeMap.nationalRiverCount>50,{timeout:80000});
            await sleep(1600);
            const initial=await page.evaluate(()=>{const m=window.FloodSafeMap.map;return{
              labels:document.querySelectorAll('.districtLabelGL').length,
              districtCount:window.FloodSafeMap.districtCount,
              nationalRiverCount:window.FloodSafeMap.nationalRiverCount,
              border:!!m.getLayer('nepal-border'),districtLines:!!m.getLayer('district-lines'),river:!!m.getLayer('river-base'),
              visibleRivers:m.queryRenderedFeatures(undefined,{layers:['river-base']}).length,
              center:m.getCenter().toArray(),zoom:m.getZoom(),pitch:m.getPitch(),terrain:m.getTerrain(),
              hint:document.querySelector('#mapHint')?.textContent||''
            }});
            if(initial.labels!==77||initial.districtCount!==77||!initial.border||!initial.districtLines||!initial.river||initial.nationalRiverCount<50||initial.visibleRivers<1)throw Error('Initial Nepal map incomplete '+JSON.stringify(initial));
            if(initial.center[0]<80||initial.center[0]>88.35||initial.center[1]<26.2||initial.center[1]>30.5)throw Error('Initial map not Nepal focused '+JSON.stringify(initial));
            if(!initial.terrain||initial.pitch<10)throw Error('3D terrain missing '+JSON.stringify(initial));

            await page.evaluate(()=>window.FloodSafeMap.select(26.5763,87.9019));
            await page.waitForFunction(()=>window.FloodSafeMap.map.queryRenderedFeatures(undefined,{layers:['river-base']}).length>0,{timeout:45000});
            await sleep(1000);
            const jhapa=await page.evaluate(()=>{const m=window.FloodSafeMap.map;return{routes:m.queryRenderedFeatures(undefined,{layers:['river-base']}).length,zoom:m.getZoom(),pitch:m.getPitch(),hint:document.querySelector('#mapHint')?.textContent||''}});
            if(jhapa.routes<1||jhapa.zoom<11)throw Error('Jhapa local rivers missing '+JSON.stringify(jhapa));

            await page.waitForFunction(()=>{const m=window.FloodSafeMap.map,e=m.queryTerrainElevation?.([87.9019,26.5763],{exaggerated:false});return Number.isFinite(e)},{timeout:30000});
            const elevation=await page.evaluate(()=>window.FloodSafeMap.map.queryTerrainElevation([87.9019,26.5763],{exaggerated:false}));
            if(!Number.isFinite(elevation))throw Error('Real DEM elevation missing');

            for(let i=0;i<4;i++){await page.click('#mapZoomIn');await sleep(450)}
            await sleep(900);
            const deep=await page.evaluate(()=>window.FloodSafeMap.map.getZoom());
            if(deep<16)throw Error('Deep zoom limited '+deep);

            await page.click('#mapReset');
            await page.waitForFunction(()=>window.FloodSafeMap.nationalRiverCount>50&&document.querySelectorAll('.districtLabelGL').length===77);
            await sleep(900);
            const reset=await page.evaluate(()=>({rivers:window.FloodSafeMap.map.queryRenderedFeatures(undefined,{layers:['river-base']}).length,center:window.FloodSafeMap.map.getCenter().toArray()}));
            if(reset.rivers<1)throw Error('Reset lost national rivers '+JSON.stringify(reset));

            if(pageErrors.length)throw Error('Page errors '+JSON.stringify(pageErrors.slice(0,10)));
            console.log('PASS Nepal-focused 3D map',{initial,jhapa,elevation,deep,reset});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(3)});
          JS
# production v3 already deployed; fresh strict gate trigger
