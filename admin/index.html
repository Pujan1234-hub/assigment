<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PJBUILTS · Portfolio Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#07101a;color:#eaf2ff;font:15px system-ui}.wrap{width:min(1100px,calc(100% - 28px));margin:50px auto}.card{background:#0d1825;border:1px solid #213249;border-radius:18px;padding:22px;margin:14px 0}input,button{padding:12px;border-radius:10px;border:1px solid #2b3c52;background:#08121e;color:#fff}input{width:100%;margin:6px 0}button{cursor:pointer;background:#69e9ff;color:#041016;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric b{font-size:28px;display:block}.msg{border:1px solid #213249;padding:18px;border-radius:14px;margin:12px 0;background:#091522}.msghead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#13263a;color:#9fc9e8;font-size:11px;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions a{padding:9px 11px;border-radius:9px;background:#13263a;color:#dff7ff;text-decoration:none;font-weight:700}.urgent{color:#ffb55d}.muted{color:#8da0b8}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><h1>PJBUILTS · Portfolio Admin</h1><div id="login" class="card"><h2>Admin login</h2><p class="muted">Use your portfolio admin email and separate password.</p><form id="lf"><input id="email" type="email" required placeholder="Admin email"><input id="password" type="password" required placeholder="Admin password"><button>Sign in</button><p id="err" class="urgent"></p></form></div><main id="dash" class="hidden"><div class="grid"><div class="card metric"><span>Total opens</span><b id="total">—</b></div><div class="card metric"><span>Today</span><b id="today">—</b></div><div class="card metric"><span>Unique sessions</span><b id="unique">—</b></div><div class="card metric"><span>New messages</span><b id="unread">—</b></div></div><div class="card"><button id="refresh">Refresh</button> <button id="logout">Log out</button></div><div class="card"><h2>Contact inbox</h2><div id="messages"></div></div></main></div><script>
const sb=supabase.createClient('https://nvfqxsnyrgjszrvmlrgf.supabase.co','sb_publishable_Mo_KNAmLRcBWdg6wC7QGVQ_hbEGkAw5');
const $=id=>document.getElementById(id);async function authorized(){const {data:{user}}=await sb.auth.getUser();if(!user)return false;const {data}=await sb.from('portfolio_admins').select('user_id').eq('user_id',user.id).maybeSingle();return !!data}
async function show(){if(await authorized()){$('login').classList.add('hidden');$('dash').classList.remove('hidden');load()}else{$('dash').classList.add('hidden');$('login').classList.remove('hidden')}}
$('lf').onsubmit=async e=>{e.preventDefault();$('err').textContent='';const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('err').textContent=error.message;return}if(!await authorized()){await sb.auth.signOut({scope:'local'});$('err').textContent='This account is not authorised as portfolio admin.';return}show()};
async function load(){const start=new Date();start.setHours(0,0,0,0);const [{count:total},{count:today},{data:vis},{data:msgs}]=await Promise.all([sb.from('portfolio_visits').select('*',{count:'exact',head:true}),sb.from('portfolio_visits').select('*',{count:'exact',head:true}).gte('created_at',start.toISOString()),sb.from('portfolio_visits').select('session_id'),sb.from('portfolio_contacts').select('*').order('created_at',{ascending:false}).limit(100)]);$('total').textContent=total??0;$('today').textContent=today??0;$('unique').textContent=new Set((vis||[]).map(x=>x.session_id)).size;$('unread').textContent=(msgs||[]).filter(x=>x.status==='new').length;$('messages').innerHTML=(msgs||[]).map(m=>`<div class="msg"><div class="msghead"><div><b>${esc(m.name)}</b> ${m.is_urgent?'<b class="urgent">● URGENT</b>':''}<br><span class="muted">${new Date(m.created_at).toLocaleString()}</span></div><span class="pill">${esc(m.enquiry_type||'Project enquiry')}</span></div><h3>${esc(m.subject||'No subject')}</h3><p>${esc(m.message)}</p><p class="muted">${m.company?'Company: '+esc(m.company)+' · ':''}${m.phone?'Phone: '+esc(m.phone)+' · ':''}${esc(m.email)}</p><div class="actions"><a href="mailto:${encodeURIComponent(m.email)}?subject=${encodeURIComponent('Re: '+(m.subject||'Portfolio enquiry'))}">Reply by email</a>${m.phone?`<a href="tel:${esc(m.phone)}">Call</a>`:''}${m.status==='new'?`<button onclick="markRead('${m.id}')">Mark read</button>`:`<span class="muted">${m.status}</span>`}</div></div>`).join('')||'<p class="muted">No messages yet.</p>'}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}window.markRead=async id=>{await sb.from('portfolio_contacts').update({status:'read'}).eq('id',id);load()};$('refresh').onclick=load;$('logout').onclick=async()=>{await sb.auth.signOut({scope:'local'});show()};show();
</script></body></html>
