name: FloodSafe Five Source Live News Sync
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/floodsafe-news-sync.py'
      - '.github/workflows/floodsafe-news-sync.yml'
permissions:
  contents: write
concurrency:
  group: floodsafe-news-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install news parser dependencies
        run: pip install --quiet requests beautifulsoup4
      - name: Fetch requested five news sources
        run: python3 scripts/floodsafe-news-sync.py
      - name: Validate requested source contract
        run: |
          python3 - <<'PY'
          import json
          p='data/floodsafe-news.json'
          j=json.load(open(p,encoding='utf-8'))
          want=['RONB Post','Onlinekhabar','Hamro Patro','eKantipur','Nepal Government']
          assert j.get('allowed_sources') == want, j.get('allowed_sources')
          assert isinstance(j.get('items'),list)
          bad=sorted({x.get('source') for x in j['items'] if x.get('source') not in want})
          assert not bad, bad
          print('news items',len(j['items']))
          print('source status',j.get('sources'))
          PY
      - name: Commit changed snapshot
        shell: bash
        run: |
          set -e
          if git diff --quiet -- data/floodsafe-news.json; then echo 'No headline change'; exit 0; fi
          git config user.name 'FloodSafe news sync'
          git config user.email 'actions@users.noreply.github.com'
          git add data/floodsafe-news.json
          git commit -m '[auto] refresh FloodSafe five-source live news'
          git pull --rebase origin main
          git push origin HEAD:main
