name: Split Nepal Waterways Tiles
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/split-nepal-waterways.yml"
      - "data/nepal-waterways-snapshot.json"
permissions:
  contents: write
concurrency:
  group: split-nepal-waterways
  cancel-in-progress: true
jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build small spatial tiles and nationwide overview
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,shutil
          src=json.load(open('data/nepal-waterways-snapshot.json'))
          waterways=src.get('waterways') or []
          if len(waterways)<=500:
            raise SystemExit(f'invalid/incomplete waterway snapshot: {len(waterways)}')
          minLon,minLat=80.0,26.2
          stepLon,stepLat=.70,.60
          nx,ny=12,8
          root='data/nepal-waterways-tiles'
          shutil.rmtree(root,ignore_errors=True); os.makedirs(root,exist_ok=True)
          tiles={}
          for w in waterways:
            pts=w.get('pts') or []
            touched=set()
            for lo,la in pts:
              x=max(0,min(nx-1,int((lo-minLon)/stepLon)))
              y=max(0,min(ny-1,int((la-minLat)/stepLat)))
              touched.add((x,y))
            for x,y in touched: tiles.setdefault((x,y),[]).append(w)
          counts={}
          for (x,y),arr in tiles.items():
            fn=f'{root}/{x}-{y}.json'
            json.dump({'count':len(arr),'waterways':arr},open(fn,'w'),ensure_ascii=False,separators=(',',':'))
            counts[f'{x}-{y}']=len(arr)

          def rank(w):
            named=bool(w.get('name') or w.get('name_ne') or w.get('name_en'))
            return (1000 if w.get('type')=='river' else 0)+(500 if named else 0)+min(400,len(w.get('pts') or [])*4)
          overview={}
          for arr in tiles.values():
            for w in sorted(arr,key=rank,reverse=True)[:90]:
              pts=w.get('pts') or []
              wid=str(w.get('id') or f"{w.get('type','stream')}|{pts[0] if pts else ''}|{pts[-1] if pts else ''}")
              overview[wid]=w
          overview_list=list(overview.values())
          json.dump({'generated_at':src.get('generated_at'),'source':src.get('source'),'license':src.get('license'),'source_count':src.get('count',len(waterways)),'count':len(overview_list),'waterways':overview_list},open(f'{root}/overview.json','w'),ensure_ascii=False,separators=(',',':'))

          manifest={'generated_at':src.get('generated_at'),'source':src.get('source'),'license':src.get('license'),'count':src.get('count',len(waterways)),'overview_count':len(overview_list),'minLon':minLon,'minLat':minLat,'stepLon':stepLon,'stepLat':stepLat,'nx':nx,'ny':ny,'tiles':counts}
          json.dump(manifest,open(f'{root}/manifest.json','w'),separators=(',',':'))
          sizes=[os.path.getsize(f'{root}/{k}.json') for k in counts]
          overview_size=os.path.getsize(f'{root}/overview.json')
          print('source waterways',len(waterways),'overview',len(overview_list),'overview bytes',overview_size,'tiles',len(counts),'max tile bytes',max(sizes))
          assert len(counts)>50 and max(sizes)<7000000
          assert len(overview_list)>1000 and overview_size<8000000
          PY
      - name: Commit tiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nepal-waterways-tiles
          git commit -m "Build mobile Nepal waterway tiles" || exit 0
          git pull --rebase origin main
          git push
