name: V23 Browser Smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V23 river interaction scripts
        run: |
          set -e
          node --check floodsafe-nepal/v23/v23-upgrade.js
          node --check floodsafe-nepal/v23/v23-hotfix.js
          node --check floodsafe-nepal/v23/v23-ux.js
          node --check floodsafe-nepal/v23/v23-river-map-v3.js
          grep -q 'const POLL=5000' floodsafe-nepal/v23/v23-upgrade.js
          grep -q 'pointerup' floodsafe-nepal/v23/v23-river-map-v3.js
          grep -q 'closestRiver' floodsafe-nepal/v23/v23-river-map-v3.js
          grep -q 'Finding river name' floodsafe-nepal/v23/v23-river-map-v3.js
          grep -q 'Status:' floodsafe-nepal/v23/v23-river-map-v3.js
          grep -q 'DHM / BIPAD' floodsafe-nepal/v23/v23-river-map-v3.js
