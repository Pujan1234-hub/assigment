name: Seed Nepal Waterways
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/seed-nepal-waterways.yml"
permissions:
  contents: write
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch reported regions
        run: |
          set -euo pipefail
          mkdir -p /tmp/seed data
          python3 - <<'PY'
          import subprocess,json,time,math,datetime
          regions=[('Myagdi',28.5782,83.5343),('Sindhuli',27.164,86.328),('Jhapa',26.5763,87.9019),('Dolpa',29.2623,83.0371)]
          eps=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']
          all=[]; seen=set()
          for label,la,lo in regions:
            s,n=la-.45,la+.45; w,e=lo-.55,lo+.55
            q=f'[out:json][timeout:45];(way["waterway"="river"]({s},{w},{n},{e});way["waterway"="stream"]({s},{w},{n},{e}););out tags geom;'
            j=None
            for ep in eps:
              try:
                p=subprocess.run(['curl','--retry','2','--retry-delay','1','--max-time','55','-fsSL','-X','POST',ep,'--data-urlencode','data='+q],capture_output=True,text=True,check=True)
                j=json.loads(p.stdout); break
              except Exception as ex: print(label,ep,'failed',str(ex)[:120]); time.sleep(1)
            if not j: raise SystemExit(label+' failed')
            print(label,len(j.get('elements',[])))
            for x in j.get('elements',[]):
              if x.get('type')!='way' or x.get('id') in seen: continue
              g=x.get('geometry') or []
              if len(g)<2: continue
              seen.add(x.get('id')); step=max(1,math.ceil(len(g)/45)); pts=[[round(p['lon'],6),round(p['lat'],6)] for p in g[::step]]
              last=[round(g[-1]['lon'],6),round(g[-1]['lat'],6)]
              if pts[-1]!=last: pts.append(last)
              t=x.get('tags') or {}; all.append({'id':x.get('id'),'type':t.get('waterway','stream'),'name':t.get('name') or '','name_ne':t.get('name:ne') or t.get('name_ne') or '','name_en':t.get('name:en') or '','pts':pts})
          out={'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'source':'OpenStreetMap via Overpass','license':'ODbL','count':len(all),'waterways':all}
          json.dump(out,open('data/nepal-waterways-seed.json','w'),ensure_ascii=False,separators=(',',':'))
          assert len(all)>50
          PY
      - name: Commit seed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nepal-waterways-seed.json
          git commit -m "Seed local Nepal waterways geometry" || exit 0
          git pull --rebase origin main
          git push
