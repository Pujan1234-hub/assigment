name: FloodSafe core official feed sync

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/floodsafe-core-sync.yml'
      - 'scripts/floodsafe-core-sync.py'

permissions:
  contents: write

concurrency:
  group: floodsafe-core-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch official DHM and BIPAD river feeds
        run: python scripts/floodsafe-core-sync.py

      - name: Validate current river snapshot
        run: |
          python -m json.tool data/floodsafe-core.json >/dev/null
          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          j=json.load(open('data/floodsafe-core.json'))
          src=j.get('sources',{}).get('rivers',{})
          assert j.get('schema_version',0) >= 4, j.get('schema_version')
          assert src.get('count',0) >= 120, src
          assert src.get('live_60m_count',0) >= 5, src
          assert src.get('dhm_live_page_count',0) >= 5, src
          newest=datetime.fromisoformat(src['newest_measurement'].replace('Z','+00:00'))
          assert datetime.now(timezone.utc)-newest.astimezone(timezone.utc) < timedelta(minutes=60), src
          rivers=j.get('rivers',[])
          def title(r): return str(r.get('title') or r.get('river_name') or r.get('name') or '').lower()
          def is_live(r):
              t=datetime.fromisoformat(str(r.get('waterLevelOn') or r.get('retrievedAt')).replace('Z','+00:00'))
              return datetime.now(timezone.utc)-t.astimezone(timezone.utc) < timedelta(minutes=60)
          kankai=[r for r in rivers if 'kankai' in title(r) and 'mainachuli' in title(r) and r.get('_officialLive') and is_live(r)]
          karnali=[r for r in rivers if 'karnali' in title(r) and 'chisapani' in title(r) and r.get('_officialLive') and is_live(r)]
          assert kankai, 'Fresh direct DHM Kankai at Mainachuli missing'
          assert karnali, 'Fresh direct DHM Karnali at Chisapani missing'
          print('river snapshot',src.get('count'),'live<=60m',src.get('live_60m_count'),'DHM live',src.get('dhm_live_page_count'),'newest',newest.isoformat())
          print('Kankai LIVE',kankai[0].get('waterLevel'),'m',kankai[0].get('waterLevelOn'))
          print('Karnali LIVE',karnali[0].get('waterLevel'),'m',karnali[0].get('waterLevelOn'))
          PY

      - name: Commit refreshed river snapshot immediately
        shell: bash
        run: |
          if git diff --quiet -- data/floodsafe-core.json; then
            echo 'No river snapshot change.'
            exit 0
          fi
          git config user.name 'FloodSafe live sync'
          git config user.email 'actions@users.noreply.github.com'
          git add data/floodsafe-core.json
          git commit -m '[auto] refresh FloodSafe realtime rivers'
          git pull --rebase origin main
          git push origin HEAD:main
