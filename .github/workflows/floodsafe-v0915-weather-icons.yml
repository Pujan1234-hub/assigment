name: FloodSafe v0.9.15 WEATHER ICONS

on:
  push:
    branches: [ fix/floodsafe-v0908-storm-events-compact-gauge ]
    paths:
      - '.github/workflows/floodsafe-v0915-weather-icons.yml'
      - 'floodsafe-android-app/patch_native_v0915_weather_icons.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Rebuild verified v0.9.14 native base
        shell: bash
        run: |
          set -euo pipefail
          python3 floodsafe-android-app/patch_native_language_safe.py
          python3 floodsafe-android-app/patch_native_weather_complete.py
          python3 floodsafe-android-app/patch_native_weather_station_correction.py
          python3 floodsafe-android-app/patch_native_v0906_district_196_rain.py
          python3 floodsafe-android-app/patch_native_v0907_district_click.py
          python3 floodsafe-android-app/patch_native_v0908_step1_river_click.py
          python3 floodsafe-android-app/patch_native_v0908_step2_compact_district.py
          python3 floodsafe-android-app/fix_v0908_step3_weather_refresh_anchor.py
          python3 floodsafe-android-app/patch_native_v0908_step3_storm_notifications.py
          python3 floodsafe-android-app/patch_native_v0909_sync_sathi_language.py
          python3 floodsafe-android-app/fix_v0909_district_lambda_compile.py
          python3 floodsafe-android-app/patch_native_v0910_step1_sathi_chat.py
          python3 floodsafe-android-app/patch_native_v0910_step2_map_labels.py
          python3 floodsafe-android-app/run_v0911_patch_fixed.py
          python3 floodsafe-android-app/fix_v0911_threshold_order.py
          python3 floodsafe-android-app/patch_native_v0912_weather_rain_parity.py
          python3 floodsafe-android-app/patch_native_v0913_dhm_rain_overlay.py
          python3 floodsafe-android-app/patch_native_v0914_current_rain_only.py
          grep -Fq "versionCode 31" floodsafe-android-app/app/build.gradle
          grep -Fq "versionName '0.9.14-current-rain-only'" floodsafe-android-app/app/build.gradle

      - name: Freeze river BIPAD station alert and UI logic
        shell: bash
        run: |
          set -euo pipefail
          J='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app'
          sha256sum \
            "$J/BipadRealtimeStationFeed.java" \
            "$J/OfficialRiverData.java" \
            "$J/FloodMonitorService.java" \
            "$J/FloodSafeNativeMapView.java" \
            "$J/AffectedRiverAlertMatcher.java" \
            "$J/FloodLiveGaugeMonitor.java" \
            "$J/RiverAlertWorker.java" \
            "$J/RainAlertWorker.java" \
            "$J/NativeFullActivity.java" \
            > /tmp/v0915-protected.before

      - name: Apply current weather icon overlay only
        shell: bash
        run: |
          set -euo pipefail
          python3 floodsafe-android-app/patch_native_v0915_weather_icons.py

      - name: Verify web-style current weather icons
        shell: bash
        run: |
          set -euo pipefail
          J='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app'
          W="$J/WeatherMapOverlayController.java"
          grep -Fq 'V0915_WEB_STYLE_WEATHER_ICONS' "$W"
          grep -Fq 'IMG_ICON_CLEAR' "$W"
          grep -Fq 'IMG_ICON_CLOUD' "$W"
          grep -Fq 'IMG_ICON_RAIN' "$W"
          grep -Fq 'IMG_ICON_THUNDER' "$W"
          grep -Fq '"☀️"' "$W"
          grep -Fq '"☁️"' "$W"
          grep -Fq '"🌧️"' "$W"
          grep -Fq '"⛈️"' "$W"
          grep -Fq 'if (c >= 95 && c <= 99) return "thunder";' "$W"
          grep -Fq 'if (isRainSignal(p)) return "rain";' "$W"
          grep -Fq 'p.cloud >= 35d' "$W"
          grep -Fq 'iconAllowOverlap(false)' "$W"
          grep -Fq 'style.addLayerBelow(layer, "fs-rivers-layer")' "$W"
          grep -Fq "versionCode 32" floodsafe-android-app/app/build.gradle
          grep -Fq "versionName '0.9.15-current-weather-icons'" floodsafe-android-app/app/build.gradle

      - name: Verify river BIPAD station alert and UI logic unchanged
        shell: bash
        run: |
          set -euo pipefail
          J='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app'
          sha256sum \
            "$J/BipadRealtimeStationFeed.java" \
            "$J/OfficialRiverData.java" \
            "$J/FloodMonitorService.java" \
            "$J/FloodSafeNativeMapView.java" \
            "$J/AffectedRiverAlertMatcher.java" \
            "$J/FloodLiveGaugeMonitor.java" \
            "$J/RiverAlertWorker.java" \
            "$J/RainAlertWorker.java" \
            "$J/NativeFullActivity.java" \
            > /tmp/v0915-protected.after
          cmp /tmp/v0915-protected.before /tmp/v0915-protected.after

      - name: Verify current-rain-only semantics remain
        shell: bash
        run: |
          set -euo pipefail
          J='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app'
          grep -Fq 'V0914_CURRENT_RAIN_ONLY_VERIFIER' "$J/DhmCurrentRainVerifier.java"
          grep -Fq 'current=precipitation,weather_code' "$J/DhmCurrentRainVerifier.java"
          grep -Fq 'DhmCurrentRainVerifier.currentRainPoints' "$J/WeatherMapOverlayController.java"

      - name: Test and assemble native APK
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/v0915.log

      - name: Verify APK and stage artifact
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'
          OUT='FloodSafe-Nepal-v0.9.15-WEATHER-ICONS.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -Fq 'AndroidManifest.xml'
          unzip -l "$APK" | grep -Fq 'assets/floodsafe-nepal/v24/nepal-districts.geojson'
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-waterways-tiles/overview.json'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee FloodSafe-Nepal-v0.9.15-SHA256.txt
          printf '%s\n' \
            'FloodSafe Nepal v0.9.15 weather-icons build' \
            '- Current weather map symbols: clear ☀️, cloudy ☁️, rain 🌧️, thunder ⛈️' \
            '- Symbols use existing current Open-Meteo district weather points' \
            '- Rain animation remains current-rain-only from v0.9.14' \
            '- Weather symbols render below official river/station safety layers' \
            '- River geometry, BIPAD feed, station markers, river status, 2 km alerts, UI and background workers remain unchanged' \
            > FloodSafe-Nepal-v0.9.15-NOTES.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-v0915-WEATHER-ICONS
          path: |
            FloodSafe-Nepal-v0.9.15-WEATHER-ICONS.apk
            FloodSafe-Nepal-v0.9.15-SHA256.txt
            FloodSafe-Nepal-v0.9.15-NOTES.txt
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-v0915-build-log
          path: /tmp/v0915.log
          if-no-files-found: ignore
          retention-days: 2
