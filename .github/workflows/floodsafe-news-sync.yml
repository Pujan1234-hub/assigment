name: FloodSafe Five Source News Sync
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/floodsafe-news-sync.py'
      - '.github/workflows/floodsafe-news-sync.yml'
permissions:
  contents: write
concurrency:
  group: floodsafe-news-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Fetch allowed news sources
        run: python3 scripts/floodsafe-news-sync.py
      - name: Commit snapshot
        shell: bash
        run: |
          set -e
          if git diff --quiet -- data/floodsafe-news.json; then exit 0; fi
          git config user.name 'FloodSafe news sync'
          git config user.email 'actions@users.noreply.github.com'
          git add data/floodsafe-news.json
          git commit -m '[auto] refresh FloodSafe five-source news'
          git pull --rebase origin main
          git push origin HEAD:main
