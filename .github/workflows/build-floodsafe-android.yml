name: Build FloodSafe Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'floodsafe-android-app/**'
      - '.github/workflows/build-floodsafe-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build debug APK
        run: /tmp/gradle-8.11.1/bin/gradle -p floodsafe-android-app :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-debug-APK
          path: floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
