name: FloodSafe v0.9.21 Map Watch Consistency TEST APK
on:
  push:
    branches:
      - fix/floodsafe-v0921-weather-sun-notifications-20261030
    paths:
      - '.github/workflows/floodsafe-weather-notifications-20261030.yml'
      - 'floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/RainAlertWorker.java'
      - 'floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/MonitoringSafetyProvider.java'
      - 'floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodMonitorService.java'
      - 'floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/NativeFullActivity.java'
      - 'floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeMapActivity.java'
      - 'floodsafe-android-app/app/src/debug/res/values/strings.xml'
      - 'floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeRemoteConfig.java'
      - 'floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeMessagingService.java'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: floodsafe-weather-notifications-20261030
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure Java 17 and Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Make native app content complete and keep original beta separate
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=floodsafe-android-app/app/src/main/assets
          mkdir -p "$ASSETS/data" "$ASSETS/floodsafe-nepal"
          cp -a data/. "$ASSETS/data/"
          cp -a floodsafe-nepal/. "$ASSETS/floodsafe-nepal/"
          python3 - <<'PY'
          import json,copy,pathlib
          p=pathlib.Path('floodsafe-android-app/app/google-services.json')
          data=json.loads(p.read_text())
          pkg='io.github.pujan1234hub.floodsafe.app.preview'
          if not any(c['client_info']['android_client_info'].get('package_name')==pkg for c in data['client']):
              client=copy.deepcopy(data['client'][0])
              client['client_info']['android_client_info']['package_name']=pkg
              data['client'].append(client)
          p.write_text(json.dumps(data))
          PY
      - name: Validate weather-only changes, no river-safety policy changes
        shell: bash
        run: |
          set -euo pipefail
          J=floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app
          grep -Fq 'WEATHER_DIGEST_INTERVAL_MS = 3L * 60L * 60L * 1000L' "$J/RainAlertWorker.java"
          grep -Fq 'sunrise,sunset' "$J/RainAlertWorker.java"
          grep -Fq 'maybeNotifySunEvents' "$J/RainAlertWorker.java"
          grep -Fq 'weather_last_fix_at' "$J/RainAlertWorker.java"
          grep -Fq 'weather_last_fix_at' "$J/FloodMonitorService.java"
          grep -Fq 'floodsafe-weather-on-open' "$J/NativeFullActivity.java"
          grep -Fq 'RIVER_STATUS_EXPIRY_TICK_MS=30_000L' "$J/NativeFullActivity.java"
          grep -Fq 'riverAutoRefresh' "$J/NativeFullActivity.java"
          grep -Fq 'FloodSafe Nepal TEST' floodsafe-android-app/app/src/debug/res/values/strings.xml
          grep -Fq 'untilSet > 0 && untilSet <= 45' "$J/RainAlertWorker.java"
          grep -Fq 'untilRise > 0 && untilRise <= 45' "$J/RainAlertWorker.java"
          grep -Fq 'static String activeNotice' "$J/FloodSafeRemoteConfig.java"
          grep -Fq 'SERVICE_CHANNEL_ID' "$J/FloodSafeMessagingService.java"
          grep -Fq 'riverAutoRefresh' "$J/NativeFullActivity.java"
          grep -Fq 'RIVER_FOREGROUND_REFRESH_MS=30_000L' "$J/NativeFullActivity.java"
          grep -Fq 'MAP_STATION_REFRESH_MS=30_000L' "$J/FloodSafeMapActivity.java"
          grep -Fq 'MAP_READING_FRESH_MS=30L*60L*1000L' "$J/FloodSafeMapActivity.java"
          grep -Fq 'raw.contains("ALERT")||raw.contains("WATCH")||raw.contains("YELLOW")' "$J/FloodSafeMapActivity.java"
          ! grep -Fq 'warn*.8' "$J/FloodSafeMapActivity.java"
          ! grep -Fq 'warning*.8' "$J/NativeFullActivity.java"
          grep -Fq 'lastMapStations.clear()' "$J/FloodSafeMapActivity.java"
          grep -Fq 'MAX_AGE_MS = 10L * 60L * 1000L' "$J/RiverAlertWorker.java"
          grep -Fq "applicationIdSuffix '.preview'" floodsafe-android-app/app/build.gradle
          grep -Fq "versionCode 121" floodsafe-android-app/app/build.gradle
      - name: Compile and test Android weather notifications
        shell: bash
        run: |
          set -euo pipefail
          gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify installable full native APK
        shell: bash
        run: |
          set -euo pipefail
          APK=floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          for asset in assets/pjbuilts-original-splash.html assets/data/nepal-waterways-snapshot.json assets/floodsafe-nepal/v25/index.html; do
            unzip -Z -1 "$APK" | grep -Fxq "$asset"
          done
          test "$(stat -c %s "$APK")" -gt 85000000
          cp "$APK" FloodSafe-Nepal-v0.9.21-MAP-STATUS-FIX-TEST.apk
          sha256sum FloodSafe-Nepal-v0.9.21-MAP-STATUS-FIX-TEST.apk > FloodSafe-Map-Status-Fix-SHA256.txt
          stat -c 'Weather test APK bytes=%s' FloodSafe-Nepal-v0.9.21-MAP-STATUS-FIX-TEST.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-v0921-MAP-STATUS-FIX-TEST
          path: |
            FloodSafe-Nepal-v0.9.21-MAP-STATUS-FIX-TEST.apk
            FloodSafe-Map-Status-Fix-SHA256.txt
          retention-days: 14
          if-no-files-found: error
      - name: Publish separately installable TEST APK direct link
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=floodsafe-v0921-map-status-fix-test-20261030
          NOTES='Preview-only surgical map status consistency fix for v0.9.21: separate River Map used an older invented 80-percent-of-warning threshold, causing yellow map dots even when Home reported zero official Watch. Removed this map-only heuristic; map and Home now classify only confirmed Watch/Warning/Danger on fresh readings. Map station layer refreshes while open at 30-second intervals and expired or unavailable observations turn stale/grey rather than appearing live. DHM-primary unified backend and existing GPS, weather overlay, river glow, 2-km emergency notifications, OTA, SATHI, language and original PJBUILTS intro preserved. Not production release; original stable download unchanged.'
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" FloodSafe-Nepal-v0.9.21-MAP-STATUS-FIX-TEST.apk FloodSafe-Map-Status-Fix-SHA256.txt --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" FloodSafe-Nepal-v0.9.21-MAP-STATUS-FIX-TEST.apk FloodSafe-Map-Status-Fix-SHA256.txt -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'FloodSafe Nepal v0.9.21 Map Status Consistency TEST' --notes "$NOTES" --prerelease --latest=false
          fi
