name: FloodSafe Nepal Pathibhara blessing - one time
on:
  push:
    branches: [main]
    paths: ['.github/workflows/floodsafe-pathibhara-blessing-20261103.yml']
permissions:
  contents: read
concurrency:
  group: floodsafe-pathibhara-blessing-20261103
  cancel-in-progress: false
jobs:
  send-blessing:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Send non-emergency Nepali greeting through existing FCM
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet google-auth requests
          python3 - <<'PY'
          import json, os, sys, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          raw=os.environ.get("FIREBASE_SERVICE_ACCOUNT","").strip()
          if not raw: sys.exit("Existing Firebase service account secret is missing. No message sent.")
          key=json.loads(raw)
          if key.get("project_id")!="floodsafe-nepal": sys.exit("Wrong Firebase project. No message sent.")
          creds=service_account.Credentials.from_service_account_info(
              key, scopes=["https://www.googleapis.com/auth/firebase.messaging"])
          creds.refresh(Request())
          payload={"message":{
              "topic":"nepal-alerts",
              "data":{
                  "kind":"app_notice",
                  "title":"🌺 पाथीभरा माताको आशीर्वाद 🙏",
                  "body":"श्री पाथीभरा माताले तपाईं र तपाईंको सम्पूर्ण परिवारको सधैँ रक्षा गरून्। सबैको जीवनमा सुख, शान्ति, सुस्वास्थ्य र समृद्धि छाओस्। जय पाथीभरा माता! 🙏❤️"
              },
              "android":{"priority":"high","ttl":"3600s"}
          }}
          url="https://fcm.googleapis.com/v1/projects/floodsafe-nepal/messages:send"
          r=requests.post(url,headers={"Authorization":"Bearer "+creds.token,
              "Content-Type":"application/json"},json=payload,timeout=25)
          print("FCM HTTP",r.status_code)
          r.raise_for_status()
          print(json.dumps({"fcm_accepted":True,"topic":"nepal-alerts",
              "kind":"app_notice","actual_delivery_confirmed":False}))
          PY
