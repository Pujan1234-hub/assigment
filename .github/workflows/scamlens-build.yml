name: ScamLens Android Build

on:
  push:
    branches: [scamlens-v1-1-upgrade]
    paths:
      - 'scamlens-upgrade/**'
      - '.github/workflows/scamlens-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests
        working-directory: scamlens-upgrade
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        working-directory: scamlens-upgrade
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp scamlens-upgrade/app/build/outputs/apk/debug/app-debug.apk ScamLens-PJBUILTS-v1.1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ScamLens-PJBUILTS-v1.1
          path: ScamLens-PJBUILTS-v1.1-debug.apk
          if-no-files-found: error
