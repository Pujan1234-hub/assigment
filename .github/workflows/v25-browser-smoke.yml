name: FloodSafe V25 Realtime Gate
on:
  push:
    branches: ["main"]
    paths:
      - "floodsafe-nepal/v25/**"
      - "data/**"
      - ".github/workflows/v25-browser-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: floodsafe-v25-realtime-gate
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for real 3D production build
        run: |
          set -euo pipefail
          BASE='https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/'
          WATER='https://raw.githubusercontent.com/Pujan1234-hub/assigment/main/data/nepal-waterways-seed.json'
          HUMAN='https://raw.githubusercontent.com/Pujan1234-hub/assigment/main/data/floodsafe-people-status.json'
          ok=0
          for i in $(seq 1 100); do
            curl --max-time 15 -fsSL "${BASE}?ci=${GITHUB_SHA}-${i}" -o /tmp/index.html || true
            if grep -Fq 'map-gl-v1.js?v=1' /tmp/index.html && grep -Fq 'map-gl-v1.css?v=1' /tmp/index.html && grep -Fq 'maplibre-gl@6.6.0' /tmp/index.html && grep -Fq 'tiles.mapterhorn.com' /tmp/index.html && grep -Fq 'worker-src' /tmp/index.html && grep -Fq 'language-pure.js?v=6' /tmp/index.html; then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1
          curl --max-time 15 -fsSL "${BASE}map-gl-v1.js?ci=${GITHUB_SHA}" -o /tmp/map-gl-v1.mjs
          node --check /tmp/map-gl-v1.mjs
          grep -Fq "new maplibregl.Map" /tmp/map-gl-v1.mjs
          grep -Fq "type:'raster-dem'" /tmp/map-gl-v1.mjs
          grep -Fq "setTerrain" /tmp/map-gl-v1.mjs
          grep -Fq "maxZoom:19.5" /tmp/map-gl-v1.mjs
          grep -Fq "flow-particles" /tmp/map-gl-v1.mjs
          grep -Fq "fsriverupdate" /tmp/map-gl-v1.mjs
          curl --max-time 20 -fsSL "$WATER?ci=$GITHUB_SHA" -o /tmp/water.json
          python3 -c "import json; j=json.load(open('/tmp/water.json')); assert j.get('count',0)>=10000"
          curl --max-time 15 -fsSL "$HUMAN?ci=$GITHUB_SHA" -o /tmp/human.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/human.json'))
          vals=(j.get('recovered_bodies'),j.get('missing_minimum'),j.get('rescued_alive'))
          assert all(isinstance(x,int) and x>0 for x in vals), vals
          assert vals!=(675,2426,2301), vals
          for k in ('recovered_source','missing_source','rescued_source'): assert j.get(k), k
          print('human',vals)
          PY
      - name: Browser real terrain deep zoom river and automatic gauge regression
        env:
          BASE: https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"; test -n "$CHROME"
          mkdir -p /tmp/floodsafe && cd /tmp/floodsafe
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24.31.0 >/dev/null 2>&1
          BASE="$BASE" CHROME="$CHROME" node <<'JS'
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist','--use-gl=swiftshader']});
            const page=await browser.newPage();
            await page.setViewport({width:1280,height:900,deviceScaleFactor:1});
            page.setDefaultTimeout(80000);page.setDefaultNavigationTimeout(80000);
            const pageErrors=[];page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto(process.env.BASE+'?ci='+Date.now(),{waitUntil:'networkidle2'});
            await page.waitForSelector('#riverMapGL .maplibregl-canvas');
            await page.waitForFunction(()=>window.FloodSafeMap?.map&&window.FloodSafeGauge&&window.FloodSafeMap.map.getLayer('river-base')&&window.FloodSafeMap.map.getSource('terrain'),{timeout:45000});
            if(await page.evaluate(()=>document.documentElement.lang)!=='en')await page.click('#langBtn');
            await page.waitForFunction(()=>document.documentElement.lang==='en');
            const boot=await page.evaluate(()=>{const m=window.FloodSafeMap.map;return{zoom:m.getZoom(),pitch:m.getPitch(),terrain:m.getTerrain(),canvas:!!document.querySelector('#riverMapGL canvas'),oldSvg:!!document.querySelector('#riverMapV3'),terrainSource:!!m.getSource('terrain'),riverLayer:!!m.getLayer('river-base')}});
            if(!boot.canvas||boot.oldSvg||!boot.terrain||!boot.terrainSource||!boot.riverLayer||boot.pitch<30)throw Error('Not real WebGL terrain '+JSON.stringify(boot));

            await page.evaluate(()=>window.FloodSafeMap.select(26.5763,87.9019));
            await page.waitForFunction(()=>{const m=window.FloodSafeMap.map;return m.queryRenderedFeatures(undefined,{layers:['river-base']}).length>0},{timeout:40000});
            await sleep(1200);
            const rivers=await page.evaluate(()=>{const m=window.FloodSafeMap.map;return{routes:m.queryRenderedFeatures(undefined,{layers:['river-base']}).length,particles:m.queryRenderedFeatures(undefined,{layers:['flow-particles']}).length,zoom:m.getZoom(),pitch:m.getPitch(),terrain:m.getTerrain(),hint:document.querySelector('#mapHint')?.textContent||''}});
            if(rivers.routes<1||rivers.particles<1||rivers.zoom<11||!rivers.terrain)throw Error('River/flow render failed '+JSON.stringify(rivers));

            // Verify DEM actually yields elevation, not just a CSS pitch or terrain config object.
            await page.waitForFunction(()=>{const m=window.FloodSafeMap.map,e=m.queryTerrainElevation?.([87.9019,26.5763],{exaggerated:false});return Number.isFinite(e)},{timeout:30000});
            const elevation=await page.evaluate(()=>window.FloodSafeMap.map.queryTerrainElevation([87.9019,26.5763],{exaggerated:false}));
            if(!Number.isFinite(elevation))throw Error('DEM elevation unavailable '+elevation);

            for(let i=0;i<4;i++){await page.click('#mapZoomIn');await sleep(420)}
            await sleep(900);
            const deep=await page.evaluate(()=>({zoom:window.FloodSafeMap.map.getZoom(),pitch:window.FloodSafeMap.map.getPitch()}));
            if(deep.zoom<16)throw Error('Deep zoom still limited '+JSON.stringify(deep));

            const clickPoint=await page.evaluate(()=>{const m=window.FloodSafeMap.map,f=m.queryRenderedFeatures(undefined,{layers:['river-base']})[0];if(!f)return null;const coords=f.geometry.coordinates,c=coords[Math.floor(coords.length/2)],p=m.project(c),r=m.getCanvas().getBoundingClientRect();return{x:r.left+p.x,y:r.top+p.y}});
            if(!clickPoint)throw Error('No river click target');
            await page.mouse.click(clickPoint.x,clickPoint.y);
            await page.waitForFunction(()=>{const s=document.querySelector('#riverSheetGL');return s&&!s.hidden&&/Water level/.test(s.innerText)},{timeout:12000});
            const sheet=await page.evaluate(()=>document.querySelector('#riverSheetGL')?.innerText||'');
            for(const x of ['Water level','Warning level','Danger level','Gauge','Measured','Source','5 seconds'])if(!sheet.includes(x))throw Error('River sheet missing '+x+' '+sheet);

            await page.evaluate(()=>{window.__origGauge=window.FloodSafeGauge.forWaterway;window.FloodSafeGauge.forWaterway=()=>({sameRiver:true,status:'warning',statusLabel:'WARNING',level:12.34,warning:10,danger:15,name:'AUTO TEST GAUGE',distanceKm:1.1,time:new Date().toISOString()});window.dispatchEvent(new CustomEvent('fsriverupdate'))});
            await page.waitForFunction(()=>document.querySelector('#riverSheetGL')?.innerText.includes('12.34')&&document.querySelector('#riverSheetGL')?.innerText.includes('AUTO TEST GAUGE'));
            await page.evaluate(()=>{window.FloodSafeGauge.forWaterway=window.__origGauge;delete window.__origGauge});

            await page.click('#map3D');
            await sleep(850);
            const flat=await page.evaluate(()=>({terrain:window.FloodSafeMap.map.getTerrain(),pitch:window.FloodSafeMap.map.getPitch(),button:document.querySelector('#map3D')?.textContent||''}));
            if(flat.terrain||flat.pitch>5||!/3D Terrain/.test(flat.button))throw Error('2D toggle failed '+JSON.stringify(flat));
            await page.click('#map3D');
            await sleep(850);
            const terrain=await page.evaluate(()=>({terrain:window.FloodSafeMap.map.getTerrain(),pitch:window.FloodSafeMap.map.getPitch(),elevation:window.FloodSafeMap.map.queryTerrainElevation?.([87.9019,26.5763],{exaggerated:false})}));
            if(!terrain.terrain||terrain.pitch<30||!Number.isFinite(terrain.elevation))throw Error('Real 3D terrain toggle failed '+JSON.stringify(terrain));

            if(pageErrors.length)throw Error('Page errors '+JSON.stringify(pageErrors.slice(0,10)));
            console.log('PASS real MapLibre WebGL terrain, DEM elevation, deep zoom, river flow and auto gauge refresh',{boot,rivers,elevation,deep,flat,terrain});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(3)});
          JS
