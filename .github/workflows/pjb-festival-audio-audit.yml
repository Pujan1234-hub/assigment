name: Verify festival music source
on:
  push:
    branches: [main]
    paths: [.github/workflows/pjb-festival-audio-audit.yml]
permissions:
  contents: read
jobs:
  audio-health:
    runs-on: ubuntu-latest
    steps:
      - name: Check playable MP3 sources
        shell: bash
        run: |
          set +e
          for url in \
            "https://www.newar.com.np/wp-content/uploads/2021/09/malshree_dhun.mp3" \
            "https://archive.org/download/dashaindhoon_201910/Dashain%20Dhoon.mp3" \
            "https://ia600205.us.archive.org/34/items/MangalDhoon_415/MangalDhoon.mp3"; do
            echo "::group::$url"
            curl -L -s --max-time 18 -r 0-2047 -D /tmp/pjb_audio_headers -o /tmp/pjb_audio_sample "$url"
            e=$?
            echo "curl exit code: $e"
            head -c 512 /tmp/pjb_audio_headers | tr '\r' '\n'
            printf "\nMIME: "; file -bi /tmp/pjb_audio_sample
            echo "::endgroup::"
          done
