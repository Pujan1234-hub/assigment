name: FloodSafe v0.9.17 NATIVE WEATHER RUNTIME v2

on:
  push:
    branches: [ fix/floodsafe-v0908-storm-events-compact-gauge ]
    paths:
      - '.github/workflows/floodsafe-v0917-native-weather-runtime-v2.yml'
      - 'floodsafe-android-app/fix_v0917_marker_comments.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Rebuild verified v0.9.16 native base
        shell: bash
        run: |
          set -euo pipefail
          python3 floodsafe-android-app/patch_native_language_safe.py
          python3 floodsafe-android-app/patch_native_weather_complete.py
          python3 floodsafe-android-app/patch_native_weather_station_correction.py
          python3 floodsafe-android-app/patch_native_v0906_district_196_rain.py
          python3 floodsafe-android-app/patch_native_v0907_district_click.py
          python3 floodsafe-android-app/patch_native_v0908_step1_river_click.py
          python3 floodsafe-android-app/patch_native_v0908_step2_compact_district.py
          python3 floodsafe-android-app/fix_v0908_step3_weather_refresh_anchor.py
          python3 floodsafe-android-app/patch_native_v0908_step3_storm_notifications.py
          python3 floodsafe-android-app/patch_native_v0909_sync_sathi_language.py
          python3 floodsafe-android-app/fix_v0909_district_lambda_compile.py
          python3 floodsafe-android-app/patch_native_v0910_step1_sathi_chat.py
          python3 floodsafe-android-app/patch_native_v0910_step2_map_labels.py
          python3 floodsafe-android-app/run_v0911_patch_fixed.py
          python3 floodsafe-android-app/fix_v0911_threshold_order.py
          python3 floodsafe-android-app/patch_native_v0912_weather_rain_parity.py
          python3 floodsafe-android-app/patch_native_v0913_dhm_rain_overlay.py
          python3 floodsafe-android-app/patch_native_v0914_current_rain_only.py
          python3 floodsafe-android-app/fix_v0915_weather_icon_patch_script.py
          python3 floodsafe-android-app/patch_native_v0915_weather_icons.py
          python3 floodsafe-android-app/fix_v0916_patch_script.py
          python3 floodsafe-android-app/fix_v0916_patch_script_v2.py
          python3 floodsafe-android-app/fix_v0916_patch_script_v3.py
          python3 floodsafe-android-app/patch_native_v0916_sathi_knowledge.py
          grep -Fq "versionCode 33" floodsafe-android-app/app/build.gradle

      - name: Freeze protected river systems
        shell: bash
        run: |
          set -euo pipefail
          J='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app'
          sha256sum "$J/BipadRealtimeStationFeed.java" "$J/OfficialRiverData.java" "$J/FloodMonitorService.java" "$J/FloodSafeNativeMapView.java" "$J/AffectedRiverAlertMatcher.java" "$J/FloodLiveGaugeMonitor.java" "$J/RiverAlertWorker.java" "$J/RainAlertWorker.java" > /tmp/protected.before

      - name: Apply corrected native weather runtime repair
        shell: bash
        run: |
          set -euo pipefail
          python3 floodsafe-android-app/fix_v0917_marker_comments.py
          python3 floodsafe-android-app/patch_native_v0917_weather_runtime.py

      - name: Verify patch scope
        shell: bash
        run: |
          set -euo pipefail
          J='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app'; U="$J/NativeFullActivity.java"; W="$J/WeatherMapOverlayController.java"; V="$J/DhmCurrentRainVerifier.java"
          grep -Fq 'V0917_NATIVE_WEATHER_PROXY' "$U"
          grep -Fq 'V0917_DISTRICT_WEATHER_PROXY' "$U"
          grep -Fq 'V0917_SATHI_WEATHER_PROXY' "$U"
          grep -Fq 'V0917_CURRENT_RAIN_PROXY' "$V"
          grep -Fq 'V0917_NATIVE_DRAWN_WEATHER_ICONS' "$W"
          grep -Fq 'iconAllowOverlap(true)' "$W"
          ! grep -Fq 'https://api.open-meteo.com/v1/forecast' "$U"
          ! grep -Fq 'https://api.open-meteo.com/v1/forecast' "$V"
          grep -Fq 'V0916_KNOWLEDGE_FALLBACK' "$U"
          grep -Fq 'V0916_SATHI_DISTRICT_WEATHER' "$U"
          grep -Fq "versionCode 34" floodsafe-android-app/app/build.gradle
          sha256sum "$J/BipadRealtimeStationFeed.java" "$J/OfficialRiverData.java" "$J/FloodMonitorService.java" "$J/FloodSafeNativeMapView.java" "$J/AffectedRiverAlertMatcher.java" "$J/FloodLiveGaugeMonitor.java" "$J/RiverAlertWorker.java" "$J/RainAlertWorker.java" > /tmp/protected.after
          cmp /tmp/protected.before /tmp/protected.after

      - name: Test and assemble native APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/v0917.log

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'; OUT='FloodSafe-Nepal-v0.9.17-NATIVE-WEATHER-RUNTIME.apk'
          test -s "$APK"; unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -Fq 'AndroidManifest.xml'
          unzip -l "$APK" | grep -Fq 'assets/floodsafe-nepal/v24/nepal-districts.geojson'
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-waterways-tiles/overview.json'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"; "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" "$OUT"; sha256sum "$OUT" | tee FloodSafe-Nepal-v0.9.17-SHA256.txt
          printf '%s\n' 'FloodSafe Nepal v0.9.17 native weather runtime repair' '- current-location, district-map and SATHI weather use PJBUILTS weather proxy' '- current-rain verifier uses live current-weather proxy' '- weather icons are native Canvas drawings' '- river/BIPAD/stations/2 km alerts unchanged' > FloodSafe-Nepal-v0.9.17-NOTES.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-v0917-NATIVE-WEATHER-RUNTIME
          path: |
            FloodSafe-Nepal-v0.9.17-NATIVE-WEATHER-RUNTIME.apk
            FloodSafe-Nepal-v0.9.17-SHA256.txt
            FloodSafe-Nepal-v0.9.17-NOTES.txt
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-v0917-v2-build-log
          path: /tmp/v0917.log
          if-no-files-found: ignore
          retention-days: 2
