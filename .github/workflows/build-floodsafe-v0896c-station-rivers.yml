name: Build FloodSafe v0.8.96c Verified Station Rivers APK

on:
  push:
    branches: [ fix/floodsafe-full-river-detail-v0879 ]
    paths:
      - '.github/workflows/build-floodsafe-v0896c-station-rivers.yml'
      - 'floodsafe-android-app/patch_native_v0896_station_rivers_truth.py'
      - 'floodsafe-android-app/patch_native_v0896_compile_repair.py'
      - 'floodsafe-android-app/patch_native_v0896_compile_repair2.py'
      - 'floodsafe-android-app/verify_v0896_station_river_assets.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply native baseline and v0.8.96 repairs
        run: |
          python3 floodsafe-android-app/run_patch_native_v0877.py
          python3 floodsafe-android-app/patch_native_v0878_station_resilience.py
          python3 floodsafe-android-app/patch_native_v0879_full_river_geometry.py
          python3 floodsafe-android-app/patch_native_v0896_station_rivers_truth.py
          python3 floodsafe-android-app/patch_native_v0896_compile_repair.py
          python3 floodsafe-android-app/patch_native_v0896_compile_repair2.py

      - name: Verify v0.8.96 source contracts
        shell: bash
        run: |
          set -euo pipefail
          A='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/NativeFullActivity.java'
          M='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java'
          G='floodsafe-android-app/app/build.gradle'
          for x in V0896_OFFICIAL_STATUS_FIRST V0896_NEPAL_COORD_REPAIR V0896_RIVERSTATION_CTOR_REPAIR; do grep -Fq "$x" "$A"; done
          for x in V0896_BIND_RIVERS_FROM_STATIONS V0896_NO_CAMERA_RIVER_OVERWRITE V0896_NONEMPTY_STATION_RIVER_SOURCE V0896_STATUS_COLOUR_ON_MONITORED_RIVERS V0896_RIVERWAY_STAGE_REPAIR V0896_GEOJSON_EXCEPTION_REPAIR V0896_RISK_GEOJSON_EXCEPTION_REPAIR; do grep -Fq "$x" "$M"; done
          grep -Fq 'lineWidth(10.0f)' "$M"
          grep -Fq 'lineWidth(4.2f)' "$M"
          grep -Fq "versionName '0.8.96'" "$G"
          grep -Fq 'versionCode 116' "$G"
          echo 'V0896C_SOURCE_CONTRACT PASS'

      - name: Bundle source assets
        run: gradle -p floodsafe-android-app clean :app:bundleFloodSafe --no-daemon

      - name: Rebuild full Nepal river assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet shapely
          python3 floodsafe-android-app/preclip_nepal_waterways.py
          python3 floodsafe-android-app/rebalance_nepal_overview_v0839.py
          python3 floodsafe-android-app/build_regional_river_tiles_v0840.py
          python3 floodsafe-android-app/build_national_river_network_v0841.py
          python3 floodsafe-android-app/build_progressive_river_tiers_v0842.py
          python3 floodsafe-android-app/build_progressive_river_names_v0863.py
          python3 floodsafe-android-app/postclip_nepal_display_rivers_v0874.py

      - name: Verify real station river geometry and status truth
        run: python3 floodsafe-android-app/verify_v0896_station_river_assets.py

      - name: Audit full river inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          b=Path('floodsafe-android-app/app/build'); mans=list(b.rglob('data/nepal-waterways-tiles/manifest.json'))
          if not mans: raise SystemExit('manifest missing')
          d=mans[0].parent;m=json.loads(mans[0].read_text());count=int(m.get('count',0));overview=int(m.get('overview_count',0))
          tiles=[p for p in d.glob('*.json') if re.fullmatch(r'\d+-\d+\.json',p.name)]
          if count<60000 or overview<4000 or len(tiles)<90: raise SystemExit((count,overview,len(tiles)))
          print('V0896C_RIVER_INVENTORY PASS',count,overview,len(tiles))
          PY

      - name: Unit test and build native APK
        run: gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug -x bundleFloodSafe --no-daemon --stacktrace

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-waterways-tiles/overview.json'
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-waterways-tiles/7-2.json'
          unzip -l "$APK" | grep -Fq 'classes.dex'
          cp "$APK" FloodSafe-Nepal-v0.8.96-STATION-RIVERS-VERIFIED.apk
          sha256sum FloodSafe-Nepal-v0.8.96-STATION-RIVERS-VERIFIED.apk | tee FloodSafe-Nepal-v0.8.96-SHA256.txt
          stat -c '%n %s bytes' FloodSafe-Nepal-v0.8.96-STATION-RIVERS-VERIFIED.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-v0896-STATION-RIVERS-VERIFIED
          path: |
            FloodSafe-Nepal-v0.8.96-STATION-RIVERS-VERIFIED.apk
            FloodSafe-Nepal-v0.8.96-SHA256.txt
          retention-days: 14
