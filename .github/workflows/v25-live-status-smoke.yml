name: V25 Live Status Smoke
on:
  push:
    branches: ["main"]
    paths:
      - "floodsafe-nepal/v25/**"
      - "data/floodsafe-people-status.json"
      - "data/floodsafe-police.json"
      - "data/dor-road-summary.json"
      - ".github/workflows/v25-live-status-smoke.yml"
permissions:
  contents: read
concurrency:
  group: v25-live-status-smoke
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for isolated production owners
        run: |
          set -euo pipefail
          BASE='https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/'
          ROOT='https://pujan1234-hub.github.io/assigment/'
          ok=0
          for i in $(seq 1 40); do
            good=1
            for f in index.html people.html alerts.html human-final-v2.js flood-live-v2.js road-live-v3.js district-live-v4.js language-v2.js language-runtime.js sw.js; do curl --max-time 8 -fsSL "${BASE}${f}?ci=${GITHUB_SHA}-${i}" -o "/tmp/${f}" || good=0; done
            curl --max-time 8 -fsSL "${ROOT}data/floodsafe-people-status.json?ci=${GITHUB_SHA}-${i}" -o /tmp/people.json || good=0
            curl --max-time 8 -fsSL "${ROOT}data/floodsafe-police.json?ci=${GITHUB_SHA}-${i}" -o /tmp/police.json || good=0
            grep -Fq 'human-final-v2.js?v=1' /tmp/index.html || good=0
            grep -Fq 'human-final-v2.js?v=1' /tmp/people.html || good=0
            grep -Fq 'id="homeDeathsLive"' /tmp/index.html || good=0
            grep -Fq 'id="peopleBodiesLive"' /tmp/people.html || good=0
            grep -Fq 'flood-live-v2.js?v=1' /tmp/alerts.html || good=0
            grep -Fq 'road-live-v3.js?v=1' /tmp/alerts.html || good=0
            grep -Fq 'id="floodAlertsListLive"' /tmp/alerts.html || good=0
            grep -Fq 'id="roadCurrentListLive"' /tmp/alerts.html || good=0
            grep -Fq 'shell-41' /tmp/sw.js || good=0
            if [ "$good" = 1 ]; then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1
          for f in human-final-v2.js flood-live-v2.js road-live-v3.js district-live-v4.js language-v2.js language-runtime.js sw.js; do node --check "/tmp/$f"; done
          python3 - <<'PY'
          import json,datetime
          p=json.load(open('/tmp/people.json')); po=json.load(open('/tmp/police.json'))
          def ts(v):
              if not v:return 0
              try:return datetime.datetime.fromisoformat(str(v).replace('Z','+00:00')).timestamp()
              except:return 0
          pd=ts(p.get('recovered_update_iso') or p.get('recovered_update_time') or p.get('updated_date')); pp=ts(po.get('official_update_iso'))
          d=p.get('recovered_bodies') if pd>=pp else po.get('total_deaths')
          open('/tmp/expected.txt','w').write(f"{d}|{p['missing_minimum']}|{p['rescued_alive']}")
          PY

      - name: Browser verify no legacy overwrite
        env:
          BASE: https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"; test -n "$CHROME"
          mkdir -p /tmp/v25-status && cd /tmp/v25-status; npm init -y >/dev/null 2>&1; npm install --no-save puppeteer-core@24.31.0 >/dev/null 2>&1
          EXPECTED="$(cat /tmp/expected.txt)" BASE="$BASE" CHROME="$CHROME" node <<'JS'
          const puppeteer=require('puppeteer-core'),wait=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage']});const p=await b.newPage();await p.setViewport({width:412,height:915});p.setDefaultTimeout(60000);const exp=process.env.EXPECTED.split('|').map(Number),errors=[];p.on('pageerror',e=>errors.push(String(e)));
            await p.goto(process.env.BASE+'?ci='+Date.now(),{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>window.__fsUnifiedHuman?.owner==='human-final-v2'&&Number(document.getElementById('homeDeathsLive')?.textContent)>0);await wait(16000);const h=await p.evaluate(()=>({shown:['homeDeathsLive','homeMissingLive','homeRescuedLive'].map(id=>Number(document.getElementById(id).textContent)),legacy:['homeDeaths','homeMissing','homeRescued'].map(id=>!!document.getElementById(id)),owner:window.__fsUnifiedHuman.owner,hidden:document.getElementById('humanStatsSection').hidden}));if(h.hidden||h.owner!=='human-final-v2'||h.shown.join('|')!==exp.join('|')||h.legacy.some(Boolean))throw Error('Human isolation '+JSON.stringify({h,exp}));
            await p.goto(process.env.BASE+'alerts.html?ci='+Date.now(),{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>window.__fsFloodState?.owner==='flood-v2'&&window.__fsRoadState?.owner==='road-v3'&&window.__fsDistrictState);await p.waitForFunction(()=>document.querySelectorAll('#districtFilter option').length===78);await wait(9000);const a=await p.evaluate(()=>{const q=id=>document.getElementById(id),f=[...q('floodAlertsListLive').querySelectorAll('.item')],r=[...q('roadCurrentListLive').querySelectorAll('.item')],rs=window.__fsRoadState;return{fOwner:window.__fsFloodState.owner,rOwner:rs.owner,fCards:f.length,rCards:r.length,fLegacy:!!q('alertsList'),rLegacy:!!q('roadCurrentList'),opts:q('districtFilter').options.length,districts:window.__fsDistrictState.districts,cards:q('districtStatusList').querySelectorAll('.item').length,road:Number(q('roadAlertCountLive').textContent),roadExpected:rs.dor&&Number.isFinite(rs.dor.closed)?rs.dor.closed:rs.bipad.closed}});if(a.fOwner!=='flood-v2'||a.rOwner!=='road-v3'||a.fLegacy||a.rLegacy||a.opts!==78||a.districts!==77||a.cards>20||a.road!==a.roadExpected)throw Error('Alert isolation '+JSON.stringify(a));if(errors.length)throw Error('page errors '+JSON.stringify(errors.slice(0,8)));console.log('PASS isolated live owners',h,a);await b.close()})().catch(e=>{console.error(e);process.exit(3)});
          JS
