<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06101b"><title>Team Tracker — Control Room</title><style>:root{--bg:#06101b;--card:#0d1d2c;--line:#263d53;--text:#f6f9fc;--muted:#93a7b9;--gold:#efb632;--green:#58d98a;--blue:#48a9e6;--red:#ff9b9b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#102c42 0,transparent 32%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}.wrap{max-width:1100px;margin:auto;padding:14px}.brand{display:flex;justify-content:space-between;align-items:center;margin:8px 0 15px}.brand b{color:var(--gold);letter-spacing:.13em}.pill{font-size:11px;border:1px solid #59461a;border-radius:99px;padding:6px 9px;color:#f6cd70}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:13px}.login{max-width:430px;margin:45px auto}.field{width:100%;padding:13px;background:#07131f;color:#fff;border:1px solid #38516a;border-radius:11px;margin:6px 0 11px}.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55}.full{width:100%}.gold{background:var(--gold);color:#191207}.dark{background:#13283b;color:#eef7ff;border:1px solid #38516a}.hidden{display:none!important}.muted{color:var(--muted)}.msg{font-size:13px;margin-top:10px;min-height:18px}.bad{color:var(--red)}.good{color:var(--green)}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}.stat{background:#0a1926;border:1px solid var(--line);border-radius:12px;padding:11px}.stat small{color:var(--muted)}.stat b{display:block;font-size:22px;margin-top:2px}.row{border:1px solid #233d54;border-radius:13px;padding:12px;margin:9px 0;background:#091724}.rowtop{display:flex;justify-content:space-between;gap:10px}.badge{font-weight:900}.live{color:var(--green);font-weight:900}.stale{color:#f0c965;font-weight:900}.sub{font-size:12px;color:var(--muted);margin-top:3px}.assign{display:grid;grid-template-columns:1fr 1.4fr .7fr auto;gap:7px;margin-top:10px}.assign input,.assign select{background:#06131f;color:#fff;border:1px solid #34506a;border-radius:9px;padding:9px}.assign button{background:#2b230d;border:1px solid #7c6120;color:#f5ce72;border-radius:9px;padding:9px;font-weight:900;cursor:pointer}.task{display:grid;grid-template-columns:1fr 1.5fr auto;gap:8px;border-top:1px solid #20364a;padding:10px 0;font-size:13px}.status{font-weight:900}.assigned{color:#efca69}.acknowledged{color:#65bfff}.completed{color:#78e0a5}.declined,.cancelled{color:#f2a2a2}.mapbox{border:1px solid var(--line);border-radius:14px;padding:12px;background:#091724}.maprow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid #1c3246}.maprow:first-child{border-top:0}.maplink{color:#76c7ff;text-decoration:none}.toast{position:fixed;right:12px;top:12px;z-index:9999;background:#0c2234;border:1px solid #486b86;border-radius:12px;padding:12px 14px;max-width:330px;display:none}.debug{font-size:11px;text-align:center;margin-top:12px;color:var(--green)}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.assign,.task{grid-template-columns:1fr}.head{align-items:flex-start}.wrap{padding:10px}.maprow{display:block}}</style></head><body><div class="wrap"><div class="brand"><b>TEAM TRACKER | CONTROL ROOM</b><span class="pill">DIRECT MODE</span></div><section id="login" class="card login"><h2>Authorised access</h2><p class="muted">Control Room / Admin account only.</p><input id="email" class="field" type="email" autocomplete="username" placeholder="Email"><input id="pass" class="field" type="password" autocomplete="current-password" placeholder="Password"><button id="signin" class="btn gold full">SIGN IN</button><div id="msg" class="msg"></div><div class="debug">READY — direct login mode</div></section><main id="app" class="hidden"><section class="card"><div class="head"><div><h2 style="margin:0">CONTROL ROOM LIVE</h2><div id="who" class="muted"></div></div><button id="signout" class="btn dark">SIGN OUT</button></div><div class="stats"><div class="stat"><small>ON SHIFT</small><b id="onCount">0</b></div><div class="stat"><small>GPS LIVE</small><b id="gpsCount">0</b></div><div class="stat"><small>HOTEL</small><b id="hotelCount">0</b></div><div class="stat"><small>WAITING</small><b id="waitCount">0</b></div></div><h3>Live Locations</h3><div id="mapbox" class="mapbox"></div><div id="staff"></div></section><section class="card"><h3 style="margin-top:0">Task Responses</h3><div id="tasks"></div></section></main></div><div id="toast" class="toast"></div><script>
const BASE='https://kkvtspbmawxhwyadafyd.supabase.co';const KEY='sb_publishable_v0Alfzh0oA5hfHkO7mzDZw_sEsDCQ3U';const $=id=>document.getElementById(id);let accessToken='',refreshToken='',profile=null,rows=[],taskRows=[],poll=null,busy=false;
function setMsg(t,k=''){const e=$('msg');e.textContent=t;e.className='msg '+k}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function badge(r){if(r.team_code==='control_room')return'CONTROL ROOM';return`${String(r.team_code||'STAFF').toUpperCase()} ${r.badge_number??''}`.trim()}function tm(x){if(!x)return'—';try{return new Date(x).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}catch{return'—'}}function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',3000)}
async function parse(r){const text=await r.text();let data;try{data=JSON.parse(text)}catch{data=text}if(!r.ok)throw new Error(data?.error_description||data?.msg||data?.message||data?.hint||data?.error||`Request failed (${r.status})`);return data}
async function signIn(email,password){const r=await fetch(`${BASE}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});return parse(r)}
async function api(path,opt={}){const headers={apikey:KEY,Authorization:`Bearer ${accessToken}`,...(opt.headers||{})};const r=await fetch(`${BASE}${path}`,{...opt,headers});return parse(r)}
async function rpc(name,body={}){return api(`/rest/v1/rpc/${name}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}
async function login(){const email=$('email').value.trim(),password=$('pass').value;if(!email||!password){setMsg('Enter email and password.','bad');return}$('signin').disabled=true;setMsg('Connecting to Princesshay…');try{const s=await signIn(email,password);accessToken=s.access_token;refreshToken=s.refresh_token||'';localStorage.setItem('tt_cr_session',JSON.stringify({accessToken,refreshToken}));setMsg('Password accepted. Loading Control Room…','good');await enter()}catch(e){setMsg(e.message||'Sign-in failed.','bad');localStorage.removeItem('tt_cr_session')}finally{$('signin').disabled=false}}
async function enter(){const data=await rpc('my_app_profile');const p=Array.isArray(data)?data[0]:data;if(!p)throw new Error('Control Room profile not found.');if(!['control_room','admin'].includes(p.access_level))throw new Error('Control Room/Admin access required.');profile=p;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=`${badge(p)} • ${p.real_name||''} • ${String(p.access_level).toUpperCase()}`;await refresh();startPoll()}
async function refresh(){if(!profile||busy)return;busy=true;try{const [s,t]=await Promise.all([api('/rest/v1/manager_live_locations?select=*&is_on_shift=eq.true&order=updated_at.desc'),api('/rest/v1/task_assignments?select=*&order=created_at.desc&limit=50')]);rows=Array.isArray(s)?s:[];taskRows=Array.isArray(t)?t:[];render()}catch(e){toast(e.message)}finally{busy=false}}
function render(){const now=Date.now();$('onCount').textContent=rows.length;$('gpsCount').textContent=rows.filter(r=>r.latitude!=null&&r.longitude!=null&&now-new Date(r.updated_at).getTime()<180000).length;$('hotelCount').textContent=rows.filter(r=>r.team_code==='hotel').length;$('waitCount').textContent=taskRows.filter(t=>['assigned','acknowledged'].includes(t.status)).length;renderLocations();renderStaff();renderTasks()}
function renderLocations(){const gps=rows.filter(r=>r.latitude!=null&&r.longitude!=null);$('mapbox').innerHTML=gps.length?gps.map(r=>`<div class="maprow"><div><b>${esc(badge(r))}</b> <span class="muted">${esc(r.real_name||'')}</span><div class="sub">${esc(r.area||'Area not set')} • ±${esc(r.accuracy_m||'?')}m • ${esc(tm(r.updated_at))}</div></div><a class="maplink" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${encodeURIComponent(r.latitude+','+r.longitude)}">OPEN MAP ↗</a></div>`).join(''):'<div class="muted">No GPS coordinates yet.</div>'}
function latestTask(id){return taskRows.find(t=>t.staff_id===id)}function renderStaff(){$('staff').innerHTML=rows.length?rows.map(r=>{const stale=!r.updated_at||Date.now()-new Date(r.updated_at).getTime()>180000,latest=latestTask(r.staff_id);return`<div class="row"><div class="rowtop"><div><span class="badge">${esc(badge(r))}</span><div class="sub">${esc(r.real_name||'Name not added')} • ${esc(r.area||'Area not set')}</div></div><span class="${stale?'stale':'live'}">${stale?'STALE GPS':'LIVE'}</span></div><div class="sub">Current: ${esc(r.task||'No task')}${latest?` • last response: ${esc(latest.status||'assigned')}`:''}</div><div class="assign"><input id="a_${r.staff_id}" value="${esc(r.area||'')}" placeholder="Area / checkpoint"><input id="t_${r.staff_id}" placeholder="Task for ${esc(badge(r))}"><select id="p_${r.staff_id}"><option value="normal">normal</option><option value="high">high</option><option value="urgent">urgent</option></select><button onclick="assignTask('${r.staff_id}')">ASSIGN</button></div></div>`}).join(''):'<div class="muted" style="padding:18px 0">No staff currently on shift.</div>'}
function renderTasks(){$('tasks').innerHTML=taskRows.length?taskRows.slice(0,20).map(t=>`<div class="task"><div><b>${esc((rows.find(r=>r.staff_id===t.staff_id)&&badge(rows.find(r=>r.staff_id===t.staff_id)))||'STAFF')}</b><div class="sub">${esc(tm(t.created_at))}</div></div><div>${esc(t.task_text||'Task')}<div class="sub">${esc(t.area||'')} • ${esc(t.priority||'normal')}</div></div><div class="status ${esc(t.status||'assigned')}">${esc(String(t.status||'assigned').toUpperCase())}</div></div>`).join(''):'<div class="muted">No task responses yet.</div>'}
window.assignTask=async id=>{const task=$('t_'+id)?.value.trim(),area=$('a_'+id)?.value.trim(),priority=$('p_'+id)?.value||'normal';if(!task){toast('Enter a task first.');return}try{await rpc('control_room_assign_task',{p_staff_id:id,p_task_text:task,p_area:area||null,p_priority:priority});$('t_'+id).value='';toast('Task assigned.');await refresh()}catch(e){toast(e.message)}};
function startPoll(){if(poll)return;poll=setInterval(()=>{if(!document.hidden)refresh()},2000)}function stopPoll(){if(poll){clearInterval(poll);poll=null}}async function logout(){stopPoll();accessToken='';refreshToken='';profile=null;localStorage.removeItem('tt_cr_session');$('app').classList.add('hidden');$('login').classList.remove('hidden');setMsg('Signed out.','good')}
$('signin').onclick=login;$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('signout').onclick=logout;window.addEventListener('focus',()=>{if(profile)refresh()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&profile)refresh()});(async()=>{try{const s=JSON.parse(localStorage.getItem('tt_cr_session')||'null');if(s?.accessToken){accessToken=s.accessToken;refreshToken=s.refreshToken||'';setMsg('Restoring Control Room session…');await enter()}}catch(e){localStorage.removeItem('tt_cr_session');setMsg('READY — enter your Control Room login.','good')}})();
</script></body></html>
