name: Build FloodSafe v0.8.73 Native River Rain Hydrology Lake APK

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-floodsafe-v0873.yml'
      - 'floodsafe-android-app/patch_native_v0873_official_hydro_rain_lake.py'
      - 'floodsafe-android-app/run_patch_native_v0873.py'
      - 'floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodLiveGaugeMonitor.java'
      - 'floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodMonitorService.java'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply FloodSafe native patches through v0.8.73
        run: python3 floodsafe-android-app/run_patch_native_v0873.py

      - name: Verify v0.8.73 narrow native contract
        run: |
          set -euo pipefail
          A='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/NativeFullActivity.java'
          M='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java'
          S='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodMonitorService.java'
          L='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodLiveGaugeMonitor.java'
          P='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/PJBuiltsSplashActivity.java'
          R='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/RainAlertWorker.java'
          W='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/RiverAlertWorker.java'
          G='floodsafe-android-app/app/build.gradle'

          grep -Fq 'V0873_SHOW_OFFICIAL_RAIN_STATIONS' "$A"
          grep -Fq 'V0873_ONE_SECOND_RAIN_RECHECK' "$A"
          grep -Fq 'V0873_EXTRA_OFFICIAL_HYDROLOGY_FEEDS' "$A"
          grep -Fq 'V0873_DETAIL_STATION_TYPE' "$A"
          grep -Fq 'V0873_STATUS_COLOURED_STATION_DOT' "$A"
          grep -Fq 'V0872_EXACT_LEVEL_DETAIL' "$A"
          grep -Fq 'V0871_ONE_SECOND_SOURCE_RECHECK' "$A"
          grep -Fq 'V0870_BIPAD_POINT_COORDS' "$A"

          grep -Fq 'V0873_ALL_RAIN_STATIONS_VISIBLE' "$M"
          grep -Fq 'V0873_RAIN_STATION_TAP' "$M"
          grep -Fq 'V0873_STATION_GREEN_USER_BLUE_STATUS_COLOURS' "$M"
          grep -Fq '"#16A34A"' "$M"
          grep -Fq '"#FFD447"' "$M"
          grep -Fq '"#FF9418"' "$M"
          grep -Fq '"#F04444"' "$M"
          grep -Fq '"#0B7FD0"' "$M"
          grep -Fq 'V0872_RIVER_STATUS_COLOUR_LAYERS' "$M"

          grep -Fq 'V0872_BACKGROUND_SOURCE_MONITOR_FIELD' "$S"
          grep -Fq 'V0872_START_1S_BACKGROUND_SOURCE' "$S"
          grep -Fq 'V0872_STOP_BACKGROUND_SOURCE' "$S"
          grep -Fq 'V0872_ONE_SECOND_BACKGROUND_RECHECK' "$L"
          grep -Fq 'RAIN_ENDPOINT' "$L"
          grep -Fq 'HYDRO_ENDPOINTS' "$L"
          grep -Fq 'flood-station/?limit=2000' "$L"
          grep -Fq 'streamflow/?limit=2000' "$L"
          grep -Fq 'station-location/?limit=2000' "$L"
          grep -Fq 'RADIUS_KM=2d' "$L"

          grep -Fq 'new Intent(this, NativeFullActivity.class)' "$P"
          grep -Fq 'RADIUS_KM = 2d' "$W"
          grep -Fq 'V0869_TWO_HOUR_DIGEST' "$R"
          grep -Fq 'RIVER_FRESH_MS=Long.MAX_VALUE' "$A"
          grep -Fq 'versionCode 93' "$G"
          grep -Fq "versionName '0.8.73'" "$G"
          ! grep -Fq 'android.webkit.WebView' "$A"
          ! grep -Fq 'android.webkit.WebView' "$M"
          ! grep -Fq 'main.postDelayed(this,10_000L);' "$A"
          ! grep -Fq 'if(datum){level-=elevation' "$A"

      - name: Bundle assets
        run: gradle -p floodsafe-android-app clean :app:bundleFloodSafe --no-daemon

      - name: Build named progressive Nepal river assets
        run: |
          set -euo pipefail
          python3 -m pip install --quiet shapely
          python3 floodsafe-android-app/preclip_nepal_waterways.py
          python3 floodsafe-android-app/rebalance_nepal_overview_v0839.py
          python3 floodsafe-android-app/build_regional_river_tiles_v0840.py
          python3 floodsafe-android-app/build_national_river_network_v0841.py
          python3 floodsafe-android-app/build_progressive_river_names_v0863.py

      - name: Optimize retained web assets
        run: |
          python3 floodsafe-android-app/patch_low_end_sathi.py
          python3 floodsafe-android-app/patch_low_end_map.py

      - name: Unit test and build native APK
        run: gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug -x bundleFloodSafe --no-daemon --stacktrace

      - name: Verify APK contents
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-waterways-major-v0842.geojson'
          cp "$APK" FloodSafe-Nepal-v0.8.73-NATIVE-RIVER-RAIN-HYDRO-LAKE-REALTIME.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-v0873-NATIVE-RIVER-RAIN-HYDRO-LAKE-REALTIME-APK
          path: FloodSafe-Nepal-v0.8.73-NATIVE-RIVER-RAIN-HYDRO-LAKE-REALTIME.apk
          retention-days: 14
