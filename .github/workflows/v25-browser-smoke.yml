name: FloodSafe V25 Realtime Gate
on:
  push:
    branches: ["main"]
    paths:
      - "floodsafe-nepal/v25/**"
      - ".github/workflows/v25-browser-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: floodsafe-v25-realtime-gate
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for current production
        run: |
          set -euo pipefail
          BASE='https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/'
          ok=0
          for i in $(seq 1 70); do
            curl --max-time 10 -fsSL "${BASE}?ci=${GITHUB_SHA}-${i}" -o /tmp/index.html || true
            if grep -Fq 'map-v7.js?v=1' /tmp/index.html && grep -Fq 'map-v3.css?v=7' /tmp/index.html; then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1
          curl --max-time 12 -fsSL "${BASE}map-v7.js?ci=${GITHUB_SHA}" -o /tmp/map.js
          curl --max-time 12 -fsSL "${BASE}map-v3.css?ci=${GITHUB_SHA}" -o /tmp/map.css
          node --check /tmp/map.js
          grep -Fq '__fsMapV7' /tmp/map.js
          grep -Fq 'riverHitV3' /tmp/map.js
          grep -Fq 'stroke-dasharray' /tmp/map.css
      - name: Browser exact Jhapa river regression
        env:
          BASE: https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"; test -n "$CHROME"
          mkdir -p /tmp/floodsafe && cd /tmp/floodsafe
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24.31.0 >/dev/null 2>&1
          BASE="$BASE" CHROME="$CHROME" node <<'JS'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:430,height:900,deviceScaleFactor:2});
            page.setDefaultTimeout(65000);page.setDefaultNavigationTimeout(65000);
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(process.env.BASE+'?ci='+Date.now(),{waitUntil:'networkidle2'});
            await page.waitForSelector('#riverMapV3');
            await page.waitForFunction(()=>window.FloodSafeMap&&window.__fsMapV7,{timeout:30000});
            await page.evaluate(()=>window.FloodSafeMap.select(26.5763,87.9019));
            await page.waitForFunction(()=>document.querySelectorAll('.riverV3').length>0,{timeout:45000});
            const r=await page.evaluate(()=>{
              const rivers=[...document.querySelectorAll('.riverV3')],labels=[...document.querySelectorAll('.riverLabelV3')];
              const first=rivers[0],cs=getComputedStyle(first);
              const rects=labels.map(x=>x.getBoundingClientRect());
              let overlaps=0;for(let i=0;i<rects.length;i++)for(let j=i+1;j<rects.length;j++){const a=rects[i],b=rects[j];if(!(a.right<b.left||a.left>b.right||a.bottom<b.top||a.top>b.bottom))overlaps++}
              return{count:rivers.length,labels:labels.length,overlaps,dash:cs.strokeDasharray,width:parseFloat(cs.strokeWidth),hint:document.querySelector('#mapHint')?.textContent||'',focus:window.FloodSafe?.state?.kind};
            });
            if(r.count<1)throw Error('Jhapa rivers missing '+JSON.stringify(r));
            if(r.count>80)throw Error('Too many overlapping river segments '+JSON.stringify(r));
            if(!r.dash||r.dash==='none')throw Error('River is not dotted '+JSON.stringify(r));
            if(r.width>3)throw Error('River line too thick '+JSON.stringify(r));
            if(r.labels>7)throw Error('Too many river labels '+JSON.stringify(r));
            if(r.overlaps>0)throw Error('River labels overlap '+JSON.stringify(r));
            if(r.focus!=='map')throw Error('Map focus not selected '+JSON.stringify(r));
            if(errors.length)throw Error('Page errors '+JSON.stringify(errors.slice(0,8)));
            console.log('PASS exact Jhapa dotted river map',r);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(3)});
          JS
