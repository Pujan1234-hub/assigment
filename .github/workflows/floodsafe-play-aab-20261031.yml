name: FloodSafe Nepal Play AAB candidate (unsigned)
on:
  push:
    branches:
      - build/floodsafe-play-aab-20261031
    paths:
      - '.github/workflows/floodsafe-play-aab-20261031.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Set next release version without changing stable source
        run: |
          sed -i "s/versionCode 121/versionCode 122/" floodsafe-android-app/app/build.gradle
          sed -i "s/versionName '0.9.21-repair-preview'/versionName '0.9.21'/" floodsafe-android-app/app/build.gradle
      - name: Prepare Play Console package and approved launcher icon
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/applicationId 'io.github.pujan1234hub.floodsafe.app'/applicationId 'com.pjbuilts.floodsafenepal'/" floodsafe-android-app/app/build.gradle
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('floodsafe-android-app/app/google-services.json')
          j=json.loads(p.read_text())
          for client in j['client']:
              client['client_info']['android_client_info']['package_name']='com.pjbuilts.floodsafenepal'
          p.write_text(json.dumps(j,indent=2))
          PY
          mkdir -p floodsafe-android-app/app/src/main/res/drawable-nodpi
          base64 --decode floodsafe-android-app/branding/approved-floodsafe-icon.webp.b64 > floodsafe-android-app/app/src/main/res/drawable-nodpi/floodsafe_icon_original.webp
          cat > floodsafe-android-app/app/src/main/res/drawable/ic_floodsafe.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
              android:src="@drawable/floodsafe_icon_original"
              android:gravity="fill" />
          XML
          test -s floodsafe-android-app/app/src/main/res/drawable-nodpi/floodsafe_icon_original.webp
      - name: Bundle complete offline FloodSafe assets
        run: |
          python3 floodsafe-android-app/bundle_web.py
          mkdir -p floodsafe-android-app/app/src/main/assets
          cp -a floodsafe-android-app/app/build/generated/floodsafe-assets/. floodsafe-android-app/app/src/main/assets/
      - name: Run native Android unit tests before release compilation
        run: gradle -p floodsafe-android-app :app:testReleaseUnitTest --no-daemon --stacktrace
      - name: Run release lint checks
        run: gradle -p floodsafe-android-app :app:lintRelease --no-daemon --stacktrace
      - name: Compile release app bundle
        run: gradle -p floodsafe-android-app :app:bundleRelease --no-daemon --stacktrace
      - name: Verify bundle content
        run: |
          set -euo pipefail
          AAB=floodsafe-android-app/app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          unzip -t "$AAB" >/dev/null
          unzip -l "$AAB" | grep -q 'base/dex/classes.dex'
          unzip -l "$AAB" | grep -q 'base/assets/floodsafe-nepal/v25/index.html'
          sha256sum "$AAB" > floodsafe-aab-sha256.txt
          du -h "$AAB"
      - name: Archive unsigned AAB for secure local signing
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-v0.9.21-unsigned-play-bundle
          path: |
            floodsafe-android-app/app/build/outputs/bundle/release/app-release.aab
            floodsafe-aab-sha256.txt
          if-no-files-found: error
          retention-days: 14
