plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def releaseKeystorePath = System.getenv('FLOODSAFE_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('FLOODSAFE_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('FLOODSAFE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('FLOODSAFE_KEY_PASSWORD')
def hasReleaseSigning = [
    releaseKeystorePath,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword
].every { it != null && !it.trim().isEmpty() }

android {
    namespace 'io.github.pujan1234hub.floodsafe.app'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.pujan1234hub.floodsafe.app'
        minSdk 26
        targetSdk 36
        versionCode 15
        versionName '0.7.1-native'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError = true
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.firebase:firebase-messaging:24.1.1'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'org.maplibre.gl:android-sdk-opengl:13.6.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
