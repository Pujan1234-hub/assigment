name: FloodSafe V25 Realtime Gate
on:
  push:
    branches: ["main"]
    paths:
      - "floodsafe-nepal/v25/**"
      - "data/floodsafe-people-status.json"
      - ".github/workflows/v25-browser-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: floodsafe-v25-realtime-gate
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for current GitHub Pages deployment
        run: |
          set -euo pipefail
          BASE='https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/'
          ok=0
          for i in $(seq 1 60); do
            curl --max-time 10 -fsSL "${BASE}?ci=${GITHUB_SHA}-${i}" -o /tmp/index.html || true
            if grep -Fq 'flood-only.js?v=10' /tmp/index.html && grep -Fq 'news-live-v3.js?v=5' /tmp/index.html && grep -Fq 'map-v3.js?v=5' /tmp/index.html && grep -Fq 'id="nationalRiverList"' /tmp/index.html; then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1
          for f in flood-only.js flood-freshness.js news-live-v3.js map-v3.js; do
            curl --max-time 12 -fsSL "${BASE}${f}?ci=${GITHUB_SHA}" -o "/tmp/${f}"
            node --check "/tmp/${f}"
          done
          grep -Fq '__fsFloodCoreV10' /tmp/flood-only.js
          grep -Fq 'stationInfoAt' /tmp/flood-only.js
          grep -Fq 'renderNational' /tmp/flood-only.js
          grep -Fq '__fsMapV6' /tmp/map-v3.js
          grep -Fq 'Nearest official gauge' /tmp/map-v3.js
          grep -Fq '__fsNewsLiveV6' /tmp/news-live-v3.js
          grep -Fq 'FRESH=30*60*1000' /tmp/news-live-v3.js
          grep -Fq "setInterval(poll,5000)" /tmp/flood-only.js

      - name: Verify live upstream sources
        run: |
          set -euo pipefail
          curl --max-time 20 -fsSL 'https://bipadportal.gov.np/api/v1/river-stations/?limit=1000' -o /tmp/bipad.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/bipad.json'))
          rows=j if isinstance(j,list) else j.get('results') or j.get('data') or []
          assert len(rows)>0, 'BIPAD river station feed empty'
          print('BIPAD rows',len(rows))
          PY
          curl --max-time 25 -fsSL -X POST 'https://overpass-api.de/api/interpreter' \
            --data-urlencode 'data=[out:json][timeout:15];(way["waterway"="river"](26.45,87.65,26.80,88.15);way["waterway"="stream"](26.45,87.65,26.80,88.15););out tags geom 25;' \
            -o /tmp/river.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/river.json'))
          a=[x for x in j.get('elements',[]) if len(x.get('geometry',[]))>1]
          assert a, 'Overpass returned no river geometry'
          print('Overpass river geometries',len(a))
          PY

      - name: Browser bilingual map river and nationwide status smoke
        env:
          BASE: https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"; test -n "$CHROME"
          mkdir -p /tmp/floodsafe && cd /tmp/floodsafe
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24.31.0 >/dev/null 2>&1
          BASE="$BASE" CHROME="$CHROME" node <<'JS'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage']});
            const page=await browser.newPage();page.setDefaultTimeout(60000);page.setDefaultNavigationTimeout(60000);
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(process.env.BASE+'?ci='+Date.now(),{waitUntil:'networkidle2'});
            await page.waitForSelector('#riverMapV3');await page.waitForSelector('.districtV3');await page.waitForSelector('#nationalRiverList');
            await page.waitForFunction(()=>document.querySelector('#stationCount')?.textContent!=='—',{timeout:30000});
            const base=await page.evaluate(()=>({core:!!window.__fsFloodCoreV10,districts:document.querySelectorAll('.districtV3').length,labels:document.querySelectorAll('.districtLabelV3').length,national:document.querySelectorAll('#nationalRiverList .station').length,ne:document.querySelector('#localRiskTitle')?.textContent||''}));
            if(!base.core||base.districts<70||base.labels<70||base.national<1||!/स्थानीय/.test(base.ne))throw Error('base '+JSON.stringify(base));
            await page.click('#langBtn');
            await page.waitForFunction(()=>document.documentElement.lang==='en'&&document.querySelector('#localRiskTitle')?.textContent.includes('Local Flood Risk'));
            const en=await page.evaluate(()=>({risk:localRiskTitle.textContent,map:mapTitle.textContent,news:newsTitle.textContent,national:riverStatusTitle.textContent,nav:navHome.textContent}));
            if(Object.values(en).some(x=>/[\u0900-\u097F]/.test(x)))throw Error('mixed English UI '+JSON.stringify(en));
            await page.click('#langBtn');await page.waitForFunction(()=>document.documentElement.lang==='ne');
            await page.$eval('.districtV3',el=>{const r=el.getBoundingClientRect();el.dispatchEvent(new MouseEvent('click',{bubbles:true,clientX:r.left+r.width/2,clientY:r.top+r.height/2}))});
            await page.waitForSelector('.selectedPointV3',{timeout:10000});
            await page.waitForFunction(()=>document.querySelectorAll('.riverV3').length>0,{timeout:45000});
            const firstRiver=await page.$('.riverV3');if(!firstRiver)throw Error('no river');await firstRiver.click();
            const map=await page.evaluate(()=>({rivers:document.querySelectorAll('.riverV3').length,detail:document.querySelector('#riverDetail')?.innerText||'',focus:window.FloodSafe?.state?.kind||null,stroke:getComputedStyle(document.querySelector('.riverV3')).strokeWidth}));
            if(map.rivers<1||map.focus!=='map'||!map.detail||!/(gauge|३५|पानीको तह|आधिकारिक)/i.test(map.detail))throw Error('map detail '+JSON.stringify(map));
            const newsAges=await page.$$eval('#liveNews .newsItem .meta',els=>els.map(e=>e.textContent));if(newsAges.some(t=>/घण्टा|दिन|hour|day/i.test(t)))throw Error('old news '+JSON.stringify(newsAges));
            if(errors.length)throw Error('page errors '+JSON.stringify(errors.slice(0,10)));
            console.log('PASS V25 bilingual realtime',{base,en,map,newsAges:newsAges.slice(0,5)});await browser.close();
          })().catch(e=>{console.error(e);process.exit(3)});
          JS
