name: Build FloodSafe v0.8.85 Native Field Test

on:
  push:
    branches: [ fix/floodsafe-v0882-realtime-river-rain ]
    paths:
      - '.github/workflows/build-floodsafe-v0884-fieldtest.yml'
      - 'floodsafe-android-app/**'
      - 'floodsafe-nepal/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply safety and lifecycle patches
        run: |
          python3 floodsafe-android-app/patch_webview_crash.py
          python3 floodsafe-android-app/patch_auto_alerts.py
          python3 floodsafe-android-app/patch_river_waterlevel.py

      - name: Current source safety gate
        shell: bash
        run: |
          set -euo pipefail
          require() { if ! grep -Fq "$1" "$2"; then echo "Missing safety contract: $1 in $2"; exit 1; fi; }
          require "versionName '0.7.0'" floodsafe-android-app/app/build.gradle
          require 'versionCode 14' floodsafe-android-app/app/build.gradle
          require 'RADIUS_KM = 2d' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/RiverAlertWorker.java
          require 'DEFAULT_RIVER_RADIUS_KM = 2d' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeMessagingService.java
          require 'LOOKAHEAD_MINUTES = 35' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/RainAlertWorker.java
          require 'ACCESS_BACKGROUND_LOCATION' floodsafe-android-app/app/src/main/AndroidManifest.xml
          require 'onRenderProcessGone' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/MainActivity.java
          test -s floodsafe-android-app/android-web/all-stations-realtime-v1.js
          test -s floodsafe-android-app/ci_reopen_smoke.sh
          echo 'pre-native safety gate PASS'

      - name: Bundle verified Android assets
        run: gradle -p floodsafe-android-app :app:bundleFloodSafe --no-daemon

      - name: Apply presentation and native v0.8.85 patch
        run: |
          python3 floodsafe-android-app/patch_low_end_sathi.py
          python3 floodsafe-android-app/patch_pjbuilts_intro.py
          python3 floodsafe-android-app/patch_native_v0885_release.py
          grep -Fq 'V0885_NATIVE_LAUNCHER' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/PJBuiltsSplashActivity.java
          grep -Fq 'V0885_MAPLIBRE_NATIVE' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/NativeFullActivity.java
          grep -Fq 'V0885_SAME_RIVER_GAUGE_ONLY' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java
          grep -Fq "versionName '0.8.85'" floodsafe-android-app/app/build.gradle
          grep -Fq 'versionCode 15' floodsafe-android-app/app/build.gradle

      - name: Unit tests and APK build
        run: gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug -x bundleFloodSafe --no-daemon --stacktrace

      - name: Verify native APK
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -Eq 'classes[0-9]*\.dex'
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-waterways-snapshot.json'
          cp "$APK" FloodSafe-Nepal-v0.8.85-NATIVE-MAPLIBRE-RIVER-DETAIL-FIELD-TEST.apk
          sha256sum FloodSafe-Nepal-v0.8.85-NATIVE-MAPLIBRE-RIVER-DETAIL-FIELD-TEST.apk | tee FloodSafe-Nepal-v0.8.85-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-v0885-NATIVE-MAPLIBRE-RIVER-DETAIL-FIELD-TEST
          path: |
            FloodSafe-Nepal-v0.8.85-NATIVE-MAPLIBRE-RIVER-DETAIL-FIELD-TEST.apk
            FloodSafe-Nepal-v0.8.85-SHA256.txt
          if-no-files-found: error
          retention-days: 14
