name: Diagnose live FloodSafe river watch classifications
on:
  push:
    branches: [fix/floodsafe-v0921-weather-sun-notifications-20261030]
    paths: ['.github/workflows/floodsafe-live-watch-audit-20261030.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch live public source and calculate freshness-based counts
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json,datetime,collections,math
          from datetime import timezone
          url='https://pjbuilts.com/api/floodsafe-station-details?kind=stations'
          req=urllib.request.Request(url,headers={'User-Agent':'FloodSafe-Status-Audit/1.0','Accept':'application/json','Cache-Control':'no-cache'})
          try:
            with urllib.request.urlopen(req,timeout=25) as r:
              print('HTTP',r.status,'Content-Type',r.headers.get('content-type'),'Cache-Control',r.headers.get('cache-control'))
              doc=json.loads(r.read(5000000))
          except Exception as exc:
            print('FETCH_ERROR',str(exc));raise
          rows=doc.get('stations') or []
          print('API_STATUS',doc.get('status'),'TOTAL',len(rows),'API_FIELDS',list(doc)[:25])
          now=datetime.datetime.now(timezone.utc)
          print('UTC_NOW',now.isoformat())
          statuses=collections.Counter()
          fresh_counts=collections.Counter()
          problems=[]
          near_watch=[]
          timestamps=[]
          for row in rows:
            statuses[str(row.get('status'))]+=1
            raw=row.get('observed')
            when=None
            if raw:
              try:when=datetime.datetime.fromisoformat(raw.replace('Z','+00:00')).astimezone(timezone.utc)
              except Exception:pass
            age=(now-when).total_seconds()/60 if when else 999999
            if when: timestamps.append(age)
            recent=row.get('status')=='observed' and -5 <= age <= 2
            level=row.get('level');warning=row.get('warning');danger=row.get('danger')
            try:level=float(level);warning=float(warning);danger=float(danger)
            except (ValueError,TypeError):level=warning=danger=float('nan')
            stage='unknown'
            if recent and math.isfinite(level):
              rawstatus=str(row.get('reportedStatus') or '').upper()
              if math.isfinite(danger) and danger>0 and level>=danger or 'DANGER' in rawstatus and 'BELOW' not in rawstatus:stage='danger'
              elif math.isfinite(warning) and warning>0 and level>=warning or 'WARNING' in rawstatus and 'BELOW' not in rawstatus:stage='warning'
              elif math.isfinite(warning) and warning>0 and level>=warning*.8 or 'WATCH' in rawstatus or 'ALERT' in rawstatus:stage='alert'
              else:stage='normal'
            fresh_counts[stage]+=1
            if stage=='alert':
              near_watch.append({'id':str(row.get('id')),'name':str(row.get('name')),'age_min':round(age,1),'level':level,'warning':warning,'percent':round(level/warning*100,1) if warning>0 else None,'reportedStatus':row.get('reportedStatus')})
          print('API_STATUSES',dict(statuses))
          print('APP_ESTIMATED_STAGE',dict(fresh_counts))
          print('AGE_STATS_MIN',min(timestamps) if timestamps else 'none','MAX',max(timestamps) if timestamps else 'none')
          print('WATCH_EXAMPLES',json.dumps(near_watch[:22],ensure_ascii=False))
          for limit in (2,10,30,120,1440):
            counts=collections.Counter()
            for row in rows:
              raw=row.get('observed') or ''
              try:when=datetime.datetime.fromisoformat(raw.replace('Z','+00:00')).astimezone(timezone.utc)
              except Exception:when=None
              age=(now-when).total_seconds()/60 if when else 999999
              if row.get('status')!='observed' or not -5<=age<=limit:
                counts['stale']+=1
                continue
              def fl(k):
                try:return float(row.get(k))
                except (ValueError,TypeError):return float('nan')
              level,warning,danger=fl('level'),fl('warning'),fl('danger')
              rawstatus=str(row.get('reportedStatus') or '').upper()
              if not math.isfinite(level):counts['unmeasured']+=1
              elif (math.isfinite(danger) and danger>0 and level>=danger) or ('DANGER' in rawstatus and 'BELOW' not in rawstatus):counts['danger']+=1
              elif (math.isfinite(warning) and warning>0 and level>=warning) or ('WARNING' in rawstatus and 'BELOW' not in rawstatus):counts['warning']+=1
              elif (math.isfinite(warning) and warning>0 and level>=.8*warning) or ('WATCH' in rawstatus or 'ALERT' in rawstatus):counts['watch']+=1
              else:counts['normal']+=1
            print('FRESH_WINDOW_MINUTES',limit,'COUNTS',dict(counts))
          print('REPORTED_STATUS_COUNTER',dict(collections.Counter(str(row.get('reportedStatus')) for row in rows)))

          PY
