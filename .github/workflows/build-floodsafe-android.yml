name: Build FloodSafe Android field APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'floodsafe-android-app/**'
      - 'floodsafe-nepal/**'
      - '.github/workflows/build-floodsafe-android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply Android safety and lifecycle patches
        run: |
          python3 floodsafe-android-app/patch_webview_crash.py
          python3 floodsafe-android-app/patch_auto_alerts.py
          python3 floodsafe-android-app/patch_river_waterlevel.py

      - name: Safety source gate
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "versionName '0.7.0'" floodsafe-android-app/app/build.gradle
          grep -Fq 'versionCode 14' floodsafe-android-app/app/build.gradle
          grep -Fq 'RADIUS_KM = 2d' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/RiverAlertWorker.java
          grep -Fq 'DEFAULT_RIVER_RADIUS_KM = 2d' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeMessagingService.java
          grep -Fq 'const MAX_KM=2' floodsafe-nepal/v25/native-alert-bridge-v1.js
          grep -Fq 'id="humanStatus"' floodsafe-nepal/v25/index.html
          grep -Fq 'human-status-v1.js?v=1' floodsafe-nepal/v25/index.html
          if grep -Fq 'id="alertBtn"' floodsafe-nepal/v25/index.html; then echo 'alert button must not exist'; exit 1; fi
          grep -Fq 'WEATHER_DIGEST_INTERVAL_MS = 4L * 60L * 60L * 1000L' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/RainAlertWorker.java
          grep -Fq 'smart_weather_updates_v2' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/RainAlertWorker.java
          grep -Fq 'last_weather_digest_v2_at' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/RainAlertWorker.java
          grep -Fq 'floodsafe-local-rain-alert-now' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/MainActivity.java
          grep -Fq 'ACCESS_BACKGROUND_LOCATION' floodsafe-android-app/app/src/main/AndroidManifest.xml
          grep -Fq 'onRenderProcessGone' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/MainActivity.java
          grep -Fq 'public final class VoiceMainActivity extends MainActivity' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/VoiceMainActivity.java
          grep -Fq 'new Intent(this, VoiceMainActivity.class)' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/PJBuiltsSplashActivity.java
          grep -Fq 'Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/PJBuiltsSplashActivity.java
          grep -Fq "const level=o=>num(val(o,['_lastWaterLevel','waterLevel','water_level','currentWaterLevel','current_water_level','currentLevel','current_level']));" floodsafe-nepal/v25/trusted-river-runtime-v3.js
          test -s floodsafe-android-app/patch_pjbuilts_intro.py
          test -s floodsafe-android-app/patch_low_end_sathi.py
          test -s floodsafe-android-app/patch_low_end_map.py
          test -s floodsafe-android-app/ci_reopen_smoke.sh
          test -s floodsafe-android-app/app/src/androidTest/java/io/github/pujan1234hub/floodsafe/app/ReopenSmokeTest.java
          test -s floodsafe-android-app/android-web/all-stations-realtime-v1.js
          grep -Fq 'const ONE_SECOND=1000' floodsafe-android-app/android-web/river-status-color-fix-v1.js
          grep -Fq 'FloodSafeRainRealtime?.poll?.()' floodsafe-android-app/android-web/river-status-color-fix-v1.js
          grep -Fq 'rain-stations/?limit=500' floodsafe-nepal/v25/trusted-rain-runtime-v1.js
          echo 'FloodSafe source safety gate PASS'

      - name: Bundle verified Android assets
        run: gradle -p floodsafe-android-app :app:bundleFloodSafe --no-daemon

      - name: Optimize SATHI and map for budget Android
        run: |
          python3 floodsafe-android-app/patch_low_end_sathi.py
          python3 floodsafe-android-app/patch_low_end_map.py

      - name: Apply smooth PJBUILTS launch intro
        run: python3 floodsafe-android-app/patch_pjbuilts_intro.py

      - name: Prepare reliable direct startup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('floodsafe-android-app/app/build/generated/floodsafe-assets/floodsafe-nepal/v25/index.html')
          text=p.read_text(encoding='utf-8')
          text=text.replace('<script src="./android-fast-start-v1.js?v=1" defer></script>','')
          aware='<script src="./sathi-app-aware-v1.js?v=1" defer></script>'
          marker='<script src="./sathi-flood-ai/place-weather-v1.js?v=1" defer></script>'
          if aware not in text:
            if marker not in text: raise SystemExit('SATHI place-weather marker missing')
            text=text.replace(marker,aware+marker,1)
          auto='<script src="./auto-alert-ui-v1.js?v=1" defer></script>'
          if auto not in text: text=text.replace('</body>',auto+'</body>',1)
          p.write_text(text,encoding='utf-8')
          PY
          INDEX='floodsafe-android-app/app/build/generated/floodsafe-assets/floodsafe-nepal/v25/index.html'
          RIVER_STYLE='floodsafe-android-app/app/build/generated/floodsafe-assets/floodsafe-nepal/v25/river-line-style-v1.js'
          LIVE_FIX='floodsafe-android-app/app/build/generated/floodsafe-assets/floodsafe-nepal/v25/river-status-color-fix-v1.js'
          ALL_STATIONS='floodsafe-android-app/app/build/generated/floodsafe-assets/floodsafe-nepal/v25/all-stations-realtime-v1.js'
          grep -Fq 'map-loader-v3.js?v=31' "$INDEX"
          grep -Fq 'permanent-281-map-v1.js?v=6' "$INDEX"
          grep -Fq 'sathi-flood-ai/floating-ui-v2.js?v=2' "$INDEX"
          grep -Fq 'sathi-flood-ai/advanced-server-v1.js?v=1' "$INDEX"
          grep -Fq 'auto-alert-ui-v1.js?v=1' "$INDEX"
          grep -Fq 'id="pjbuiltsIntro"' "$INDEX"
          grep -Fq '__FS_LOW_END_SATHI_V1__' floodsafe-android-app/app/build/generated/floodsafe-assets/floodsafe-nepal/v25/sathi-flood-ai/live.js
          grep -Fq 'window.__fsSathiTyping' floodsafe-android-app/app/build/generated/floodsafe-assets/floodsafe-nepal/v25/trusted-river-runtime-v3.js
          if grep -Fq '__fsRiverLineStyleV18' "$RIVER_STYLE"; then
            grep -Fq 'function cadence(map)' "$RIVER_STYLE"
            grep -Fq 'setTimeout(animateOnce' "$RIVER_STYLE"
          else
            grep -Fq 'setInterval(()=>{if(mapBusy())return;animate()},850)' "$RIVER_STYLE"
          fi
          grep -Fq 'setInterval(()=>{const m=window.FloodSafeMap?.map;' floodsafe-android-app/app/build/generated/floodsafe-assets/floodsafe-nepal/v25/permanent-281-map-v1.js
          test -s "$ALL_STATIONS"
          grep -Fq 'const ONE_SECOND=1000' "$LIVE_FIX"
          grep -Fq 'all-stations-realtime-v1.js?v=1' "$LIVE_FIX"
          grep -Fq 'r1:rainValue(o,1)' "$ALL_STATIONS"
          grep -Fq 'r24:rainValue(o,24)' "$ALL_STATIONS"
          grep -Fq "status:'unknown'" floodsafe-android-app/app/build/generated/floodsafe-assets/floodsafe-nepal/v25/permanent-281-map-v1.js
          grep -Fq 'LAST OFFICIAL READING — NOT CURRENT' floodsafe-android-app/app/build/generated/floodsafe-assets/floodsafe-nepal/v25/permanent-281-map-v1.js
          if grep -Fq 'android-fast-start-v1.js' "$INDEX"; then echo 'serial startup loader must not be active'; exit 1; fi
          if grep -Fq 'id="alertBtn"' "$INDEX"; then echo 'alert button found'; exit 1; fi

      - name: Unit tests and APK build
        run: gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug -x bundleFloodSafe --no-daemon

      - name: Verify packaged APK
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -p "$APK" assets/floodsafe-nepal/v25/index.html > /tmp/index.html
          unzip -p "$APK" assets/floodsafe-nepal/v25/river-line-style-v1.js > /tmp/river-line-style-v1.js
          unzip -p "$APK" assets/floodsafe-nepal/v25/river-status-color-fix-v1.js > /tmp/river-status-color-fix-v1.js
          unzip -p "$APK" assets/floodsafe-nepal/v25/all-stations-realtime-v1.js > /tmp/all-stations-realtime-v1.js
          grep -Fq 'id="humanStatus"' /tmp/index.html
          grep -Fq 'map-loader-v3.js?v=31' /tmp/index.html
          grep -Fq 'permanent-281-map-v1.js?v=6' /tmp/index.html
          grep -Fq 'sathi-flood-ai/floating-ui-v2.js?v=2' /tmp/index.html
          grep -Fq 'sathi-flood-ai/advanced-server-v1.js?v=1' /tmp/index.html
          grep -Fq 'id="pjbuiltsIntro"' /tmp/index.html
          if grep -Fq 'id="alertBtn"' /tmp/index.html; then echo 'alert button found in APK'; exit 1; fi
          if grep -Fq 'android-fast-start-v1.js' /tmp/index.html; then echo 'bad serial startup loader found'; exit 1; fi
          unzip -p "$APK" assets/floodsafe-nepal/v25/sathi-flood-ai/live.js | grep -Fq '__FS_LOW_END_SATHI_V1__'
          unzip -p "$APK" assets/floodsafe-nepal/v25/trusted-river-runtime-v3.js | grep -Fq 'window.__fsSathiTyping'
          if grep -Fq '__fsRiverLineStyleV18' /tmp/river-line-style-v1.js; then
            grep -Fq 'function cadence(map)' /tmp/river-line-style-v1.js
            grep -Fq 'setTimeout(animateOnce' /tmp/river-line-style-v1.js
          else
            grep -Fq 'setInterval(()=>{if(mapBusy())return;animate()},850)' /tmp/river-line-style-v1.js
          fi
          unzip -p "$APK" assets/floodsafe-nepal/v25/permanent-281-map-v1.js | grep -Fq 'setInterval(()=>{const m=window.FloodSafeMap?.map;'
          unzip -p "$APK" assets/floodsafe-nepal/v25/permanent-281-map-v1.js | grep -Fq 'LAST OFFICIAL READING — NOT CURRENT'
          grep -Fq 'const ONE_SECOND=1000' /tmp/river-status-color-fix-v1.js
          grep -Fq 'all-stations-realtime-v1.js?v=1' /tmp/river-status-color-fix-v1.js
          grep -Fq 'r1:rainValue(o,1)' /tmp/all-stations-realtime-v1.js
          grep -Fq 'r24:rainValue(o,24)' /tmp/all-stations-realtime-v1.js
          unzip -l "$APK" | grep -Eq 'classes[0-9]*\.dex'
          echo 'FloodSafe APK package verification PASS'

      - name: Android real-launcher reopen + WebView smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash floodsafe-android-app/ci_reopen_smoke.sh

      - name: Upload reopen diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Reopen-Diagnostics
          path: |
            /tmp/reopen-test.txt
            /tmp/floodsafe-logcat.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-FieldTest-0.7.0-APK
          path: floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
