name: FloodSafe Map Acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'floodsafe-nepal/v25/index.html'
      - 'floodsafe-nepal/v25/map-*.js'
      - 'floodsafe-nepal/v25/hydro-smooth-v2.js'
      - 'floodsafe-nepal/v25/trusted-river-runtime-v3.js'
      - 'floodsafe-nepal/v25/trusted-rain-runtime-v1.js'
      - 'floodsafe-nepal/v25/realtime-guard-v1.js'
      - 'floodsafe-nepal/v25/river-current-20m-v1.js'
      - 'floodsafe-nepal/v25/official-stale-safety-v1.js'
      - '.github/workflows/floodsafe-map-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: floodsafe-map-acceptance
  cancel-in-progress: true
jobs:
  live-map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and 10-minute official contract
        run: |
          set -euo pipefail
          for f in floodsafe-nepal/v25/{trusted-river-runtime-v3.js,trusted-rain-runtime-v1.js,realtime-guard-v1.js,river-current-20m-v1.js,map-smooth-v3.js,hydro-smooth-v2.js,station-click-coherence-v1.js,official-stale-safety-v1.js}; do node --check "$f"; done
          grep -Fq '__fsTrustedRiverRuntimeV31' floodsafe-nepal/v25/trusted-river-runtime-v3.js
          grep -Fq 'FRESH_MS=10*60*1000' floodsafe-nepal/v25/trusted-river-runtime-v3.js
          grep -Fq 'FRESH10_MS=10*60*1000' floodsafe-nepal/v25/realtime-guard-v1.js
          grep -Fq 'CURRENT_MS=10*60*1000' floodsafe-nepal/v25/official-stale-safety-v1.js
          grep -Fq '__fsRiverDistrictLiveV8' floodsafe-nepal/v25/river-current-20m-v1.js
          grep -Fq '__fsStationClickCoherenceV1' floodsafe-nepal/v25/station-click-coherence-v1.js
      - name: Probe official BIPAD and 77 districts
        run: |
          python - <<'PY'
          import json, urllib.request
          d=json.load(open('floodsafe-nepal/v24/nepal-districts.geojson'))
          assert len(d.get('features',[]))==77
          u='https://bipadportal.gov.np/api/v1/river-stations/?limit=2000&ordering=-waterLevelOn'
          q=urllib.request.Request(u,headers={'Accept':'application/json','Origin':'https://pujan1234-hub.github.io','User-Agent':'FloodSafe-Nepal-acceptance'})
          with urllib.request.urlopen(q,timeout=35) as r:j=json.loads(r.read().decode('utf-8-sig'))
          rows=j if isinstance(j,list) else j.get('results') or j.get('data') or []
          assert len(rows)>=200
          print('OFFICIAL_STATIONS',len(rows),'DISTRICTS',len(d['features']))
          PY
      - name: Wait for deployed 10-minute build
        run: |
          set -euo pipefail
          U='https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/'
          ok=0
          for i in $(seq 1 120); do
            h="$(curl --max-time 12 -fsSL "${U}?accept=${GITHUB_SHA}-${i}" || true)"
            if [[ "$h" == *'trusted-river-runtime-v3.js?v=31'* && "$h" == *'realtime-guard-v1.js?v=8'* && "$h" == *'७७ जिल्ला — सबै official नदी स्टेशन'* ]]; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
      - name: Browser 77-district and freshness parity
        env:
          APP: https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"; test -n "$CHROME"
          mkdir -p /tmp/mapaccept && cd /tmp/mapaccept; npm init -y >/dev/null 2>&1; npm install --no-save puppeteer-core@24.31.0 >/dev/null 2>&1
          APP="$APP" CHROME="$CHROME" node <<'JS'
          const puppeteer=require('puppeteer-core'),wait=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--enable-unsafe-swiftshader']});
            const p=await b.newPage();p.setDefaultTimeout(120000);await p.setViewport({width:1280,height:1000});
            const errors=[];p.on('pageerror',e=>errors.push(String(e)));
            await p.goto(process.env.APP+'?districtaccept='+Date.now()+'#map',{waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>window.__fsSmoothMapLoaded&&window.__fsHydroSmoothLoaded&&window.FloodSafeMap?.initialized,{timeout:120000});
            await p.waitForFunction(()=>window.__fsRiverRealtimeState?.catalogCount>0&&window.__fsRiverRealtimeState?.freshWindowMinutes===10,{timeout:90000});
            await p.waitForFunction(()=>window.__fsDistrictRiverState?.districts===77&&document.querySelectorAll('.districtBtn').length===77,{timeout:60000});
            await wait(1000);
            const live=await p.evaluate(()=>{
              const R=window.__fsRiverRealtimeState||{},S=window.FloodSafe?.state||{},now=Date.now(),fresh=10*60*1000,future=5*60*1000;
              const time=o=>o?._measurementTime||o?.waterLevelOn||o?.measurementTime||o?.observationTime||null;
              const level=o=>Number(o?._lastWaterLevel??o?.waterLevel??o?.level);
              const current=S.currentRiverStations||[];
              const staleCurrent=current.filter(o=>{const t=+new Date(time(o)||0),a=now-t;return !t||!Number.isFinite(level(o))||a>fresh||a<-future}).length;
              const leaked=(S.allRiverStations||[]).filter(o=>o?._staleDiscarded&&(time(o)||Number.isFinite(level(o)))).length;
              return{catalog:R.catalogCount,current:R.currentCount,staleDiscarded:R.staleDiscardedCount,window:R.freshWindowMinutes,districts:window.__fsDistrictRiverState?.districts,buttons:document.querySelectorAll('.districtBtn').length,staleCurrent,leaked,guard:!!window.__fsRealtimeGuardV8};
            });
            console.log('LIVE',JSON.stringify(live));
            if(live.catalog<200||live.window!==10||live.districts!==77||live.buttons!==77||live.staleCurrent!==0||live.leaked!==0||!live.guard)throw Error('10-minute map parity '+JSON.stringify(live));
            if(errors.some(x=>/SyntaxError|TypeError|FloodSafe smooth map runtime failed/.test(x)))throw Error('browser errors '+JSON.stringify(errors));
            console.log('PASS FloodSafe 77-district 10-minute official map');await b.close();
          })().catch(e=>{console.error(e);process.exit(3)});
          JS
