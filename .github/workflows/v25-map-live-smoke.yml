name: V25 Map Live Verification
on:
  push:
    branches: [main]
    paths:
      - 'floodsafe-nepal/v25/index.html'
      - 'floodsafe-nepal/v25/map-*.js'
      - 'floodsafe-nepal/v25/hydro-*.js'
      - 'floodsafe-nepal/v25/trusted-river-runtime-v1.js'
      - 'floodsafe-nepal/v25/ui-simple-v1.css'
      - 'floodsafe-nepal/v25/river-*.js'
      - '.github/workflows/v25-map-live-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v25-map-live-verification
  cancel-in-progress: true
jobs:
  map-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/
      BIPAD: https://bipadportal.gov.np/api/v1/river-stations/?latest=true&limit=2000
      SUPABASE_EDGE: https://camkoacuokffryyrygda.supabase.co/functions/v1/bipad-river-live
      SUPABASE_KEY: sb_publishable_xLbPCN9-jctCQ8lPze10tg_AYL7hlFr
    steps:
      - name: Wait for deployed corrected realtime river build
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 90); do
            html="$(curl --max-time 15 -fsSL "${BASE}?mapci=${GITHUB_SHA}-${i}" || true)"
            if printf '%s' "$html" | grep -Fq 'trusted-river-runtime-v1.js?v=18' && printf '%s' "$html" | grep -Fq 'map-loader-v3.js?v=23' && ! printf '%s' "$html" | grep -Fq 'bipad-realtime-overlay-v1.js'; then
              ok=1; break
            fi
            sleep 4
          done
          test "$ok" = 1

      - name: Sync Supabase and verify exact BIPAD realtime latest parity
        run: |
          set -euo pipefail
          passed=0
          for attempt in 1 2 3; do
            curl --max-time 25 -fsSL -H 'accept: application/json' "$BIPAD&_ci=$RANDOM" > /tmp/bipad.json
            curl --max-time 30 -fsSL -X POST -H "apikey: $SUPABASE_KEY" -H 'content-type: application/json' -d '{}' "$SUPABASE_EDGE" > /tmp/supa.json
            if node <<'JS'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/bipad.json','utf8'));
          const s=JSON.parse(fs.readFileSync('/tmp/supa.json','utf8'));
          const rows=j=>Array.isArray(j)?j:Array.isArray(j?.results)?j.results:Array.isArray(j?.data)?j.data:Array.isArray(j?.data?.results)?j.data.results:[];
          const val=(o,ks)=>{for(const k of ks){const v=o?.[k];if(v!==undefined&&v!==null&&v!=='')return v}return null};
          const ids=o=>['stationSeriesId','station_series_id','stationId','station_id','stationIndex','station_index'].map(k=>o?.[k]).filter(v=>v!==undefined&&v!==null&&v!=='').map(String);
          const key=o=>ids(o)[0]?`sid:${ids(o)[0]}`:(o?.id!=null?`id:${o.id}`:null);
          const num=v=>{const n=Number(String(v??'').replace(/[^0-9.+-]/g,''));return Number.isFinite(n)?n:null};
          const level=o=>num(val(o,['waterLevel','water_level','currentWaterLevel','current_water_level','currentLevel','current_level','level']));
          const stamp=o=>val(o,['waterLevelOn','water_level_on','measuredOn','measured_on','measurementTime','observationTime']);
          const br=rows(b),sr=rows(s);
          if(!br.length||!sr.length)throw Error(`empty feed ${br.length}/${sr.length}`);
          if(br.length!==sr.length)throw Error(`count ${br.length}/${sr.length}`);
          if(!String(s.source_url||'').includes('latest=true'))throw Error('Supabase is not using BIPAD latest=true');
          const sm=new Map(sr.map(o=>[key(o),o]).filter(x=>x[0])); let checked=0;
          for(const o of br){const a=sm.get(key(o));if(!a||level(o)===null||!stamp(o))continue;
            if(level(a)!==level(o)||+new Date(stamp(a))!==+new Date(stamp(o)))throw Error('current reading mismatch '+key(o));
            for(const f of ['warningLevel','dangerLevel','basin','elevation','steady','description','status'])if(o[f]!==undefined&&o[f]!==null&&String(a[f]??'')!==String(o[f]))throw Error(`${f} mismatch ${key(o)}`);
            if(++checked>=12)break;
          }
          if(checked<3)throw Error('too few exact current matches '+checked);
          if(sr.some(o=>String(o.stationSeriesId??o.station_series_id??'')==='24310'))throw Error('stale Yangri 24310 leaked into BIPAD latest=true feed');
          console.log('EDGE_LATEST_PARITY_OK',JSON.stringify({bipad:br.length,supabase:sr.length,checked,source:s.source}));
          JS
            then passed=1; break; fi
            sleep 3
          done
          test "$passed" = 1

      - name: Verify live browser uses only BIPAD realtime latest stations
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          mkdir -p /tmp/mapgate && cd /tmp/mapgate
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24.31.0 >/dev/null 2>&1
          BASE="$BASE" CHROME="$CHROME" node <<'JS'
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage(); await page.setViewport({width:412,height:915,deviceScaleFactor:1});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(process.env.BASE+'?mapci='+Date.now()+'#map',{waitUntil:'domcontentloaded',timeout:70000});
            await page.waitForFunction(()=>window.FloodSafeMap?.map&&window.__fsRiverRealtimeState?.connected===true&&Number(window.__fsRiverRealtimeState?.catalogCount||0)>0,{timeout:70000});
            await page.waitForFunction(()=>window.FloodSafeMap.map.isStyleLoaded(),{timeout:70000}); await sleep(5000);
            const app=await page.evaluate(()=>({state:window.__fsRiverRealtimeState,all:window.FloodSafe?.state?.allRiverStations||[],latest:window.FloodSafe?.state?.latestRiverStations||[],current:window.FloodSafe?.state?.currentRiverStations||[],text:document.body.innerText,otherBipad:!!document.getElementById('fsBipadLayerControl')}));
            if(app.state.source!=='BIPAD realtime latest=true via Supabase')throw Error('correct realtime source not active '+JSON.stringify(app.state));
            if(app.state.officialQuery!=='latest=true')throw Error('official latest query missing '+JSON.stringify(app.state));
            if(app.all.length<100)throw Error('too few BIPAD realtime stations '+app.all.length);
            if(app.current.length!==app.latest.length||app.latest.length!==app.all.length)throw Error(`current/latest/all mismatch ${app.current.length}/${app.latest.length}/${app.all.length}`);
            if(app.all.some(o=>String(o.stationSeriesId??o.station_series_id??'')==='24310'))throw Error('stale Indrawati at Yangri 24310 is still exposed as realtime');
            if(app.otherBipad)throw Error('non-river BIPAD control present');
            const gauge=await page.evaluate(()=>window.FloodSafeMap.map.getSource('gauges')?._data?.features?.[0]||null);
            if(gauge){
              await page.evaluate(f=>{const m=window.FloodSafeMap.map,c=f.geometry.coordinates;m.fire('click',{lngLat:{lng:c[0],lat:c[1]},point:m.project(c),features:[f]})},gauge);
              await sleep(800);
              const pop=await page.$eval('.maplibregl-popup',e=>e.innerText).catch(()=> '');
              if(!/Water level|पानीको सतह/.test(pop)||!/Danger level|खतरा तह/.test(pop)||!/Warning level|चेतावनी तह/.test(pop)||!/Station series ID/.test(pop))throw Error('river detail popup incomplete: '+pop);
              if(!/latest=true/.test(pop))throw Error('popup source is not labelled as BIPAD realtime latest=true: '+pop);
            }
            if(errors.length)throw Error('page errors '+JSON.stringify(errors.slice(0,6)));
            console.log('PASS BIPAD REALTIME LATEST',JSON.stringify({stations:app.all.length,source:app.state.source,newest:app.state.newestMeasurement}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(3)});
          JS
