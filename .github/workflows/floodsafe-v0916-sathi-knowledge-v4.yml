name: FloodSafe v0.9.16 SATHI KNOWLEDGE v4

on:
  push:
    branches: [ fix/floodsafe-v0908-storm-events-compact-gauge ]
    paths:
      - '.github/workflows/floodsafe-v0916-sathi-knowledge-v4.yml'
      - 'floodsafe-android-app/fix_v0916_patch_script_v3.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Rebuild verified v0.9.15 native base
        shell: bash
        run: |
          set -euo pipefail
          python3 floodsafe-android-app/patch_native_language_safe.py
          python3 floodsafe-android-app/patch_native_weather_complete.py
          python3 floodsafe-android-app/patch_native_weather_station_correction.py
          python3 floodsafe-android-app/patch_native_v0906_district_196_rain.py
          python3 floodsafe-android-app/patch_native_v0907_district_click.py
          python3 floodsafe-android-app/patch_native_v0908_step1_river_click.py
          python3 floodsafe-android-app/patch_native_v0908_step2_compact_district.py
          python3 floodsafe-android-app/fix_v0908_step3_weather_refresh_anchor.py
          python3 floodsafe-android-app/patch_native_v0908_step3_storm_notifications.py
          python3 floodsafe-android-app/patch_native_v0909_sync_sathi_language.py
          python3 floodsafe-android-app/fix_v0909_district_lambda_compile.py
          python3 floodsafe-android-app/patch_native_v0910_step1_sathi_chat.py
          python3 floodsafe-android-app/patch_native_v0910_step2_map_labels.py
          python3 floodsafe-android-app/run_v0911_patch_fixed.py
          python3 floodsafe-android-app/fix_v0911_threshold_order.py
          python3 floodsafe-android-app/patch_native_v0912_weather_rain_parity.py
          python3 floodsafe-android-app/patch_native_v0913_dhm_rain_overlay.py
          python3 floodsafe-android-app/patch_native_v0914_current_rain_only.py
          python3 floodsafe-android-app/fix_v0915_weather_icon_patch_script.py
          python3 floodsafe-android-app/patch_native_v0915_weather_icons.py
          grep -Fq "versionCode 32" floodsafe-android-app/app/build.gradle
          grep -Fq "versionName '0.9.15-current-weather-icons'" floodsafe-android-app/app/build.gradle

      - name: Freeze protected FloodSafe systems
        shell: bash
        run: |
          set -euo pipefail
          J='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app'
          sha256sum "$J/BipadRealtimeStationFeed.java" "$J/OfficialRiverData.java" "$J/FloodMonitorService.java" "$J/FloodSafeNativeMapView.java" "$J/AffectedRiverAlertMatcher.java" "$J/FloodLiveGaugeMonitor.java" "$J/RiverAlertWorker.java" "$J/RainAlertWorker.java" "$J/WeatherMapOverlayController.java" > /tmp/protected.before

      - name: Apply SATHI and knowledge repair
        shell: bash
        run: |
          set -euo pipefail
          python3 floodsafe-android-app/fix_v0916_patch_script.py
          python3 floodsafe-android-app/fix_v0916_patch_script_v2.py
          python3 floodsafe-android-app/fix_v0916_patch_script_v3.py
          python3 floodsafe-android-app/patch_native_v0916_sathi_knowledge.py

      - name: Verify patch scope
        shell: bash
        run: |
          set -euo pipefail
          J='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app'; U="$J/NativeFullActivity.java"
          grep -Fq 'V0916_KNOWLEDGE_ROTATION' "$U"
          grep -Fq 'V0916_SATHI_DISTRICT_WEATHER' "$U"
          grep -Fq 'V0916_KNOWLEDGE_FALLBACK' "$U"
          grep -Fq 'districtWeatherAnswer' "$U"
          grep -Fq 'renderKnowledgeFallback(true)' "$U"
          grep -Fq "versionCode 33" floodsafe-android-app/app/build.gradle
          grep -Fq "versionName '0.9.16-sathi-knowledge'" floodsafe-android-app/app/build.gradle
          sha256sum "$J/BipadRealtimeStationFeed.java" "$J/OfficialRiverData.java" "$J/FloodMonitorService.java" "$J/FloodSafeNativeMapView.java" "$J/AffectedRiverAlertMatcher.java" "$J/FloodLiveGaugeMonitor.java" "$J/RiverAlertWorker.java" "$J/RainAlertWorker.java" "$J/WeatherMapOverlayController.java" > /tmp/protected.after
          cmp /tmp/protected.before /tmp/protected.after
          grep -Fq 'V0914_CURRENT_RAIN_ONLY_VERIFIER' "$J/DhmCurrentRainVerifier.java"
          grep -Fq 'V0915_WEB_STYLE_WEATHER_ICONS' "$J/WeatherMapOverlayController.java"

      - name: Test and assemble native APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/v0916.log

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'; OUT='FloodSafe-Nepal-v0.9.16-SATHI-KNOWLEDGE.apk'
          test -s "$APK"; unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -Fq 'AndroidManifest.xml'
          unzip -l "$APK" | grep -Fq 'assets/floodsafe-nepal/v24/nepal-districts.geojson'
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-waterways-tiles/overview.json'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"; "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" "$OUT"; sha256sum "$OUT" | tee FloodSafe-Nepal-v0.9.16-SHA256.txt
          printf '%s\n' 'FloodSafe Nepal v0.9.16 SATHI + knowledge repair' '- strict <=30-minute verified news preserved' '- no fresh news => rotating non-repeating safety knowledge' '- district-specific SATHI current weather/temperature' '- river/BIPAD/stations/map/2 km alerts/weather overlay unchanged' > FloodSafe-Nepal-v0.9.16-NOTES.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-v0916-SATHI-KNOWLEDGE
          path: |
            FloodSafe-Nepal-v0.9.16-SATHI-KNOWLEDGE.apk
            FloodSafe-Nepal-v0.9.16-SHA256.txt
            FloodSafe-Nepal-v0.9.16-NOTES.txt
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-v0916-v4-build-log
          path: /tmp/v0916.log
          if-no-files-found: ignore
          retention-days: 2
