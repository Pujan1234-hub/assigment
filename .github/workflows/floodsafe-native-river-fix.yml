name: FloodSafe native station rivers only

on:
  push:
    branches: [fix/floodsafe-full-river-detail-v0879]

permissions:
  contents: write

jobs:
  build-verify-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/floodsafe-full-river-detail-v0879
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm

      - name: Preinstall Android emulator with retries
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          for attempt in 1 2 3 4; do
            echo "Android emulator install attempt ${attempt}/4"
            if sdkmanager --install emulator platform-tools 'platforms;android-34'; then
              emulator -version
              exit 0
            fi
            rm -rf "$ANDROID_SDK_ROOT/.temp" "$ANDROID_SDK_ROOT/temp" "$HOME/.android/cache" || true
            sleep 15
          done
          echo 'Android emulator package failed after retries'
          exit 1

      - name: Apply station-rivers-only patch
        run: |
          python3 floodsafe-android-app/patch_native_v0899_verified_river_flow_safety.py
          python3 floodsafe-android-app/patch_native_v0900_station_rivers_only.py
          python3 floodsafe-android-app/patch_native_v0900_station_river_alias.py

      - name: Verify station-only source contracts
        shell: bash
        run: |
          set -euo pipefail
          MAP=floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java
          ACT=floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/NativeFullActivity.java
          grep -q 'V0900_STATION_RIVERS_ONLY' "$MAP"
          grep -q 'V0900_FULL_NETWORK_NEVER_RENDERED' "$MAP"
          grep -q 'V0900_BUILD_MAPPING_ONCE' "$MAP"
          grep -q 'V0900_NAME_FIRST_STRICT_COORD_FALLBACK' "$MAP"
          grep -q 'V0900_LOCAL_SAME_RIVER_ONLY' "$MAP"
          grep -q 'V0900_VISIBLE_SOURCE_IS_MONITORED_ONLY' "$MAP"
          grep -q 'V0900_ANIMATION_MONITORED_SOURCE_ONLY' "$MAP"
          grep -q 'V0900_STATUS_COLOURS_LINKED_SEGMENTS_ONLY' "$MAP"
          grep -q 'V0900_STRICT_NEPAL_BOUNDS' "$MAP"
          grep -q 'V0900_BIPAD_NAME_MATCH_PRIORITY' "$MAP"
          ! grep -q 'riversGeoJson = makeRiversGeoJson(all)' "$MAP"
          ! grep -q 'Math.min(36, rivers.size())' "$MAP"
          grep -q 'new FloodSafeNativeMapView' "$ACT"
          ! grep -R -n 'android\.webkit\|androidx\.webkit' floodsafe-android-app/app/src/main/java floodsafe-android-app/app/build.gradle
          grep -q "versionName '0.9.00-native'" floodsafe-android-app/app/build.gradle
          echo 'Station-only native map source contracts PASS'

      - name: Verify bundled candidate geometry contains Bagmati and Nepal rivers
        shell: python3 {0}
        run: |
          import json
          from pathlib import Path
          p=Path('data/nepal-waterways-tiles/overview.json')
          j=json.loads(p.read_text(encoding='utf-8'))
          ways=j.get('waterways') or []
          assert len(ways)>0, 'overview has no river candidates'
          def txt(w): return ' '.join(str(w.get(k,'')).lower() for k in ('name','name_en','name_ne'))
          bag=[w for w in ways if 'bagmati' in txt(w)]
          print('candidate waterways=',len(ways),'bagmati_named_segments=',len(bag))
          assert bag, 'Bagmati named geometry missing from bundled candidate asset'
          assert any(len(w.get('pts') or [])>=2 for w in bag), 'Bagmati geometry has no usable points'

      - name: Unit tests and build debug APK
        run: gradle -p floodsafe-android-app clean :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Inspect final APK native-only and station-river markers
        shell: bash
        run: |
          set -euo pipefail
          APK=floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z1 "$APK" > /tmp/apk-files.txt
          ! grep -Ei '\.(html|js|mjs|webmanifest)$' /tmp/apk-files.txt
          unzip -l "$APK" | grep -q 'assets/data/nepal-waterways-tiles/overview.json'
          : > /tmp/dexstrings
          while read -r d; do unzip -p "$APK" "$d" | strings >> /tmp/dexstrings; done < <(grep -E '^classes[0-9]*\.dex$' /tmp/apk-files.txt)
          ! grep -qE 'android/webkit/WebView|androidx/webkit|VoiceMainActivity|BundledContent' /tmp/dexstrings
          grep -q 'station_linked_features=' /tmp/dexstrings
          grep -q 'animated_station_features=' /tmp/dexstrings
          grep -q 'station-only river layers active' /tmp/dexstrings
          grep -q 'fs-river-glow' /tmp/dexstrings
          grep -q 'fs-rivers-layer' /tmp/dexstrings
          grep -q 'fs-flow-particles-layer' /tmp/dexstrings
          echo 'Final APK native/station-river inspection PASS'

      - name: Runtime MapLibre render verification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -e
            APK=floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk
            adb install -r "$APK"
            adb logcat -c
            adb shell monkey -p io.github.pujan1234hub.floodsafe.app -c android.intent.category.LAUNCHER 1
            sleep 45
            adb shell input swipe 540 2000 540 400 900 || true
            sleep 5
            adb exec-out screencap -p > floodsafe-android-app/runtime-station-rivers-1.png
            sleep 1
            adb exec-out screencap -p > floodsafe-android-app/runtime-station-rivers-2.png
            adb logcat -d > floodsafe-android-app/runtime-log.txt
            echo '--- FloodSafeRiver runtime ---'
            grep 'FloodSafeRiver' floodsafe-android-app/runtime-log.txt | tail -100 || true
            grep -Eq 'station_linked_features=[1-9][0-9]*' floodsafe-android-app/runtime-log.txt
            grep -Eq 'flow_frame=[1-9][0-9]*.*animated_station_features=[1-9][0-9]*' floodsafe-android-app/runtime-log.txt
            grep -q 'station-only river layers active' floodsafe-android-app/runtime-log.txt
            grep -Eq 'sample=.*(Bagmati|Gaurighat|bagmati|gaurighat)' floodsafe-android-app/runtime-log.txt
            test -s floodsafe-android-app/runtime-station-rivers-1.png
            test -s floodsafe-android-app/runtime-station-rivers-2.png

      - name: Commit verified source
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'FloodSafe Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java floodsafe-android-app/app/build.gradle
          git commit -m 'fix: render and animate only BIPAD station rivers v0.9.00'
          git push origin HEAD:fix/floodsafe-full-river-detail-v0879

      - name: Package verified APK
        if: success()
        run: |
          cp floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk floodsafe-android-app/FloodSafe-Nepal-v0.9.00-station-rivers-native.apk
          sha256sum floodsafe-android-app/FloodSafe-Nepal-v0.9.00-station-rivers-native.apk > floodsafe-android-app/FloodSafe-Nepal-v0.9.00-sha256.txt

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-v0.9.00-runtime-evidence
          path: |
            floodsafe-android-app/runtime-station-rivers-1.png
            floodsafe-android-app/runtime-station-rivers-2.png
            floodsafe-android-app/runtime-log.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload verified APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-v0.9.00-station-rivers-native
          path: |
            floodsafe-android-app/FloodSafe-Nepal-v0.9.00-station-rivers-native.apk
            floodsafe-android-app/FloodSafe-Nepal-v0.9.00-sha256.txt
          if-no-files-found: error
          retention-days: 14
