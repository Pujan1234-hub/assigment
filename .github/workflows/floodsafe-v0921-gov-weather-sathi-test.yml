name: FloodSafe Nepal v0.9.21 Hybrid OTA My Location Flicker TEST
on:
  push:
    branches:
      - test/floodsafe-v0921-ota-location-tap-flicker-20261029
    paths:
      - '.github/workflows/floodsafe-v0921-gov-weather-sathi-test.yml'
      - 'floodsafe-android-app/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: floodsafe-v0921-ota-location-flicker-isolated-test
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Package full v0.9.21 native content, separate install identity
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=floodsafe-android-app/app/src/main/assets
          mkdir -p "$ASSETS/data" "$ASSETS/floodsafe-nepal"
          cp -a data/. "$ASSETS/data/"
          cp -a floodsafe-nepal/. "$ASSETS/floodsafe-nepal/"
          python3 - <<'PY'
          import json,copy,pathlib
          p=pathlib.Path('floodsafe-android-app/app/google-services.json')
          data=json.loads(p.read_text())
          client=copy.deepcopy(data['client'][0])
          client['client_info']['android_client_info']['package_name']='io.github.pujan1234hub.floodsafe.app.preview'
          data['client'].append(client)
          p.write_text(json.dumps(data))
          PY
      - name: Verify only real native UI launches after original shiny splash
        shell: bash
        run: |
          set -euo pipefail
          JAVA=floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app
          grep -Fq 'new Intent(this, NativeFullActivity.class)' "$JAVA/PJBuiltsSplashActivity.java"
          grep -Fq 'AnimatedNepalWeatherOverlay' "$JAVA/NativeFullActivity.java"
          ! grep -Fq 'new AnimatedNepalWeatherOverlay(this)' "$JAVA/NativeFullActivity.java"
          ! grep -Fq 'new FloodSafeNativeMapView(this' "$JAVA/NativeFullActivity.java"
          grep -Fq 'new FloodSafeNativeMapView(this' "$JAVA/FloodSafeMapActivity.java"
          grep -Fq 'new Intent(this,FloodSafeMapActivity.class)' "$JAVA/NativeFullActivity.java"
          grep -Fq 'OfficialStationFeeds.rainfall()' "$JAVA/NativeFullActivity.java"
          ! grep -Fq 'new NativeRiverMap()' "$JAVA/NativeFullActivity.java"
          ! grep -Fq 'Full river satellite map' "$JAVA/NativeFullActivity.java"
          grep -Fq 'new Intent(this,FloodSafeAdvancedActivity.class)' "$JAVA/NativeFullActivity.java"
          grep -Fq 'NepalRiverBoundary' "$JAVA/FloodSafeNativeMapView.java"
          grep -Fq 'EMERGENCY_FRESH_MS=10L' "$JAVA/NativeFullActivity.java"
          test -s floodsafe-android-app/app/src/main/assets/pjbuilts-original-splash.html
          test -s floodsafe-android-app/app/src/main/assets/district-weather-points.json
          grep -Fq 'content.addView(governmentCard()' "$JAVA/NativeFullActivity.java"
          grep -Fq 'new DistrictWeatherOverlay(this' "$JAVA/FloodSafeMapActivity.java"
          grep -Fq 'new AutoCompleteTextView(this)' "$JAVA/NativeFullActivity.java"
          grep -Fq 'SathiKnowledge.answer' "$JAVA/NativeFullActivity.java"
          grep -Fq 'GovernmentWarningWorker.class' "$JAVA/NativeFullActivity.java"
          grep -Fq 'private void refreshRiverRiskSources()' "$JAVA/FloodSafeNativeMapView.java"
          grep -Fq 'private void startParticles()' "$JAVA/FloodSafeNativeMapView.java"
          grep -Fq 'data/nepal-waterways-tiles/overview.json' "$JAVA/FloodSafeNativeMapView.java"
          grep -Fq 'setWeatherOverlayInvalidator' "$JAVA/FloodSafeMapActivity.java"
          grep -Fq 'GovernmentNotices.valid' "$JAVA/NativeFullActivity.java"
          ! grep -Fq 'content.addView(gyanCard())' "$JAVA/NativeFullActivity.java"
          ! grep -Fq '↻ समाचार पुनः जाँच्नुहोस्' "$JAVA/NativeFullActivity.java"
          grep -Fq 'NEWS_POLL_INTERVAL_MS=60_000L' "$JAVA/NativeFullActivity.java"
          grep -Fq 'sameCurrentNews(out)' "$JAVA/NativeFullActivity.java"
          grep -Fq 'scrollSathiToLatest(messages,history)' "$JAVA/NativeFullActivity.java"
          grep -Fq 'startVoice(history,messages)' "$JAVA/NativeFullActivity.java"
          grep -Fq 'SATELLITE_SOURCE_MAX_ZOOM = 15' "$JAVA/FloodSafeNativeMapView.java"
          grep -Fq 'map.setMaxZoomPreference(CAMERA_MAX_ZOOM)' "$JAVA/FloodSafeNativeMapView.java"
          grep -Fq 'Math.min(CAMERA_MAX_ZOOM, current + delta)' "$JAVA/FloodSafeNativeMapView.java"
          grep -Fq 'positiveThreshold(warn)' "$JAVA/FloodSafeMapActivity.java"
          grep -Fq 'english,false,s.warning,s.danger' "$JAVA/FloodSafeMapActivity.java"
          grep -Fq 'thresholdCard(context' "$JAVA/StationDetailSheet.java"
          grep -Fq 'validThreshold(warningLevel)' "$JAVA/StationDetailSheet.java"
          grep -Fq 'main.postDelayed(this,10000L)' "$JAVA/NativeFullActivity.java"
          grep -Fq 'final List<RiverWay> geometry = new ArrayList<>(rivers)' "$JAVA/FloodSafeNativeMapView.java"
          grep -Fq 'io.execute(() ->' "$JAVA/FloodSafeNativeMapView.java"
          grep -Fq 'setParticleAnimationEnabled' "$JAVA/FloodSafeNativeMapView.java"
          grep -Fq 'AutoCompleteTextView' "$JAVA/NativeFullActivity.java"
          grep -Fq 'GyanKnowledge.answer' "$JAVA/SathiKnowledge.java"
          test -s "$JAVA/GyanKnowledge.java"
          test -s "$JAVA/GyanActivity.java"
          grep -Fq 'polygon.contains(o,a)' "$JAVA/NativeFullActivity.java"
          grep -Fq 'SafeInsets.apply(root)' "$JAVA/FloodSafeMapActivity.java"
          grep -Fq 'SafeInsets.apply(root)' "$JAVA/NativeFullActivity.java"
          grep -Fq 'MAX_RIVERS=2200' "$JAVA/FloodSafeNativeMapView.java"
          grep -Fq 'answerWithOffset' "$JAVA/GyanKnowledge.java"
          grep -Fq 'weatherAnswer' "$JAVA/SathiKnowledge.java"
          grep -Fq 'NewsFeedParser.parse' "$JAVA/NativeFullActivity.java"
          test -s "$JAVA/NewsFeedParser.java"
          test -s "$JAVA/SafeInsets.java"
          grep -Fq 'static final long RECENT_MS=30L*60L*1000L' "$JAVA/NewsFeedParser.java"
          grep -Fq 'showNewsKnowledgeFallback(false)' "$JAVA/NativeFullActivity.java"
          grep -Fq 'FloodSafeRemoteConfig.knowledgeRotateMillis()' "$JAVA/NativeFullActivity.java"
          grep -Fq 'FloodSafeRemoteConfig.refreshAsync' "$JAVA/NativeFullActivity.java"
          grep -Fq 'FloodSafeRemoteConfig.newsLessonAt' "$JAVA/NativeFullActivity.java"
          grep -Fq 'FloodSafeRemoteConfig.answerFAQ' "$JAVA/SathiKnowledge.java"
          grep -Fq 'new PlayStoreUpdateBridge(this)' "$JAVA/NativeFullActivity.java"
          grep -Fq 'com.google.android.play:app-update:2.1.0' floodsafe-android-app/app/build.gradle
          test -s "$JAVA/FloodSafeRemoteConfig.java"
          test -s "$JAVA/PlayStoreUpdateBridge.java"
          grep -Fq 'World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}' "$JAVA/FloodSafeNativeMapView.java"
          grep -Fq 'DistrictWeatherStore.districts(getContext())' "$JAVA/FloodSafeNativeMapView.java"
          grep -Fq 'drawBundledDistrictNames(canvas)' "$JAVA/FloodSafeNativeMapView.java"
          grep -Fq 'districtNamesOverlay.postInvalidateOnAnimation()' "$JAVA/FloodSafeNativeMapView.java"
          grep -Fq 'map.setMaxZoomPreference(CAMERA_MAX_ZOOM)' "$JAVA/FloodSafeNativeMapView.java"
          grep -Fq 'StationDetailSheet.show(this,s.name' "$JAVA/FloodSafeMapActivity.java"
          grep -Fq 'locate.setOnClickListener(v->requestLocation(true))' "$JAVA/NativeFullActivity.java"
          grep -Fq 'boolean sameRecentFix=meters[0]<65f' "$JAVA/NativeFullActivity.java"
          grep -Fq 'version!=weatherRequestVersion' "$JAVA/NativeFullActivity.java"
          grep -Fq 'Math.abs(lat-requestedLat)>0.00065' "$JAVA/NativeFullActivity.java"
          grep -Fq 'Keep the previous weather card visible' "$JAVA/NativeFullActivity.java"
          ! grep -Fq 'miniForecast.setForecast(new JSONObject())' "$JAVA/NativeFullActivity.java"
          grep -Fq 'floodSafetyAnswer' "$JAVA/SathiKnowledge.java"
          grep -Fq 'StationDetailSheet.show' "$JAVA/FloodSafeNativeMapView.java"
          grep -Fq 'StationDetailSheet.show' "$JAVA/FloodSafeMapActivity.java"
          test -s "$JAVA/StationDetailSheet.java"
      - name: Validate remote OTA configuration and HTTPS source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request
          url='https://raw.githubusercontent.com/Pujan1234-hub/assigment/floodsafe-ota-config-v0921/ota/floodsafe-config-v1.json'
          with urllib.request.urlopen(url,timeout=12) as response:
              data=response.read(65537)
          assert len(data)<=65536
          config=json.loads(data)
          assert config['schema']==1 and config['enabled'] is True
          assert config['revision']>=1 and len(config['knowledge'])>=1
          assert 60<=config['news']['poll_seconds']<=900
          assert len(config.get('sathi_faq',[]))>=1
          print('Remote config HTTPS reachable, version',config['revision'])
          PY
      - name: Android native unit tests and compile
        run: gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Validate complete APK file and original river geometry
        shell: bash
        run: |
          set -euo pipefail
          APK=floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK" >/dev/null
          for asset in assets/pjbuilts-original-splash.html assets/data/nepal-waterways-snapshot.json assets/floodsafe-nepal/v25/index.html; do
            unzip -Z -1 "$APK" | grep -Fxq "$asset"
          done
          test "$(stat -c %s "$APK")" -gt 85000000
          cp "$APK" FloodSafe-Nepal-v0.9.21-OTA-LOCATION-FLICKER-FIX-TEST.apk
          sha256sum FloodSafe-Nepal-v0.9.21-OTA-LOCATION-FLICKER-FIX-TEST.apk
          stat -c 'NATIVE_APK_BYTES=%s' FloodSafe-Nepal-v0.9.21-OTA-LOCATION-FLICKER-FIX-TEST.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-v0921-OTA-Location-Flicker-TEST
          path: FloodSafe-Nepal-v0.9.21-OTA-LOCATION-FLICKER-FIX-TEST.apk
          retention-days: 14
          if-no-files-found: error

  smoke:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FloodSafe-v0921-OTA-Location-Flicker-TEST
          path: ./test-apk
      - name: Install native debug and record startup evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 660
          disable-animations: false
          script: |
            set +e
            adb install -r ./test-apk/FloodSafe-Nepal-v0.9.21-OTA-LOCATION-FLICKER-FIX-TEST.apk
            adb logcat -c
            adb shell am start -n io.github.pujan1234hub.floodsafe.app.preview/io.github.pujan1234hub.floodsafe.app.PJBuiltsSplashActivity
            sleep 18
            adb shell dumpsys activity activities > ./activity-state.txt
            adb logcat -d -v brief > ./android-logcat.txt
            adb shell screencap -p /sdcard/floodsafe-native.png
            adb pull /sdcard/floodsafe-native.png ./native-screen.png
            if grep -Fq 'NativeFullActivity' ./activity-state.txt && ! grep -A 12 'FATAL EXCEPTION' ./android-logcat.txt | grep -Fq 'io.github.pujan1234hub.floodsafe.app'; then
              echo "NATIVE_HOME_SCREEN_VERIFIED"
              exit 0
            fi
            echo "STARTUP_NOT_VERIFIED"
            exit 1
      - name: Upload startup diagnostics, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-v0921-OTA-Location-Flicker-Diagnostics
          path: |
            native-screen.png
            activity-state.txt
            android-logcat.txt
          if-no-files-found: ignore
          retention-days: 14

  publish-test:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FloodSafe-v0921-OTA-Location-Flicker-TEST
          path: ./apk
      - name: Publish direct TEST APK without changing production
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=./apk/FloodSafe-Nepal-v0.9.21-OTA-LOCATION-FLICKER-FIX-TEST.apk
          test -s "$APK"
          test "$(stat -c %s "$APK")" -gt 85000000
          unzip -t "$APK" >/dev/null
          unzip -Z -1 "$APK" | grep -Fqx 'assets/pjbuilts-original-splash.html'
          unzip -Z -1 "$APK" | grep -Fqx 'assets/floodsafe-nepal/v25/index.html'
          sha256sum "$APK" > STABILITY-GYAN-SHA256.txt
          TAG=floodsafe-v0921-ota-location-flicker-test-20261029
          NOTES='TEST ONLY. Fix ONLY the Android Home My Current Location tap-induced flicker reported in user video: do not instantly apply a potentially stale cached fix before another GPS callback when location is already known; debounce duplicate taps; prevent redundant Home weather and station redraws for near-identical GPS readings within 90 seconds; avoid old network weather/geocoder responses overwriting the newer location/language; preserve last good seven-day forecast instead of clearing the chart on a temporary error. The initial auto-location behavior remains available. Everything else inherited intact from prior OTA Map Labels test: 77 districts + satellite place labels, source v0.9.21, original cream-gold splash, map, 3D, official river warnings/danger levels, SATHI, News/Gyan, content OTA + optional Play-native updates and existing alert logic. Production app/site are NOT changed. Phone runtime flicker improvement is not certified by unit tests.'
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" STABILITY-GYAN-SHA256.txt --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" STABILITY-GYAN-SHA256.txt -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'FloodSafe Nepal v0.9.21 OTA My Location Tap Flicker Fix TEST' --notes "$NOTES" --prerelease --latest=false
          fi
