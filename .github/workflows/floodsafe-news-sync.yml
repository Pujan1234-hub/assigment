name: FloodSafe Three Source Live News Sync
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/floodsafe-news-sync-v2.py'
      - '.github/workflows/floodsafe-news-sync.yml'
permissions:
  contents: write
concurrency:
  group: floodsafe-news-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install news parser dependencies
        run: pip install --quiet requests beautifulsoup4
      - name: Fetch RONB Radio Nepal and News24 Nepal
        run: python3 scripts/floodsafe-news-sync-v2.py
      - name: Validate three source contract
        run: |
          python3 - <<'PY'
          import json
          j=json.load(open('data/floodsafe-news.json',encoding='utf-8'))
          want=['RONB Post','Radio Nepal','News24 Nepal']
          assert j.get('allowed_sources') == want, j.get('allowed_sources')
          assert j.get('latest_window_minutes') == 10
          assert j.get('archive_window_minutes') == 20
          assert j.get('max_age_minutes') == 30
          assert isinstance(j.get('items'),list)
          bad=sorted({x.get('source') for x in j['items'] if x.get('source') not in want})
          assert not bad,bad
          print('news items',len(j['items']))
          print('source status',j.get('sources'))
          PY
      - name: Commit changed snapshot
        shell: bash
        run: |
          set -e
          if git diff --quiet -- data/floodsafe-news.json; then echo 'No news snapshot change'; exit 0; fi
          git config user.name 'FloodSafe news sync'
          git config user.email 'actions@users.noreply.github.com'
          git add data/floodsafe-news.json
          git commit -m '[auto] refresh FloodSafe three-source live news'
          git pull --rebase origin main
          git push origin HEAD:main
