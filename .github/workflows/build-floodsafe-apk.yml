name: Build FloodSafe APK

on:
  push:
    branches: [ main ]
    paths:
      - 'floodsafe-nepal/**'
      - 'floodsafe-android-app/**'
      - '.github/workflows/build-floodsafe-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply FloodSafe safety and native-app patches
        run: |
          python3 floodsafe-android-app/patch_webview_crash.py
          python3 floodsafe-android-app/patch_launcher_reopen_hard_reset.py
          python3 floodsafe-android-app/patch_auto_alerts.py
          python3 floodsafe-android-app/patch_river_waterlevel.py
          python3 floodsafe-android-app/patch_two_hour_weather.py
          python3 floodsafe-android-app/patch_cold_start_blank.py
          python3 floodsafe-android-app/patch_cross_device_navigation.py
          python3 floodsafe-android-app/patch_native_compat_fallback.py
          python3 floodsafe-android-app/patch_map_smooth_v075.py
          python3 floodsafe-android-app/patch_full_native_v080.py
          python3 floodsafe-android-app/patch_native_v081_polish.py
          python3 floodsafe-android-app/patch_native_v081_escape_fix.py
          python3 floodsafe-android-app/patch_native_maplibre_v082.py
          python3 floodsafe-android-app/patch_native_map_detail_v083.py
          python3 floodsafe-android-app/patch_native_v084_sathi_map.py
          python3 floodsafe-android-app/patch_native_v085_flow_sathi.py
          python3 floodsafe-android-app/patch_native_v086_full_waterways.py
          python3 floodsafe-android-app/patch_native_v087_runtime_rivers.py
          python3 floodsafe-android-app/patch_native_v088_restore_web_rivers.py
          python3 floodsafe-android-app/patch_native_v089_realtime_gauges.py
          python3 floodsafe-android-app/patch_native_v0810_live_source_colours.py

      - name: Verify locked safety and v0.8.10 native requirements
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'RADIUS_KM = 2d' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/RiverAlertWorker.java
          grep -Fq 'DEFAULT_RIVER_RADIUS_KM = 2d' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeMessagingService.java
          grep -Fq 'WEATHER_DIGEST_INTERVAL_MS = 2L * 60L * 60L * 1000L' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/RainAlertWorker.java
          grep -Fq 'smart_weather_updates_v3' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/RainAlertWorker.java
          grep -Fq 'ACCESS_BACKGROUND_LOCATION' floodsafe-android-app/app/src/main/AndroidManifest.xml
          grep -Fq 'android:name=".NativeFullActivity"' floodsafe-android-app/app/src/main/AndroidManifest.xml
          grep -Fq 'new Intent(this, NativeFullActivity.class)' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/PJBuiltsSplashActivity.java
          grep -Fq 'new Intent(this, NativeFullActivity.class)' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/SathiWakeService.java
          grep -Fq 'private FloodSafeNativeMapView map;' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/NativeFullActivity.java
          grep -Fq '100% native Android river map using MapLibre Native. No WebView is used.' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java
          grep -Fq 'requestDisallowInterceptTouchEvent(true)' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java
          grep -Fq 'data/nepal-waterways-snapshot.json' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java
          grep -Fq 'all.size() > 1400' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java
          grep -Fq 'trimRiverToNepalBBox(rw)' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java
          grep -Fq 'lineColor("#003a4b"), lineWidth(6.2f)' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java
          grep -Fq 'lineColor("#7f939c"), lineWidth(2.45f)' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java
          grep -Fq 'lineColor("#bdfbff"), lineWidth(1.05f)' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java
          grep -Fq 'Math.min(320, rivers.size())' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java
          grep -Fq 'refreshVisibleRiverTiles' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java
          grep -Fq 'readRiverTile' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java
          grep -Fq 'fs-river-flow-trace' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java
          grep -Fq 'fs-flow-particles-layer' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java
          grep -Fq 'stationGeoImportant(snapshot)' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java
          grep -Fq 'fs-district-labels' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java
          grep -Fq 'fs-river-labels-layer' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java
          grep -Fq 'BIPAD+"river-trimed/?limit=1000' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/NativeFullActivity.java
          grep -Fq 'BIPAD+"rain-trimed/?limit=1000' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/NativeFullActivity.java
          grep -Fq 'BIPAD+"river/?limit=1000' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/NativeFullActivity.java
          grep -Fq 'BIPAD+"rain/?limit=1000' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/NativeFullActivity.java
          grep -Fq 'RIVER_FRESH_MS=10L*60L*1000L' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/NativeFullActivity.java
          grep -Fq 'RAIN_FRESH_MS=30L*60L*1000L' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/NativeFullActivity.java
          grep -Fq 'main.postDelayed(livePoll,60_000L)' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/NativeFullActivity.java
          grep -Fq 'map.setRainStations' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/NativeFullActivity.java
          grep -Fq 'rawStatus=rs' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/NativeFullActivity.java
          grep -Fq 'fs-rain-normal-layer' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java
          grep -Fq 'directGaugeFor' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java
          grep -Fq 'fs-river-normal-status-layer' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java
          grep -Fq 'fs-river-alert-status-layer' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java
          grep -Fq 'fs-river-warning-status-layer' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java
          grep -Fq 'fs-river-danger-status-layer' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java
          grep -Fq 'refreshRiverStatusSources' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java
          grep -Fq '"#f4feff", 4.0f, 1.0f' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java
          if grep -Fq 'fs-nepal-mask-layer' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java; then echo 'Invalid diagonal Nepal mask remained'; exit 1; fi
          if grep -Fq 'android.webkit.WebView' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java; then echo 'Native map must not use WebView'; exit 1; fi
          grep -Fq 'versionCode 30' floodsafe-android-app/app/build.gradle
          grep -Fq "versionName '0.8.10'" floodsafe-android-app/app/build.gradle

      - name: Bundle verified Android assets
        run: gradle -p floodsafe-android-app clean :app:bundleFloodSafe --no-daemon

      - name: Optimize retained web assets
        run: |
          python3 floodsafe-android-app/patch_low_end_sathi.py
          python3 floodsafe-android-app/patch_low_end_map.py

      - name: Build and unit test full native APK
        run: gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug -x bundleFloodSafe --no-daemon --stacktrace

      - name: Verify APK exists and native assets packaged
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-waterways-snapshot.json'
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-waterways-tiles/overview.json'
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-waterways-tiles/10-0.json'
          unzip -l "$APK" | grep -Fq 'assets/floodsafe-nepal/v24/nepal-districts.geojson'

      - name: Rename APK
        run: cp floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk FloodSafe-Nepal-v0.8.10-LIVE-BIPAD-COLOURS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-APK
          path: FloodSafe-Nepal-v0.8.10-LIVE-BIPAD-COLOURS.apk
          if-no-files-found: error
          retention-days: 14
