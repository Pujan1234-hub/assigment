name: FloodSafe Nepal v0.9.21 30min News Auto Gyan SATHI Premium Station TEST
on:
  push:
    branches:
      - test/floodsafe-v0921-30min-gyan-station-sathi-20261029
    paths:
      - '.github/workflows/floodsafe-v0921-gov-weather-sathi-test.yml'
      - 'floodsafe-android-app/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: floodsafe-v0921-30min-gyan-station-sathi-isolated-test
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Package full v0.9.21 native content, separate install identity
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=floodsafe-android-app/app/src/main/assets
          mkdir -p "$ASSETS/data" "$ASSETS/floodsafe-nepal"
          cp -a data/. "$ASSETS/data/"
          cp -a floodsafe-nepal/. "$ASSETS/floodsafe-nepal/"
          python3 - <<'PY'
          import json,copy,pathlib
          p=pathlib.Path('floodsafe-android-app/app/google-services.json')
          data=json.loads(p.read_text())
          client=copy.deepcopy(data['client'][0])
          client['client_info']['android_client_info']['package_name']='io.github.pujan1234hub.floodsafe.app.preview'
          data['client'].append(client)
          p.write_text(json.dumps(data))
          PY
      - name: Verify only real native UI launches after original shiny splash
        shell: bash
        run: |
          set -euo pipefail
          JAVA=floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app
          grep -Fq 'new Intent(this, NativeFullActivity.class)' "$JAVA/PJBuiltsSplashActivity.java"
          grep -Fq 'AnimatedNepalWeatherOverlay' "$JAVA/NativeFullActivity.java"
          ! grep -Fq 'new AnimatedNepalWeatherOverlay(this)' "$JAVA/NativeFullActivity.java"
          ! grep -Fq 'new FloodSafeNativeMapView(this' "$JAVA/NativeFullActivity.java"
          grep -Fq 'new FloodSafeNativeMapView(this' "$JAVA/FloodSafeMapActivity.java"
          grep -Fq 'new Intent(this,FloodSafeMapActivity.class)' "$JAVA/NativeFullActivity.java"
          grep -Fq 'OfficialStationFeeds.rainfall()' "$JAVA/NativeFullActivity.java"
          ! grep -Fq 'new NativeRiverMap()' "$JAVA/NativeFullActivity.java"
          ! grep -Fq 'Full river satellite map' "$JAVA/NativeFullActivity.java"
          grep -Fq 'new Intent(this,FloodSafeAdvancedActivity.class)' "$JAVA/NativeFullActivity.java"
          grep -Fq 'NepalRiverBoundary' "$JAVA/FloodSafeNativeMapView.java"
          grep -Fq 'EMERGENCY_FRESH_MS=10L' "$JAVA/NativeFullActivity.java"
          test -s floodsafe-android-app/app/src/main/assets/pjbuilts-original-splash.html
          test -s floodsafe-android-app/app/src/main/assets/district-weather-points.json
          grep -Fq 'content.addView(governmentCard()' "$JAVA/NativeFullActivity.java"
          grep -Fq 'new DistrictWeatherOverlay(this' "$JAVA/FloodSafeMapActivity.java"
          grep -Fq 'new AutoCompleteTextView(this)' "$JAVA/NativeFullActivity.java"
          grep -Fq 'SathiKnowledge.answer' "$JAVA/NativeFullActivity.java"
          grep -Fq 'GovernmentWarningWorker.class' "$JAVA/NativeFullActivity.java"
          grep -Fq 'private void refreshRiverRiskSources()' "$JAVA/FloodSafeNativeMapView.java"
          grep -Fq 'private void startParticles()' "$JAVA/FloodSafeNativeMapView.java"
          grep -Fq 'data/nepal-waterways-tiles/overview.json' "$JAVA/FloodSafeNativeMapView.java"
          grep -Fq 'setWeatherOverlayInvalidator' "$JAVA/FloodSafeMapActivity.java"
          grep -Fq 'GovernmentNotices.valid' "$JAVA/NativeFullActivity.java"
          grep -Fq 'main.post(gyanTick)' "$JAVA/NativeFullActivity.java"
          grep -Fq 'main.postDelayed(this,10000L)' "$JAVA/NativeFullActivity.java"
          grep -Fq 'final List<RiverWay> geometry = new ArrayList<>(rivers)' "$JAVA/FloodSafeNativeMapView.java"
          grep -Fq 'io.execute(() ->' "$JAVA/FloodSafeNativeMapView.java"
          grep -Fq 'setParticleAnimationEnabled' "$JAVA/FloodSafeNativeMapView.java"
          grep -Fq 'AutoCompleteTextView' "$JAVA/NativeFullActivity.java"
          grep -Fq 'GyanKnowledge.answer' "$JAVA/SathiKnowledge.java"
          test -s "$JAVA/GyanKnowledge.java"
          test -s "$JAVA/GyanActivity.java"
          grep -Fq 'polygon.contains(o,a)' "$JAVA/NativeFullActivity.java"
          grep -Fq 'SafeInsets.apply(root)' "$JAVA/FloodSafeMapActivity.java"
          grep -Fq 'SafeInsets.apply(root)' "$JAVA/NativeFullActivity.java"
          grep -Fq 'MAX_RIVERS=2200' "$JAVA/FloodSafeNativeMapView.java"
          grep -Fq 'answerWithOffset' "$JAVA/GyanKnowledge.java"
          grep -Fq 'weatherAnswer' "$JAVA/SathiKnowledge.java"
          grep -Fq 'NewsFeedParser.parse' "$JAVA/NativeFullActivity.java"
          test -s "$JAVA/NewsFeedParser.java"
          test -s "$JAVA/SafeInsets.java"
          grep -Fq 'static final long RECENT_MS=30L*60L*1000L' "$JAVA/NewsFeedParser.java"
          grep -Fq 'showNewsKnowledgeFallback(false)' "$JAVA/NativeFullActivity.java"
          grep -Fq 'main.postDelayed(newsKnowledgeTick,10500L)' "$JAVA/NativeFullActivity.java"
          grep -Fq 'floodSafetyAnswer' "$JAVA/SathiKnowledge.java"
          grep -Fq 'StationDetailSheet.show' "$JAVA/FloodSafeNativeMapView.java"
          grep -Fq 'StationDetailSheet.show' "$JAVA/FloodSafeMapActivity.java"
          test -s "$JAVA/StationDetailSheet.java"
      - name: Android native unit tests and compile
        run: gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Validate complete APK file and original river geometry
        shell: bash
        run: |
          set -euo pipefail
          APK=floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK" >/dev/null
          for asset in assets/pjbuilts-original-splash.html assets/data/nepal-waterways-snapshot.json assets/floodsafe-nepal/v25/index.html; do
            unzip -Z -1 "$APK" | grep -Fxq "$asset"
          done
          test "$(stat -c %s "$APK")" -gt 85000000
          cp "$APK" FloodSafe-Nepal-v0.9.21-30MIN-GYAN-STATION-SATHI-TEST.apk
          sha256sum FloodSafe-Nepal-v0.9.21-30MIN-GYAN-STATION-SATHI-TEST.apk
          stat -c 'NATIVE_APK_BYTES=%s' FloodSafe-Nepal-v0.9.21-30MIN-GYAN-STATION-SATHI-TEST.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-v0921-30min-Gyan-Station-Sathi-TEST
          path: FloodSafe-Nepal-v0.9.21-30MIN-GYAN-STATION-SATHI-TEST.apk
          retention-days: 14
          if-no-files-found: error

  smoke:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FloodSafe-v0921-30min-Gyan-Station-Sathi-TEST
          path: ./test-apk
      - name: Install native debug and record startup evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 660
          disable-animations: false
          script: |
            set +e
            adb install -r ./test-apk/FloodSafe-Nepal-v0.9.21-30MIN-GYAN-STATION-SATHI-TEST.apk
            adb logcat -c
            adb shell am start -n io.github.pujan1234hub.floodsafe.app.preview/io.github.pujan1234hub.floodsafe.app.PJBuiltsSplashActivity
            sleep 18
            adb shell dumpsys activity activities > ./activity-state.txt
            adb logcat -d -v brief > ./android-logcat.txt
            adb shell screencap -p /sdcard/floodsafe-native.png
            adb pull /sdcard/floodsafe-native.png ./native-screen.png
            if grep -Fq 'NativeFullActivity' ./activity-state.txt && ! grep -A 12 'FATAL EXCEPTION' ./android-logcat.txt | grep -Fq 'io.github.pujan1234hub.floodsafe.app'; then
              echo "NATIVE_HOME_SCREEN_VERIFIED"
              exit 0
            fi
            echo "STARTUP_NOT_VERIFIED"
            exit 1
      - name: Upload startup diagnostics, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-v0921-30min-Gyan-Station-Sathi-Diagnostics
          path: |
            native-screen.png
            activity-state.txt
            android-logcat.txt
          if-no-files-found: ignore
          retention-days: 14

  publish-test:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FloodSafe-v0921-30min-Gyan-Station-Sathi-TEST
          path: ./apk
      - name: Publish direct TEST APK without changing production
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=./apk/FloodSafe-Nepal-v0.9.21-30MIN-GYAN-STATION-SATHI-TEST.apk
          test -s "$APK"
          test "$(stat -c %s "$APK")" -gt 85000000
          unzip -t "$APK" >/dev/null
          unzip -Z -1 "$APK" | grep -Fqx 'assets/pjbuilts-original-splash.html'
          unzip -Z -1 "$APK" | grep -Fqx 'assets/floodsafe-nepal/v25/index.html'
          sha256sum "$APK" > STABILITY-GYAN-SHA256.txt
          TAG=floodsafe-v0921-30min-gyan-station-sathi-test-20261029
          NOTES='TEST ONLY. Native full 0.9.21 assets and PUJAN/PJBUILTS cream-gold intro kept. Strict 30-minute published-at news lock restored: older and undated news are never displayed. When no fresh news is available or the feed is unavailable, automatically cycle existing curated Knowledge lessons inside the same news section; restore fresh news automatically. SATHI now recognizes Romanised Nepali flood emergency questions with practical multi-step guidance and non-repeating answers, and Kathmandu river questions use district records. Map official gauge and river details use an attractive immediate native bottom sheet with source, freshness and measured water level, and nearest river tap uses a cached bounding box to reduce delay. Preview APK only, no production edits. APK compile and package tests do not certify device runtime.'
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" STABILITY-GYAN-SHA256.txt --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" STABILITY-GYAN-SHA256.txt -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'FloodSafe Nepal v0.9.21 30-Minute News Gyan Auto Fallback + SATHI + Station Details TEST' --notes "$NOTES" --prerelease --latest=false
          fi
