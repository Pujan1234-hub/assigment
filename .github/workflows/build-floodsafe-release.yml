name: Build FloodSafe Signed Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'floodsafe-nepal/**'
      - 'floodsafe-android-app/**'
      - 'data/**'
      - '.github/workflows/build-floodsafe-release.yml'

permissions:
  contents: read

concurrency:
  group: floodsafe-signed-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FLOODSAFE_KEYSTORE_PATH: /tmp/floodsafe-upload.jks
      FLOODSAFE_KEYSTORE_PASSWORD: ${{ secrets.FLOODSAFE_KEYSTORE_PASSWORD }}
      FLOODSAFE_KEY_ALIAS: ${{ secrets.FLOODSAFE_KEY_ALIAS }}
      FLOODSAFE_KEY_PASSWORD: ${{ secrets.FLOODSAFE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Apply latest native FloodSafe patches
        shell: bash
        run: |
          set -euo pipefail
          python3 floodsafe-android-app/patch_webview_crash.py
          python3 floodsafe-android-app/patch_launcher_reopen_hard_reset.py
          python3 floodsafe-android-app/patch_auto_alerts.py
          python3 floodsafe-android-app/patch_river_waterlevel.py
          python3 floodsafe-android-app/patch_two_hour_weather.py
          python3 floodsafe-android-app/patch_cold_start_blank.py
          python3 floodsafe-android-app/patch_cross_device_navigation.py
          python3 floodsafe-android-app/patch_native_compat_fallback.py
          python3 floodsafe-android-app/patch_map_smooth_v075.py
          python3 floodsafe-android-app/patch_full_native_v080.py
          python3 floodsafe-android-app/patch_native_v081_polish.py
          python3 floodsafe-android-app/patch_native_v081_escape_fix.py
          python3 floodsafe-android-app/patch_native_maplibre_v082.py
          python3 floodsafe-android-app/patch_native_map_detail_v083.py
          python3 floodsafe-android-app/patch_native_v084_sathi_map.py
          python3 floodsafe-android-app/patch_native_v085_flow_sathi.py
          python3 floodsafe-android-app/patch_native_v086_full_waterways.py
          python3 floodsafe-android-app/patch_native_v087_runtime_rivers.py
          python3 floodsafe-android-app/patch_native_v088_restore_web_rivers.py
          python3 floodsafe-android-app/patch_native_v089_realtime_gauges.py
          python3 floodsafe-android-app/patch_native_v0810_live_source_colours.py
          python3 floodsafe-android-app/patch_native_v0811_nepal_clean_progressive_map.py
          python3 floodsafe-android-app/patch_native_v0812_anr_fix.py
          python3 floodsafe-android-app/patch_native_v0813_official_complete.py

      - name: Verify v0.8.13 official realtime contract
        shell: bash
        run: |
          set -euo pipefail
          A='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/NativeFullActivity.java'
          M='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java'
          B='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodLiveGaugeMonitor.java'
          grep -Fq 'river-stations/?limit=2000' "$A"
          grep -Fq 'river-stations/?latest=true&limit=2000' "$A"
          grep -Fq 'rain-stations/?limit=2000' "$A"
          grep -Fq 'flood-station/?limit=2000' "$A"
          grep -Fq 'streamflow/?limit=2000' "$A"
          grep -Fq 'station-location/?limit=2000' "$A"
          grep -Fq 'main.postDelayed(this,5_000L)' "$A"
          grep -Fq 'Nearest official rainfall/AWS' "$M"
          grep -Fq 'Discharge / streamflow' "$M"
          grep -Fq 'LATEST OFFICIAL • STALE' "$M"
          grep -Fq 'handler.postDelayed(this,1_000L)' "$B"
          grep -Fq 'ALERT_FRESH_MS=10L*60L*1000L' "$B"
          grep -Fq 'RADIUS_KM=2d' "$B"
          grep -Fq 'versionCode 33' floodsafe-android-app/app/build.gradle
          grep -Fq "versionName '0.8.13'" floodsafe-android-app/app/build.gradle
          grep -Fq 'android:name=".NativeFullActivity"' floodsafe-android-app/app/src/main/AndroidManifest.xml
          echo 'v0.8.13 official realtime contract PASS'

      - name: Bundle verified Android assets
        run: /tmp/gradle-8.11.1/bin/gradle -p floodsafe-android-app clean :app:bundleFloodSafe --no-daemon

      - name: Optimize retained web assets
        run: |
          python3 floodsafe-android-app/patch_low_end_sathi.py
          python3 floodsafe-android-app/patch_low_end_map.py

      - name: Prepare existing release signing key when configured
        env:
          FLOODSAFE_KEYSTORE_BASE64: ${{ secrets.FLOODSAFE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$FLOODSAFE_KEYSTORE_BASE64" ] && [ -n "$FLOODSAFE_KEYSTORE_PASSWORD" ] && [ -n "$FLOODSAFE_KEY_ALIAS" ] && [ -n "$FLOODSAFE_KEY_PASSWORD" ]; then
            printf '%s' "$FLOODSAFE_KEYSTORE_BASE64" | base64 --decode > "$FLOODSAFE_KEYSTORE_PATH"
            chmod 600 "$FLOODSAFE_KEYSTORE_PATH"
            keytool -list -keystore "$FLOODSAFE_KEYSTORE_PATH" -storepass "$FLOODSAFE_KEYSTORE_PASSWORD" -alias "$FLOODSAFE_KEY_ALIAS" >/dev/null
            echo 'Existing release signing key loaded.'
          else
            echo 'No repository release key configured; building unsigned release for secure offline signing.'
          fi

      - name: Build release APK and AAB
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          /tmp/gradle-8.11.1/bin/gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease -x bundleFloodSafe --no-daemon --stacktrace

      - name: Verify and stage release artifacts
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          mkdir -p release-output
          APK="$(find floodsafe-android-app/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)"
          AAB="$(find floodsafe-android-app/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -1)"
          test -n "$APK" && test -s "$APK"
          test -n "$AAB" && test -s "$AAB"
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-waterways-snapshot.json'
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-waterways-tiles/overview.json'
          unzip -l "$APK" | grep -Fq 'assets/floodsafe-nepal/v24/nepal-districts.geojson'
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" >/tmp/apkverify.txt 2>&1; then
            cp "$APK" release-output/FloodSafe-Nepal-v0.8.13-SIGNED.apk
            cp "$AAB" release-output/FloodSafe-Nepal-v0.8.13-SIGNED.aab
            echo signed > release-output/signing-state.txt
            cat /tmp/apkverify.txt
          else
            cp "$APK" release-output/FloodSafe-Nepal-v0.8.13-UNSIGNED.apk
            cp "$AAB" release-output/FloodSafe-Nepal-v0.8.13-UNSIGNED.aab
            echo unsigned > release-output/signing-state.txt
          fi
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" release-output/apksigner.jar
          sha256sum "$APK" "$AAB" > release-output/unsigned-or-ci-signed-sha256.txt
          printf 'versionName=0.8.13\nversionCode=33\ncommit=%s\n' "$GITHUB_SHA" > release-output/build-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-v0.8.13-Release
          path: release-output/
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$FLOODSAFE_KEYSTORE_PATH"
