name: FloodSafe Nepal owner-controlled service notifications
on:
  push:
    branches: [main]
    paths: ['.github/workflows/floodsafe-admin-notice-push.yml']
  workflow_dispatch:
    inputs:
      audience:
        description: 'One configured owner device, preview devices, or confirmed broadcast'
        type: choice
        options:
          - device
          - preview
          - all
        default: device
        required: true
      title_ne:
        description: 'Nepali notification title'
        type: string
        required: true
      body_ne:
        description: 'Nepali notification text'
        type: string
        required: true
      title_en:
        description: 'English notification title'
        type: string
        required: true
      body_en:
        description: 'English notification text'
        type: string
        required: true
      confirm_broadcast:
        description: 'For all subscribers, type SEND NON-EMERGENCY PUSH to confirm'
        type: string
        required: false

permissions:
  contents: read
concurrency:
  group: floodsafe-manual-service-notice
  cancel-in-progress: false
jobs:
  notify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deliver validated app notice through Firebase (never an emergency alert)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          AUDIENCE: ${{ inputs.audience }}
          OWNER_TEST_DEVICE: ${{ secrets.FLOODSAFE_OWNER_TEST_FCM_TOKEN }}
          TITLE_NE: ${{ inputs.title_ne }}
          BODY_NE: ${{ inputs.body_ne }}
          TITLE_EN: ${{ inputs.title_en }}
          BODY_EN: ${{ inputs.body_en }}
          CONFIRM_BROADCAST: ${{ inputs.confirm_broadcast }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet google-auth requests
          python3 - <<'PY'
          import json,os,sys,re,requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          audience=os.environ.get('AUDIENCE')
          if audience not in ('device','preview','all'):sys.exit('Invalid audience; no message sent')
          device=os.environ.get('OWNER_TEST_DEVICE','').strip() if audience=='device' else ''
          if audience=='device' and not re.fullmatch(r'[A-Za-z0-9_:\-]{20,4096}',device):
              sys.exit('Owner test device is not configured; no message sent. No broadcast fallback.')
          # A Play beta install subscribes to nepal-alerts, NOT floodsafe-testers.
          # An explicit approval is required each time for all-device broadcast.
          if audience=='all' and os.environ.get('CONFIRM_BROADCAST','')!='SEND NON-EMERGENCY PUSH':
              sys.exit('All-subscribers broadcast blocked: explicit confirmation missing')
          title_ne=os.environ.get('TITLE_NE','').strip()
          title_en=os.environ.get('TITLE_EN','').strip()
          body_ne=os.environ.get('BODY_NE','').strip()
          body_en=os.environ.get('BODY_EN','').strip()
          if any(not s or len(s)>limit for s,limit in (
              (title_ne,90),(title_en,90),(body_ne,500),(body_en,500))):
              sys.exit('Both languages are required within safe lengths')
          raw=os.environ.get('FIREBASE_SERVICE_ACCOUNT','').strip()
          if not raw:sys.exit('FIREBASE_SERVICE_ACCOUNT not configured: no message sent')
          service=json.loads(raw)
          if service.get('project_id')!='floodsafe-nepal':
              sys.exit('Wrong Firebase project. Expected floodsafe-nepal; no message sent')
          if not service.get('client_email','').endswith('.gserviceaccount.com'):
              sys.exit('Invalid Firebase service account; no message sent')
          creds=service_account.Credentials.from_service_account_info(
              service,scopes=['https://www.googleapis.com/auth/firebase.messaging'])
          creds.refresh(Request())
          # No source URLs, authority impersonation or remote executable payloads.
          title='ℹ️ '+title_ne+' / '+title_en
          body=body_ne+'\n'+body_en
          if len(title)>180 or len(body)>1050:sys.exit('Combined notification too long; shorten both languages')
          if audience=='device':
              target={'token':device}
              title='TEST · '+title
              android={'priority':'high','ttl':'60s'}
          else:
              target={'topic':'floodsafe-testers' if audience=='preview' else 'nepal-alerts'}
              android={'priority':'high','ttl':'1800s'}
          payload={'message':{**target,
              'data':{'kind':'app_notice','title':title,'body':body},
              'android':android}}
          url=f"https://fcm.googleapis.com/v1/projects/{service['project_id']}/messages:send"
          r=requests.post(url,headers={
              'Authorization':'Bearer '+creds.token,'Content-Type':'application/json'
          },json=payload,timeout=20)
          if not r.ok:sys.exit('Firebase rejected the request (HTTP %d); no fallback sent'%r.status_code)
          print(json.dumps({'submitted':True,'audience':audience,
              'target_project':'floodsafe-nepal',
              'kind':'app_notice','fcm_accepted':True,'delivery_confirmed':False}))
          PY

  validate-push-workflow:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that push is informational and guarded
        run: |
          set -euo pipefail
          grep -q "kind':'app_notice'" .github/workflows/floodsafe-admin-notice-push.yml
          grep -q "SEND NON-EMERGENCY PUSH" .github/workflows/floodsafe-admin-notice-push.yml
          grep -q "if: github.event_name == 'workflow_dispatch'" .github/workflows/floodsafe-admin-notice-push.yml
          echo 'Only explicit manual dispatch sends notifications'
