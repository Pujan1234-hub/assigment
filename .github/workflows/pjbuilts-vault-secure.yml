name: PJBUILTS Vault Android APK
on:
  push:
    branches:
      - pjbuilts-vault-secure-build
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unpack secure vault source
        run: |
          mkdir -p vault-android
          base64 -d vault-project.tar.gz.b64 | tar -xz -C vault-android
      - name: Build installable APK
        run: cd vault-android && gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PJBUILTS-Vault-v2.0.0-SECURE-APK
          path: vault-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
