name: Build FloodSafe In-App APK
on:
  push:
    branches: ['build/floodsafe-inapp-apk-20260902']
    paths: ['floodsafe-android-app/**', '.github/workflows/build-floodsafe-inapp.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22.14.0'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - uses: android-actions/setup-android@v3
      - name: SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Existing web regression tests
        run: node --test tests/gps-rain.test.cjs tests/floodsafe-refresh.test.cjs tests/river-sync-latency.test.cjs
      - name: Build and validate Android app
        working-directory: floodsafe-android-app
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Collect signed APK
        run: |
          mkdir -p apk-output
          cp floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk apk-output/FloodSafe-Nepal-App.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs apk-output/FloodSafe-Nepal-App.apk | tee apk-output/signature.txt
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging apk-output/FloodSafe-Nepal-App.apk > apk-output/package.txt
          cd apk-output
          sha256sum FloodSafe-Nepal-App.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-InApp
          path: apk-output/*
          if-no-files-found: error
          retention-days: 30
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 offline app smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            cd floodsafe-android-app && gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-InApp-test-reports
          path: floodsafe-android-app/app/build/reports/
          if-no-files-found: ignore
