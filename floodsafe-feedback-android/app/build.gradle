plugins { id 'com.android.application'; id 'com.google.gms.google-services' }
android {
 namespace 'com.pjbuilts.floodsafefeedback'
 compileSdk 35
 defaultConfig { applicationId 'com.pjbuilts.floodsafefeedback'; minSdk 26; targetSdk 34; versionCode 6; versionName '1.0.5' }
 buildTypes { release { minifyEnabled false; debuggable false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 lint { abortOnError true }
}

dependencies { implementation 'com.google.firebase:firebase-messaging:24.1.2' }
