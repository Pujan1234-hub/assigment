name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "sw.js"
      - "fixcheck/**"
      - "team-tracker/**"
      - ".github/workflows/fixcheck-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare public site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp sw.js _site/sw.js
          cp -R fixcheck _site/fixcheck
          cp -R team-tracker _site/team-tracker
          python - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          s=p.read_text()
          old='<div class="actions"><a class="btn primary" href="#teamtracker">View product details</a></div>'
          new='<div class="actions"><a class="btn primary" href="#teamtracker">View product details</a><a class="btn" href="./team-tracker/">Open Team Tracker web app ↗</a></div>'
          if old in s:
              s=s.replace(old,new,1)
          marker='<p class="lead" style="font-size:17px">A workforce coordination prototype for teams that need a simple way to see who is active, understand operational status and move assigned work from request to completion.</p>'
          if marker in s:
              s=s.replace(marker,marker+'<div class="actions"><a class="btn primary" href="./team-tracker/">Launch Team Tracker web app ↗</a></div>',1)
          p.write_text(s)
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload portfolio
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
