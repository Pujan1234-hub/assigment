plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def releaseKeystorePath = System.getenv('FLOODSAFE_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('FLOODSAFE_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('FLOODSAFE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('FLOODSAFE_KEY_PASSWORD')
def hasReleaseSigning = [
        releaseKeystorePath,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword
].every { it != null && !it.trim().isEmpty() }

android {
    namespace 'io.github.pujan1234hub.floodsafe.app'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.pujan1234hub.floodsafe.app'
        minSdk 26
        targetSdk 36
        versionCode 15
        versionName '0.8.98-native'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/floodsafe-assets'))
    lint { abortOnError = true }
}

def generatedFloodSafeAssets = layout.buildDirectory.dir('generated/floodsafe-assets')

def bundleNativeAssets = tasks.register('bundleNativeAssets', Copy) {
    doFirst { delete generatedFloodSafeAssets.get().asFile }

    from(rootProject.file('../floodsafe-nepal')) {
        into 'floodsafe-nepal'
        include 'v24/nepal-districts.geojson'
        include 'v24/nepal-districts.json'
    }

    from(rootProject.file('../data')) {
        into 'data'
        include '**/*.json'
        include '**/*.geojson'
    }

    includeEmptyDirs = false
    into(generatedFloodSafeAssets)

    doLast {
        def forbiddenExtensions = ['.html', '.js', '.mjs', '.webmanifest']
        def forbidden = fileTree(generatedFloodSafeAssets).files.findAll { f ->
            forbiddenExtensions.any { ext -> f.name.toLowerCase().endsWith(ext) }
        }
        if (!forbidden.isEmpty()) {
            throw new GradleException("Web assets leaked into native package: ${forbidden}")
        }

        def districts = new File(generatedFloodSafeAssets.get().asFile,
                'floodsafe-nepal/v24/nepal-districts.geojson')
        def overview = new File(generatedFloodSafeAssets.get().asFile,
                'data/nepal-waterways-tiles/overview.json')
        if (!districts.isFile()) throw new GradleException('Native district GeoJSON missing')
        if (!overview.isFile()) throw new GradleException('Native river overview JSON missing')
        println 'FloodSafe native assets PASS: JSON/GeoJSON only'
    }
}

tasks.named('preBuild').configure { dependsOn bundleNativeAssets }

dependencies {
    implementation 'com.google.firebase:firebase-messaging:24.1.1'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'org.maplibre.gl:android-sdk-opengl:13.6.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
