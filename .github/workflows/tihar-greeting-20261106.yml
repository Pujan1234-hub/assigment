name: Kukur Tihar greeting - 2026 only
on:
  schedule:
    # 2026-11-08 07:00 Asia/Kathmandu = 2026-11-08 01:15 UTC
    - cron: '15 1 8 11 *'

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send one-time Kukur Tihar greeting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python -m pip install --quiet google-auth requests
          python - <<'PY'
          import datetime, json, os, requests, sys
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          now = datetime.datetime.now(datetime.timezone.utc)
          if now.date().isoformat() != "2026-11-08":
              print("Skipping: this notification is only for 8 November 2026.")
              sys.exit(0)

          raw = os.environ.get("FIREBASE_SERVICE_ACCOUNT", "")
          if not raw:
              print("ERROR: FIREBASE_SERVICE_ACCOUNT secret missing")
              sys.exit(2)
          info = json.loads(raw)
          creds = service_account.Credentials.from_service_account_info(
              info, scopes=["https://www.googleapis.com/auth/firebase.messaging"]
          )
          creds.refresh(Request())
          data = {
              "message": {
                  "topic": "nepal-alerts",
                  "notification": {
                      "title": "🐕🌼 कुकुर तिहारको हार्दिक शुभकामना!",
                      "body": "निःस्वार्थ प्रेम र वफादारिताको प्रतीक कुकुरप्रति सम्मान व्यक्त गर्ने यो पावन दिनमा सबैमा हार्दिक शुभकामना। सबै प्राणीप्रति माया, दया र सम्मान रहिरहोस्। 🐾❤️ — FloodSafe Nepal"
                  },
                  "android": {"priority": "high"},
                  "data": {"type": "festival", "festival": "kukur_tihar", "sender": "FloodSafe Nepal"}
              }
          }
          project_id = info["project_id"]
          response = requests.post(
              f"https://fcm.googleapis.com/v1/projects/{project_id}/messages:send",
              headers={"Authorization": f"Bearer {creds.token}", "Content-Type": "application/json"},
              json=data, timeout=30
          )
          print("FCM HTTP status:", response.status_code)
          print("FCM response:", response.text)
          response.raise_for_status()
          PY
