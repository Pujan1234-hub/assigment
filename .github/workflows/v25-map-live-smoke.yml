name: V25 Map Live Verification
on:
  push:
    branches: [main]
    paths:
      - 'floodsafe-nepal/v25/index.html'
      - 'floodsafe-nepal/v25/map-*.js'
      - 'floodsafe-nepal/v25/hydro-*.js'
      - 'floodsafe-nepal/v25/trusted-river-runtime-v1.js'
      - 'floodsafe-nepal/v25/ui-simple-v1.css'
      - 'floodsafe-nepal/v25/river-*.js'
      - 'data/floodsafe-core.json'
      - '.github/workflows/v25-map-live-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v25-map-live-verification
  cancel-in-progress: true
jobs:
  map-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/
    steps:
      - name: Wait for deployed upgraded build
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 70); do
            html="$(curl --max-time 15 -fsSL "${BASE}?mapci=${GITHUB_SHA}-${i}" || true)"
            if printf '%s' "$html" | grep -Fq 'ui-simple-v1.css?v=1' && printf '%s' "$html" | grep -Fq 'trusted-river-runtime-v1.js?v=15' && printf '%s' "$html" | grep -Fq 'map-loader-v3.js?v=20'; then
              ok=1; break
            fi
            sleep 4
          done
          test "$ok" = 1

      - name: Verify Nepal map, all-station catalogue and river network
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          mkdir -p /tmp/mapgate && cd /tmp/mapgate
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24.31.0 >/dev/null 2>&1
          BASE="$BASE" CHROME="$CHROME" node <<'JS'
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:412,height:915,deviceScaleFactor:1});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(process.env.BASE+'?mapci='+Date.now(),{waitUntil:'domcontentloaded',timeout:70000});
            await page.waitForFunction(()=>window.FloodSafeMap?.map && document.getElementById('riverMapGL'),{timeout:70000});
            await page.waitForFunction(()=>window.FloodSafeMap.map.isStyleLoaded(),{timeout:70000});
            await page.waitForFunction(()=>Number(window.__fsRiverRealtimeState?.catalogCount||0)>0,{timeout:70000});
            await page.waitForFunction(()=>Number(window.FloodSafeMap?.districtCount||0)===77,{timeout:70000});
            await sleep(8000);
            const state=await page.evaluate(()=>{
              const map=window.FloodSafeMap.map,src=map.getSource('gauges'),d=src?._data,features=Array.isArray(d?.features)?d.features:[];
              return {catalog:Number(window.__fsRiverRealtimeState?.catalogCount||0),latest:Number(window.__fsRiverRealtimeState?.latestCount||0),fresh:Number(window.__fsRiverRealtimeState?.updatedWithin5mCount||0),districts:Number(window.FloodSafeMap?.districtCount||0),gauges:features.length,hydro:Number(window.__fsHydroMatchState?.features||0),overlay:document.getElementById('fsMapSimpleStatus')?.textContent||'',pageErrors:errors};
            });
            if(state.catalog<1) throw Error('Official catalogue missing '+JSON.stringify(state));
            if(state.districts!==77) throw Error('77 districts missing '+JSON.stringify(state));
            if(state.gauges<1) throw Error('Official gauges missing '+JSON.stringify(state));
            if(!state.overlay) throw Error('Simple live map status missing '+JSON.stringify(state));
            if(state.pageErrors.length) throw Error('Page errors '+JSON.stringify(state.pageErrors.slice(0,6)));
            console.log('PASS MAP V25',JSON.stringify(state));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(3)});
          JS
