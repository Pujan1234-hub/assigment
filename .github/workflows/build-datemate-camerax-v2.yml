name: Build DateMate CameraX V2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-datemate-camerax-v2.yml'
      - 'datemate-camera-v2/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct previous DateMate project
        shell: bash
        run: |
          cat datemate-build/project.part00 datemate-build/project.part01 datemate-build/project.part02 datemate-build/project.part03 > /tmp/datemate-project.b64
          base64 --decode /tmp/datemate-project.b64 > /tmp/datemate-project.zip
          unzip -q /tmp/datemate-project.zip -d .
          test -f datemate-android-fixed/app/src/main/java/com/pujan/datemate/MainActivity.kt

      - name: Apply CameraX V2 fix
        shell: bash
        run: |
          cp datemate-camera-v2/ExpiryCameraActivity.kt datemate-android-fixed/app/src/main/java/com/pujan/datemate/ExpiryCameraActivity.kt
          python3 datemate-camera-v2/patch.py
          grep -q 'ExpiryCameraActivity' datemate-android-fixed/app/src/main/AndroidManifest.xml
          grep -q 'androidx.camera:camera-core' datemate-android-fixed/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Gradle wrapper
        run: gradle -p datemate-android-fixed wrapper --gradle-version 8.10.2

      - name: Build debug APK
        run: ./datemate-android-fixed/gradlew -p datemate-android-fixed --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          test -f datemate-android-fixed/app/build/outputs/apk/debug/app-debug.apk
          cp datemate-android-fixed/app/build/outputs/apk/debug/app-debug.apk DateMate-CameraX-V2.apk
          ls -lh DateMate-CameraX-V2.apk

      - name: Add handoff README
        shell: bash
        run: |
          cat > datemate-android-fixed/README-CAMERAX-V2.txt <<'EOF'
          DateMate CameraX V2
          ==================
          This version replaces the external expiry-photo camera flow with an in-app CameraX activity.

          Why:
          The previous build could hang after the system camera returned a full-resolution image on some Samsung/Android devices.

          New flow:
          1. Scan barcode.
          2. DateMate opens its own in-app expiry camera.
          3. Tap CAPTURE.
          4. OCR runs from the temporary cache photo.
          5. DateMate returns directly to the confirmation screen.

          The photo is not saved to the gallery.
          Camera permission is requested only for the expiry scanner.
          EOF

      - name: Create complete Android Studio project ZIP
        shell: bash
        run: |
          rm -rf datemate-android-fixed/app/build datemate-android-fixed/.gradle datemate-android-fixed/.kotlin
          cp DateMate-CameraX-V2.apk datemate-android-fixed/DateMate-CameraX-V2.apk
          mv datemate-android-fixed DateMate
          zip -qr DateMate-AndroidStudio-CameraX-V2.zip DateMate
          unzip -t DateMate-AndroidStudio-CameraX-V2.zip >/dev/null
          ls -lh DateMate-AndroidStudio-CameraX-V2.zip

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DateMate-CameraX-V2-APK
          path: DateMate-CameraX-V2.apk
          if-no-files-found: error

      - name: Upload project artifact
        uses: actions/upload-artifact@v4
        with:
          name: DateMate-AndroidStudio-CameraX-V2
          path: DateMate-AndroidStudio-CameraX-V2.zip
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="datemate-camerax-v2-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" DateMate-CameraX-V2.apk DateMate-AndroidStudio-CameraX-V2.zip --title "DateMate CameraX V2 ${GITHUB_RUN_NUMBER}" --notes "DateMate Android build with in-app CameraX expiry capture to avoid the post-photo system-camera freeze. Barcode scan, OCR/date parsing, local items/archive, user name, and reminders are included."
