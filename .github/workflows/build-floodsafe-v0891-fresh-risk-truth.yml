name: Build FloodSafe v0.8.91 Fresh Risk Truth APK

on:
  push:
    branches: [ fix/floodsafe-v0882-realtime-river-rain ]
    paths:
      - '.github/workflows/build-floodsafe-v0891-fresh-risk-truth.yml'
      - '.github/scripts/patch_floodsafe_v0891_fresh_visual_truth.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Fetch current official BIPAD river snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p floodsafe-android-app/app/src/main/assets/data
          python3 - <<'PY'
          import json,urllib.request,pathlib,time,datetime
          u='https://bipadportal.gov.np/api/v1/river-stations/?limit=5000&_fs=0891_'+str(int(time.time()))
          req=urllib.request.Request(u,headers={'User-Agent':'FloodSafe-Nepal/0.8.91','Accept':'application/json','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,timeout=40) as r: obj=json.load(r)
          rows=obj.get('results') or []
          assert len(rows)>=250, len(rows)
          obs=[x for x in rows if x.get('waterLevel') is not None and x.get('waterLevelOn')]
          severe=[x for x in obs if 'ABOVE WARNING' in str(x.get('status','')).upper() or 'ABOVE DANGER' in str(x.get('status','')).upper()]
          p=pathlib.Path('floodsafe-android-app/app/src/main/assets/data/bipad-river-stations-bootstrap.json')
          p.write_text(json.dumps(obj,separators=(',',':')),encoding='utf-8')
          print('V0891_BOOTSTRAP catalog=',len(rows),'readings=',len(obs),'raw_official_severe_latest=',len(severe),'bytes=',p.stat().st_size)
          for x in severe[:30]: print('RAW_SEVERE',x.get('status'),x.get('title'),x.get('waterLevel'),x.get('waterLevelOn'))
          PY

      - name: Apply native chain through v0.8.91
        run: |
          python3 floodsafe-android-app/run_patch_native_v0877.py
          python3 floodsafe-android-app/patch_native_v0878_station_resilience.py
          python3 floodsafe-android-app/patch_native_v0879_full_river_geometry.py
          python3 floodsafe-android-app/patch_native_v0880_viewport_same_river_detail.py
          python3 floodsafe-android-app/run_patch_native_v0881.py
          python3 floodsafe-android-app/patch_native_v0883_map_camera_river_tap.py
          python3 floodsafe-android-app/run_patch_native_v0884.py
          python3 floodsafe-android-app/patch_native_v0885_official_parity_river_network.py
          python3 floodsafe-android-app/patch_native_v0885b_compile_fix.py
          python3 floodsafe-android-app/patch_native_v0886_same_river_official_station_join.py
          python3 floodsafe-android-app/patch_native_v0887_preflight.py
          python3 floodsafe-android-app/patch_native_v0887_monitored_rivers_instant_stations.py
          python3 floodsafe-android-app/patch_native_v0887_postflight.py
          python3 floodsafe-android-app/patch_native_v0887_compile_fix.py
          python3 floodsafe-android-app/patch_native_v0888_startup_crash_fast_rivers.py
          python3 floodsafe-android-app/patch_native_v0889_persistent_stations_rivers.py
          python3 .github/scripts/patch_floodsafe_v0890_risk_lines.py
          python3 .github/scripts/patch_floodsafe_v0891_fresh_visual_truth.py

      - name: Verify v0.8.91 truth contracts
        shell: bash
        run: |
          set -euo pipefail
          M='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java'
          G='floodsafe-android-app/app/build.gradle'
          test -s floodsafe-android-app/app/src/main/assets/data/bipad-river-stations-bootstrap.json
          grep -Fq 'V0891_STALE_STATION_GREY' "$M"
          grep -Fq 'V0891_FRESH_ONLY_STATION_COLOUR' "$M"
          grep -Fq 'V0891_FRESH_ONLY_RISK_LINE' "$M"
          grep -Fq 'V0891_CURRENT_FLOOD_RIVER_ONLY' "$M"
          grep -Fq 'V0891_STATION_GEO_USES_FRESH_TRUTH' "$M"
          grep -Fq 'V0890_NO_UNCHANGED_STATION_FLICKER' "$M"
          grep -Fq 'V0890_FUZZY_RIVER_NAME_EVIDENCE' "$M"
          grep -Fq 'V0890_TIGHT_GEOMETRY_JOIN' "$M"
          grep -Fq 'versionCode 111' "$G"
          grep -Fq "versionName '0.8.91'" "$G"
          echo 'V0891_TRUTH_CONTRACT PASS'

      - name: Bundle source assets
        run: gradle -p floodsafe-android-app clean :app:bundleFloodSafe --no-daemon

      - name: Rebuild full Nepal river candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet shapely
          python3 floodsafe-android-app/preclip_nepal_waterways.py
          python3 floodsafe-android-app/rebalance_nepal_overview_v0839.py
          python3 floodsafe-android-app/build_regional_river_tiles_v0840.py
          python3 floodsafe-android-app/build_national_river_network_v0841.py
          python3 floodsafe-android-app/build_progressive_river_tiers_v0842.py
          python3 floodsafe-android-app/build_progressive_river_names_v0863.py
          python3 floodsafe-android-app/postclip_nepal_display_rivers_v0874.py

      - name: Unit test and build APK
        run: gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug -x bundleFloodSafe --no-daemon --stacktrace

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -Fq 'assets/data/bipad-river-stations-bootstrap.json'
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-waterways-tiles/overview.json'
          cp "$APK" FloodSafe-Nepal-v0.8.91-FRESH-RISK-TRUTH-FIELD-TEST.apk
          sha256sum FloodSafe-Nepal-v0.8.91-FRESH-RISK-TRUTH-FIELD-TEST.apk | tee FloodSafe-Nepal-v0.8.91-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-v0891-FRESH-RISK-TRUTH-FIELD-TEST
          path: |
            FloodSafe-Nepal-v0.8.91-FRESH-RISK-TRUTH-FIELD-TEST.apk
            FloodSafe-Nepal-v0.8.91-SHA256.txt
          retention-days: 14
