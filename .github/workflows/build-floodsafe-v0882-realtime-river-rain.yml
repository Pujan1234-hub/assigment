name: Build FloodSafe v0.8.83 Camera River Detail APK

on:
  push:
    branches: [ fix/floodsafe-v0882-realtime-river-rain ]
    paths:
      - '.github/workflows/build-floodsafe-v0882-realtime-river-rain.yml'
      - 'floodsafe-android-app/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply corrected native chain
        run: |
          python3 floodsafe-android-app/run_patch_native_v0877.py
          python3 floodsafe-android-app/patch_native_v0878_station_resilience.py
          python3 floodsafe-android-app/patch_native_v0879_full_river_geometry.py
          python3 floodsafe-android-app/patch_native_v0880_viewport_same_river_detail.py
          python3 floodsafe-android-app/run_patch_native_v0881.py
          python3 floodsafe-android-app/patch_native_v0883_map_camera_river_tap.py
      - name: Verify field feedback contracts
        shell: bash
        run: |
          set -euo pipefail
          M='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java'
          A='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/NativeFullActivity.java'
          R='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/RainAlertWorker.java'
          G='floodsafe-android-app/app/build.gradle'
          grep -Fq 'V0883_NEPAL_MIN_ZOOM' "$M"
          grep -Fq 'V0883_SAFE_NEPAL_OVERVIEW' "$M"
          grep -Fq 'V0883_TIGHT_NEPAL_CAMERA_BOUNDS' "$M"
          grep -Fq 'V0883_RIVER_TAP_PRIORITY' "$M"
          grep -Fq 'V0883_ALWAYS_IDENTIFY_RIVER_TYPE' "$M"
          grep -Fq 'V0881_RIVER_FIRST_CLASS_DETAIL' "$M"
          grep -Fq 'V0881_HYDRO_WATERBODY_GEO' "$M"
          grep -Fq 'V0880_EXACT_SAME_RIVER_ONLY' "$M"
          grep -Fq 'V0877_CLEAN_FRESH_ONLY_LIVE' "$A"
          grep -Fq 'LOOKAHEAD_MINUTES = 35' "$R"
          grep -Fq 'Cache-Control", "no-cache' "$R"
          grep -Fq 'versionCode 103' "$G"
          grep -Fq "versionName '0.8.83'" "$G"
          ! grep -Fq 'android.webkit.WebView' "$M"
          echo 'V0883_FIELD_FEEDBACK_CONTRACT PASS'
      - name: Bundle source assets
        run: gradle -p floodsafe-android-app clean :app:bundleFloodSafe --no-daemon
      - name: Rebuild complete Nepal river assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet shapely
          python3 floodsafe-android-app/preclip_nepal_waterways.py
          python3 floodsafe-android-app/rebalance_nepal_overview_v0839.py
          python3 floodsafe-android-app/build_regional_river_tiles_v0840.py
          python3 floodsafe-android-app/build_national_river_network_v0841.py
          python3 floodsafe-android-app/build_progressive_river_tiers_v0842.py
          python3 floodsafe-android-app/build_progressive_river_names_v0863.py
          python3 floodsafe-android-app/postclip_nepal_display_rivers_v0874.py
      - name: Test and build APK
        run: gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug -x bundleFloodSafe --no-daemon --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-waterways-tiles/overview.json'
          unzip -l "$APK" | grep -Fq 'assets/floodsafe-nepal/v24/nepal-districts.geojson'
          cp "$APK" FloodSafe-Nepal-v0.8.83-CAMERA-RIVER-DETAIL-FIELD-TEST.apk
          sha256sum FloodSafe-Nepal-v0.8.83-CAMERA-RIVER-DETAIL-FIELD-TEST.apk | tee FloodSafe-Nepal-v0.8.83-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-v0883-CAMERA-RIVER-DETAIL-FIELD-TEST
          path: |
            FloodSafe-Nepal-v0.8.83-CAMERA-RIVER-DETAIL-FIELD-TEST.apk
            FloodSafe-Nepal-v0.8.83-SHA256.txt
          retention-days: 14
