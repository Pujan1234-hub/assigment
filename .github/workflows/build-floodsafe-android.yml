name: Build FloodSafe Android field APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'floodsafe-android-app/**'
      - 'floodsafe-nepal/**'
      - '.github/workflows/build-floodsafe-android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK and Gradle
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Apply WebView renderer crash hardening
        run: python3 floodsafe-android-app/patch_webview_crash.py
      - name: Safety source gate
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "versionName '0.7.0'" floodsafe-android-app/app/build.gradle
          grep -Fq 'versionCode 14' floodsafe-android-app/app/build.gradle
          grep -Fq 'RADIUS_KM = 2d' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/RiverAlertWorker.java
          grep -Fq 'DEFAULT_RIVER_RADIUS_KM = 2d' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeMessagingService.java
          grep -Fq 'const MAX_KM=2' floodsafe-nepal/v25/native-alert-bridge-v1.js
          grep -Fq 'id="humanStatus"' floodsafe-nepal/v25/index.html
          grep -Fq 'human-status-v1.js?v=1' floodsafe-nepal/v25/index.html
          test -s floodsafe-nepal/v25/human-status-v1.js
          grep -Fq 'WEATHER_DIGEST_INTERVAL_MS = 3L * 60L * 60L * 1000L' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/RainAlertWorker.java
          grep -Fq 'ACCESS_BACKGROUND_LOCATION' floodsafe-android-app/app/src/main/AndroidManifest.xml
          grep -Fq 'onRenderProcessGone' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/MainActivity.java
          grep -Fq 'RenderProcessGoneDetail' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/MainActivity.java
          echo 'FloodSafe v0.7.0 source safety gate PASS'
      - name: Apply Android fast-start first-paint transform
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('floodsafe-nepal/v25/index.html')
          text=p.read_text(encoding='utf-8')
          lazy=[
            './official-live-fetch-fix-v1.js?v=1','./trusted-river-runtime-v3.js?v=37','./trusted-rain-runtime-v1.js?v=4',
            './river-current-20m-v1.js?v=8','./realtime-guard-v1.js?v=8','./gauge-bridge.js?v=24',
            './river-name-alias-v1.js?v=1','./streamflow-gauge-patch-v1.js?v=1','./river-line-status-v1.js?v=10',
            './river-status-ui.js?v=4','./live-official-label-lock.js?v=2','./map-loader-v3.js?v=31',
            './map-mobile-recovery-v1.js?v=4','./permanent-281-map-v1.js?v=6','./station-click-coherence-v1.js?v=1',
            './river-line-style-v1.js?v=12','./river-flow-freshness-v1.js?v=2','./map-side-panel-v1.js?v=12',
            './user-facing-ui-v1.js?v=10','./clean-user-lines-v1.js?v=1','./sathi-flood-ai/live.js?v=1',
            './sathi-flood-ai/floating-ui-v2.js?v=2','./sathi-flood-ai/place-weather-v1.js?v=1',
            './sathi-flood-ai/river-match-lock-v1.js?v=1','./sathi-flood-ai/advanced-server-v1.js?v=1'
          ]
          for src in lazy:
            text=text.replace(f'<script src="{src}" defer></script>','')
          marker='<script src="./android-fast-start-v1.js?v=1" defer></script>'
          if marker not in text:
            text=text.replace('</body>',marker+'</body>')
          p.write_text(text,encoding='utf-8')
          PY
          grep -Fq 'android-fast-start-v1.js?v=1' floodsafe-nepal/v25/index.html
      - name: Unit tests and APK build
        run: /tmp/gradle-8.11.1/bin/gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -p "$APK" assets/floodsafe-nepal/v25/index.html > /tmp/index.html
          grep -Fq 'id="humanStatus"' /tmp/index.html
          grep -Fq 'human-status-v1.js?v=1' /tmp/index.html
          grep -Fq 'android-fast-start-v1.js?v=1' /tmp/index.html
          unzip -p "$APK" assets/floodsafe-nepal/v25/native-alert-bridge-v1.js | grep -Fq 'const MAX_KM=2'
          unzip -l "$APK" | grep -Eq 'classes[0-9]*\.dex'
          echo 'FloodSafe v0.7.0 APK verification PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-FieldTest-0.7.0-APK
          path: floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
