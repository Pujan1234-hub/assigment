name: Build Nepal Waterways Snapshot
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-nepal-waterways.yml"
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
concurrency:
  group: nepal-waterways-snapshot
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current last-good snapshot
        run: |
          set -euo pipefail
          mkdir -p /tmp/waterways data
          python3 - <<'PY'
          import json,os,shutil
          p='data/nepal-waterways-snapshot.json'
          if os.path.exists(p) and os.path.getsize(p)>100:
            try:
              j=json.load(open(p))
              if isinstance(j.get('waterways'),list) and len(j['waterways'])>500:
                shutil.copy2(p,'/tmp/previous-good.json')
                print('preserved previous good',len(j['waterways']))
            except Exception as e: print('current snapshot invalid:',e)
          PY
      - name: Fetch Nepal river and stream geometry
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,json,time,os
          # 18 moderate tiles: reliable Overpass fetch while covering all Nepal districts.
          lons=[80.0,81.4,82.8,84.2,85.6,87.0,88.35]
          lats=[26.2,27.6,29.0,30.5]
          tiles=[(lats[y],lons[x],lats[y+1],lons[x+1]) for y in range(len(lats)-1) for x in range(len(lons)-1)]
          eps=['https://overpass.kumi.systems/api/interpreter','https://overpass-api.de/api/interpreter']
          for i,(s,w,n,e) in enumerate(tiles):
            q=f'[out:json][timeout:65];(way["waterway"="river"]({s},{w},{n},{e});way["waterway"="stream"]({s},{w},{n},{e}););out tags geom;'
            ok=False
            for attempt in range(4):
              for ep in eps:
                try:
                  p=subprocess.run(['curl','--retry','2','--retry-delay','2','--max-time','82','-fsSL','-X','POST',ep,'--data-urlencode','data='+q],capture_output=True,text=True,check=True)
                  j=json.loads(p.stdout)
                  els=j.get('elements')
                  if isinstance(els,list) and len(els)>0:
                    with open(f'/tmp/waterways/{i}.json','w') as f: json.dump(j,f)
                    print('tile',i,'elements',len(els),'via',ep)
                    ok=True; break
                except Exception as ex:
                  print('attempt',attempt+1,'tile',i,'failed',ep,str(ex)[:180])
              if ok: break
              time.sleep(3+attempt*2)
            if not ok: raise SystemExit(f'tile {i} failed; refusing to replace last-good snapshot')
          if len(os.listdir('/tmp/waterways')) != len(tiles): raise SystemExit('incomplete tile set')
          PY
      - name: Merge high-fidelity geometry and atomically stage snapshot
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,glob,math,datetime,os,sys
          sys.setrecursionlimit(10000)

          # Ramer-Douglas-Peucker at about 4 metres. The old every-Nth-point thinning
          # could visibly cut across a curved river; geometric simplification preserves shape.
          def point_seg_m(p,a,b):
            lat0=math.radians((p[1]+a[1]+b[1])/3.0)
            sx=111320.0*math.cos(lat0); sy=110574.0
            px,py=p[0]*sx,p[1]*sy; ax,ay=a[0]*sx,a[1]*sy; bx,by=b[0]*sx,b[1]*sy
            dx,dy=bx-ax,by-ay; den=dx*dx+dy*dy
            if den<=0:return math.hypot(px-ax,py-ay)
            t=max(0.0,min(1.0,((px-ax)*dx+(py-ay)*dy)/den))
            return math.hypot(px-(ax+t*dx),py-(ay+t*dy))
          def rdp(pts,eps=4.0):
            if len(pts)<=2:return pts
            a,b=pts[0],pts[-1]; best=-1.0; idx=-1
            for i in range(1,len(pts)-1):
              d=point_seg_m(pts[i],a,b)
              if d>best:best=d;idx=i
            if best<=eps:return [a,b]
            left=rdp(pts[:idx+1],eps); right=rdp(pts[idx:],eps)
            return left[:-1]+right

          out=[]; seen=set(); raw_points=0; kept_points=0
          files=glob.glob('/tmp/waterways/*.json')
          if len(files)!=18: raise SystemExit(f'expected 18 tiles, got {len(files)}')
          for fn in files:
            for e in json.load(open(fn)).get('elements',[]):
              if e.get('type')!='way' or e.get('id') in seen: continue
              geom=e.get('geometry') or []
              if len(geom)<2: continue
              pts=[[round(float(p['lon']),7),round(float(p['lat']),7)] for p in geom if 79.8<=float(p['lon'])<=88.6 and 26.0<=float(p['lat'])<=30.7]
              if len(pts)<2: continue
              seen.add(e.get('id')); raw_points+=len(pts)
              pts=rdp(pts,4.0); kept_points+=len(pts)
              tags=e.get('tags') or {}
              out.append({'id':e.get('id'),'type':tags.get('waterway','stream'),'name':tags.get('name') or '','name_ne':tags.get('name:ne') or tags.get('name_ne') or '','name_en':tags.get('name:en') or '','pts':pts})
          if len(out)<=500: raise SystemExit(f'only {len(out)} waterways; refusing replacement')
          payload={'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'source':'OpenStreetMap via Overpass','license':'ODbL','geometry_mode':'rdp','geometry_tolerance_m':4,'raw_point_count':raw_points,'point_count':kept_points,'count':len(out),'waterways':out}
          tmp='/tmp/nepal-waterways-next.json'
          with open(tmp,'w') as f: json.dump(payload,f,ensure_ascii=False,separators=(',',':'))
          j=json.load(open(tmp)); assert j['count']==len(j['waterways']) and j['count']>500
          assert j['geometry_tolerance_m']==4 and j['point_count']>j['count']*2
          assert os.path.getsize(tmp)>50000
          print('validated high fidelity snapshot',j['count'],'points',raw_points,'->',kept_points,'bytes',os.path.getsize(tmp))
          PY
          cp /tmp/nepal-waterways-next.json data/nepal-waterways-snapshot.json
          cp /tmp/nepal-waterways-next.json data/nepal-waterways-last-good.json
      - name: Validate national coverage and Dhobi Khola corridor geometry
        run: |
          python3 - <<'PY'
          import json,math
          j=json.load(open('data/nepal-waterways-snapshot.json'))
          ways=j['waterways']
          def segkm(lat,lon,a,b):
            lat0=math.radians(lat);sc=math.cos(lat0)
            x1=(a[0]-lon)*111.32*sc;y1=(a[1]-lat)*110.574
            x2=(b[0]-lon)*111.32*sc;y2=(b[1]-lat)*110.574
            dx=x2-x1;dy=y2-y1;den=dx*dx+dy*dy
            t=max(0,min(1,-(x1*dx+y1*dy)/den)) if den else 0
            return math.hypot(x1+t*dx,y1+t*dy)
          def nearest(la,lo):
            best=9999; hit=None
            for w in ways:
              pts=w.get('pts') or []
              for i in range(1,len(pts)):
                d=segkm(la,lo,pts[i-1],pts[i])
                if d<best:best=d;hit=w
            return best,hit
          broad=[('Jhapa',26.5763,87.9019),('Sindhuli',27.164,86.328),('Myagdi',28.5782,83.5343),('Dolpa',29.2623,83.0371)]
          for name,la,lo in broad:
            d,w=nearest(la,lo); print(name,'nearest km',round(d,2),'route',None if not w else (w.get('name_en') or w.get('name') or w.get('id')))
            if d>30: raise SystemExit(name+' has no nearby waterway')
          dhobi=[('Chabahil',27.7160,85.3390),('Kalopul',27.7100,85.3370),('Bijulibazar',27.6930,85.3280),('Lower',27.6878,85.3265)]
          for name,la,lo in dhobi:
            d,w=nearest(la,lo); print('Dhobi',name,'nearest km',round(d,3),'route',None if not w else (w.get('name_en') or w.get('name') or w.get('name_ne') or w.get('id')))
            if d>0.40: raise SystemExit('Dhobi Khola corridor geometry missing/misaligned at '+name)
          PY
      - name: Commit validated snapshot and last-good
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nepal-waterways-snapshot.json data/nepal-waterways-last-good.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh high fidelity Nepal waterways snapshot"
          git pull --rebase origin main
          git push