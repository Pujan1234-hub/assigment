name: V25 Complete Live Safety Gate
on:
  push:
    branches: ["main"]
    paths:
      - "floodsafe-nepal/v25/**"
      - "floodsafe-nepal/v24/**"
      - "data/**"
      - ".github/workflows/v25-today-smoke.yml"
permissions:
  contents: read
concurrency:
  group: v25-complete-live-gate
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    env:
      BASE: https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/
      MAP: https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v24/
      ROOT: https://pujan1234-hub.github.io/assigment/
    steps:
      - name: Wait for production wiring
        run: |
          set -euo pipefail
          V25FILES='index.html alerts.html people.html news.html weather.html sources.html language-v2.js language-runtime.js sync-controller.js flood-live-fast.js road-live-fast.js district-live-v4.js today-monitor-v4.js national-news.js news-stability.js disaster-monitor.js weather-live.js sw.js realtime-1s.js'
          ok=0
          for i in $(seq 1 100); do
            good=1
            for f in $V25FILES; do curl -fsSL "${BASE}${f}?ci=${GITHUB_SHA}-${i}" -o "/tmp/v25-$(basename "$f")" || good=0; done
            curl -fsSL "${MAP}sw.js?ci=${GITHUB_SHA}-${i}" -o /tmp/v24-sw.js || good=0
            curl -fsSL "${MAP}v24-river-source-guard.js?ci=${GITHUB_SHA}-${i}" -o /tmp/v24-river-source-guard.js || good=0
            curl -fsSL "${MAP}v23-river-map-v3.js?ci=${GITHUB_SHA}-${i}" -o /tmp/v23-river-map-v3.js || good=0
            curl -fsSL "${ROOT}data/floodsafe-people-status.json?ci=${GITHUB_SHA}-${i}" -o /tmp/people.json || good=0
            curl -fsSL "${ROOT}data/floodsafe-police.json?ci=${GITHUB_SHA}-${i}" -o /tmp/police.json || good=0
            grep -Fq 'shell-39' /tmp/v25-sw.js || good=0
            grep -Fq 'shell-24' /tmp/v24-sw.js || good=0
            grep -Fq 'flood-live-fast.js?v=1' /tmp/v25-alerts.html || good=0
            grep -Fq 'road-live-fast.js?v=2' /tmp/v25-alerts.html || good=0
            grep -Fq 'district-live-v4.js?v=1' /tmp/v25-alerts.html || good=0
            grep -Fq 'sync-controller.js?v=3' /tmp/v25-index.html || good=0
            grep -Fq 'id="homeDeaths"' /tmp/v25-index.html || good=0
            grep -Fq 'id="peopleBodies"' /tmp/v25-people.html || good=0
            grep -Fq 'language-runtime.js?v=1' /tmp/v25-index.html || good=0
            grep -Fq 'v24-river-source-guard.js?v=1' /tmp/v24-sw.js || good=0
            grep -Fq 'v23-river-map-v3.js?v=4' /tmp/v24-sw.js || good=0
            if [ "$good" = 1 ]; then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1

      - name: Validate syntax and live contracts
        run: |
          set -euo pipefail
          for f in language-v2.js language-runtime.js sync-controller.js flood-live-fast.js road-live-fast.js district-live-v4.js today-monitor-v4.js national-news.js news-stability.js disaster-monitor.js weather-live.js sw.js realtime-1s.js; do node --check "/tmp/v25-$f"; done
          node --check /tmp/v24-river-source-guard.js
          node --check /tmp/v23-river-map-v3.js
          node --check /tmp/v24-sw.js
          grep -Fq 'setInterval(poll,5000)' /tmp/v25-flood-live-fast.js
          grep -Fq 'setInterval(poll,5000)' /tmp/v25-road-live-fast.js
          grep -Fq 'setInterval(localPoll,5000)' /tmp/v25-sync-controller.js
          grep -Fq 'setInterval(poll,15000)' /tmp/v25-district-live-v4.js
          grep -Fq 'FETCH_MS=60000' /tmp/v25-weather-live.js
          grep -Fq 'FLASH_MS=60*60*1000' /tmp/v25-national-news.js
          grep -Fq 'RECENT_MS=6*60*60*1000' /tmp/v25-national-news.js
          grep -Fq 'now-t>2*3600e3' /tmp/v24-river-source-guard.js
          grep -Fq 'setInterval(()=>fetchGauges(false),5000)' /tmp/v23-river-map-v3.js
          ! grep -Fq 'clients.navigate' /tmp/v24-sw.js
          ! grep -Fq "dispatchEvent(new Event('online'))" /tmp/v25-realtime-1s.js
          python3 - <<'PY'
          import json,datetime
          p=json.load(open('/tmp/people.json')); po=json.load(open('/tmp/police.json'))
          def ts(v):
              try:return datetime.datetime.fromisoformat(str(v).replace('Z','+00:00')).timestamp()
              except:return 0
          pd=ts(p.get('recovered_update_iso') or p.get('recovered_update_time') or p.get('updated_date'))
          pp=ts(po.get('official_update_iso'))
          expected=po.get('total_deaths') if pp>pd else p.get('recovered_bodies')
          assert expected is not None and p.get('missing_minimum') is not None and p.get('rescued_alive') is not None
          print('human source contract',expected,p['missing_minimum'],p['rescued_alive'])
          PY

      - name: Install browser harness
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          mkdir -p /tmp/complete-live && cd /tmp/complete-live
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24.31.0 >/dev/null 2>&1

      - name: Home Human and language
        run: |
          set -euo pipefail
          cd /tmp/complete-live
          node <<'JS'
          const puppeteer=require('puppeteer-core'),wait=ms=>new Promise(r=>setTimeout(r,ms)),dev=/[\u0900-\u097F]/;
          (async()=>{const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage']});const p=await b.newPage();await p.setViewport({width:412,height:915});p.setDefaultTimeout(70000);await p.goto(process.env.BASE+'?ci='+Date.now(),{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>window.__fsUnifiedHuman&&Number(document.getElementById('homeDeaths')?.textContent)>0);await wait(6500);const x=await p.evaluate(async()=>{const q=id=>document.getElementById(id),people=await fetch('../../data/floodsafe-people-status.json?x='+Date.now(),{cache:'no-store'}).then(r=>r.json()),police=await fetch('../../data/floodsafe-police.json?x='+Date.now(),{cache:'no-store'}).then(r=>r.json());return{shown:[q('homeDeaths').textContent,q('homeMissing').textContent,q('homeRescued').textContent],state:window.__fsUnifiedHuman,people,police,hidden:q('humanStatsSection').hidden}});if(x.hidden||x.shown.join('|')!==[x.state.d.value,x.state.m.value,x.state.r.value].map(String).join('|'))throw Error('Human DOM/state '+JSON.stringify(x));const pt=Date.parse(x.people.recovered_update_iso||x.people.updated_date||0),pot=Date.parse(x.police.official_update_iso||0);if(pt>pot&&Number(x.shown[0])!==Number(x.people.recovered_bodies))throw Error('Older police overwrote newer metric '+JSON.stringify(x));await p.click('#fsLangToggle');await wait(1200);const en=await p.evaluate(()=>({head:document.querySelector('.pageHead h2')?.textContent||'',core:[...document.querySelectorAll('header,.pageHead,.grid,#humanStatsSection,.healthGrid')].map(x=>x.textContent).join(' '),toggle:document.getElementById('fsLangToggle')?.textContent}));if(en.head!=='Key information'||en.toggle!=='नेपाली'||dev.test(en.core))throw Error('English mix '+JSON.stringify(en));console.log('PASS Home Human/language',x.shown);await b.close()})().catch(e=>{console.error(e);process.exit(3)});
          JS

      - name: Flood Road and 77 Districts
        run: |
          set -euo pipefail
          cd /tmp/complete-live
          node <<'JS'
          const puppeteer=require('puppeteer-core'),wait=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage']});const p=await b.newPage();await p.setViewport({width:412,height:915});p.setDefaultTimeout(70000);let n=0;p.on('request',r=>{/bipadportal\.gov\.np\/api\/v1\//.test(r.url())&&n++});await p.goto(process.env.BASE+'alerts.html?ci='+Date.now(),{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>window.__fsFloodState&&window.__fsRoadState&&window.__fsDistrictState);await p.waitForFunction(()=>document.querySelectorAll('#districtFilter option').length===78);await wait(6500);const x=await p.evaluate(()=>{const q=id=>document.getElementById(id),f=[...q('alertsList').querySelectorAll('.item')],r=[...q('roadCurrentList').querySelectorAll('.item')];return{floodOwner:f.every(x=>x.dataset.floodOwner==='1'),roadOwner:r.every(x=>x.dataset.roadOwner==='1'),flood:f.map(x=>x.textContent),road:r.map(x=>x.textContent),count:Number(q('roadAlertCount').textContent),rs:window.__fsRoadState,fs:window.__fsFloodState,ds:window.__fsDistrictState,options:q('districtFilter').options.length,district:q('districtStatusList').querySelectorAll('.item').length,dup:q('closedRoadSection')?.hidden}});if(!x.floodOwner||!x.roadOwner||x.options!==78||x.ds.districts!==77||x.district>20||x.dup!==true)throw Error('Owner/layout '+JSON.stringify(x));if(x.flood.some(t=>/^ROAD\b|\bPARTIALLY OPEN\b|\bCLOSED\b.*Alternative route/i.test(t)))throw Error('Road leaked into flood '+JSON.stringify(x.flood));const expected=x.rs.dor?x.rs.dor.closed:x.rs.bipad.closed;if(x.count!==expected)throw Error('Road count '+JSON.stringify(x));if(x.road.some(t=>/CLOSED|बन्द/.test(t)&&!/Alternative route|वैकल्पिक मार्ग/.test(t)))throw Error('Road route disclosure '+JSON.stringify(x.road));await wait(10000);if(n>100)throw Error('Network storm '+n);console.log('PASS Alerts',{flood:x.fs,road:x.rs,district:x.ds,requests:n});await b.close()})().catch(e=>{console.error(e);process.exit(3)});
          JS

      - name: People and News
        run: |
          set -euo pipefail
          cd /tmp/complete-live
          node <<'JS'
          const puppeteer=require('puppeteer-core'),wait=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage']});const p=await b.newPage();p.setDefaultTimeout(70000);await p.goto(process.env.BASE+'people.html?ci='+Date.now(),{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>window.__fsUnifiedHuman&&Number(document.getElementById('peopleBodies')?.textContent)>0);await wait(6500);const ppl=await p.evaluate(()=>({shown:['peopleBodies','peopleMissing','peopleRescued'].map(id=>document.getElementById(id).textContent),state:window.__fsUnifiedHuman,hidden:document.getElementById('peopleStatsSection').hidden}));if(ppl.hidden||ppl.shown.join('|')!==[ppl.state.d.value,ppl.state.m.value,ppl.state.r.value].map(String).join('|'))throw Error('People mismatch '+JSON.stringify(ppl));await p.goto(process.env.BASE+'news.html?ci='+Date.now(),{waitUntil:'domcontentloaded'});await wait(8000);const news=await p.evaluate(async()=>{let local=0,kcha=0;try{const j=await fetch('../../data/national-news.json?x='+Date.now(),{cache:'no-store'}).then(r=>r.json());local=(j.items||[]).filter(x=>Date.now()-new Date(x.published_at||x.published||x.date||0).getTime()<21600000).length}catch{}try{const j=await fetch('https://kchakhabar.com/api/v1/today.json?limit=100',{cache:'no-store'}).then(r=>r.json());kcha=(j.stories||[]).filter(x=>Date.now()-new Date(x.first_reported||x.updated_at||0).getTime()<21600000).length}catch{}return{local,kcha,cards:document.querySelectorAll('#newsList .item').length,text:document.getElementById('newsList').textContent}});if(news.local+news.kcha>0&&news.cards===0)throw Error('News empty '+JSON.stringify(news));console.log('PASS People/News',ppl.shown,news);await b.close()})().catch(e=>{console.error(e);process.exit(3)});
          JS

      - name: Weather and Sources language
        run: |
          set -euo pipefail
          cd /tmp/complete-live
          node <<'JS'
          const puppeteer=require('puppeteer-core'),wait=ms=>new Promise(r=>setTimeout(r,ms)),dev=/[\u0900-\u097F]/;
          (async()=>{const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage']});const ctx=b.defaultBrowserContext();await ctx.overridePermissions(new URL(process.env.BASE).origin,['geolocation']);const p=await b.newPage();await p.setGeolocation({latitude:27.7172,longitude:85.3240,accuracy:30});p.setDefaultTimeout(70000);await p.goto(process.env.BASE+'weather.html?ci='+Date.now(),{waitUntil:'domcontentloaded'});await p.click('#gpsWeatherBtn');await p.waitForFunction(()=>document.getElementById('wxTemp').textContent!=='—°');await p.click('#fsLangToggle');await wait(1500);const wx=await p.evaluate(()=>({condition:document.getElementById('wxCondition').textContent,status:document.getElementById('appStatus').textContent,head:document.querySelector('.pageHead h2').textContent}));if(dev.test(wx.condition)||dev.test(wx.status)||dev.test(wx.head))throw Error('Weather English mix '+JSON.stringify(wx));await p.goto(process.env.BASE+'sources.html?ci='+Date.now(),{waitUntil:'domcontentloaded'});await p.click('#fsLangToggle');await wait(1200);const s=await p.evaluate(()=>[...document.querySelectorAll('.pageHead,.sourceCard p,.notice')].map(x=>x.textContent).join(' '));if(dev.test(s))throw Error('Sources English mix '+s);console.log('PASS Weather/Sources',wx);await b.close()})().catch(e=>{console.error(e);process.exit(3)});
          JS

      - name: Map and River freshness guard
        run: |
          set -euo pipefail
          cd /tmp/complete-live
          node <<'JS'
          const puppeteer=require('puppeteer-core'),wait=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage']});const p=await b.newPage();p.setDefaultTimeout(70000);const u=process.env.MAP+'?mapOnly=1&v25=1&testFocus=1&ci='+Date.now();await p.goto(u,{waitUntil:'domcontentloaded'});await p.waitForSelector('#map');try{await p.waitForFunction(()=>window.__fsRiverSourceHealth&&document.getElementById('fsRiver3Sheet'),{timeout:20000})}catch{await p.reload({waitUntil:'domcontentloaded'});await p.waitForFunction(()=>window.__fsRiverSourceHealth&&document.getElementById('fsRiver3Sheet'),{timeout:35000})}await wait(5000);const x=await p.evaluate(()=>({guard:window.__fsRiverSourceHealth,sheet:!!document.getElementById('fsRiver3Sheet'),map:!!window.__fs?.map}));if(!x.guard||!x.sheet||!x.map||!String(x.guard.source||'').includes('DHM'))throw Error('River guard '+JSON.stringify(x));console.log('PASS Map/River',x);await b.close()})().catch(e=>{console.error(e);process.exit(3)});
          JS