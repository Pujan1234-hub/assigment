name: Send Kukur Tihar greeting now
on:
  push:
    paths:
      - '.github/workflows/tihar-greeting-20261106.yml'

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Kukur Tihar notification through Firebase Cloud Messaging
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python -m pip install --quiet google-auth requests
          python - <<'PY'
          import json, os, requests, sys
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          raw = os.environ.get("FIREBASE_SERVICE_ACCOUNT", "")
          if not raw:
              print("ERROR: FIREBASE_SERVICE_ACCOUNT secret not configured.")
              sys.exit(2)

          info = json.loads(raw)
          credentials = service_account.Credentials.from_service_account_info(
              info, scopes=["https://www.googleapis.com/auth/firebase.messaging"]
          )
          credentials.refresh(Request())
          payload = {
              "message": {
                  "topic": "nepal-alerts",
                  "notification": {
                      "title": "🐕🌼 कुकुर तिहारको हार्दिक शुभकामना!",
                      "body": "विश्वास, प्रेम र वफादारिताको प्रतीक कुकुरको सम्मान गर्ने यस पावन दिनमा सबैलाई हार्दिक शुभकामना। सबै प्राणीप्रति माया र सम्मान रहिरहोस्। 🐾❤️ — FloodSafe Nepal"
                  },
                  "android": {"priority": "high"},
                  "data": {"type": "festival", "festival": "kukur_tihar", "sender": "FloodSafe Nepal"}
              }
          }
          response = requests.post(
              "https://fcm.googleapis.com/v1/projects/" + info["project_id"] + "/messages:send",
              headers={"Authorization": f"Bearer {credentials.token}", "Content-Type": "application/json"},
              json=payload, timeout=30
          )
          print("FCM HTTP status:", response.status_code)
          print("FCM response:", response.text)
          response.raise_for_status()
          PY
