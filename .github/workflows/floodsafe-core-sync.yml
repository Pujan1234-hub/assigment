name: FloodSafe core official feed sync

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/floodsafe-core-sync.yml'
      - 'scripts/floodsafe-core-sync.py'
      - 'scripts/floodsafe-river-sanitize.py'

permissions:
  contents: write

concurrency:
  group: floodsafe-core-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch official DHM and BIPAD river feeds
        run: python scripts/floodsafe-core-sync.py

      - name: Reject fake freshness and normalize current observations
        run: python scripts/floodsafe-river-sanitize.py

      - name: Validate current river snapshot
        run: |
          python -m json.tool data/floodsafe-core.json >/dev/null
          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta

          j=json.load(open('data/floodsafe-core.json'))
          src=j.get('sources',{}).get('rivers',{})
          rivers=j.get('rivers',[])
          now=datetime.now(timezone.utc)

          assert j.get('schema_version',0) >= 4, j.get('schema_version')
          assert src.get('count',0) >= 120, src

          def parse_time(row):
              # ONLY hydrological observation timestamps. Never retrievedAt,
              # modifiedOn, updatedAt or alert-created timestamps.
              raw=(row.get('waterLevelOn') or row.get('water_level_on') or
                   row.get('measuredOn') or row.get('measured_on') or
                   row.get('measurementTime') or row.get('observationTime'))
              if not raw: return None
              try:
                  d=datetime.fromisoformat(str(raw).replace('Z','+00:00'))
                  return d if d.tzinfo else d.replace(tzinfo=timezone.utc)
              except Exception:
                  return None

          def measured(row):
              return any(row.get(k) not in (None,'') for k in (
                  'waterLevel','water_level','currentWaterLevel','current_water_level',
                  'currentLevel','current_level','level'))

          fresh=[]
          for r in rivers:
              if not isinstance(r,dict) or not measured(r):
                  continue
              t=parse_time(r)
              if not t: continue
              age=now-t.astimezone(timezone.utc)
              if timedelta(minutes=-5) <= age <= timedelta(minutes=20):
                  fresh.append(r)

          assert fresh, 'No genuinely timestamped official river observation <=20 minutes; do not publish fake realtime data.'
          assert src.get('current_20m_count') == len(fresh), (src.get('current_20m_count'),len(fresh))
          newest=max(parse_time(r).astimezone(timezone.utc) for r in fresh)
          print('river snapshot',src.get('count'),'fresh<=20m',len(fresh),'newest',newest.isoformat())
          for r in fresh[:10]:
              print('CURRENT',r.get('title') or r.get('river_name') or r.get('name'),r.get('waterLevel') or r.get('water_level'),parse_time(r).isoformat(),r.get('_officialStatus'))
          PY

      - name: Commit refreshed river snapshot immediately
        shell: bash
        run: |
          if git diff --quiet -- data/floodsafe-core.json; then
            echo 'No river snapshot change.'
            exit 0
          fi
          git config user.name 'FloodSafe live sync'
          git config user.email 'actions@users.noreply.github.com'
          git add data/floodsafe-core.json
          git commit -m '[auto] refresh FloodSafe realtime rivers'
          git pull --rebase origin main
          git push origin HEAD:main
