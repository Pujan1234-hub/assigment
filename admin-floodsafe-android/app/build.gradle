plugins {
    id 'com.android.application'
}
android {
    namespace 'com.pjbuilts.adminfloodsafe'
    compileSdk 35
    defaultConfig {
        applicationId 'com.pjbuilts.adminfloodsafe'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            debuggable false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}
