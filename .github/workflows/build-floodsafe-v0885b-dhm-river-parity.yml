name: Build FloodSafe v0.8.85b DHM River Parity APK

on:
  push:
    branches: [ fix/floodsafe-v0882-realtime-river-rain ]
    paths:
      - '.github/workflows/build-floodsafe-v0885b-dhm-river-parity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Fetch exact DHM River Watch assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request,urllib.parse
          from pathlib import Path
          out=Path('floodsafe-android-app/app/src/main/assets/data');out.mkdir(parents=True,exist_ok=True)
          H={'User-Agent':'Mozilla/5.0 FloodSafeNepal/0.8.85','Accept':'*/*','Cache-Control':'no-cache'}
          def get(url,t):
              req=urllib.request.Request(url,headers=H)
              with urllib.request.urlopen(req,timeout=t) as r:return r.read().decode('utf-8','replace')
          river=json.loads(get('https://dhm.gov.np/assets/frontend/geo/River_All.geojson',90))
          if not isinstance(river,dict) or river.get('type')!='FeatureCollection' or not river.get('features'):raise SystemExit('official DHM river network unavailable')
          (out/'dhm-river-all-v0885.geojson').write_text(json.dumps(river,separators=(',',':'),ensure_ascii=False),encoding='utf-8')
          page=get('https://www.dhm.gov.np/hydrology/river-watch',210);marker='var coordinates =';p=page.find(marker);s=page.find('[',p+len(marker))
          if p<0 or s<0:raise SystemExit('DHM coordinate catalog unavailable')
          depth=0;quote=None;esc=False;e=-1
          for i in range(s,len(page)):
              ch=page[i]
              if quote:
                  if esc:esc=False
                  elif ch=='\\':esc=True
                  elif ch==quote:quote=None
              else:
                  if ch in ('"',"'"):quote=ch
                  elif ch=='[':depth+=1
                  elif ch==']':
                      depth-=1
                      if depth==0:e=i+1;break
          rows=json.loads(page[s:e]);slim=[]
          for x in rows:
              if not isinstance(x,dict):continue
              try:la=float(x.get('latitude'));lo=float(x.get('longitude'))
              except Exception:continue
              if 26<=la<=31 and 80<=lo<=89:slim.append({'id':x.get('id'),'stationIndex':str(x.get('stationIndex') or '').strip(),'name':str(x.get('name') or '').strip(),'basin':str(x.get('basin') or '').strip(),'district':str(x.get('district') or '').strip(),'latitude':la,'longitude':lo})
          if len(slim)<280:raise SystemExit(f'DHM coords insufficient: {len(slim)}')
          (out/'dhm-river-watch-stations-v0885.json').write_text(json.dumps(slim,separators=(',',':'),ensure_ascii=False),encoding='utf-8')
          body=urllib.parse.urlencode({'type':'0','mapValue':'all'}).encode();headers={**H,'Accept':'application/json,*/*','Content-Type':'application/x-www-form-urlencoded; charset=UTF-8','X-Requested-With':'XMLHttpRequest','Referer':'https://www.dhm.gov.np/hydrology/river-watch'}
          req=urllib.request.Request('https://dhm.gov.np/site/riverWatchTableViewData',data=body,method='POST',headers=headers)
          with urllib.request.urlopen(req,timeout=60) as r:feed=json.loads(r.read().decode('utf-8','replace'))
          live=feed.get('data',[]) if isinstance(feed,dict) else [];valid=[x for x in live if isinstance(x,dict) and isinstance(x.get('waterLevel'),dict) and x['waterLevel'].get('datetime') and x['waterLevel'].get('value') is not None]
          if feed.get('status')!='success' or len(live)<300 or len(valid)<50:raise SystemExit('DHM current feed unavailable')
          severe=[x for x in valid if str(x.get('status','')).upper() in ('WARNING','DANGER')]
          print('V0885_DHM_CURRENT_CHECK PASS rows',len(live),'valid',len(valid),'coords',len(slim),'river_features',len(river['features']),'severe_now',len(severe))
          if severe:print('SEVERE_SAMPLE',severe[0].get('name'),severe[0].get('status'),severe[0].get('waterLevel'))
          PY

      - name: Apply native chain through DHM parity
        run: |
          python3 floodsafe-android-app/run_patch_native_v0877.py
          python3 floodsafe-android-app/patch_native_v0878_station_resilience.py
          python3 floodsafe-android-app/patch_native_v0879_full_river_geometry.py
          python3 floodsafe-android-app/patch_native_v0880_viewport_same_river_detail.py
          python3 floodsafe-android-app/run_patch_native_v0881.py
          python3 floodsafe-android-app/patch_native_v0883_map_camera_river_tap.py
          python3 floodsafe-android-app/run_patch_native_v0884.py
          python3 floodsafe-android-app/run_patch_native_v0885.py

      - name: Verify source-parity contracts
        shell: bash
        run: |
          set -euo pipefail
          A='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/NativeFullActivity.java';M='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java';G='floodsafe-android-app/app/build.gradle'
          grep -Fq 'site/riverWatchTableViewData' "$A"
          grep -Fq 'V0885_DHM_RIVERWATCH_PRIMARY' "$A"
          grep -Fq 'V0885_DHM_CURRENT_OFFICIAL_TRUTH' "$A"
          ! grep -Fq 'LIVE (≤20m)' "$A"
          grep -Fq 'V0885_DHM_OFFICIAL_RIVER_NETWORK' "$M"
          grep -Fq 'V0884_STATUS_COLOUR_FLOW_GLOW' "$M"
          grep -Fq 'V0884_REAL_RIVER_DETAIL_TIME_SOURCE_THRESHOLDS' "$M"
          grep -Fq 'versionCode 105' "$G";grep -Fq "versionName '0.8.85'" "$G"
          echo V0885_SOURCE_PARITY_CONTRACT_PASS

      - name: Bundle and rebuild detailed river assets
        shell: bash
        run: |
          set -euo pipefail
          gradle -p floodsafe-android-app clean :app:bundleFloodSafe --no-daemon
          python3 -m pip install --quiet shapely
          python3 floodsafe-android-app/preclip_nepal_waterways.py
          python3 floodsafe-android-app/rebalance_nepal_overview_v0839.py
          python3 floodsafe-android-app/build_regional_river_tiles_v0840.py
          python3 floodsafe-android-app/build_national_river_network_v0841.py
          python3 floodsafe-android-app/build_progressive_river_tiers_v0842.py
          python3 floodsafe-android-app/build_progressive_river_names_v0863.py
          python3 floodsafe-android-app/postclip_nepal_display_rivers_v0874.py

      - name: Test and build APK
        run: gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug -x bundleFloodSafe --no-daemon --stacktrace

      - name: Verify APK contents
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk';test -s "$APK";unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -Fq 'assets/data/dhm-river-all-v0885.geojson'
          unzip -l "$APK" | grep -Fq 'assets/data/dhm-river-watch-stations-v0885.json'
          cp "$APK" FloodSafe-Nepal-v0.8.85-DHM-RIVER-PARITY-FIELD-TEST.apk
          sha256sum FloodSafe-Nepal-v0.8.85-DHM-RIVER-PARITY-FIELD-TEST.apk | tee FloodSafe-Nepal-v0.8.85-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-v0885-DHM-RIVER-PARITY-FIELD-TEST
          path: |
            FloodSafe-Nepal-v0.8.85-DHM-RIVER-PARITY-FIELD-TEST.apk
            FloodSafe-Nepal-v0.8.85-SHA256.txt
          retention-days: 14
