<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06101b"><title>Team Tracker</title><style>html,body{margin:0;min-height:100%;background:#06101b;color:#fff;font-family:system-ui}#load{min-height:100vh;display:grid;place-items:center;color:#e9bc55;font-weight:800;letter-spacing:.08em}</style></head><body><div id="load">TEAM TRACKER • LOADING</div><script>(async()=>{try{const names=['part1.txt','part2.txt','part3.txt','part4.txt','part5.txt'];const html=(await Promise.all(names.map(n=>fetch(n+'?v=staff-premium-1',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(n);return r.text()})))).join('');document.open();document.write(html);document.close()}catch(e){document.getElementById('load').textContent='TEAM TRACKER • LOAD ERROR';console.error(e)}})();</script></body></html>
