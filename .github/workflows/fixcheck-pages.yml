name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - sw.js
      - auto-update.js
      - portfolio-floodsafe.js
      - portfolio-motion.js
      - portfolio-content-fix.js
      - portfolio-i18n.js
      - fixcheck/**
      - team-tracker/**
      - floodsafe-nepal/**
      - data/**
      - assets/**
      - .github/workflows/fixcheck-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare public site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          cp index.html _site/index.html
          cp sw.js _site/sw.js
          cp auto-update.js _site/auto-update.js
          cp portfolio-floodsafe.js _site/portfolio-floodsafe.js
          cp portfolio-motion.js _site/portfolio-motion.js
          cp portfolio-content-fix.js _site/portfolio-content-fix.js
          cp portfolio-i18n.js _site/portfolio-i18n.js
          cp -R fixcheck _site/fixcheck
          cp -R team-tracker _site/team-tracker
          cp -R floodsafe-nepal _site/floodsafe-nepal
          if [ -d data ]; then cp -R data _site/data; fi
          if [ -d assets ]; then cp -R assets _site/assets; fi

          test -s _site/data/nepal-waterways-seed.json
          test -s _site/assets/portfolio/datemate-home.svg
          test -s _site/assets/portfolio/datemate-archive.svg
          test -s _site/assets/portfolio/floodsafe-map.svg
          test -s _site/assets/portfolio/floodsafe-poster.svg
          test -s _site/portfolio-i18n.js
          test -s _site/portfolio-content-fix.js

          python3 -c "import json; j=json.load(open('_site/data/nepal-waterways-seed.json')); assert j.get('count',0)>=100; assert len(j.get('waterways',[]))==j['count']; print('packaging river routes',j['count'])"
          printf '%s' "$GITHUB_SHA" > _site/build-version.txt

          # Only real projects that have deliberately been started are listed here.
          # Generic platform folders and build outputs never become portfolio products.
          python3 - <<'PY'
          from pathlib import Path
          import json
          projects=[
            {'slug':'team-tracker','title':'Team Tracker','started':True,'portfolio':True,'status_en':'Working web app','status_np':'चलिरहेको वेब एप','link':'./team-tracker/'},
            {'slug':'fixcheck','title':'FixCheck','started':True,'portfolio':True,'status_en':'In development','status_np':'विकासमा','link':'./fixcheck/'},
            {'slug':'datemate','title':'DateMate','started':True,'portfolio':True,'status_en':'Active development','status_np':'सक्रिय विकास','link':None},
            {'slug':'floodsafe-nepal','title':'FloodSafe Nepal','started':True,'portfolio':True,'status_en':'Active development','status_np':'सक्रिय विकास','link':'./floodsafe-nepal/'},
            {'slug':'sathi-ai','title':'SATHI AI','started':True,'portfolio':True,'status_en':'FloodSafe Nepal feature','status_np':'FloodSafe Nepal सुविधा','link':'./floodsafe-nepal/'}
          ]
          payload={'version':7,'mode':'curated-started-projects-only','project_count':len(projects),'projects':projects}
          Path('_site/projects-manifest.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          s=p.read_text()
          s=s.replace('AI-assisted development helps move from idea to prototype quickly, but product quality still depends on the problem definition, user flow, testing and honest limitations.','I develop each product through hands-on design, building, testing and repeated refinement, with the focus on solving the problem clearly and making each version more useful.')
          s=s.replace('I use modern web tools and AI-assisted workflows to move from idea to testable prototype quickly.','I turn ideas into testable prototypes through hands-on design, building, testing and iteration.')
          s=s.replace('AI-assisted development','hands-on development').replace('AI-assisted workflows','hands-on development workflows').replace('AI-assisted','hands-on')
          s=s.replace('<meta name="theme-color" content="#070a10">','<meta name="theme-color" content="#f7f3eb">')

          # Critical light theme is baked directly into deployed HTML. This keeps
          # Facebook/in-app browsers light even if they cache or delay JS files.
          critical='''<style id="portfolio-base-light-v7">
          :root{--bg:#f7f3eb!important;--bg2:#eee8dd!important;--panel:#fffdf8!important;--panel2:#f5f0e7!important;--text:#171b23!important;--muted:#667085!important;--line:rgba(26,32,44,.12)!important;--cyan:#0d9fb4!important;--blue:#4967e8!important;--purple:#7b5ce1!important;--green:#168a68!important;--orange:#d77b2c!important;--red:#d94f70!important}
          html,body{background:#f7f3eb!important;color:#171b23!important;color-scheme:light!important}
          body:before{background:radial-gradient(850px circle at var(--mx) var(--my),rgba(73,103,232,.075),transparent 46%),radial-gradient(680px circle at 12% 76%,rgba(13,159,180,.07),transparent 50%),linear-gradient(180deg,#fbf8f2 0%,#f4efe6 48%,#f8f4ed 100%)!important}
          body:after{opacity:.46!important;background-image:linear-gradient(rgba(40,48,62,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(40,48,62,.035) 1px,transparent 1px)!important}
          .nav.scrolled{background:rgba(250,247,240,.94)!important;border-bottom-color:rgba(26,32,44,.10)!important;box-shadow:0 8px 30px rgba(30,35,45,.06)!important}.brand{color:#171b23!important}.navlinks{color:#616b7b!important}.navlinks a:hover,.navlinks a.active{color:#171b23!important}.status-pill{background:#edf8f3!important;border-color:#b9e5d3!important;color:#166b50!important}
          h1{color:#171b23!important}h1 .grad{background:linear-gradient(95deg,#171b23 5%,#3157d5 46%,#7655d6 92%)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important}h1 .thin,.hero-copy{color:#596476!important}.stat span{color:#697486!important}.hero-stats{border-top-color:rgba(26,32,44,.11)!important}.eyebrow{background:rgba(255,255,255,.78)!important;border-color:rgba(26,32,44,.12)!important;color:#505b6c!important}
          .btn{background:#fff!important;border-color:rgba(26,32,44,.13)!important;color:#202632!important}.btn.primary{background:linear-gradient(135deg,#39c8dc,#7581f2)!important;color:#071019!important;border:0!important}
          .marquee{background:rgba(255,255,255,.42)!important;border-color:rgba(26,32,44,.10)!important}.marquee span{color:#687385!important}.section-index{color:#7b8492!important}.section-title small{color:#3157d5!important}.section-title h2{color:#171b23!important}.section-title p{color:#667085!important}
          .project{background:linear-gradient(145deg,rgba(255,253,248,.98),rgba(250,247,241,.96))!important;border-color:rgba(26,32,44,.12)!important;box-shadow:0 22px 60px rgba(34,40,52,.08)!important}.project h3{color:#171b23!important}.project-copy>p{color:#5e6879!important}.feature{background:rgba(255,255,255,.78)!important;border-color:rgba(26,32,44,.10)!important;color:#596476!important}.feature b{color:#202632!important}.project-links a{background:#fff!important;border-color:rgba(26,32,44,.12)!important;color:#202632!important}.project-visual{background:linear-gradient(135deg,rgba(255,255,255,.72),rgba(238,242,248,.64))!important;border-left-color:rgba(26,32,44,.10)!important}
          .gallery figure,.process-card,.about-card,.contact-card{background:linear-gradient(145deg,#fffdf8,#f7f2e9)!important;border-color:rgba(26,32,44,.11)!important;color:#171b23!important}.gallery figcaption,.process-card p,.about-card p,.contact-card p{color:#616c7d!important}.process-card h3,.about-card .big,.contact-card h3{color:#171b23!important}.skills span{background:rgba(255,255,255,.75)!important;color:#505b6c!important;border-color:rgba(26,32,44,.11)!important}.contact-email{color:#202632!important}.foot{border-top-color:rgba(26,32,44,.10)!important;color:#697486!important}
          /* Product mockups stay dark, but every label/value stays readable. */
          .dev-card,.browser,.scan,.fake-map,.river-bg,.river-card,.orbit-card,.float-expiry,.ai-chip{color:#eef4fb!important}.browserbar,.metric span,.river-card small,.orbit-card small,.scan-result{color:#9aa8ba!important}.metric strong,.river-card strong,.orbit-card strong,.os-core b{color:#f7f9fc!important}.metric strong em,.browser .task b,.river-card .reading,.river-card .task b,.scan-result b{color:var(--accent)!important}.browser .task,.river-card .task{color:#bdc7d4!important;background:rgba(255,255,255,.04)!important;border-color:rgba(255,255,255,.09)!important}.float-expiry b,.ai-chip b{color:#f7f9fc!important}
          @media(max-width:700px){body:before{background:linear-gradient(180deg,#fbf8f2 0%,#f5f0e7 52%,#faf7f1 100%)!important}.project{box-shadow:0 14px 34px rgba(34,40,52,.075)!important}.project-copy{background:rgba(255,253,248,.74)!important}.project-visual{border-left:0!important;border-top:1px solid rgba(26,32,44,.09)!important}.section-title p,.project-copy>p{color:#556071!important}.feature{color:#4f5b6c!important}}
          </style>'''
          s=s.replace('</head>',critical+'</head>')
          p.write_text(s)
          PY

          sed -i 's#</head>#<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"></head>#' _site/index.html
          sed -i 's#</body>#<script src="./portfolio-floodsafe.js?v=4"></script><script src="./portfolio-motion.js?v=7"></script><script src="./portfolio-i18n.js?v=6"></script><script src="./portfolio-content-fix.js?v=2"></script><script src="./auto-update.js?v=3"></script></body>#' _site/index.html

          python - <<'PY'
          from pathlib import Path
          import re
          for ver in ('v23','v24'):
              p=Path('_site/floodsafe-nepal')/ver/'index.html'
              if not p.exists(): continue
              s=p.read_text()
              for old in ('v23-gateway.js','v23-upgrade.js','v23-hotfix.js','v23-ux.js','v23-river-map-v2.js','v23-river-name.js','v23-river-map.js','v23-river-map-v3.js','v23-location.js','v23-lang-police.js','v23-live-2s.js','v23-active-hazards.js','v23-map-guard.js'):
                  s=re.sub(rf'<script[^>]+{re.escape(old)}[^>]*></script>','',s)
              for fn,vernum in [('v23-gateway.js','1'),('v23-upgrade.js','5'),('v23-hotfix.js','4'),('v23-ux.js','2'),('v23-river-map-v3.js','3'),('v23-location.js','1'),('v23-lang-police.js','1'),('v23-live-2s.js','1'),('v23-active-hazards.js','1'),('v23-map-guard.js','1')]:
                  f=p.parent/fn
                  if f.exists(): s=s.replace('</body>',f'<script src="./{fn}?v={vernum}"></script></body>')
              p.write_text(s)
          PY

          # Public-root privacy guard and attribution guard. The product name SATHI AI is allowed.
          python3 - <<'PY'
          from pathlib import Path
          import re,sys
          files=[Path('_site/index.html'),Path('_site/portfolio-floodsafe.js'),Path('_site/portfolio-motion.js'),Path('_site/portfolio-content-fix.js'),Path('_site/portfolio-i18n.js'),Path('_site/projects-manifest.json')]
          forbidden=re.compile(r'\b(?:Princesshay|Suroj|Tango|Victor|Chiraag|hotel|siyara|mic|security|cleaner|Exeter|employment|badge|Bedford|Catherine)\b|Roman\s+Walk',re.I)
          attribution=re.compile(r'AI-assisted|artificial intelligence|built\s+(?:with|by)\s+AI|made\s+(?:with|by)\s+AI|using\s+AI\s+to\s+(?:build|develop|create)',re.I)
          for p in files:
              text=p.read_text(encoding='utf-8',errors='ignore')
              if forbidden.search(text): print('Blocked private/internal wording in',p);sys.exit(2)
              if attribution.search(text): print('Blocked unwanted attribution wording in',p);sys.exit(2)
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with: {enablement: true}

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Verify exact deployed build
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://pujan1234-hub.github.io/assigment
          for i in $(seq 1 30); do
            deployed="$(curl --max-time 10 -fsSL "$BASE/build-version.txt?check=$GITHUB_SHA-$i" || true)"
            if [ "$deployed" = "$GITHUB_SHA" ]; then
              curl --max-time 15 -fsSL "$BASE/floodsafe-nepal/v25/?check=$GITHUB_SHA" -o /tmp/v25.html
              grep -Fq 'trusted-river-runtime-v3.js?v=36' /tmp/v25.html
              grep -Fq 'impact-live-v1.js?v=6' /tmp/v25.html
              ! grep -Fq 'flood-freshness.js' /tmp/v25.html

              curl --max-time 15 -fsSL "$BASE/?check=$GITHUB_SHA" -o /tmp/home.html
              grep -Fq 'portfolio-base-light-v7' /tmp/home.html
              grep -Fq 'theme-color" content="#f7f3eb' /tmp/home.html
              grep -Fq 'portfolio-floodsafe.js?v=4' /tmp/home.html
              grep -Fq 'portfolio-motion.js?v=7' /tmp/home.html
              grep -Fq 'portfolio-i18n.js?v=6' /tmp/home.html
              grep -Fq 'portfolio-content-fix.js?v=2' /tmp/home.html
              grep -Fq 'auto-update.js?v=3' /tmp/home.html

              curl --max-time 15 -fsSL "$BASE/portfolio-floodsafe.js?check=$GITHUB_SHA" -o /tmp/portfolio-floodsafe.js
              grep -Fq 'hasDateMateTicket' /tmp/portfolio-floodsafe.js
              grep -Fq 'dateMateTickets.slice(1)' /tmp/portfolio-floodsafe.js

              curl --max-time 15 -fsSL "$BASE/portfolio-content-fix.js?check=$GITHUB_SHA" -o /tmp/content-fix.js
              grep -Fq 'Typed flood questions' /tmp/content-fix.js
              grep -Fq 'Built into FloodSafe Nepal' /tmp/content-fix.js
              grep -Fq '.metric strong' /tmp/content-fix.js

              curl --max-time 15 -fsSL "$BASE/portfolio-i18n.js?check=$GITHUB_SHA" -o /tmp/i18n.js
              grep -Fq '__pcPortfolioI18nV6' /tmp/i18n.js
              grep -Fq 'नेपाली' /tmp/i18n.js
              grep -Fq 'पृष्ठभूमि' /tmp/i18n.js
              grep -Fq 'अनुमति' /tmp/i18n.js
              ! grep -Fq 'Auto-detected project' /tmp/i18n.js
              ! grep -Fq 'November development phase' /tmp/i18n.js
              ! grep -Fq 'required paid services' /tmp/i18n.js
              grep -Fq 'SATHI AI' /tmp/i18n.js
              grep -Fq 'sathi-ai' /tmp/i18n.js

              curl --max-time 15 -fsSL "$BASE/projects-manifest.json?check=$GITHUB_SHA" -o /tmp/projects.json
              python3 -c "import json; j=json.load(open('/tmp/projects.json')); assert j['mode']=='curated-started-projects-only'; assert j['project_count']==5; assert [x['title'] for x in j['projects']]==['Team Tracker','FixCheck','DateMate','FloodSafe Nepal','SATHI AI']; assert all(x['started'] and x['portfolio'] for x in j['projects']); assert j['projects'][-1]['status_en']=='FloodSafe Nepal feature'"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Verify stable FloodSafe scripts
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://pujan1234-hub.github.io/assigment
          for i in $(seq 1 25); do
            if curl -fsSL "$BASE/floodsafe-nepal/v23/?t=$RANDOM" -o /tmp/v23.html; then
              if grep -q 'v23-gateway.js?v=1' /tmp/v23.html && grep -q 'v23-upgrade.js?v=5' /tmp/v23.html && grep -q 'v23-hotfix.js?v=4' /tmp/v23.html && grep -q 'v23-ux.js?v=2' /tmp/v23.html && grep -q 'v23-river-map-v3.js?v=3' /tmp/v23.html && grep -q 'v23-location.js?v=1' /tmp/v23.html && grep -q 'v23-lang-police.js?v=1' /tmp/v23.html && grep -q 'v23-live-2s.js?v=1' /tmp/v23.html && grep -q 'v23-active-hazards.js?v=1' /tmp/v23.html && grep -q 'v23-map-guard.js?v=1' /tmp/v23.html && ! grep -q 'v23-river-map-v2.js' /tmp/v23.html; then exit 0; fi
            fi
            sleep 3
          done
          exit 1