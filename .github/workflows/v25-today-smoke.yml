name: V25 Complete Live Safety Gate
on:
  push:
    branches: ["main"]
    paths:
      - "floodsafe-nepal/v25/**"
      - "floodsafe-nepal/v24/**"
      - "data/**"
      - ".github/workflows/v25-today-smoke.yml"
permissions:
  contents: read
concurrency:
  group: v25-complete-live-gate
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Verify complete live-data architecture in production
        run: |
          set -euo pipefail
          BASE='https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/'
          MAP='https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v24/'
          ROOT='https://pujan1234-hub.github.io/assigment/'
          V25FILES='index.html alerts.html people.html news.html weather.html sources.html language-v2.js language-runtime.js sync-controller.js flood-live-fast.js road-live-fast.js district-live-v4.js today-monitor-v4.js national-news.js news-stability.js disaster-monitor.js weather-live.js sw.js realtime-1s.js'
          ok=0
          for i in $(seq 1 100); do
            good=1
            for f in $V25FILES; do curl -fsSL "${BASE}${f}?ci=${GITHUB_SHA}-${i}" -o "/tmp/v25-$(basename "$f")" || good=0; done
            curl -fsSL "${MAP}sw.js?ci=${GITHUB_SHA}-${i}" -o /tmp/v24-sw.js || good=0
            curl -fsSL "${MAP}v24-river-source-guard.js?ci=${GITHUB_SHA}-${i}" -o /tmp/v24-river-source-guard.js || good=0
            curl -fsSL "${MAP}v23-river-map-v3.js?ci=${GITHUB_SHA}-${i}" -o /tmp/v23-river-map-v3.js || good=0
            curl -fsSL "${ROOT}data/floodsafe-people-status.json?ci=${GITHUB_SHA}-${i}" -o /tmp/people.json || good=0
            curl -fsSL "${ROOT}data/floodsafe-police.json?ci=${GITHUB_SHA}-${i}" -o /tmp/police.json || good=0
            grep -Fq 'shell-39' /tmp/v25-sw.js || good=0
            grep -Fq 'shell-24' /tmp/v24-sw.js || good=0
            grep -Fq 'flood-live-fast.js?v=1' /tmp/v25-alerts.html || good=0
            grep -Fq 'road-live-fast.js?v=2' /tmp/v25-alerts.html || good=0
            grep -Fq 'district-live-v4.js?v=1' /tmp/v25-alerts.html || good=0
            grep -Fq 'sync-controller.js?v=3' /tmp/v25-index.html || good=0
            grep -Fq 'id="homeDeaths"' /tmp/v25-index.html || good=0
            grep -Fq 'id="peopleBodies"' /tmp/v25-people.html || good=0
            grep -Fq 'language-runtime.js?v=1' /tmp/v25-index.html || good=0
            grep -Fq 'v24-river-source-guard.js?v=1' /tmp/v24-sw.js || good=0
            grep -Fq 'v23-river-map-v3.js?v=4' /tmp/v24-sw.js || good=0
            if [ "$good" = 1 ]; then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1

          for f in language-v2.js language-runtime.js sync-controller.js flood-live-fast.js road-live-fast.js district-live-v4.js today-monitor-v4.js national-news.js news-stability.js disaster-monitor.js weather-live.js sw.js realtime-1s.js; do node --check "/tmp/v25-$f"; done
          node --check /tmp/v24-river-source-guard.js
          node --check /tmp/v23-river-map-v3.js
          node --check /tmp/v24-sw.js
          grep -Fq "setInterval(poll,5000)" /tmp/v25-flood-live-fast.js
          grep -Fq "setInterval(poll,5000)" /tmp/v25-road-live-fast.js
          grep -Fq "setInterval(localPoll,5000)" /tmp/v25-sync-controller.js
          grep -Fq "setInterval(poll,15000)" /tmp/v25-district-live-v4.js
          grep -Fq "FETCH_MS=60000" /tmp/v25-weather-live.js
          grep -Fq "FLASH_MS=60*60*1000" /tmp/v25-national-news.js
          grep -Fq "RECENT_MS=6*60*60*1000" /tmp/v25-national-news.js
          grep -Fq "now-t>2*3600e3" /tmp/v24-river-source-guard.js
          grep -Fq "setInterval(()=>fetchGauges(false),5000)" /tmp/v23-river-map-v3.js
          ! grep -Fq 'clients.navigate' /tmp/v24-sw.js
          ! grep -Fq "dispatchEvent(new Event('online'))" /tmp/v25-realtime-1s.js
          python3 - <<'PY'
          import json,datetime
          p=json.load(open('/tmp/people.json')); po=json.load(open('/tmp/police.json'))
          def ts(v):
              try:return datetime.datetime.fromisoformat(str(v).replace('Z','+00:00')).timestamp()
              except:return 0
          pd=ts(p.get('recovered_update_iso') or p.get('recovered_update_time') or p.get('updated_date'))
          pp=ts(po.get('official_update_iso'))
          expected=po.get('total_deaths') if pp>pd else p.get('recovered_bodies')
          assert expected is not None
          assert p.get('missing_minimum') is not None and p.get('rescued_alive') is not None
          print('expected current local human',expected,p['missing_minimum'],p['rescued_alive'])
          PY

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          mkdir -p /tmp/complete-live && cd /tmp/complete-live
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24.31.0 >/dev/null 2>&1
          BASE="$BASE" MAP="$MAP" ROOT="$ROOT" CHROME="$CHROME" node <<'JS'
          const puppeteer=require('puppeteer-core');
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const dev=/[\u0900-\u097F]/;
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage']});
            const context=browser.defaultBrowserContext();
            await context.overridePermissions(new URL(process.env.BASE).origin,['geolocation']);
            const page=await browser.newPage();
            await page.setViewport({width:412,height:915,deviceScaleFactor:1});
            await page.setGeolocation({latitude:27.7172,longitude:85.3240,accuracy:30});
            page.setDefaultTimeout(70000);
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            const url=(base,p='')=>base+p+(p.includes('?')?'&':'?')+'ci='+Date.now();

            // HOME + HUMAN OWNER
            await page.goto(url(process.env.BASE,''),{waitUntil:'domcontentloaded'});
            await page.waitForSelector('#humanStatsSection:not([hidden])',{timeout:30000});
            await page.waitForFunction(()=>window.__fsUnifiedHuman&&Number(document.getElementById('homeDeaths')?.textContent)>0,{timeout:30000});
            await wait(6500); // survive legacy 5s render cycle
            const human=await page.evaluate(async()=>{
              const q=id=>document.getElementById(id),p=await fetch('../../data/floodsafe-people-status.json?x='+Date.now(),{cache:'no-store'}).then(r=>r.json()),po=await fetch('../../data/floodsafe-police.json?x='+Date.now(),{cache:'no-store'}).then(r=>r.json());
              return {shown:[q('homeDeaths').textContent,q('homeMissing').textContent,q('homeRescued').textContent],state:window.__fsUnifiedHuman,people:p,police:po,hidden:q('humanStatsSection').hidden};
            });
            if(human.hidden)throw Error('Human hidden');
            if(human.shown.join('|')!==[human.state.d.value,human.state.m.value,human.state.r.value].map(String).join('|'))throw Error('Human DOM/state mismatch '+JSON.stringify(human));
            const pt=Date.parse(human.people.recovered_update_iso||human.people.recovered_update_time||human.people.updated_date||0),pot=Date.parse(human.police.official_update_iso||0);
            if(pt>pot&&Number(human.shown[0])!==Number(human.people.recovered_bodies))throw Error('Older police value overwrote newer human report '+JSON.stringify(human));
            if(Date.parse(human.state.m.time||0)<Date.parse(human.people.missing_update_time||human.people.updated_date||0))throw Error('Missing metric stale '+JSON.stringify(human.state.m));
            if(Date.parse(human.state.r.time||0)<Date.parse(human.people.rescued_update_time||human.people.updated_date||0))throw Error('Rescue metric stale '+JSON.stringify(human.state.r));

            // LANGUAGE HOME
            await page.click('#fsLangToggle');await wait(1200);
            const enHome=await page.evaluate(()=>({head:document.querySelector('.pageHead h2')?.textContent||'',human:[...document.querySelectorAll('#humanStatsSection small')].map(x=>x.textContent),core:[...document.querySelectorAll('header,.pageHead,.grid,#humanStatsSection,.healthGrid')].map(x=>x.textContent).join(' '),toggle:document.getElementById('fsLangToggle')?.textContent}));
            if(enHome.head!=='Key information'||enHome.toggle!=='नेपाली'||enHome.human.some(x=>/[\u0900-\u097F]/.test(x))||dev.test(enHome.core))throw Error('English Home mix '+JSON.stringify(enHome));
            await page.click('#fsLangToggle');await wait(1000);
            const neHome=await page.evaluate(()=>({head:document.querySelector('.pageHead h2')?.textContent||'',toggle:document.getElementById('fsLangToggle')?.textContent}));
            if(neHome.head!=='मुख्य जानकारी'||neHome.toggle!=='English')throw Error('Nepali Home failed '+JSON.stringify(neHome));

            // ALERTS: FLOOD / ROAD / DISTRICT SEPARATE OWNERS
            let bipadRequests=0;const req=r=>{if(/bipadportal\.gov\.np\/api\/v1\//.test(r.url()))bipadRequests++};page.on('request',req);
            await page.goto(url(process.env.BASE,'alerts.html'),{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.__fsFloodState&&window.__fsRoadState&&window.__fsDistrictState,{timeout:35000});
            await page.waitForFunction(()=>document.querySelectorAll('#districtFilter option').length===78,{timeout:30000});
            await wait(6500);
            const alerts=await page.evaluate(()=>{const q=id=>document.getElementById(id),f=[...q('alertsList').querySelectorAll('.item')],r=[...q('roadCurrentList').querySelectorAll('.item')];return{floodOwner:f.every(x=>x.dataset.floodOwner==='1'),roadOwner:r.every(x=>x.dataset.roadOwner==='1'),flood:f.map(x=>x.textContent),road:r.map(x=>x.textContent),roadCount:Number(q('roadAlertCount').textContent),stateRoad:window.__fsRoadState,stateFlood:window.__fsFloodState,stateDistrict:window.__fsDistrictState,options:q('districtFilter').options.length,districtCards:q('districtStatusList').querySelectorAll('.item').length,dupHidden:q('closedRoadSection')?.hidden}});
            if(!alerts.floodOwner||!alerts.roadOwner)throw Error('Owner conflict '+JSON.stringify(alerts));
            if(alerts.options!==78||alerts.stateDistrict.districts!==77||alerts.districtCards>20)throw Error('District status bad '+JSON.stringify(alerts));
            if(alerts.dupHidden!==true)throw Error('Duplicate road section visible');
            if(alerts.flood.some(x=>/^ROAD\b|\bPARTIALLY OPEN\b|\bCLOSED\b.*Alternative route/i.test(x)))throw Error('Road leaked into Flood section '+JSON.stringify(alerts.flood));
            const expectedRoad=alerts.stateRoad.dor?alerts.stateRoad.dor.closed:alerts.stateRoad.bipad.closed;if(alerts.roadCount!==expectedRoad)throw Error('Road count mismatch '+JSON.stringify(alerts));
            if(alerts.road.some(x=>/CLOSED|बन्द/.test(x)&&!/Alternative route|वैकल्पिक मार्ग/.test(x)))throw Error('Closed road missing alternative-route disclosure '+JSON.stringify(alerts.road));
            await wait(10000);page.off('request',req);if(bipadRequests>100)throw Error('Network storm: '+bipadRequests+' BIPAD requests');

            // PEOPLE survives old renderer
            await page.goto(url(process.env.BASE,'people.html'),{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.__fsUnifiedHuman&&Number(document.getElementById('peopleBodies')?.textContent)>0,{timeout:30000});await wait(6500);
            const ppl=await page.evaluate(()=>({shown:['peopleBodies','peopleMissing','peopleRescued'].map(id=>document.getElementById(id).textContent),state:window.__fsUnifiedHuman,hidden:document.getElementById('peopleStatsSection').hidden}));
            if(ppl.hidden||ppl.shown.join('|')!==[ppl.state.d.value,ppl.state.m.value,ppl.state.r.value].map(String).join('|'))throw Error('People owner mismatch '+JSON.stringify(ppl));

            // NEWS: if a recent verified source item exists, UI must not be empty
            await page.goto(url(process.env.BASE,'news.html'),{waitUntil:'domcontentloaded'});await wait(8000);
            const news=await page.evaluate(async()=>{let local=0,kcha=0;try{const j=await fetch('../../data/national-news.json?x='+Date.now(),{cache:'no-store'}).then(r=>r.json());local=(j.items||[]).filter(x=>Date.now()-new Date(x.published_at||x.published||x.date||0).getTime()<21600000).length}catch{}try{const j=await fetch('https://kchakhabar.com/api/v1/today.json?limit=100',{cache:'no-store'}).then(r=>r.json());kcha=(j.stories||[]).filter(x=>Date.now()-new Date(x.first_reported||x.updated_at||0).getTime()<21600000).length}catch{}return{local,kcha,cards:document.querySelectorAll('#newsList .item').length,text:document.getElementById('newsList').textContent}});
            if(news.local+news.kcha>0&&news.cards===0)throw Error('Recent news exists but News feed empty '+JSON.stringify(news));

            // WEATHER live + language
            await page.goto(url(process.env.BASE,'weather.html'),{waitUntil:'domcontentloaded'});await page.click('#gpsWeatherBtn');await page.waitForFunction(()=>document.getElementById('wxTemp').textContent!=='—°',{timeout:30000});await page.click('#fsLangToggle');await wait(1500);
            const wx=await page.evaluate(()=>({condition:document.getElementById('wxCondition').textContent,status:document.getElementById('appStatus').textContent,head:document.querySelector('.pageHead h2').textContent}));
            if(dev.test(wx.condition)||dev.test(wx.status)||dev.test(wx.head))throw Error('Weather English mix '+JSON.stringify(wx));

            // SOURCES English static descriptions
            await page.goto(url(process.env.BASE,'sources.html'),{waitUntil:'domcontentloaded'});await page.click('#fsLangToggle');await wait(1200);
            const sources=await page.evaluate(()=>[...document.querySelectorAll('.pageHead,.sourceCard p,.notice')].map(x=>x.textContent).join(' '));if(dev.test(sources))throw Error('Sources English mix '+sources);

            // V24 MAP + RIVER SOURCE GUARD
            await page.goto(url(process.env.MAP,'?mapOnly=1&v25=1&testFocus=1'),{waitUntil:'domcontentloaded'});
            await page.waitForSelector('#map');await page.waitForFunction(()=>window.__fsRiverSourceHealth&&document.getElementById('fsRiver3Sheet'),{timeout:40000});await wait(6000);
            const map=await page.evaluate(()=>({guard:window.__fsRiverSourceHealth,sheet:!!document.getElementById('fsRiver3Sheet'),map:!!window.__fs?.map,scale:window.__floodsafeScaleBridge?.mode||null}));
            if(!map.sheet||!map.map||!map.guard||map.guard.staleExcluded<0||!String(map.guard.source).includes('DHM'))throw Error('River guard/map missing '+JSON.stringify(map));
            if(errors.length)throw Error('Page errors '+JSON.stringify(errors.slice(0,12)));
            console.log('PASS COMPLETE LIVE SAFETY GATE',{human:human.shown,alerts:{flood:alerts.stateFlood,road:alerts.stateRoad,district:alerts.stateDistrict},news,wx,map});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(3)});
          JS