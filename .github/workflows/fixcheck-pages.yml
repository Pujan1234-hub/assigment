name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - sw.js
      - auto-update.js
      - portfolio-floodsafe.js
      - fixcheck/**
      - team-tracker/**
      - floodsafe-nepal/**
      - .github/workflows/fixcheck-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare public site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          cp index.html _site/index.html
          cp sw.js _site/sw.js
          cp auto-update.js _site/auto-update.js
          cp portfolio-floodsafe.js _site/portfolio-floodsafe.js
          cp -R fixcheck _site/fixcheck
          cp -R team-tracker _site/team-tracker
          cp -R floodsafe-nepal _site/floodsafe-nepal

          printf '%s' "$GITHUB_SHA" > _site/build-version.txt

          # Main portfolio always loads the latest product module and checks for new deployments.
          sed -i 's#</head>#<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"></head>#' _site/index.html
          sed -i 's#</body>#<script src="./portfolio-floodsafe.js?v=2"></script><script src="./auto-update.js?v=2"></script></body>#' _site/index.html

          # Stable FloodSafe URL automatically serves the highest numbered version folder.
          LATEST_FLOOD=$(find floodsafe-nepal -maxdepth 1 -mindepth 1 -type d -name 'v[0-9]*' -printf '%f\n' | sort -V | tail -1)
          if [ -n "$LATEST_FLOOD" ] && [ -f "floodsafe-nepal/$LATEST_FLOOD/index.html" ]; then
            cp -R "floodsafe-nepal/$LATEST_FLOOD/." _site/floodsafe-nepal/
            echo "Stable FloodSafe URL now serves $LATEST_FLOOD"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify stable links and auto updater
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://pujan1234-hub.github.io/assigment
          for i in $(seq 1 20); do
            if curl -fsSL "$BASE/?t=$RANDOM" -o /tmp/home.html && curl -fsSL "$BASE/build-version.txt?t=$RANDOM" -o /tmp/version.txt && curl -fsSL "$BASE/floodsafe-nepal/?t=$RANDOM" -o /tmp/flood.html; then
              if grep -q 'portfolio-floodsafe.js?v=2' /tmp/home.html && grep -q 'auto-update.js?v=2' /tmp/home.html && grep -q 'बाढी सुरक्षा नेपाल' /tmp/flood.html && test -s /tmp/version.txt; then
                echo 'Stable links and automatic updater verified'
                exit 0
              fi
            fi
            sleep 3
          done
          echo 'Stable link verification failed'
          exit 1
