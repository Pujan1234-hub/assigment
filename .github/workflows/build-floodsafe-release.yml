name: Build FloodSafe Signed Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'floodsafe-nepal/**'
      - 'floodsafe-android-app/**'
      - 'data/**'
      - '.github/workflows/build-floodsafe-release.yml'

permissions:
  contents: read

concurrency:
  group: floodsafe-signed-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FLOODSAFE_KEYSTORE_PATH: /tmp/floodsafe-upload.jks
      FLOODSAFE_KEYSTORE_PASSWORD: ${{ secrets.FLOODSAFE_KEYSTORE_PASSWORD }}
      FLOODSAFE_KEY_ALIAS: ${{ secrets.FLOODSAFE_KEY_ALIAS }}
      FLOODSAFE_KEY_PASSWORD: ${{ secrets.FLOODSAFE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          sdkmanager --list_installed | grep -E 'platforms;android-36|build-tools;35.0.0'
      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Validate release signing secrets
        env:
          FLOODSAFE_KEYSTORE_BASE64: ${{ secrets.FLOODSAFE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          [ -n "$FLOODSAFE_KEYSTORE_BASE64" ] || { echo '::error::Missing FLOODSAFE_KEYSTORE_BASE64'; missing=1; }
          [ -n "$FLOODSAFE_KEYSTORE_PASSWORD" ] || { echo '::error::Missing FLOODSAFE_KEYSTORE_PASSWORD'; missing=1; }
          [ -n "$FLOODSAFE_KEY_ALIAS" ] || { echo '::error::Missing FLOODSAFE_KEY_ALIAS'; missing=1; }
          [ -n "$FLOODSAFE_KEY_PASSWORD" ] || { echo '::error::Missing FLOODSAFE_KEY_PASSWORD'; missing=1; }
          [ "$missing" -eq 0 ] || exit 1
          printf '%s' "$FLOODSAFE_KEYSTORE_BASE64" | base64 --decode > "$FLOODSAFE_KEYSTORE_PATH"
          test -s "$FLOODSAFE_KEYSTORE_PATH"
          chmod 600 "$FLOODSAFE_KEYSTORE_PATH"
          keytool -list -keystore "$FLOODSAFE_KEYSTORE_PATH" -storepass "$FLOODSAFE_KEYSTORE_PASSWORD" -alias "$FLOODSAFE_KEY_ALIAS" >/dev/null
      - name: Set Play Store release version
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/versionCode 14/versionCode 15/" floodsafe-android-app/app/build.gradle
          sed -i "s/versionName '0.7.0'/versionName '0.7.1'/" floodsafe-android-app/app/build.gradle
          grep -Fq 'versionCode 15' floodsafe-android-app/app/build.gradle
          grep -Fq "versionName '0.7.1'" floodsafe-android-app/app/build.gradle
      - name: Verify release source contract
        shell: bash
        run: |
          set -euo pipefail
          test ! -e data/floodsafe-people-status.json
          test ! -e floodsafe-nepal/v25/human-bootstrap.js
          test ! -e floodsafe-nepal/v25/human-current-guard.js
          test ! -e floodsafe-nepal/v25/human-final.js
          test ! -e floodsafe-nepal/v25/human-final-v2.js
          test ! -e floodsafe-nepal/v25/people.html
          ! grep -Fq 'id="impact"' floodsafe-nepal/v25/index.html
          grep -Fq 'id="bulletin"' floodsafe-nepal/v25/index.html
          grep -Fq 'news-live-v5.js?v=17' floodsafe-nepal/v25/index.html
          grep -Fq 'official-map-panel-v6.js' floodsafe-nepal/v25/map-side-panel-v1.js
          grep -Fq 'latest official reading always' floodsafe-nepal/v25/trusted-river-runtime-v3.js
          grep -Fq 'latest official rainfall' floodsafe-nepal/v25/trusted-rain-runtime-v1.js
          echo 'Release source guard PASS'
      - name: Build signed release APK and AAB
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          /tmp/gradle-8.11.1/bin/gradle -p floodsafe-android-app :app:clean :app:assembleRelease :app:bundleRelease --no-daemon
      - name: Verify release artifacts and signature
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/release/app-release.apk'
          AAB='floodsafe-android-app/app/build/outputs/bundle/release/app-release.aab'
          test -s "$APK"
          test -s "$AAB"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          jarsigner -verify "$AAB" >/dev/null
          unzip -p "$APK" assets/floodsafe-nepal/v25/index.html > /tmp/floodsafe-release-index.html
          ! grep -Fq 'id="disasterStatus"' /tmp/floodsafe-release-index.html
          grep -Fq 'id="bulletin"' /tmp/floodsafe-release-index.html
          grep -Fq 'news-live-v5.js?v=17' /tmp/floodsafe-release-index.html
          unzip -l "$APK" | grep -Fq 'assets/floodsafe-nepal/v25/official-map-panel-v6.js'
          sha256sum "$APK" "$AAB" | tee floodsafe-android-app/app/build/outputs/release-sha256.txt
          echo 'Signed release verification PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-Signed-Release-v0.7.1
          path: |
            floodsafe-android-app/app/build/outputs/apk/release/app-release.apk
            floodsafe-android-app/app/build/outputs/bundle/release/app-release.aab
            floodsafe-android-app/app/build/outputs/release-sha256.txt
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$FLOODSAFE_KEYSTORE_PATH"
