name: FloodSafe V25 Realtime Gate
on:
  push:
    branches: ["main"]
    paths:
      - "floodsafe-nepal/v25/**"
      - "data/floodsafe-people-status.json"
      - ".github/workflows/v25-browser-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: floodsafe-v25-realtime-gate
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for current GitHub Pages deployment
        run: |
          set -euo pipefail
          BASE='https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/'
          ok=0
          for i in $(seq 1 60); do
            curl --max-time 10 -fsSL "${BASE}?ci=${GITHUB_SHA}-${i}" -o /tmp/index.html || true
            if grep -Fq 'news-live-v3.js?v=4' /tmp/index.html && grep -Fq 'map-v3.js?v=2' /tmp/index.html && grep -Fq 'id="liveNews"' /tmp/index.html; then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1
          for f in flood-only.js flood-freshness.js news-live-v3.js map-v3.js; do
            curl --max-time 12 -fsSL "${BASE}${f}?ci=${GITHUB_SHA}" -o "/tmp/${f}"
            node --check "/tmp/${f}"
          done
          grep -Fq 'FRESH=30*60*1000' /tmp/news-live-v3.js
          grep -Fq "document.getElementById('liveNews')" /tmp/news-live-v3.js
          grep -Fq "setInterval(()=>syncRonb(false),10000)" /tmp/news-live-v3.js
          grep -Fq "setInterval(poll,5000)" /tmp/flood-only.js
          grep -Fq 'overpass-api.de/api/interpreter' /tmp/map-v3.js

      - name: Verify live upstream sources
        run: |
          set -euo pipefail
          curl --max-time 20 -fsSL 'https://bipadportal.gov.np/api/v1/river-stations/?limit=1000' -o /tmp/bipad.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/bipad.json'))
          rows=j if isinstance(j,list) else j.get('results') or j.get('data') or []
          assert len(rows)>0, 'BIPAD river station feed empty'
          print('BIPAD rows',len(rows))
          PY
          curl --max-time 20 -fsSL 'https://www.ronbpost.com/wp-json/wp/v2/posts?per_page=5&_fields=date_gmt,modified_gmt,link,title' -o /tmp/ronb.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/ronb.json'))
          assert isinstance(j,list) and j, 'RONB feed empty'
          assert j[0].get('link') and j[0].get('title'), 'RONB latest post malformed'
          print('RONB latest',j[0].get('date_gmt'),j[0].get('link'))
          PY
          curl --max-time 25 -fsSL -X POST 'https://overpass-api.de/api/interpreter' \
            --data-urlencode 'data=[out:json][timeout:15];(way["waterway"="river"](27.60,85.20,27.80,85.55);way["waterway"="stream"](27.60,85.20,27.80,85.55););out tags geom 25;' \
            -o /tmp/river.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/river.json'))
          a=[x for x in j.get('elements',[]) if len(x.get('geometry',[]))>1]
          assert a, 'Overpass returned no river geometry'
          print('Overpass river geometries',len(a))
          PY

      - name: Browser map news and freshness smoke
        env:
          BASE: https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"; test -n "$CHROME"
          mkdir -p /tmp/floodsafe && cd /tmp/floodsafe
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24.31.0 >/dev/null 2>&1
          BASE="$BASE" CHROME="$CHROME" node <<'JS'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            page.setDefaultTimeout(60000); page.setDefaultNavigationTimeout(60000);
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(process.env.BASE+'?ci='+Date.now(),{waitUntil:'networkidle2'});
            await page.waitForSelector('#riverMapV3'); await page.waitForSelector('.districtV3'); await page.waitForSelector('#liveNews');
            const base=await page.evaluate(()=>({districts:document.querySelectorAll('.districtV3').length,labels:document.querySelectorAll('.districtLabelV3').length,mapRect:(()=>{const r=document.querySelector('#riverMapV3').getBoundingClientRect();return [r.width,r.height]})(),stationText:document.querySelector('#stationCount')?.textContent||''}));
            if(base.districts<70||base.labels<70||base.mapRect[0]<250||base.mapRect[1]<300) throw Error('map base invalid '+JSON.stringify(base));
            await page.waitForFunction(()=>document.querySelector('#stationCount')?.textContent!=='—',{timeout:30000}).catch(()=>{});
            const newsAges=await page.$$eval('#liveNews .newsItem .meta',els=>els.map(e=>e.textContent));
            if(newsAges.some(t=>/घण्टा|दिन|hour|day/i.test(t))) throw Error('old news rendered '+JSON.stringify(newsAges));
            if(document.querySelector){/* keep parser happy */}
            await page.$eval('.districtV3',el=>{const r=el.getBoundingClientRect();el.dispatchEvent(new MouseEvent('click',{bubbles:true,clientX:r.left+r.width/2,clientY:r.top+r.height/2}));});
            await page.waitForSelector('.selectedPointV3',{timeout:10000});
            await page.waitForFunction(()=>document.querySelectorAll('.riverV3').length>0,{timeout:45000});
            const map=await page.evaluate(()=>({rivers:document.querySelectorAll('.riverV3').length,marker:!!document.querySelector('.selectedPointV3'),hint:document.querySelector('#mapHint')?.textContent||'',vb:document.querySelector('#riverMapV3')?.getAttribute('viewBox')||''}));
            if(!map.marker||map.rivers<1) throw Error('map interaction failed '+JSON.stringify(map));
            const feed=await page.evaluate(async()=>{const r=await fetch('https://bipadportal.gov.np/api/v1/river-stations/?limit=1000',{cache:'no-store'});const j=await r.json();const a=Array.isArray(j)?j:(j.results||j.data||[]);return a.length});
            if(feed<1) throw Error('browser BIPAD fetch empty');
            if(errors.length) throw Error('page errors '+JSON.stringify(errors.slice(0,10)));
            console.log('PASS FloodSafe realtime gate',{base,map,feed,newsAges:newsAges.slice(0,5)}); await browser.close();
          })().catch(e=>{console.error(e);process.exit(3)});
          JS
