name: FloodSafe core official feed sync

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/floodsafe-core-sync.yml'
      - 'scripts/floodsafe-core-sync.py'

permissions:
  contents: write

concurrency:
  group: floodsafe-core-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch official DHM and BIPAD river feeds
        run: python scripts/floodsafe-core-sync.py

      - name: Validate current river snapshot
        run: |
          python -m json.tool data/floodsafe-core.json >/dev/null
          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta

          j=json.load(open('data/floodsafe-core.json'))
          src=j.get('sources',{}).get('rivers',{})
          rivers=j.get('rivers',[])
          now=datetime.now(timezone.utc)

          assert j.get('schema_version',0) >= 4, j.get('schema_version')
          assert src.get('count',0) >= 120, src

          def parse_time(row):
              raw=(row.get('waterLevelOn') or row.get('water_level_on') or
                   row.get('measuredOn') or row.get('measured_on') or
                   row.get('updatedOn') or row.get('updated_at') or
                   row.get('retrievedAt'))
              if not raw: return None
              try:
                  d=datetime.fromisoformat(str(raw).replace('Z','+00:00'))
                  return d if d.tzinfo else d.replace(tzinfo=timezone.utc)
              except Exception:
                  return None

          def measured(row):
              for k in ('waterLevel','water_level','currentWaterLevel','current_water_level','currentLevel','current_level','level'):
                  if row.get(k) not in (None,''):
                      return True
              return False

          def official(row):
              ds=str(row.get('dataSource') or row.get('data_source') or '').lower()
              url=str(row.get('_officialLivePage') or '').lower()
              return bool(row.get('_officialLive')) or 'dhm' in ds or 'hydrology.gov.np' in ds or 'bipad' in ds or 'dhm.gov.np' in url

          fresh=[]
          for r in rivers:
              if not isinstance(r,dict) or not measured(r) or not official(r):
                  continue
              t=parse_time(r)
              if not t: continue
              age=now-t.astimezone(timezone.utc)
              if timedelta(minutes=-5) <= age <= timedelta(minutes=20):
                  fresh.append(r)

          # The map is allowed to publish only when at least one genuinely
          # timestamped official observation is current.  Do not require
          # specific stations or the DHM homepage because those pages can be
          # empty/dynamic while BIPAD's official DHM-backed river feed is live.
          assert fresh, 'No official river observation <=20 minutes; preserve the last good snapshot instead of publishing fake current data.'
          newest=max(parse_time(r).astimezone(timezone.utc) for r in fresh)
          print('river snapshot',src.get('count'),'fresh<=20m',len(fresh),'newest',newest.isoformat())
          for r in fresh[:10]:
              print('LIVE',r.get('title') or r.get('river_name') or r.get('name'),r.get('waterLevel') or r.get('water_level'),parse_time(r).isoformat())
          PY

      - name: Commit refreshed river snapshot immediately
        shell: bash
        run: |
          if git diff --quiet -- data/floodsafe-core.json; then
            echo 'No river snapshot change.'
            exit 0
          fi
          git config user.name 'FloodSafe live sync'
          git config user.email 'actions@users.noreply.github.com'
          git add data/floodsafe-core.json
          git commit -m '[auto] refresh FloodSafe realtime rivers'
          git pull --rebase origin main
          git push origin HEAD:main
