name: FloodSafe Map Acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'floodsafe-nepal/v25/index.html'
      - 'floodsafe-nepal/v25/map-*.js'
      - 'floodsafe-nepal/v25/trusted-river-runtime-v1.js'
      - 'floodsafe-nepal/v25/river-line-status-v1.js'
      - '.github/workflows/floodsafe-map-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: floodsafe-map-acceptance
  cancel-in-progress: true
jobs:
  live-map:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for this map build on GitHub Pages
        run: |
          set -euo pipefail
          U='https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/'
          ok=0
          for i in $(seq 1 90); do
            html="$(curl --max-time 10 -fsSL "${U}?accept=${GITHUB_SHA}-${i}" || true)"
            if printf '%s' "$html" | grep -Eq 'trusted-river-runtime-v1\.js\?v=[0-9]+' && printf '%s' "$html" | grep -Fq 'map-loader-v3.js?v=4'; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
          curl --max-time 10 -fsSL "${U}trusted-river-runtime-v1.js?accept=${GITHUB_SHA}" | grep -Fq 'MIRROR_MAX=5*60*1000'
          curl --max-time 10 -fsSL "${U}map-stable-v2.js?v=5&accept=${GITHUB_SHA}" | grep -Fq 'MAX_AGE=20*60*1000'
          curl --max-time 10 -fsSL "${U}map-runtime-fix-v1.js?v=2&accept=${GITHUB_SHA}" | grep -Fq '#22a7ff'

      - name: Browser cross-check official mirror and live map
        env:
          APP: https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          mkdir -p /tmp/mapaccept && cd /tmp/mapaccept
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24.31.0 >/dev/null 2>&1
          APP="$APP" CHROME="$CHROME" node <<'JS'
          const puppeteer=require('puppeteer-core');
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage']});
            const p=await b.newPage();p.setDefaultTimeout(90000);
            p.on('console',m=>console.log('PAGE',m.type(),m.text()));
            await p.goto(process.env.APP+'?mapaccept='+Date.now()+'#map',{waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>window.__fsMapRuntimeGuardLoaded&&window.FloodSafeMap?.initialized,{timeout:90000});
            await p.waitForFunction(()=>window.FloodSafeMap?.nationalRiverCount>=500,{timeout:90000});
            await wait(7000);
            const result=await p.evaluate(async()=>{
              const MAX=20*60*1000,FUT=5*60*1000,MIRROR_MAX=5*60*1000;
              const val=(o,ks)=>{for(const k of ks){const v=o?.[k];if(v!==undefined&&v!==null&&v!=='')return v}return null};
              const flat=o=>o&&typeof o==='object'&&o.fields&&typeof o.fields==='object'?Object.assign({},o.fields,o):o;
              const st=o=>val(flat(o),['_measurementTime','waterLevelOn','water_level_on','measuredOn','measured_on','measurementTime','observationTime']);
              const lv=o=>{const n=Number(val(flat(o),['waterLevel','water_level','currentWaterLevel','current_water_level','currentLevel','current_level','level']));return Number.isFinite(n)?n:null};
              const valid=o=>{o=flat(o);const t=+new Date(st(o)||0),age=Date.now()-t;return o&&o._measurementTimeTrusted!==false&&o._current20m!==false&&t&&lv(o)!==null&&age>=-FUT&&age<=MAX};
              const key=o=>{o=flat(o);const id=val(o,['stationSeriesId','station_series_id','stationId','station_id','id']);if(id!==null)return 'id:'+id;const n=val(o,['title','river_name','riverName','station_name','stationName','name']);return n!==null?'name:'+String(n).toLowerCase().trim():''};
              const r=await fetch(new URL('../../data/floodsafe-core.json?accept='+Date.now(),location.href),{cache:'no-store'});
              if(!r.ok)throw Error('mirror HTTP '+r.status);
              const mirror=await r.json();
              const generated=+new Date(mirror?.generated_at||0),mirrorAge=generated?Date.now()-generated:Infinity;
              const official=(Array.isArray(mirror?.rivers)?mirror.rivers:[]).filter(valid);
              const state=(window.FloodSafe?.state?.stations||[]).filter(valid);
              let sample=null;
              if(official.length){
                const a=official[0],k=key(a),s=state.find(x=>key(x)===k);
                sample={key:k,mirrorLevel:lv(a),appLevel:s?lv(s):null,mirrorTime:st(a),appTime:s?st(s):null};
              }
              const map=window.FloodSafeMap.map;
              const src=map.getSource('gauges');
              const serialized=src?src.serialize?.():null;
              const features=serialized?.data?.features||[];
              const stale=features.filter(f=>{const t=+new Date(f.properties?.time||0),a=Date.now()-t;return !t||a<-FUT||a>MAX});
              const riverPaint=JSON.stringify(map.getPaintProperty('river-base','line-color'));
              const gaugePaint=JSON.stringify(map.getPaintProperty('gauges','circle-color'));
              return {
                districts:window.FloodSafeMap.districtCount,
                rivers:window.FloodSafeMap.nationalRiverCount,
                mirrorAge,mirrorCurrent:official.length,stateCurrent:state.length,sample,
                gauges:features.length,staleGauges:stale.length,
                riverPaint,gaugePaint,
                feed:window.FloodSafe?.state?.feedSource||'',
                hint:document.getElementById('mapHint')?.textContent||''
              };
            });
            console.log('MAP RESULT',JSON.stringify(result));
            if(result.districts<77)throw Error('districts '+result.districts);
            if(result.rivers<500)throw Error('river routes '+result.rivers);
            if(result.mirrorAge<0||result.mirrorAge>5*60*1000)throw Error('official mirror stale '+result.mirrorAge+'ms');
            if(result.mirrorCurrent!==result.stateCurrent)throw Error('mirror/app current count mismatch '+result.mirrorCurrent+' vs '+result.stateCurrent);
            if(result.sample&&(result.sample.appLevel===null||Math.abs(result.sample.mirrorLevel-result.sample.appLevel)>1e-9||result.sample.mirrorTime!==result.sample.appTime))throw Error('mirror/app sample mismatch '+JSON.stringify(result.sample));
            if(result.staleGauges!==0)throw Error('stale gauges visible '+result.staleGauges);
            if(!result.riverPaint.includes('#22a7ff')||!result.riverPaint.includes('#ff8a00')||!result.riverPaint.includes('#ff2d20'))throw Error('river colours '+result.riverPaint);
            if(!result.gaugePaint.includes('#22a7ff'))throw Error('normal gauge not blue '+result.gaugePaint);
            if(result.mirrorCurrent>0&&result.gauges===0)throw Error('official mirror current but map has zero gauges');
            await p.evaluate(()=>window.FloodSafe.setFocus(27.7172,85.3240,'gps'));
            await wait(1800);
            const gps=await p.evaluate(()=>{const c=window.FloodSafeMap.map.getCenter(),s=window.FloodSafe.state;return{lat:c.lat,lon:c.lng,kind:s.kind,stateLat:s.lat,stateLon:s.lon}});
            console.log('GPS RESULT',JSON.stringify(gps));
            if(gps.kind!=='gps'||Math.abs(gps.lat-27.7172)>.03||Math.abs(gps.lon-85.324)>.03)throw Error('GPS map follow failed '+JSON.stringify(gps));
            console.log('PASS FloodSafe map acceptance');
            await b.close();
          })().catch(e=>{console.error(e);process.exit(3)});
          JS
