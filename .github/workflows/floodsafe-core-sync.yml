name: FloodSafe core official feed sync

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/floodsafe-core-sync.yml'
      - 'scripts/floodsafe-core-sync.py'

permissions:
  contents: write

concurrency:
  group: floodsafe-core-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch official DHM and BIPAD river feeds
        run: python scripts/floodsafe-core-sync.py

      - name: Validate current river snapshot
        run: |
          python -m json.tool data/floodsafe-core.json >/dev/null
          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          j=json.load(open('data/floodsafe-core.json'))
          src=j.get('sources',{}).get('rivers',{})
          assert j.get('schema_version',0) >= 4, j.get('schema_version')
          assert src.get('count',0) >= 150, src
          assert src.get('live_60m_count',0) >= 5, src
          newest=datetime.fromisoformat(src['newest_measurement'].replace('Z','+00:00'))
          assert datetime.now(timezone.utc)-newest.astimezone(timezone.utc) < timedelta(minutes=60), src
          print('river snapshot',src.get('count'),'live<=60m',src.get('live_60m_count'),'DHM live',src.get('dhm_live_page_count'),'newest',newest.isoformat())
          PY

      - name: Commit refreshed river snapshot immediately
        shell: bash
        run: |
          if git diff --quiet -- data/floodsafe-core.json; then
            echo 'No river snapshot change.'
            exit 0
          fi
          git config user.name 'FloodSafe live sync'
          git config user.email 'actions@users.noreply.github.com'
          git add data/floodsafe-core.json
          git commit -m '[auto] refresh FloodSafe realtime rivers'
          git pull --rebase origin main
          git push origin HEAD:main
