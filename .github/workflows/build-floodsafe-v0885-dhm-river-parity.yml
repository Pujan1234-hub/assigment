name: Build FloodSafe v0.8.85 DHM River Parity APK

on:
  push:
    branches: [ fix/floodsafe-v0882-realtime-river-rain ]
    paths:
      - '.github/workflows/build-floodsafe-v0885-dhm-river-parity.yml'
      - 'floodsafe-android-app/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Fetch official DHM River Watch map metadata and river network
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,urllib.request,urllib.parse
          from pathlib import Path
          out=Path('floodsafe-android-app/app/src/main/assets/data');out.mkdir(parents=True,exist_ok=True)
          H={'User-Agent':'Mozilla/5.0 FloodSafeNepal/0.8.85','Accept':'*/*','Cache-Control':'no-cache'}
          def get(url,timeout=180):
              req=urllib.request.Request(url,headers=H)
              with urllib.request.urlopen(req,timeout=timeout) as r:return r.read().decode('utf-8','replace')
          river_url='https://dhm.gov.np/assets/frontend/geo/River_All.geojson'
          river_text=get(river_url,90);river=json.loads(river_text)
          feats=river.get('features',[]) if isinstance(river,dict) else []
          if not isinstance(river,dict) or river.get('type')!='FeatureCollection' or len(feats)<1:raise SystemExit('DHM River_All.geojson contract failed')
          (out/'dhm-river-all-v0885.geojson').write_text(json.dumps(river,separators=(',',':'),ensure_ascii=False),encoding='utf-8')
          page=get('https://www.dhm.gov.np/hydrology/river-watch',210)
          marker='var coordinates =';p=page.find(marker)
          if p<0:raise SystemExit('DHM coordinates marker missing')
          s=page.find('[',p+len(marker))
          if s<0:raise SystemExit('DHM coordinates array start missing')
          depth=0;quote=None;esc=False;e=-1
          for i in range(s,len(page)):
              ch=page[i]
              if quote:
                  if esc:esc=False
                  elif ch=='\\':esc=True
                  elif ch==quote:quote=None
              else:
                  if ch in ('"',"'"):quote=ch
                  elif ch=='[':depth+=1
                  elif ch==']':
                      depth-=1
                      if depth==0:e=i+1;break
          if e<0:raise SystemExit('DHM coordinates array end missing')
          rows=json.loads(page[s:e]);slim=[]
          for x in rows:
              if not isinstance(x,dict):continue
              try: la=float(x.get('latitude'));lo=float(x.get('longitude'))
              except Exception:continue
              if not (26.0<=la<=31.0 and 80.0<=lo<=89.0):continue
              slim.append({'id':x.get('id'),'stationIndex':str(x.get('stationIndex') or '').strip(),'name':str(x.get('name') or '').strip(),'basin':str(x.get('basin') or '').strip(),'district':str(x.get('district') or '').strip(),'latitude':la,'longitude':lo})
          if len(slim)<280:raise SystemExit(f'DHM coordinate rows too small: {len(slim)}')
          (out/'dhm-river-watch-stations-v0885.json').write_text(json.dumps(slim,separators=(',',':'),ensure_ascii=False),encoding='utf-8')
          body=urllib.parse.urlencode({'type':'0','mapValue':'all'}).encode()
          req=urllib.request.Request('https://dhm.gov.np/site/riverWatchTableViewData',data=body,method='POST',headers={**H,'Accept':'application/json,*/*','Content-Type':'application/x-www-form-urlencoded; charset=UTF-8','X-Requested-With':'XMLHttpRequest','Referer':'https://www.dhm.gov.np/hydrology/river-watch'})
          with urllib.request.urlopen(req,timeout=60) as r:feed=json.loads(r.read().decode('utf-8','replace'))
          live=feed.get('data',[]) if isinstance(feed,dict) else []
          valid=[x for x in live if isinstance(x,dict) and isinstance(x.get('waterLevel'),dict) and x['waterLevel'].get('datetime') and x['waterLevel'].get('value') is not None]
          if feed.get('status')!='success' or len(live)<300 or len(valid)<50:raise SystemExit(f'DHM current feed contract failed rows={len(live)} valid={len(valid)}')
          severe=[x for x in valid if str(x.get('status','')).upper() in ('WARNING','DANGER')]
          print(f'V0885_OFFICIAL_DHM_ASSETS PASS river_features={len(feats)} station_coords={len(slim)} current_rows={len(live)} valid_readings={len(valid)} severe_now={len(severe)}')
          if severe:
              x=severe[0];print('CURRENT_SEVERE_SAMPLE',x.get('name'),x.get('status'),x.get('waterLevel'),x.get('warning_level'),x.get('danger_level'))
          PY

      - name: Apply native chain through v0.8.85
        run: |
          python3 floodsafe-android-app/run_patch_native_v0877.py
          python3 floodsafe-android-app/patch_native_v0878_station_resilience.py
          python3 floodsafe-android-app/patch_native_v0879_full_river_geometry.py
          python3 floodsafe-android-app/patch_native_v0880_viewport_same_river_detail.py
          python3 floodsafe-android-app/run_patch_native_v0881.py
          python3 floodsafe-android-app/patch_native_v0883_map_camera_river_tap.py
          python3 floodsafe-android-app/run_patch_native_v0884.py
          python3 floodsafe-android-app/patch_native_v0885_dhm_river_parity.py

      - name: Verify DHM parity contracts
        shell: bash
        run: |
          set -euo pipefail
          A='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/NativeFullActivity.java'
          M='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java'
          G='floodsafe-android-app/app/build.gradle'
          grep -Fq 'https://dhm.gov.np/site/riverWatchTableViewData' "$A"
          grep -Fq 'V0885_DHM_RIVERWATCH_PRIMARY' "$A"
          grep -Fq 'V0885_DHM_CURRENT_OFFICIAL_TRUTH' "$A"
          grep -Fq '_floodsafeCurrentOfficial' "$A"
          grep -Fq 'DHM River Watch' "$A"
          ! grep -Fq 'LIVE (≤20m)' "$A"
          grep -Fq 'V0885_DHM_OFFICIAL_RIVER_NETWORK' "$M"
          grep -Fq 'data/dhm-river-all-v0885.geojson' "$M"
          grep -Fq 'V0884_STATUS_COLOUR_FLOW_GLOW' "$M"
          grep -Fq 'V0884_REAL_RIVER_DETAIL_TIME_SOURCE_THRESHOLDS' "$M"
          grep -Fq 'versionCode 105' "$G"
          grep -Fq "versionName '0.8.85'" "$G"
          test -s floodsafe-android-app/app/src/main/assets/data/dhm-river-all-v0885.geojson
          test -s floodsafe-android-app/app/src/main/assets/data/dhm-river-watch-stations-v0885.json
          echo 'V0885_DHM_PARITY_CONTRACT PASS'

      - name: Bundle source assets
        run: gradle -p floodsafe-android-app clean :app:bundleFloodSafe --no-daemon

      - name: Rebuild detailed Nepal river assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet shapely
          python3 floodsafe-android-app/preclip_nepal_waterways.py
          python3 floodsafe-android-app/rebalance_nepal_overview_v0839.py
          python3 floodsafe-android-app/build_regional_river_tiles_v0840.py
          python3 floodsafe-android-app/build_national_river_network_v0841.py
          python3 floodsafe-android-app/build_progressive_river_tiers_v0842.py
          python3 floodsafe-android-app/build_progressive_river_names_v0863.py
          python3 floodsafe-android-app/postclip_nepal_display_rivers_v0874.py

      - name: Unit test and build APK
        run: gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug -x bundleFloodSafe --no-daemon --stacktrace

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -Fq 'assets/data/dhm-river-all-v0885.geojson'
          unzip -l "$APK" | grep -Fq 'assets/data/dhm-river-watch-stations-v0885.json'
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-waterways-tiles/overview.json'
          cp "$APK" FloodSafe-Nepal-v0.8.85-DHM-RIVER-PARITY-FIELD-TEST.apk
          sha256sum FloodSafe-Nepal-v0.8.85-DHM-RIVER-PARITY-FIELD-TEST.apk | tee FloodSafe-Nepal-v0.8.85-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-v0885-DHM-RIVER-PARITY-FIELD-TEST
          path: |
            FloodSafe-Nepal-v0.8.85-DHM-RIVER-PARITY-FIELD-TEST.apk
            FloodSafe-Nepal-v0.8.85-SHA256.txt
          retention-days: 14
