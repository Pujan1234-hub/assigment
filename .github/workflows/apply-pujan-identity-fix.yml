name: Apply Pujan identity facts

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-pujan-identity-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch only Jhapa wording
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_about = 'is an independent software developer born in <strong>Jhapa, Nepal</strong>.'
          new_about = 'is an independent software developer from <strong>Jhapa, Nepal</strong>.'
          if old_about in s:
              s = s.replace(old_about, new_about, 1)
          elif new_about not in s:
              raise SystemExit('Expected About wording not found; refusing broad edit')

          old_schema_desc = '"description": "Independent software developer born in Jhapa, Nepal. Studied Computer Science at Hrit Academy and completed a Bachelor\'s degree in Computer Science at the University of Wolverhampton. PJBUILTS is his personal developer brand and portfolio.",'
          new_schema_desc = '"description": "Independent software developer from Jhapa, Nepal. Studied Computer Science at Hrit Academy and completed a Bachelor\'s degree in Computer Science at the University of Wolverhampton. PJBUILTS is his personal developer brand and portfolio.",'
          if old_schema_desc in s:
              s = s.replace(old_schema_desc, new_schema_desc, 1)
          elif new_schema_desc not in s:
              raise SystemExit('Expected schema description not found; refusing broad edit')

          birthplace_block = '    "birthPlace": {\n      "@type": "Place",\n      "name": "Jhapa, Nepal"\n    },\n'
          if birthplace_block in s:
              s = s.replace(birthplace_block, '', 1)

          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          grep -q 'developer from <strong>Jhapa, Nepal</strong>' index.html
          grep -q 'Independent software developer from Jhapa, Nepal' index.html
          if grep -q 'born in Jhapa, Nepal' index.html; then
            echo 'Old born wording still present' >&2
            exit 1
          fi
          if grep -q '"birthPlace"' index.html; then
            echo 'birthPlace schema still present' >&2
            exit 1
          fi

      - name: Commit targeted Jhapa wording correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use from Jhapa wording in Pujan profile'
          git push origin main
