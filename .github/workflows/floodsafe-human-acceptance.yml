name: FloodSafe Human Status Acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/floodsafe-browser-transitions.cjs'
      - '.github/workflows/floodsafe-human-acceptance.yml'
  workflow_run:
    workflows: ['Deploy Portfolio to GitHub Pages']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: floodsafe-human-acceptance
  cancel-in-progress: true
jobs:
  live-human-status:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source count parsing and stale-report handling
        run: node --test --test-name-pattern='human|one human' tests/floodsafe-refresh.test.cjs
      - name: Verify live UI and intercepted fresh/expired/offline transitions
        run: |
          npm install --prefix /tmp/floodsafe-browser --no-save puppeteer-core@24.31.0
          export NODE_PATH=/tmp/floodsafe-browser/node_modules
          export CHROME="$(command -v google-chrome || command -v chromium)"
          node tests/floodsafe-live-browser.cjs
