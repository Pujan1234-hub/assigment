name: Build FixCheck Desktop Apps

on:
  workflow_dispatch:
  push:
    paths:
      - 'fixcheck/**'
      - 'fixcheck-app/**'
      - '.github/workflows/build-fixcheck-desktop.yml'

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: fixcheck-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows portable app
        run: npm run desktop:dist -- --win portable --publish never
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: FixCheck-Windows
          path: fixcheck-app/dist/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: fixcheck-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build unsigned macOS app
        run: npm run desktop:dist -- --mac zip --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: FixCheck-macOS-unsigned
          path: fixcheck-app/dist/*.zip
          if-no-files-found: error
