name: Package FloodSafe Native Android Source

on:
  push:
    paths:
      - '.github/workflows/package-floodsafe-native-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write snapshot metadata
        shell: bash
        run: |
          cat > SOURCE_SNAPSHOT.txt <<EOF
          FloodSafe Nepal Native Android Source Snapshot
          Repository: Pujan1234-hub/assigment
          Commit: $GITHUB_SHA
          Branch: $GITHUB_REF_NAME
          Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Includes: floodsafe-android-app, floodsafe-nepal, data
          EOF
      - name: Upload native Android source bundle
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-Latest-Native-Android-Source
          path: |
            floodsafe-android-app
            floodsafe-nepal
            data
            SOURCE_SNAPSHOT.txt
          if-no-files-found: error
          retention-days: 7
