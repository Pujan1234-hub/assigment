name: FloodSafe v0.9.09 FINAL VERIFIED

on:
  push:
    branches: [ fix/floodsafe-v0908-storm-events-compact-gauge ]
    paths:
      - '.github/workflows/floodsafe-v0909-final-verified.yml'
      - 'floodsafe-android-app/patch_native_v0909_sync_sathi_language.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Freeze official river sources
        shell: bash
        run: |
          set -euo pipefail
          J='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app'
          sha256sum "$J/BipadRealtimeStationFeed.java" "$J/OfficialRiverData.java" "$J/DhmRainMirror.java" "$J/FloodMonitorService.java" > /tmp/river.before

      - name: Rebuild verified v0.9.08 base
        shell: bash
        run: |
          set -euo pipefail
          python3 floodsafe-android-app/patch_native_language_safe.py
          python3 floodsafe-android-app/patch_native_weather_complete.py
          python3 floodsafe-android-app/patch_native_weather_station_correction.py
          python3 floodsafe-android-app/patch_native_v0906_district_196_rain.py
          python3 floodsafe-android-app/patch_native_v0907_district_click.py
          python3 floodsafe-android-app/patch_native_v0908_step1_river_click.py
          python3 floodsafe-android-app/patch_native_v0908_step2_compact_district.py
          python3 floodsafe-android-app/fix_v0908_step3_weather_refresh_anchor.py
          python3 floodsafe-android-app/patch_native_v0908_step3_storm_notifications.py
          grep -Fq "versionName '0.9.08-storm-events-compact-gauge'" floodsafe-android-app/app/build.gradle
          J='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app'
          sha256sum "$J/FloodSafeNativeMapView.java" "$J/WeatherMapOverlayController.java" > /tmp/mapweather.v0908
          gradle -p floodsafe-android-app :app:compileDebugJavaWithJavac --no-daemon

      - name: Apply v0.9.09 requested fixes only
        shell: bash
        run: |
          set -euo pipefail
          python3 floodsafe-android-app/patch_native_v0909_sync_sathi_language.py
          J='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app'
          UI="$J/NativeFullActivity.java"
          grep -Fq 'V0909_BIPAD_FOREGROUND_PARITY' "$UI"
          grep -Fq 'main.postDelayed(v0909RiverRefreshTick,60L*1000L)' "$UI"
          grep -Fq 'V0909_ALL_77_DISTRICTS' "$UI"
          grep -Fq 'V0909_EMPTY_DISTRICT_VISIBLE' "$UI"
          grep -Fq 'V0909_SATHI_TEXT_AND_VOICE' "$UI"
          grep -Fq 'Type your question here' "$UI"
          grep -Fq 'V0909_FAST_LANGUAGE_NO_RECREATE' "$UI"
          grep -Fq 'V0909_LANGUAGE_PRESERVE_MAP' "$UI"
          ! grep -Fq 'recreate();' "$UI"
          grep -Fq "versionName '0.9.09-live77-sathi-fastlang'" floodsafe-android-app/app/build.gradle
          sha256sum "$J/FloodSafeNativeMapView.java" "$J/WeatherMapOverlayController.java" > /tmp/mapweather.v0909
          cmp /tmp/mapweather.v0908 /tmp/mapweather.v0909
          sha256sum "$J/BipadRealtimeStationFeed.java" "$J/OfficialRiverData.java" "$J/DhmRainMirror.java" "$J/FloodMonitorService.java" > /tmp/river.after
          cmp /tmp/river.before /tmp/river.after

      - name: Verify 77 district source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('floodsafe-nepal/v24/nepal-districts.geojson')
          fs=json.loads(p.read_text()).get('features') or []
          names=[(f.get('properties') or {}).get('nameEn','').strip() for f in fs]
          assert len(fs)==77,len(fs)
          assert len(set(names))==77,len(set(names))
          assert all(names)
          print('DISTRICTS=77')
          PY

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/v0909.log

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'
          OUT='FloodSafe-Nepal-v0.9.09-LIVE77-SATHI-FASTLANG.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
          unzip -l "$APK" | grep -Fq 'assets/floodsafe-nepal/v24/nepal-districts.geojson'
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-waterways-tiles/overview.json'
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee FloodSafe-Nepal-v0.9.09-SHA256.txt
          printf '%s\n' \
            'FloodSafe Nepal v0.9.09 verified build' \
            '- BIPAD visible station set auto-refreshes every ~60s while app is open' \
            '- District chooser is sourced from bundled 77-district geometry, including districts with 0 current River Watch stations' \
            '- SATHI has typed question input plus existing voice input' \
            '- Language toggle updates in-place; Activity/MapLibre/location are not recreated' \
            '- Existing river source/mirror/monitor files unchanged' \
            '- Existing native river map and weather overlay files unchanged from verified v0.9.08' \
            > FloodSafe-Nepal-v0.9.09-NOTES.txt

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-v0909-FINAL-VERIFIED
          path: |
            FloodSafe-Nepal-v0.9.09-LIVE77-SATHI-FASTLANG.apk
            FloodSafe-Nepal-v0.9.09-SHA256.txt
            FloodSafe-Nepal-v0.9.09-NOTES.txt
          retention-days: 14

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-v0909-build-log
          path: /tmp/v0909.log
          if-no-files-found: ignore
          retention-days: 2
