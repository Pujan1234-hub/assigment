name: FloodSafe v0.9.14 CURRENT RAIN ONLY

on:
  push:
    branches: [ fix/floodsafe-v0908-storm-events-compact-gauge ]
    paths:
      - '.github/workflows/floodsafe-v0914-current-rain-only.yml'
      - 'floodsafe-android-app/patch_native_v0914_current_rain_only.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Rebuild verified v0.9.13 native base
        shell: bash
        run: |
          set -euo pipefail
          python3 floodsafe-android-app/patch_native_language_safe.py
          python3 floodsafe-android-app/patch_native_weather_complete.py
          python3 floodsafe-android-app/patch_native_weather_station_correction.py
          python3 floodsafe-android-app/patch_native_v0906_district_196_rain.py
          python3 floodsafe-android-app/patch_native_v0907_district_click.py
          python3 floodsafe-android-app/patch_native_v0908_step1_river_click.py
          python3 floodsafe-android-app/patch_native_v0908_step2_compact_district.py
          python3 floodsafe-android-app/fix_v0908_step3_weather_refresh_anchor.py
          python3 floodsafe-android-app/patch_native_v0908_step3_storm_notifications.py
          python3 floodsafe-android-app/patch_native_v0909_sync_sathi_language.py
          python3 floodsafe-android-app/fix_v0909_district_lambda_compile.py
          python3 floodsafe-android-app/patch_native_v0910_step1_sathi_chat.py
          python3 floodsafe-android-app/patch_native_v0910_step2_map_labels.py
          python3 floodsafe-android-app/run_v0911_patch_fixed.py
          python3 floodsafe-android-app/fix_v0911_threshold_order.py
          python3 floodsafe-android-app/patch_native_v0912_weather_rain_parity.py
          python3 floodsafe-android-app/patch_native_v0913_dhm_rain_overlay.py
          grep -Fq "versionCode 30" floodsafe-android-app/app/build.gradle
          grep -Fq "versionName '0.9.13-dhm-rain-overlay'" floodsafe-android-app/app/build.gradle

      - name: Freeze river BIPAD station alert and UI logic
        shell: bash
        run: |
          set -euo pipefail
          J='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app'
          sha256sum \
            "$J/BipadRealtimeStationFeed.java" \
            "$J/OfficialRiverData.java" \
            "$J/FloodMonitorService.java" \
            "$J/FloodSafeNativeMapView.java" \
            "$J/AffectedRiverAlertMatcher.java" \
            "$J/FloodLiveGaugeMonitor.java" \
            "$J/RiverAlertWorker.java" \
            "$J/RainAlertWorker.java" \
            "$J/NativeFullActivity.java" \
            > /tmp/v0914-protected.before

      - name: Apply current-rain-only correction
        shell: bash
        run: |
          set -euo pipefail
          python3 floodsafe-android-app/patch_native_v0914_current_rain_only.py

      - name: Verify current rain semantics
        shell: bash
        run: |
          set -euo pipefail
          J='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app'
          D="$J/DhmRainMirror.java"
          W="$J/WeatherMapOverlayController.java"
          V="$J/DhmCurrentRainVerifier.java"
          grep -Fq 'V0914_DHM_GAUGE_LOCATIONS_ONLY' "$D"
          grep -Fq 'static List<RainPoint> freshStationPoints()' "$D"
          grep -Fq 'V0914_CURRENT_RAIN_ONLY' "$W"
          grep -Fq 'DhmCurrentRainVerifier.currentRainPoints' "$W"
          ! grep -Fq 'DhmRainMirror.freshRainPoints()' "$W"
          grep -Fq 'V0914_CURRENT_RAIN_ONLY_VERIFIER' "$V"
          grep -Fq 'current=precipitation,weather_code' "$V"
          grep -Fq 'precipitation > 0d' "$V"
          grep -Fq '(weatherCode >= 51 && weatherCode <= 57)' "$V"
          grep -Fq '(weatherCode >= 61 && weatherCode <= 67)' "$V"
          grep -Fq '(weatherCode >= 80 && weatherCode <= 82)' "$V"
          grep -Fq '(weatherCode >= 95 && weatherCode <= 99)' "$V"
          grep -Fq 'MAX_CURRENT_AGE_MS = 7L * 60L * 1000L' "$V"
          grep -Fq "versionCode 31" floodsafe-android-app/app/build.gradle
          grep -Fq "versionName '0.9.14-current-rain-only'" floodsafe-android-app/app/build.gradle

      - name: Verify river BIPAD station alert and UI logic unchanged
        shell: bash
        run: |
          set -euo pipefail
          J='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app'
          sha256sum \
            "$J/BipadRealtimeStationFeed.java" \
            "$J/OfficialRiverData.java" \
            "$J/FloodMonitorService.java" \
            "$J/FloodSafeNativeMapView.java" \
            "$J/AffectedRiverAlertMatcher.java" \
            "$J/FloodLiveGaugeMonitor.java" \
            "$J/RiverAlertWorker.java" \
            "$J/RainAlertWorker.java" \
            "$J/NativeFullActivity.java" \
            > /tmp/v0914-protected.after
          cmp /tmp/v0914-protected.before /tmp/v0914-protected.after

      - name: Verify v0.9.11 safety rules remain
        shell: bash
        run: |
          set -euo pipefail
          J='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app'
          U="$J/NativeFullActivity.java"
          grep -Fq 'V0911_THRESHOLD_ORDER_GUARD' "$U"
          grep -Fq 'V0911_INVERTED_THRESHOLDS_NOT_TRUSTED' "$U"
          grep -Fq 'V0911_ALWAYS_VISIBLE_LANGUAGE' "$U"
          grep -Fq 'V0911_AFFECTED_RIVER_2KM_MATCHER' "$J/AffectedRiverAlertMatcher.java"
          grep -Fq 'V0911_FAST_ALERT_USES_AFFECTED_RIVER_GEOMETRY' "$J/FloodLiveGaugeMonitor.java"
          grep -Fq 'V0911_RAIN_START_STOP_EVENTS' "$J/RainAlertWorker.java"

      - name: Test and assemble native APK
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/v0914.log

      - name: Verify APK and stage artifact
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'
          OUT='FloodSafe-Nepal-v0.9.14-CURRENT-RAIN-ONLY.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -Fq 'AndroidManifest.xml'
          unzip -l "$APK" | grep -Fq 'assets/floodsafe-nepal/v24/nepal-districts.geojson'
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-waterways-tiles/overview.json'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee FloodSafe-Nepal-v0.9.14-SHA256.txt
          printf '%s\n' \
            'FloodSafe Nepal v0.9.14 current-rain-only build' \
            '- Rain animation is NOT driven by DHM 1-hour accumulation' \
            '- DHM gauge coordinates are used only as local sampling locations' \
            '- Animation appears only when current precipitation > 0 or current WMO drizzle/rain/showers/thunderstorm code confirms rain' \
            '- Current confirmations expire quickly so stopped rain does not remain animated' \
            '- River geometry, BIPAD station feed, station markers, river status, affected-river 2 km alerts, UI and background alert workers are unchanged' \
            > FloodSafe-Nepal-v0.9.14-NOTES.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-v0914-CURRENT-RAIN-ONLY
          path: |
            FloodSafe-Nepal-v0.9.14-CURRENT-RAIN-ONLY.apk
            FloodSafe-Nepal-v0.9.14-SHA256.txt
            FloodSafe-Nepal-v0.9.14-NOTES.txt
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-v0914-build-log
          path: /tmp/v0914.log
          if-no-files-found: ignore
          retention-days: 2
