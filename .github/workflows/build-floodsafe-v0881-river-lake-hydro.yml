name: Build FloodSafe v0.8.81 River Lake Hydro APK

on:
  push:
    branches: [ fix/floodsafe-full-river-detail-v0879 ]
    paths:
      - '.github/workflows/build-floodsafe-v0881-river-lake-hydro.yml'
      - 'floodsafe-android-app/patch_native_v0881_river_lake_hydro_details.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply known-good v0.8.77 baseline
        run: python3 floodsafe-android-app/run_patch_native_v0877.py

      - name: Apply v0.8.78 station resilience
        run: python3 floodsafe-android-app/patch_native_v0878_station_resilience.py

      - name: Apply v0.8.79 complete river geometry
        run: python3 floodsafe-android-app/patch_native_v0879_full_river_geometry.py

      - name: Apply v0.8.80 viewport same-river matching
        run: python3 floodsafe-android-app/patch_native_v0880_viewport_same_river_detail.py

      - name: Apply v0.8.81 river lake hydro detail
        run: python3 floodsafe-android-app/patch_native_v0881_river_lake_hydro_details.py

      - name: Verify v0.8.81 detail and safety contracts
        shell: bash
        run: |
          set -euo pipefail
          M='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java'
          A='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/NativeFullActivity.java'
          G='floodsafe-android-app/app/build.gradle'
          grep -Fq 'V0881_RIVER_FIRST_CLASS_DETAIL' "$M"
          grep -Fq 'V0881_NO_STATION_REDIRECT' "$M"
          grep -Fq 'V0881_HYDRO_WATERBODY_GEO' "$M"
          grep -Fq 'V0881_PUBLISH_HYDRO_WATERBODY_LAYERS' "$M"
          grep -Fq 'V0881_WATERBODY_DETAIL_POPUP' "$M"
          grep -Fq 'V0881_WATERBODY_TAP_PRIORITY' "$M"
          grep -Fq 'V0880_VISIBLE_REGION_ALL_TILES' "$M"
          grep -Fq 'V0880_EXACT_SAME_RIVER_ONLY' "$M"
          grep -Fq 'V0877_CLEAN_FRESH_ONLY_LIVE' "$A"
          grep -Fq 'RADIUS_KM = 2d' "$A" || true
          ! grep -Fq 'android.webkit.WebView' "$M"
          grep -Fq 'versionCode 101' "$G"
          grep -Fq "versionName '0.8.81'" "$G"
          echo 'V0881_NATIVE_CONTRACT PASS'

      - name: Bundle source assets
        run: gradle -p floodsafe-android-app clean :app:bundleFloodSafe --no-daemon

      - name: Rebuild all Nepal river assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet shapely
          python3 floodsafe-android-app/preclip_nepal_waterways.py
          python3 floodsafe-android-app/rebalance_nepal_overview_v0839.py
          python3 floodsafe-android-app/build_regional_river_tiles_v0840.py
          python3 floodsafe-android-app/build_national_river_network_v0841.py
          python3 floodsafe-android-app/build_progressive_river_tiers_v0842.py
          python3 floodsafe-android-app/build_progressive_river_names_v0863.py
          python3 floodsafe-android-app/postclip_nepal_display_rivers_v0874.py

      - name: Audit Nepal river assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          build=Path('floodsafe-android-app/app/build')
          mans=list(build.rglob('data/nepal-waterways-tiles/manifest.json'))
          if not mans: raise SystemExit('river manifest missing')
          wd=mans[0].parent;m=json.loads(mans[0].read_text(encoding='utf-8'))
          count=int(m.get('count',0));overview=int(m.get('overview_count',0))
          tiles=[p for p in wd.glob('*.json') if re.fullmatch(r'\d+-\d+\.json',p.name)]
          regional=wd.parent/'nepal-waterways-tiles-regional'
          rtiles=[p for p in regional.glob('*.json') if re.fullmatch(r'\d+-\d+\.json',p.name)]
          if count < 60000: raise SystemExit(f'expected >=60000 Nepal waterways, got {count}')
          if overview < 4000: raise SystemExit(f'expected >=4000 balanced overview waterways, got {overview}')
          if len(tiles) < 90 or len(rtiles) < 90: raise SystemExit(f'river tile coverage sparse: exact={len(tiles)} regional={len(rtiles)}')
          districts=list(build.rglob('floodsafe-nepal/v24/nepal-districts.geojson'))
          if not districts: raise SystemExit('district asset missing')
          d=json.loads(districts[0].read_text(encoding='utf-8'))
          names={str((f.get('properties') or {}).get('nameEn','')).strip() for f in d.get('features',[]) if str((f.get('properties') or {}).get('nameEn','')).strip()}
          if len(names)!=77: raise SystemExit(f'expected 77 districts, got {len(names)}')
          print('V0881_RIVER_COVERAGE PASS',count,overview,len(tiles),len(rtiles),len(names))
          PY

      - name: Unit test and build native APK
        run: gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug -x bundleFloodSafe --no-daemon --stacktrace

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-waterways-tiles/overview.json'
          unzip -l "$APK" | grep -Fq 'assets/floodsafe-nepal/v24/nepal-districts.geojson'
          cp "$APK" FloodSafe-Nepal-v0.8.81-RIVER-LAKE-HYDRO.apk
          sha256sum FloodSafe-Nepal-v0.8.81-RIVER-LAKE-HYDRO.apk | tee FloodSafe-Nepal-v0.8.81-SHA256.txt
          cat > V0881-FIELD-TEST-NOTES.txt <<'EOF'
          FloodSafe Nepal v0.8.81 — River + Lake/Outlet + Hydrology detail repair
          - tapping a river now always opens that river's own detail card instead of silently redirecting to a station
          - exact same-river official gauge data is embedded in the river card when safely matched
          - hydrology sites get a dedicated cyan map halo/layer instead of appearing only as generic station dots
          - official lake/reservoir/dam/outlet sites get dedicated status-coloured map markers and direct detail popups
          - lake/outlet detail shows official source, observation timestamp, level and thresholds when supplied
          - when an official site has no current observation, it remains visible and is clearly labelled NO CURRENT OFFICIAL READING; no status is fabricated
          - full viewport river geometry, exact same-river matching, fresh-only LIVE truth and 2 km emergency safety behavior remain unchanged
          Field-test/evaluation build; official emergency instructions remain authoritative.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-v0881-RIVER-LAKE-HYDRO
          path: |
            FloodSafe-Nepal-v0.8.81-RIVER-LAKE-HYDRO.apk
            FloodSafe-Nepal-v0.8.81-SHA256.txt
            V0881-FIELD-TEST-NOTES.txt
          retention-days: 14

      - name: Publish direct-download prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='floodsafe-v0.8.81-river-lake-hydro'
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'FloodSafe Nepal v0.8.81 — River Lake Hydro Details' \
              --prerelease \
              --notes-file V0881-FIELD-TEST-NOTES.txt
          fi
          gh release upload "$TAG" \
            FloodSafe-Nepal-v0.8.81-RIVER-LAKE-HYDRO.apk \
            FloodSafe-Nepal-v0.8.81-SHA256.txt \
            V0881-FIELD-TEST-NOTES.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
