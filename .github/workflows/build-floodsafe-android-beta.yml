name: Build FloodSafe Android Beta APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'floodsafe-android/**'
      - '.github/workflows/build-floodsafe-android-beta.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Ensure Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests, lint and signed testing APK
        working-directory: floodsafe-android
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify and collect APK
        run: |
          mkdir -p apk-output
          cp floodsafe-android/app/build/outputs/apk/debug/app-debug.apk apk-output/FloodSafe-Nepal-Beta.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs apk-output/FloodSafe-Nepal-Beta.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging apk-output/FloodSafe-Nepal-Beta.apk
          cd apk-output
          sha256sum FloodSafe-Nepal-Beta.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-Beta
          path: apk-output/*
          if-no-files-found: error
          retention-days: 30
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Android-test-reports
          path: floodsafe-android/app/build/reports/
          if-no-files-found: ignore
