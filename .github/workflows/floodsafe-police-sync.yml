name: FloodSafe Nepal Police Sync

on:
  push:
    paths:
      - 'scripts/update_floodsafe_police.py'
      - '.github/workflows/floodsafe-police-sync.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: floodsafe-police-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and verify latest Nepal Police bulletin
        run: python3 scripts/update_floodsafe_police.py

      - name: Commit verified update if changed
        shell: bash
        run: |
          set -e
          if git diff --quiet -- data/floodsafe-police.json; then
            echo 'No verified bulletin change.'
            exit 0
          fi
          git config user.name 'FloodSafe data sync'
          git config user.email 'actions@users.noreply.github.com'
          git add data/floodsafe-police.json
          git commit -m 'Auto-sync verified Nepal Police flood bulletin'
          git pull --rebase origin main
          git push origin HEAD:main
