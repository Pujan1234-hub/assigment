name: Probe BIPAD realtime river counts
on:
  push:
    branches: [ fix/floodsafe-v0-weather-complete ]
    paths: [ '.github/workflows/probe-bipad-realtime.yml' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe BIPAD endpoints
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, pathlib, datetime
          base='https://bipadportal.gov.np/api/v1/'
          tests={
            'river':'river/?limit=5000&ordering=-waterLevelOn',
            'river_trimmed':'river-trimed/?limit=5000',
            'stations':'river-stations/?limit=5000',
            'stations_latest':'river-stations/?latest=true&limit=5000',
            'river_latest':'river/?latest=true&limit=5000&ordering=-waterLevelOn',
          }
          def key(row):
              f=row.get('fields') if isinstance(row.get('fields'),dict) else {}
              def pick(*names):
                  for n in names:
                      v=row.get(n,f.get(n))
                      if v not in (None,''): return str(v).strip().lower()
                  return ''
              sid=pick('stationSeriesId','station_series_id','stationId','station_id','stationIndex','station_index','seriesId','series_id')
              name=pick('station_name','stationName','title','name')
              return ('id:'+sid) if sid else ('name:'+name if name else '')
          out={}
          for name,path in tests.items():
              url=base+path
              try:
                  req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'FloodSafe-Nepal/probe','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=30) as r:data=json.load(r)
                  rows=data.get('results',data.get('data',[])) if isinstance(data,dict) else data
                  if isinstance(rows,dict): rows=rows.get('results',[])
                  ks=[key(x) for x in rows if isinstance(x,dict)]
                  unique={x for x in ks if x}
                  out[name]={'raw':len(rows) if isinstance(rows,list) else None,'unique':len(unique),'api_count':data.get('count') if isinstance(data,dict) else None,'sample_keys':list(unique)[:5]}
              except Exception as e:
                  out[name]={'error':repr(e)}
          text=json.dumps(out,ensure_ascii=False,indent=2)
          print(text)
          pathlib.Path('BIPAD-REALTIME-PROBE.json').write_text(text,encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: BIPAD-REALTIME-PROBE
          path: BIPAD-REALTIME-PROBE.json
          retention-days: 2
