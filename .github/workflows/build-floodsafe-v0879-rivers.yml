name: Build FloodSafe v0.8.79 Full River Detail APK

on:
  push:
    branches: [ fix/floodsafe-full-river-detail-v0879 ]
    paths:
      - '.github/workflows/build-floodsafe-v0879-rivers.yml'
      - 'floodsafe-android-app/patch_native_v0879_full_river_geometry.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply known-good v0.8.77 baseline
        run: python3 floodsafe-android-app/run_patch_native_v0877.py

      - name: Apply v0.8.78 station resilience
        run: python3 floodsafe-android-app/patch_native_v0878_station_resilience.py

      - name: Apply v0.8.79 full river geometry fix
        run: python3 floodsafe-android-app/patch_native_v0879_full_river_geometry.py

      - name: Verify v0.8.79 native river contracts
        shell: bash
        run: |
          set -euo pipefail
          M='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java'
          G='floodsafe-android-app/app/build.gradle'
          grep -Fq 'V0879_FULL_RIVER_TILE_RUNTIME' "$M"
          grep -Fq 'V0879_CAMERA_IDLE_RIVER_DETAIL' "$M"
          grep -Fq 'V0879_NO_GLOBAL_1400_TRUNCATION' "$M"
          grep -Fq 'V0879_PROGRESSIVE_77_DISTRICT_GEOMETRY' "$M"
          grep -Fq 'data/nepal-waterways-tiles-regional/' "$M"
          grep -Fq 'data/nepal-waterways-tiles/' "$M"
          ! grep -Fq 'if (all.size() > 1400)' "$M"
          ! grep -Fq 'android.webkit.WebView' "$M"
          grep -Fq 'versionCode 99' "$G"
          grep -Fq "versionName '0.8.79'" "$G"
          echo 'V0879_NATIVE_RIVER_CONTRACT PASS'

      - name: Bundle source assets
        run: gradle -p floodsafe-android-app clean :app:bundleFloodSafe --no-daemon

      - name: Rebuild all Nepal river assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet shapely
          python3 floodsafe-android-app/preclip_nepal_waterways.py
          python3 floodsafe-android-app/rebalance_nepal_overview_v0839.py
          python3 floodsafe-android-app/build_regional_river_tiles_v0840.py
          python3 floodsafe-android-app/build_national_river_network_v0841.py
          python3 floodsafe-android-app/build_progressive_river_tiers_v0842.py
          python3 floodsafe-android-app/build_progressive_river_names_v0863.py
          python3 floodsafe-android-app/postclip_nepal_display_rivers_v0874.py

      - name: Audit 77-district river geometry coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          build=Path('floodsafe-android-app/app/build')
          mans=list(build.rglob('data/nepal-waterways-tiles/manifest.json'))
          if not mans: raise SystemExit('river manifest missing')
          wd=mans[0].parent
          m=json.loads(mans[0].read_text(encoding='utf-8'))
          count=int(m.get('count',0)); overview=int(m.get('overview_count',0))
          tiles=[p for p in wd.glob('*.json') if re.fullmatch(r'\d+-\d+\.json',p.name)]
          regional=wd.parent/'nepal-waterways-tiles-regional'
          rtiles=[p for p in regional.glob('*.json') if re.fullmatch(r'\d+-\d+\.json',p.name)]
          if count < 60000: raise SystemExit(f'expected source inventory >=60000 Nepal waterways, got {count}')
          # The strict Nepal polygon clip intentionally removes cross-border/outside-only
          # display segments. The balanced national overview produced from the clipped
          # geometry is currently 4,219 ways; require a dense >=4,000 network rather than
          # the pre-clip 6k estimate.
          if overview < 4000: raise SystemExit(f'expected >=4000 balanced Nepal overview waterways, got {overview}')
          if len(tiles) < 90: raise SystemExit(f'expected dense exact tiles, got {len(tiles)}')
          if len(rtiles) < 90: raise SystemExit(f'expected dense regional tiles, got {len(rtiles)}')
          kt=wd/'7-2.json'
          if not kt.exists(): raise SystemExit('Kathmandu-area exact tile 7-2 missing')
          k=json.loads(kt.read_text(encoding='utf-8'))
          if len(k.get('waterways') or []) < 1500: raise SystemExit(f'Kathmandu-area river detail unexpectedly sparse: {len(k.get("waterways") or [])}')
          districts=list(build.rglob('floodsafe-nepal/v24/nepal-districts.geojson'))
          if not districts: raise SystemExit('district asset missing')
          d=json.loads(districts[0].read_text(encoding='utf-8'))
          names={str((f.get('properties') or {}).get('nameEn','')).strip() for f in d.get('features',[]) if str((f.get('properties') or {}).get('nameEn','')).strip()}
          if len(names)!=77: raise SystemExit(f'expected 77 districts, got {len(names)}')
          print('V0879_RIVER_COVERAGE PASS source=',count,'overview=',overview,'exact_tiles=',len(tiles),'regional_tiles=',len(rtiles),'kt_detail=',len(k.get('waterways') or []),'districts=',len(names))
          PY

      - name: Unit test and build native APK
        run: gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug -x bundleFloodSafe --no-daemon --stacktrace

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-waterways-tiles/overview.json'
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-waterways-tiles/7-2.json'
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-waterways-tiles-regional/7-2.json'
          unzip -l "$APK" | grep -Fq 'assets/floodsafe-nepal/v24/nepal-districts.geojson'
          cp "$APK" FloodSafe-Nepal-v0.8.79-FULL-RIVER-DETAIL.apk
          sha256sum FloodSafe-Nepal-v0.8.79-FULL-RIVER-DETAIL.apk | tee FloodSafe-Nepal-v0.8.79-SHA256.txt
          cat > V0879-RIVER-FIX-NOTES.txt <<'EOF'
          FloodSafe Nepal v0.8.79 — Full River Detail field-test build
          - removes the old global 1,400-river truncation that caused broken/half river lines
          - whole-Nepal view uses a balanced national overview network
          - regional zoom loads spatially balanced nearby river tiles
          - local zoom loads exact nearby OSM river/stream tiles from the 60k+ source inventory
          - stations/readings retain v0.8.78 resilience behavior
          - 77 district boundaries and river assets are bundled for Nepal-wide testing
          Field-test/evaluation build; official emergency instructions remain authoritative.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-v0879-FULL-RIVER-DETAIL
          path: |
            FloodSafe-Nepal-v0.8.79-FULL-RIVER-DETAIL.apk
            FloodSafe-Nepal-v0.8.79-SHA256.txt
            V0879-RIVER-FIX-NOTES.txt
          retention-days: 14
