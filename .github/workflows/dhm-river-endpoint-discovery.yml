name: DHM River Watch Endpoint Discovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dhm-river-endpoint-discovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect rendered DHM River Watch payload
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          mkdir -p /tmp/dhm && cd /tmp/dhm
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24.31.0 >/dev/null 2>&1
          CHROME="$CHROME" node <<'JS'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:1440,height:1000});
            const seen=[];
            page.on('response',r=>{const u=r.url();if(/river|hydro|api|gss|station|water|chart|graph/i.test(u))seen.push({status:r.status(),url:u,ct:r.headers()['content-type']||''})});
            await page.goto('https://dhm.gov.np/hydrology/river-watch',{waitUntil:'domcontentloaded',timeout:90000});
            await new Promise(r=>setTimeout(r,12000));
            const data=await page.evaluate(()=>{
              const rows=[...document.querySelectorAll('table tbody tr')];
              return {
                rowCount:rows.length,
                rowHtml:rows.slice(0,5).map(r=>r.outerHTML),
                links:rows.slice(0,10).flatMap(r=>[...r.querySelectorAll('a')].map(a=>({text:a.innerText,href:a.href,onclick:a.getAttribute('onclick'),data:{...a.dataset}}))),
                imgs:rows.slice(0,10).flatMap(r=>[...r.querySelectorAll('img')].map(i=>({src:i.src,alt:i.alt,title:i.title,data:{...i.dataset}}))),
                attrs:rows.slice(0,10).map(r=>Object.fromEntries([...r.attributes].map(a=>[a.name,a.value]))),
                scripts:[...document.scripts].map(s=>s.src||s.textContent).filter(x=>/Likhu Khola|river|station|water_level|warning_level|danger_level|hydrograph/i.test(x)).slice(0,20)
              }
            });
            console.log('=== NETWORK ===');for(const x of [...new Map(seen.map(x=>[x.url,x])).values()])console.log(JSON.stringify(x));
            console.log('=== ROW COUNT ===',data.rowCount);
            console.log('=== ROW HTML ===');console.log(JSON.stringify(data.rowHtml,null,2));
            console.log('=== LINKS ===');console.log(JSON.stringify(data.links,null,2));
            console.log('=== IMAGES ===');console.log(JSON.stringify(data.imgs,null,2));
            console.log('=== ATTRS ===');console.log(JSON.stringify(data.attrs,null,2));
            console.log('=== SCRIPTS ===');console.log(JSON.stringify(data.scripts,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(2)});
          JS
