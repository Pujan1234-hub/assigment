name: V25 Live Status Smoke
on:
  push:
    branches: ["main"]
    paths:
      - "floodsafe-nepal/v25/**"
      - "data/floodsafe-people-status.json"
      - "data/floodsafe-police.json"
      - "data/dor-road-summary.json"
      - ".github/workflows/v25-live-status-smoke.yml"
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live Human road and district UI
        run: |
          set -e
          BASE='https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/'
          ROOT='https://pujan1234-hub.github.io/assigment/'
          for i in $(seq 1 100); do
            ok=1
            curl -fsSL "${BASE}alerts.html" -o /tmp/alerts.html || ok=0
            curl -fsSL "${BASE}district-road-live.js" -o /tmp/district.js || ok=0
            curl -fsSL "${BASE}human-current-guard.js" -o /tmp/human.js || ok=0
            curl -fsSL "${ROOT}data/floodsafe-people-status.json" -o /tmp/people.json || ok=0
            curl -fsSL "${ROOT}data/floodsafe-police.json" -o /tmp/police.json || ok=0
            grep -q 'districtLiveSection' /tmp/alerts.html || ok=0
            grep -q 'roadCurrentList' /tmp/alerts.html || ok=0
            grep -q 'district-road-live.js' <(curl -fsSL "${BASE}disaster-monitor.js") || ok=0
            grep -q 'fsHumanVisibleGuard' /tmp/human.js || ok=0
            python3 - <<'PY' || ok=0
          import json
          p=json.load(open('/tmp/people.json')); po=json.load(open('/tmp/police.json'))
          assert po['total_deaths'] >= 489, po
          assert p['missing_minimum'] >= 2381, p
          assert p['rescued_alive'] >= 1545, p
          PY
            if [ "$ok" = 1 ]; then break; fi
            sleep 3
          done
          test "$ok" = 1
          node --check /tmp/district.js
          node --check /tmp/human.js
          grep -q "peopleStatsFresh" /tmp/human.js
          grep -q "KCHA" /tmp/human.js
          grep -q "Kanchanpur" /tmp/district.js
          grep -q "Taplejung" /tmp/district.js
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          mkdir -p /tmp/status-smoke && cd /tmp/status-smoke
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24.31.0 >/dev/null 2>&1
          BASE="$BASE" CHROME="$CHROME" node <<'JS'
          const puppeteer=require('puppeteer-core');
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage']});
            const page=await browser.newPage();page.setDefaultTimeout(60000);
            await page.goto(process.env.BASE+'people.html',{waitUntil:'domcontentloaded'});
            await page.waitForSelector('#peopleStatsSection:not([hidden])',{timeout:30000});
            await page.waitForFunction(()=>Number(document.getElementById('peopleBodies')?.textContent)>=489,{timeout:30000});
            await wait(3500);
            const human=await page.evaluate(()=>({hidden:document.getElementById('peopleStatsSection')?.hidden,d:Number(document.getElementById('peopleBodies').textContent),m:Number(document.getElementById('peopleMissing').textContent),r:Number(document.getElementById('peopleRescued').textContent),fresh:document.getElementById('peopleStatsFresh')?.textContent||'',display:getComputedStyle(document.getElementById('peopleStatsSection')).display}));
            if(human.hidden||human.display==='none'||human.d<489||human.m<2381||human.r<1545||!/app live/.test(human.fresh))throw Error('human '+JSON.stringify(human));
            await page.goto(process.env.BASE+'alerts.html',{waitUntil:'domcontentloaded'});
            await page.waitForSelector('#districtLiveSection');
            await page.waitForSelector('#roadLiveSection');
            await page.waitForFunction(()=>document.querySelectorAll('#districtFilter option').length===78,{timeout:30000});
            await wait(5000);
            const a=await page.evaluate(()=>({districts:document.querySelectorAll('#districtFilter option').length,road:document.getElementById('roadAlertCount')?.textContent,summary:document.getElementById('roadOfficialSummary')?.textContent||'',cards:document.querySelectorAll('#districtStatusList .item').length}));
            if(a.districts!==78||a.cards<70||a.road==='60')throw Error('alerts '+JSON.stringify(a));
            console.log('PASS V25 live Human road district status',human,a);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(3)});
          JS
