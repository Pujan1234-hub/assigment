name: Build ScamLens v0.9 Real Intelligence

on:
  push:
    branches:
      - scamlens-v0.9-real-intelligence
    paths-ignore:
      - "scamlens-build/releases/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Reconstruct large source files
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="scamlens-build/ScamLens-v0.9-real-intelligence"
          PART_DIR="scamlens-build/parts/v09"
          mkdir -p "$APP_DIR/app/src/main/java/com/pjbuilts/scamlens/domain"
          mkdir -p "$APP_DIR/app/src/main/java/com/pjbuilts/scamlens"
          cat "$PART_DIR"/RiskEngine.kt.b64.* | base64 -d > "$APP_DIR/app/src/main/java/com/pjbuilts/scamlens/domain/RiskEngine.kt"
          cat "$PART_DIR"/MainActivity.kt.b64.* | base64 -d > "$APP_DIR/app/src/main/java/com/pjbuilts/scamlens/MainActivity.kt"
          test -s "$APP_DIR/app/src/main/java/com/pjbuilts/scamlens/domain/RiskEngine.kt"
          test -s "$APP_DIR/app/src/main/java/com/pjbuilts/scamlens/MainActivity.kt"
          grep -q "object RiskEngine" "$APP_DIR/app/src/main/java/com/pjbuilts/scamlens/domain/RiskEngine.kt"
          grep -q "class MainActivity" "$APP_DIR/app/src/main/java/com/pjbuilts/scamlens/MainActivity.kt"
          echo "RiskEngine bytes: $(wc -c < "$APP_DIR/app/src/main/java/com/pjbuilts/scamlens/domain/RiskEngine.kt")"
          echo "MainActivity bytes: $(wc -c < "$APP_DIR/app/src/main/java/com/pjbuilts/scamlens/MainActivity.kt")"

      - name: Build debug APK
        working-directory: scamlens-build/ScamLens-v0.9-real-intelligence
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="scamlens-build/ScamLens-v0.9-real-intelligence/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Package delivery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scamlens-build/releases
          APK="scamlens-build/ScamLens-v0.9-real-intelligence/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" "scamlens-build/releases/ScamLens-PJBUILTS-v0.9-RealIntelligence.apk"
          rm -f "scamlens-build/releases/ScamLens-PJBUILTS-v0.9-RealIntelligence-source.zip"
          (
            cd scamlens-build
            zip -qr "releases/ScamLens-PJBUILTS-v0.9-RealIntelligence-source.zip" "ScamLens-v0.9-real-intelligence"               -x "ScamLens-v0.9-real-intelligence/.gradle/*"                  "ScamLens-v0.9-real-intelligence/app/build/*"                  "ScamLens-v0.9-real-intelligence/build/*"
          )
          (
            cd scamlens-build/releases
            sha256sum ScamLens-PJBUILTS-v0.9-RealIntelligence.apk ScamLens-PJBUILTS-v0.9-RealIntelligence-source.zip > SHA256SUMS.txt
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScamLens-v0.9-RealIntelligence-delivery
          path: |
            scamlens-build/releases/ScamLens-PJBUILTS-v0.9-RealIntelligence.apk
            scamlens-build/releases/ScamLens-PJBUILTS-v0.9-RealIntelligence-source.zip
            scamlens-build/releases/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish compiled delivery on build branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f scamlens-build/releases/ScamLens-PJBUILTS-v0.9-RealIntelligence.apk
          git add -f scamlens-build/releases/ScamLens-PJBUILTS-v0.9-RealIntelligence-source.zip
          git add -f scamlens-build/releases/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "Delivery files unchanged."
          else
            git commit -m "ScamLens v0.9 compiled delivery [skip ci]"
            git push
          fi
