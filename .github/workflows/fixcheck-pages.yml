name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "sw.js"
      - "fixcheck/**"
      - ".github/workflows/fixcheck-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare public site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp sw.js _site/sw.js
          cp -R fixcheck _site/fixcheck
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload portfolio
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
