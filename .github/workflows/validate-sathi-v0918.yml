name: Validate SATHI v0.9.18 branch

on:
  push:
    branches:
      - fix/v0-9-18-sathi-next-level
    paths:
      - 'floodsafe-android-app/**'
      - 'floodsafe-nepal/v25/sathi-flood-ai/**'
      - 'floodsafe-nepal/v25/index.html'
      - '.github/workflows/validate-sathi-v0918.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check web SATHI JavaScript syntax
        run: node --check floodsafe-nepal/v25/sathi-flood-ai/voice-human-v0918.js
      - name: Compile native SATHI and assemble debug APK
        id: android_build
        shell: bash
        run: |
          set +e
          gradle -p floodsafe-android-app :app:assembleDebug -x bundleFloodSafe --no-daemon --stacktrace 2>&1 | tee sathi-v0918-build.log
          status=${PIPESTATUS[0]}
          echo "gradle_status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sathi-v0918-build-log
          path: sathi-v0918-build.log
          if-no-files-found: error
          retention-days: 2
      - name: Fail if Gradle failed
        if: steps.android_build.outputs.gradle_status != '0'
        run: exit 1
      - name: Verify SATHI native class packaged
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -Eq 'classes[0-9]*\.dex'
          echo 'SATHI v0.9.18 validation PASS'
