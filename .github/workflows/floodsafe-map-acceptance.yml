name: FloodSafe Map Acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'floodsafe-nepal/v25/index.html'
      - 'floodsafe-nepal/v25/map-*.js'
      - 'floodsafe-nepal/v25/hydro-smooth-v2.js'
      - 'floodsafe-nepal/v25/trusted-river-runtime-v1.js'
      - 'floodsafe-nepal/v25/gauge-bridge.js'
      - 'floodsafe-nepal/v25/river-line-status-v1.js'
      - 'floodsafe-nepal/v25/river-map-detail-v2.js'
      - 'floodsafe-nepal/v25/river-line-style-v1.js'
      - '.github/workflows/floodsafe-map-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: floodsafe-map-acceptance
  cancel-in-progress: true
jobs:
  live-map:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax check
        run: |
          node --check floodsafe-nepal/v25/map-smooth-v3.js
          node --check floodsafe-nepal/v25/hydro-smooth-v2.js
          node --check floodsafe-nepal/v25/river-line-style-v1.js
          node --check floodsafe-nepal/v25/gauge-bridge.js
          node --check floodsafe-nepal/v25/river-line-status-v1.js
      - name: Wait for smooth runtime on Pages
        run: |
          set -euo pipefail
          U='https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/'
          ok=0
          for i in $(seq 1 100); do
            html="$(curl --max-time 10 -fsSL "${U}?smooth=${GITHUB_SHA}-${i}" || true)"
            if [[ "$html" == *'map-loader-v3.js?v=8'* ]] && [[ "$html" == *'river-line-style-v1.js?v=5'* ]]; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
          loader="$(curl --max-time 10 -fsSL "${U}map-loader-v3.js?v=8&smooth=${GITHUB_SHA}")"
          hydro="$(curl --max-time 10 -fsSL "${U}hydro-smooth-v2.js?v=1&smooth=${GITHUB_SHA}")"
          base="$(curl --max-time 10 -fsSL "${U}map-smooth-v3.js?v=2&smooth=${GITHUB_SHA}")"
          style="$(curl --max-time 10 -fsSL "${U}river-line-style-v1.js?v=5&smooth=${GITHUB_SHA}")"
          [[ "$loader" == *'map-smooth-v3.js?v=2'* && "$loader" == *'hydro-smooth-v2.js?v=1'* ]]
          [[ "$hydro" == *'__fsHydroSmoothV2'* && "$hydro" == *"map.on('movestart'"* ]]
          [[ "$base" == *'__fsMapSmoothV4'* && "$base" == *"map.addSource('rivers'"* ]]
          [[ "$style" == *'__fsRiverLineStyleV5'* ]]
          [[ "$style" != *'setTimeout(pulse,260)'* ]]
      - name: Verify coverage realtime colours and interaction smoothness
        env:
          APP: https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          mkdir -p /tmp/mapaccept && cd /tmp/mapaccept
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24.31.0 >/dev/null 2>&1
          APP="$APP" CHROME="$CHROME" node <<'JS'
          const puppeteer=require('puppeteer-core');
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--enable-unsafe-swiftshader']});
            const p=await b.newPage();p.setDefaultTimeout(120000);await p.setViewport({width:1280,height:900});
            const errors=[];p.on('pageerror',e=>errors.push(String(e)));p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await p.goto(process.env.APP+'?smoothaccept='+Date.now()+'#map',{waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>window.__fsSmoothMapLoaded&&window.__fsHydroSmoothLoaded&&window.FloodSafeMap?.initialized,{timeout:120000});
            await p.waitForFunction(()=>window.FloodSafeHydroSmooth?.overviewCount>=1000&&window.FloodSafeHydroSmooth?.manifest?.count>=60000,{timeout:120000});
            await p.waitForFunction(()=>window.FloodSafeMap?.map?.getLayer?.('hydro-complete-lines')&&window.FloodSafeMap?.map?.getSource?.('hydro-complete'),{timeout:120000});
            await p.waitForFunction(()=>window.__fsRiverRealtimeState?.source==='BIPAD official direct',{timeout:90000});
            await wait(1200);
            const coverage=await p.evaluate(()=>{const m=window.FloodSafeMap.map,fs=m.getSource('hydro-complete')?.serialize?.()?.data?.features||[];return{districts:window.FloodSafeMap.districtCount,overview:window.FloodSafeHydroSmooth.overviewCount,total:window.FloodSafeHydroSmooth.manifest?.count||0,shown:fs.length,source:window.__fsRiverRealtimeState?.source,current:(window.FloodSafe?.state?.stations||[]).length,paint:JSON.stringify(m.getPaintProperty('hydro-complete-lines','line-color'))}});
            console.log('COVERAGE',JSON.stringify(coverage));
            if(coverage.districts!==77||coverage.overview<6000||coverage.total<60000||coverage.shown<1000)throw Error('coverage incomplete '+JSON.stringify(coverage));
            if(coverage.source!=='BIPAD official direct')throw Error('direct source inactive');
            if(!coverage.paint.includes('#ff7a00')||!coverage.paint.includes('#ff2d20'))throw Error('alert colours missing');
            const perf=await p.evaluate(async()=>{const map=window.FloodSafeMap.map,src=map.getSource('hydro-complete');let setData=0;const original=src.setData.bind(src);src.setData=(...a)=>{setData++;return original(...a)};let maxGap=0,last=performance.now();map.easeTo({center:[84.7,28.2],zoom:7.15,duration:1100});const end=last+3600;await new Promise(resolve=>{function f(now){maxGap=Math.max(maxGap,now-last);last=now;if(now>=end)return resolve();requestAnimationFrame(f)}requestAnimationFrame(f)});src.setData=original;return{setData,maxGap,zoom:map.getZoom(),moving:map.isMoving()}});
            console.log('PERF',JSON.stringify(perf));
            if(perf.setData>3)throw Error('too many hydro redraws during one interaction '+JSON.stringify(perf));
            if(perf.maxGap>450)throw Error('main thread stall '+JSON.stringify(perf));
            await p.waitForFunction(()=>!window.FloodSafeMap.map.isMoving(),{timeout:15000});await wait(1200);
            const target=await p.evaluate(()=>{const map=window.FloodSafeMap.map,fs=map.getSource('hydro-complete')?.serialize?.()?.data?.features||[],canvas=map.getCanvas();for(const f of fs){const line=f.geometry?.coordinates;if(f.geometry?.type!=='LineString'||!line?.length)continue;const c=line[Math.floor((line.length-1)/2)],pt=map.project(c);if(pt.x>40&&pt.y>40&&pt.x<canvas.clientWidth-40&&pt.y<canvas.clientHeight-40)return{id:f.properties.id,name:f.properties.name_en||f.properties.name_raw||f.properties.name||'Acceptance River',c}}return null});
            if(!target)throw Error('no visible river target');
            await p.evaluate(t=>{const now=new Date().toISOString();window.__origStations=(window.FloodSafe.state.stations||[]).slice();window.FloodSafe.state.stations=[{title:t.name,waterLevel:9,warningLevel:5,dangerLevel:8,waterLevelOn:now,_measurementTime:now,_measurementTimeTrusted:true,_current20m:true,point:{coordinates:t.c},dataSource:'acceptance'}];window.FloodSafeRiverLine.rebuild(true)},target);
            await p.waitForFunction(id=>(window.FloodSafeMap.map.getSource('hydro-complete')?.serialize?.()?.data?.features||[]).some(f=>String(f.properties?.id)===String(id)&&f.properties?.live_status==='danger'),{timeout:15000},target.id);
            const danger=await p.evaluate(id=>{const m=window.FloodSafeMap.map,fs=m.getSource('hydro-complete')?.serialize?.()?.data?.features||[],f=fs.find(x=>String(x.properties?.id)===String(id));return{status:f?.properties?.live_status,station:f?.properties?.live_station}},target.id);
            console.log('DANGER',JSON.stringify(danger));if(danger.status!=='danger')throw Error('danger colour reaction failed');
            const detailTimerStopped=await p.evaluate(async()=>{const before=performance.now();let ticks=0;const original=window.setInterval;return{wired:!!window.FloodSafeRiverDetail,hasLegacyCompat:!!window.FloodSafeMap.map.getSource('rivers'),elapsed:performance.now()-before,ticks}});
            console.log('DETAIL_COMPAT',JSON.stringify(detailTimerStopped));if(!detailTimerStopped.wired||!detailTimerStopped.hasLegacyCompat)throw Error('detail compatibility not ready');
            await p.evaluate(()=>{window.FloodSafe.state.stations=window.__origStations||[];window.FloodSafeRiverLine.rebuild(true)});
            if(errors.some(x=>/FloodSafe smooth map runtime failed|SyntaxError|TypeError/.test(x)))throw Error('browser errors '+JSON.stringify(errors));
            console.log('PASS smooth FloodSafe map acceptance');await b.close();
          })().catch(e=>{console.error(e);process.exit(3)});
          JS
