name: FloodSafe River Source Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/floodsafe-river-source-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe current official observations and flood alerts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          from datetime import datetime, timezone
          ORIGIN='https://pujan1234-hub.github.io'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 FloodSafe-Nepal-source-probe','Accept':'application/json','Origin':ORIGIN})
              with urllib.request.urlopen(req,timeout=35) as r:
                  print('HTTP',r.status,url,'CORS=',r.headers.get('Access-Control-Allow-Origin'),'DATE=',r.headers.get('Date'))
                  return json.loads(r.read().decode('utf-8-sig'))
          def rows(j):
              if isinstance(j,list): return j
              for k in ('results','data','objects'):
                  if isinstance(j,dict) and isinstance(j.get(k),list): return j[k]
              return []
          def dt(v):
              if not v:return None
              try:return datetime.fromisoformat(str(v).replace('Z','+00:00')).astimezone(timezone.utc)
              except:return None
          now=datetime.now(timezone.utc)
          stations=rows(get('https://bipadportal.gov.np/api/v1/river-stations/?limit=2000&ordering=-waterLevelOn'))
          print('STATIONS',len(stations))
          current=[]
          for x in stations:
              t=dt(x.get('waterLevelOn') or x.get('measuredOn') or x.get('measurementTime'))
              lv=x.get('waterLevel')
              if t and lv is not None:
                  age=(now-t).total_seconds()/60
                  if -5<=age<=20: current.append((age,x))
          current.sort(key=lambda z:z[0])
          print('CURRENT_20M',len(current))
          for age,x in current[:30]:
              lv=x.get('waterLevel'); w=x.get('warningLevel'); d=x.get('dangerLevel'); raw=x.get('status')
              stage='normal'
              try:
                  if d is not None and float(d)>0 and float(lv)>=float(d): stage='danger'
                  elif w is not None and float(w)>0 and float(lv)>=float(w): stage='warning'
              except: pass
              if isinstance(raw,str):
                  r=raw.upper()
                  if ('DANGER' in r or 'RED' in r) and 'BELOW DANGER' not in r: stage='danger'
                  elif ('WARNING' in r or 'ORANGE' in r) and 'BELOW WARNING' not in r: stage='warning'
              print('CURRENT',round(age,1),stage,x.get('title'),lv,'W',w,'D',d,x.get('waterLevelOn'),x.get('point'))
          alerts=rows(get('https://bipadportal.gov.np/api/v1/alert/?limit=300&ordering=-createdOn'))
          print('ALERTS',len(alerts))
          for x in alerts[:25]:
              blob=json.dumps(x,ensure_ascii=False).lower()
              if any(k in blob for k in ('flood','river','बाढी','नदी','खोला')):
                  print('FLOOD_ALERT',json.dumps(x,ensure_ascii=False)[:5000])
          PY
