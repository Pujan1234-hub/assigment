name: Probe FloodSafe Official Sources

on:
  push:
    branches: [ fix/floodsafe-v0882-realtime-river-rain ]
    paths: [ '.github/workflows/probe-floodsafe-official-sources.yml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe BIPAD River Watch and DHM rainfall POST contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request,datetime,time
          u='https://bipadportal.gov.np/api/v1/river-stations/?format=json&limit=5000&_fs='+str(time.time_ns())
          req=urllib.request.Request(u,headers={'User-Agent':'FloodSafe-Nepal/source-probe','Accept':'application/json','Cache-Control':'no-cache,no-store'})
          with urllib.request.urlopen(req,timeout=30) as r:j=json.load(r)
          rows=j.get('results') or [];now=time.time();active=[]
          for x in rows:
            t=x.get('waterLevelOn') or x.get('water_level_on');lvl=x.get('waterLevel') if x.get('waterLevel') is not None else x.get('water_level')
            if not t or lvl is None:continue
            try:
              dt=datetime.datetime.fromisoformat(str(t).replace('Z','+00:00'));dt=dt if dt.tzinfo else dt.replace(tzinfo=datetime.timezone(datetime.timedelta(hours=5,minutes=45)));age=now-dt.timestamp()
            except:continue
            if -300<=age<=24*3600:active.append(x)
          print('BIPAD_CATALOG',len(rows),'BIPAD_24H_RIVER_WATCH',len(active))
          PY
          python3 - <<'PY'
          import urllib.request,urllib.parse,http.cookiejar,re,json
          jar=http.cookiejar.CookieJar();op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar));hdr={'User-Agent':'Mozilla/5.0 FloodSafe','Accept':'text/html,application/xhtml+xml'}
          req=urllib.request.Request('https://dhm.gov.np/hydrology/rainfall-watch-map',headers=hdr);html=op.open(req,timeout=30).read().decode('utf-8','ignore')
          token=re.search(r'name="csrf_test_name"\s+value="([^"]+)"',html);token=token.group(1) if token else ''
          print('DHM_CSRF',bool(token),'COOKIES',[(c.name,c.value[:8]) for c in jar])
          for needle in ['loadMapData(', "$(\'#applyfilter\')", 'var mapValue', "filterData').serialize", 'rainfallTab.active']:
            pos=0
            while True:
              i=html.find(needle,pos)
              if i<0:break
              print('DHM_CONTEXT',needle,repr(html[max(0,i-900):min(len(html),i+1500)]));pos=i+len(needle)
          data=urllib.parse.urlencode({'csrf_test_name':token,'sortby':'','basinname[]':'','stationindex[]':'','districtname[]':''},doseq=True).encode()
          req=urllib.request.Request('https://dhm.gov.np/hydrology/filterInRainfallTable',data=data,headers={'User-Agent':'Mozilla/5.0 FloodSafe','Accept':'application/json','Content-Type':'application/x-www-form-urlencoded','Referer':'https://dhm.gov.np/hydrology/rainfall-watch-map'})
          try:
            raw=op.open(req,timeout=30).read().decode('utf-8','ignore');print('DHM_TABLE_RESPONSE',raw[:2500])
          except Exception as e:print('DHM_TABLE_ERROR',repr(e))
          PY
