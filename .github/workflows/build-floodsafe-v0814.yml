name: Build FloodSafe v0.8.16 Current Official Only APK

on:
  push:
    branches: [ main ]
    paths:
      - 'floodsafe-android-app/**'
      - '.github/workflows/build-floodsafe-v0814.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply FloodSafe patches through v0.8.16
        run: |
          python3 floodsafe-android-app/patch_webview_crash.py
          python3 floodsafe-android-app/patch_launcher_reopen_hard_reset.py
          python3 floodsafe-android-app/patch_auto_alerts.py
          python3 floodsafe-android-app/patch_river_waterlevel.py
          python3 floodsafe-android-app/patch_two_hour_weather.py
          python3 floodsafe-android-app/patch_cold_start_blank.py
          python3 floodsafe-android-app/patch_cross_device_navigation.py
          python3 floodsafe-android-app/patch_native_compat_fallback.py
          python3 floodsafe-android-app/patch_map_smooth_v075.py
          python3 floodsafe-android-app/patch_full_native_v080.py
          python3 floodsafe-android-app/patch_native_v081_polish.py
          python3 floodsafe-android-app/patch_native_v081_escape_fix.py
          python3 floodsafe-android-app/patch_native_maplibre_v082.py
          python3 floodsafe-android-app/patch_native_map_detail_v083.py
          python3 floodsafe-android-app/patch_native_v084_sathi_map.py
          python3 floodsafe-android-app/patch_native_v085_flow_sathi.py
          python3 floodsafe-android-app/patch_native_v086_full_waterways.py
          python3 floodsafe-android-app/patch_native_v087_runtime_rivers.py
          python3 floodsafe-android-app/patch_native_v088_restore_web_rivers.py
          python3 floodsafe-android-app/patch_native_v089_realtime_gauges.py
          python3 floodsafe-android-app/patch_native_v0810_live_source_colours.py
          python3 floodsafe-android-app/patch_native_v0811_map_anr_fix.py
          python3 floodsafe-android-app/patch_native_v0812_trusted_latest_flow.py
          python3 floodsafe-android-app/patch_native_v0813_prep_truth_ui.py
          python3 floodsafe-android-app/patch_native_v0813_nepal_truth_map.py
          python3 floodsafe-android-app/patch_native_v0814_prep_runtime_counts.py
          python3 floodsafe-android-app/patch_native_v0814_source_exact_smooth.py
          python3 floodsafe-android-app/patch_native_v0814_compile_fix.py
          python3 floodsafe-android-app/patch_native_v0815_single_source_truth.py
          python3 floodsafe-android-app/patch_native_v0816_current_only_map.py

      - name: Verify v0.8.16 current official truth and safety gates
        shell: bash
        run: |
          set -euo pipefail
          MAP=floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeNativeMapView.java
          ACT=floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/NativeFullActivity.java
          grep -Fq 'RADIUS_KM = 2d' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/RiverAlertWorker.java
          grep -Fq 'DEFAULT_RIVER_RADIUS_KM = 2d' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/FloodSafeMessagingService.java
          grep -Fq 'WEATHER_DIGEST_INTERVAL_MS = 2L * 60L * 60L * 1000L' floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app/RainAlertWorker.java
          grep -Fq 'sourceStatusLabel(RiverStation s)' "$ACT"
          grep -Fq 'Only current official source is highlighted' "$ACT"
          grep -Fq 'background geometry hidden' "$ACT"
          grep -Fq 'nearestMatchingRiverForGauge' "$MAP"
          grep -Fq 'lineWidth(0.65f), lineOpacity(0.055f)' "$MAP"
          grep -Fq 'if(s!=null&&s.fresh)' "$MAP"
          grep -Fq 'generic OSM river-name mesh hidden by default' "$MAP"
          grep -Fq 'coreWidth=normal?3.05f' "$MAP"
          if grep -Fq 'lineColor("#78909c"), lineWidth(1.45f), lineOpacity(0.42f)' "$MAP"; then echo 'Cluttered background river styling remained'; exit 1; fi
          if grep -Fq 'riskValue.setText(stageName(best.stage))' "$ACT"; then echo 'Derived risk label remained'; exit 1; fi
          grep -Fq 'versionCode 36' floodsafe-android-app/app/build.gradle
          grep -Fq "versionName '0.8.16'" floodsafe-android-app/app/build.gradle

      - name: Probe official BIPAD source freshness and exact status
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime
          url='https://bipadportal.gov.np/api/v1/river-stations/?latest=true&limit=2000'
          req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'FloodSafe-CI/0.8.16'})
          with urllib.request.urlopen(req,timeout=20) as r: j=json.load(r)
          rows=j if isinstance(j,list) else j.get('results') or (j.get('data') or {}).get('results') or j.get('data') or []
          if not isinstance(rows,list): rows=[]
          now=datetime.datetime.now(datetime.timezone.utc)
          def parse(s):
              if not s:return None
              try:return datetime.datetime.fromisoformat(str(s).replace('Z','+00:00')).astimezone(datetime.timezone.utc)
              except:return None
          fresh=[]
          for x in rows:
              if not isinstance(x,dict):continue
              t=parse(x.get('waterLevelOn') or x.get('_measurementTime'))
              if t and 0 <= (now-t).total_seconds() <= 1800:
                  fresh.append((x.get('title') or x.get('name') or x.get('id'),x.get('status'),x.get('waterLevel'),x.get('waterLevelOn')))
          print('BIPAD latest rows=',len(rows),'fresh<=30m=',len(fresh))
          from collections import Counter
          print('fresh exact status counts=',Counter(str(x[1]) for x in fresh))
          for x in fresh[:20]: print(' | '.join(map(str,x)))
          PY

      - name: Bundle Android assets
        run: gradle -p floodsafe-android-app clean :app:bundleFloodSafe --no-daemon

      - name: Optimize retained web assets
        run: |
          python3 floodsafe-android-app/patch_low_end_sathi.py
          python3 floodsafe-android-app/patch_low_end_map.py

      - name: Build and unit test APK
        run: gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug -x bundleFloodSafe --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-waterways-snapshot.json'
          unzip -l "$APK" | grep -Fq 'assets/data/nepal-waterways-tiles/overview.json'

      - name: Rename APK
        run: cp floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk FloodSafe-Nepal-v0.8.16-CURRENT-OFFICIAL-ONLY.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-v0816-CURRENT-OFFICIAL-ONLY-APK
          path: FloodSafe-Nepal-v0.8.16-CURRENT-OFFICIAL-ONLY.apk
          if-no-files-found: error
          retention-days: 14
