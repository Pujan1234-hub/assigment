name: Quick v0.9.18 animated cloud marker APK

on:
  push:
    branches:
      - fix/v0-9-18-sathi-next-level
    paths:
      - '.github/workflows/quick-v0918-animated-cloud-marker-apk.yml'
      - '.github/scripts/patch_v0918_animated_cloud_marker_only.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore verified native v0.9.18 and animate only the existing cloud marker
        shell: bash
        run: |
          set -euo pipefail
          J='floodsafe-android-app/app/src/main/java/io/github/pujan1234hub/floodsafe/app'
          mkdir -p /tmp/current-v0918-overlay
          cp "$J/PJBuiltsSplashActivity.java" /tmp/current-v0918-overlay/
          cp "$J/MonitoringSafetyProvider.java" /tmp/current-v0918-overlay/
          cp "$J/SathiNextLevelV0918.java" /tmp/current-v0918-overlay/
          cp floodsafe-android-app/app/src/main/AndroidManifest.xml /tmp/current-v0918-overlay/AndroidManifest.xml

          git fetch --no-tags --depth=1 origin 00eab9a3d2a5256bcb353a24b39b549182367696
          git checkout 00eab9a3d2a5256bcb353a24b39b549182367696 -- floodsafe-android-app
          git fetch --no-tags --depth=1 origin 50a2f51b1dd1427c1f5ed0e78cdc5f6272c791f4
          git checkout 50a2f51b1dd1427c1f5ed0e78cdc5f6272c791f4 -- floodsafe-android-app/patch_native_v0918_stability_performance.py

          cp /tmp/current-v0918-overlay/PJBuiltsSplashActivity.java "$J/PJBuiltsSplashActivity.java"
          cp /tmp/current-v0918-overlay/MonitoringSafetyProvider.java "$J/MonitoringSafetyProvider.java"
          cp /tmp/current-v0918-overlay/SathiNextLevelV0918.java "$J/SathiNextLevelV0918.java"

          python3 floodsafe-android-app/patch_native_language_safe.py
          python3 floodsafe-android-app/patch_native_weather_complete.py
          python3 floodsafe-android-app/patch_native_weather_station_correction.py
          python3 floodsafe-android-app/patch_native_v0906_district_196_rain.py
          python3 floodsafe-android-app/patch_native_v0907_district_click.py
          python3 floodsafe-android-app/patch_native_v0908_step1_river_click.py
          python3 floodsafe-android-app/patch_native_v0908_step2_compact_district.py
          python3 floodsafe-android-app/fix_v0908_step3_weather_refresh_anchor.py
          python3 floodsafe-android-app/patch_native_v0908_step3_storm_notifications.py
          python3 floodsafe-android-app/patch_native_v0909_sync_sathi_language.py
          python3 floodsafe-android-app/fix_v0909_district_lambda_compile.py
          python3 floodsafe-android-app/patch_native_v0910_step1_sathi_chat.py
          python3 floodsafe-android-app/patch_native_v0910_step2_map_labels.py
          python3 floodsafe-android-app/run_v0911_patch_fixed.py
          python3 floodsafe-android-app/fix_v0911_threshold_order.py
          python3 floodsafe-android-app/patch_native_v0912_weather_rain_parity.py
          python3 floodsafe-android-app/patch_native_v0913_dhm_rain_overlay.py
          python3 floodsafe-android-app/patch_native_v0914_current_rain_only.py
          python3 floodsafe-android-app/fix_v0915_weather_icon_patch_script.py
          python3 floodsafe-android-app/patch_native_v0915_weather_icons.py
          python3 floodsafe-android-app/fix_v0916_patch_script.py
          python3 floodsafe-android-app/fix_v0916_patch_script_v2.py
          python3 floodsafe-android-app/fix_v0916_patch_script_v3.py
          python3 floodsafe-android-app/patch_native_v0916_sathi_knowledge.py
          python3 floodsafe-android-app/fix_v0917_marker_comments.py
          python3 floodsafe-android-app/patch_native_v0917_weather_runtime.py
          python3 floodsafe-android-app/patch_native_v0918_stability_performance.py

          # Preserve all fixes the user already approved.
          python3 .github/scripts/patch_v0918_userfix.py
          python3 .github/scripts/patch_v0918_sathi_visual_text_only.py
          python3 .github/scripts/patch_v0918_language_no_map_reload.py

          # ONLY this turn: fix/animate the existing in-map cloud weather marker.
          python3 .github/scripts/patch_v0918_animated_cloud_marker_only.py

          cp /tmp/current-v0918-overlay/AndroidManifest.xml floodsafe-android-app/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('floodsafe-android-app/app/build.gradle')
          s=p.read_text()
          s=s.replace("versionCode 35", "versionCode 116")
          s=s.replace("versionName '0.9.18-stability-performance'", "versionName '0.9.18-animated-cloud-marker'")
          if "androidx.webkit:webkit:1.12.1" not in s:
              s=s.replace("dependencies {\n", "dependencies {\n    implementation 'androidx.webkit:webkit:1.12.1'\n")
          p.write_text(s)
          PY

          # Existing native app invariants.
          grep -Fq 'No WebView is used' "$J/NativeFullActivity.java"
          grep -Fq 'RADIUS_KM=2d' "$J/FloodLiveGaugeMonitor.java"
          grep -Fq 'new Intent(this, NativeFullActivity.class)' "$J/PJBuiltsSplashActivity.java"
          grep -Fq '✦  SATHI AI' "$J/NativeFullActivity.java"
          grep -Fq 'spoken answer disabled by user request' "$J/SathiNextLevelV0918.java"
          grep -Fq 'V0918_LANGUAGE_KEEP_MAP_VISIBLE' "$J/NativeFullActivity.java"

          # This exact change only: existing cloud marker is cloud-shaped and animated.
          grep -Fq 'V0918_ANIMATED_CLOUD_MARKER_ONLY' "$J/WeatherMapOverlayController.java"
          grep -Fq 'cloudMarkerTick' "$J/WeatherMapOverlayController.java"
          grep -Fq 'applyCloudMarkerAnimation' "$J/WeatherMapOverlayController.java"
          grep -Fq 'LYR_ICON_CLOUD' "$J/WeatherMapOverlayController.java"

          # Do NOT include the previous roaming/random cloud overlay.
          if grep -Fq 'SRC_CLOUD_SPRITES' "$J/WeatherMapOverlayController.java"; then exit 1; fi
          if grep -Fq 'cloudSprites(snapshot()' "$J/WeatherMapOverlayController.java"; then exit 1; fi

      - name: Build native APK
        run: gradle -p floodsafe-android-app :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK='floodsafe-android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" > /tmp/floodsafe-apk-list.txt
          grep -Eq 'classes[0-9]*\.dex' /tmp/floodsafe-apk-list.txt
          grep -Fq 'AndroidManifest.xml' /tmp/floodsafe-apk-list.txt
          grep -Fq 'assets/floodsafe-nepal/v24/nepal-districts.geojson' /tmp/floodsafe-apk-list.txt
          grep -Fq 'assets/data/nepal-waterways-tiles/overview.json' /tmp/floodsafe-apk-list.txt
          if grep -Eq 'assets/.*\.(html|js|mjs|webmanifest)$' /tmp/floodsafe-apk-list.txt; then exit 1; fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" FloodSafe-Nepal-v0.9.18-ANIMATED-CLOUD-MARKER.apk
          sha256sum FloodSafe-Nepal-v0.9.18-ANIMATED-CLOUD-MARKER.apk > FloodSafe-Nepal-v0.9.18-ANIMATED-CLOUD-MARKER-SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloodSafe-Nepal-v0.9.18-ANIMATED-CLOUD-MARKER-APK
          path: |
            FloodSafe-Nepal-v0.9.18-ANIMATED-CLOUD-MARKER.apk
            FloodSafe-Nepal-v0.9.18-ANIMATED-CLOUD-MARKER-SHA256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish Android test APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: floodsafe-v0.9.18-android-test
          name: FloodSafe Nepal Android Test v0.9.18
          prerelease: true
          files: |
            FloodSafe-Nepal-v0.9.18-ANIMATED-CLOUD-MARKER.apk
            FloodSafe-Nepal-v0.9.18-ANIMATED-CLOUD-MARKER-SHA256.txt
