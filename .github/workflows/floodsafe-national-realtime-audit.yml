name: FloodSafe National Realtime Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'floodsafe-nepal/v25/trusted-river-runtime-v1.js'
      - 'floodsafe-nepal/v25/trusted-rain-runtime-v1.js'
      - 'floodsafe-nepal/v25/index.html'
      - '.github/workflows/floodsafe-national-realtime-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax check
        run: |
          node --check floodsafe-nepal/v25/trusted-river-runtime-v1.js
          node --check floodsafe-nepal/v25/trusted-rain-runtime-v1.js
      - name: Audit all official BIPAD river and rain station pages
        run: |
          python - <<'PY'
          import json, urllib.request
          from datetime import datetime, timezone, timedelta

          BASE='https://bipadportal.gov.np/api/v1/'
          HEAD={'User-Agent':'Mozilla/5.0 FloodSafe-national-realtime-audit','Accept':'application/json'}

          def fetch_all(url, max_pages=20):
              out=[]; pages=0; total=None; remaining=None
              while url and pages < max_pages:
                  req=urllib.request.Request(url,headers=HEAD)
                  with urllib.request.urlopen(req,timeout=40) as r: j=json.load(r)
                  part=j if isinstance(j,list) else j.get('results') or j.get('data') or []
                  pages+=1
                  if not part:
                      remaining=None
                      break
                  out.extend(part)
                  if total is None and isinstance(j,dict):
                      c=j.get('count')
                      if isinstance(c,int) and 0 <= c < 100000: total=c
                  remaining=j.get('next') if isinstance(j,dict) else None
                  if not remaining or remaining == 'null': break
                  url=remaining
              return out,pages,total,remaining if pages>=max_pages else None

          def parse_time(v):
              if not v:return None
              try:
                  d=datetime.fromisoformat(str(v).replace('Z','+00:00'))
                  return d if d.tzinfo else d.replace(tzinfo=timezone.utc)
              except:return None

          now=datetime.now(timezone.utc)
          def is_fresh(row, keys):
              d=None
              for k in keys:
                  d=parse_time(row.get(k))
                  if d: break
              if not d:return False
              age=now-d.astimezone(timezone.utc)
              return timedelta(minutes=-5)<=age<=timedelta(minutes=20)

          rivers,rpages,rtotal,rnext=fetch_all(BASE+'river-stations/?limit=500&ordering=-waterLevelOn')
          rains,apages,atotal,anext=fetch_all(BASE+'rain-stations/?limit=500')
          rfresh=[x for x in rivers if is_fresh(x,['waterLevelOn','water_level_on','measuredOn','measurementTime','observationTime']) and x.get('waterLevel') is not None]
          afresh=[x for x in rains if is_fresh(x,['rainfallOn','rainfall_on','measuredOn','measurementTime','observationTime','updatedOn','modifiedOn','timestamp','dateTime','datetime'])]

          print('river fetched=',len(rivers),'usable_api_count=',rtotal,'pages=',rpages,'fresh<=20m=',len(rfresh),'truncated=',bool(rnext))
          print('rain fetched=',len(rains),'usable_api_count=',atotal,'pages=',apages,'fresh<=20m=',len(afresh),'truncated=',bool(anext))
          if rains:
              print('rain sample keys=',sorted(rains[0].keys()))
              print('rain sample averages=',json.dumps(rains[0].get('averages'),ensure_ascii=False)[:2000])
          if rivers: print('river sample keys=',sorted(rivers[0].keys()))

          assert rivers, 'No river stations returned by official BIPAD endpoint'
          assert rains, 'No rain stations returned by official BIPAD endpoint'
          assert not rnext, 'River station pagination exceeded 20 pages'
          assert not anext, 'Rain station pagination exceeded 20 pages'
          if isinstance(rtotal,int): assert len(rivers) >= rtotal, f'River pagination incomplete: {len(rivers)}/{rtotal}'
          if isinstance(atotal,int): assert len(rains) >= atotal, f'Rain pagination incomplete: {len(rains)}/{atotal}'
          PY
