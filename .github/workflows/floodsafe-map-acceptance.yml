name: FloodSafe Map Acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'floodsafe-nepal/v25/index.html'
      - 'floodsafe-nepal/v25/map-*.js'
      - 'floodsafe-nepal/v25/hydro-smooth-v2.js'
      - 'floodsafe-nepal/v25/trusted-river-runtime-v1.js'
      - 'floodsafe-nepal/v25/realtime-guard-v1.js'
      - 'floodsafe-nepal/v25/river-current-20m-v1.js'
      - 'floodsafe-nepal/v25/gauge-bridge.js'
      - 'floodsafe-nepal/v25/river-line-status-v1.js'
      - 'floodsafe-nepal/v25/river-map-detail-v2.js'
      - 'floodsafe-nepal/v25/river-line-style-v1.js'
      - '.github/workflows/floodsafe-map-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: floodsafe-map-acceptance
  cancel-in-progress: true
jobs:
  live-map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and trusted observation contract
        run: |
          set -euo pipefail
          for f in floodsafe-nepal/v25/{trusted-river-runtime-v1.js,realtime-guard-v1.js,river-current-20m-v1.js,map-smooth-v3.js,hydro-smooth-v2.js,gauge-bridge.js,river-line-status-v1.js,river-map-detail-v2.js,river-line-style-v1.js}; do node --check "$f"; done
          grep -Fq '__fsTrustedRiverRuntimeV11' floodsafe-nepal/v25/trusted-river-runtime-v1.js
          grep -Fq 'MAX=20*60*1000' floodsafe-nepal/v25/trusted-river-runtime-v1.js
          grep -Fq '__fsHydroSmoothV7' floodsafe-nepal/v25/hydro-smooth-v2.js
          grep -Fq 'MAX=20*60*1000' floodsafe-nepal/v25/hydro-smooth-v2.js
          grep -Fq '__fsRiverMapDetailV21' floodsafe-nepal/v25/river-map-detail-v2.js
          ! grep -Fq 'NO CURRENT ≤5M' floodsafe-nepal/v25/river-map-detail-v2.js

      - name: Probe official BIPAD source
        run: |
          python - <<'PY'
          import json, urllib.request
          from datetime import datetime, timezone
          u='https://bipadportal.gov.np/api/v1/river-stations/?limit=2000&ordering=-waterLevelOn'
          req=urllib.request.Request(u,headers={'Accept':'application/json','Origin':'https://pujan1234-hub.github.io','User-Agent':'FloodSafe-Nepal-acceptance'})
          with urllib.request.urlopen(req,timeout=35) as r:
              assert r.status==200
              assert r.headers.get('Access-Control-Allow-Origin') in ('*','https://pujan1234-hub.github.io')
              j=json.loads(r.read().decode('utf-8-sig'))
          rows=j if isinstance(j,list) else j.get('results') or j.get('data') or []
          now=datetime.now(timezone.utc); current=0; reversed_count=0
          for x in rows:
              t=x.get('waterLevelOn') or x.get('measuredOn') or x.get('measurementTime')
              try: d=datetime.fromisoformat(str(t).replace('Z','+00:00')).astimezone(timezone.utc)
              except: d=None
              if d and x.get('waterLevel') is not None and -5 <= (now-d).total_seconds()/60 <= 20: current+=1
              c=(x.get('point') or {}).get('coordinates') or []
              if len(c)>=2 and 26<=float(c[0])<=31 and 79.5<=float(c[1])<=89: reversed_count+=1
          print('OFFICIAL',len(rows),'current<=20m',current,'reversed coords',reversed_count)
          assert len(rows)>=200 and current>=1 and reversed_count>=1
          PY

      - name: Wait for exact deployed build
        run: |
          set -euo pipefail
          U='https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/'
          ok=0
          for i in $(seq 1 120); do
            h="$(curl --max-time 12 -fsSL "${U}?accept=${GITHUB_SHA}-${i}" || true)"
            if [[ "$h" == *'trusted-river-runtime-v1.js?v=11'* && "$h" == *'gauge-bridge.js?v=21'* && "$h" == *'river-line-status-v1.js?v=8'* && "$h" == *'map-loader-v3.js?v=13'* && "$h" == *'river-map-detail-v2.js?v=21'* && "$h" == *'≤२० मिनेट'* ]]; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
          l="$(curl --max-time 12 -fsSL "${U}map-loader-v3.js?v=13&accept=${GITHUB_SHA}")"
          y="$(curl --max-time 12 -fsSL "${U}hydro-smooth-v2.js?v=6&accept=${GITHUB_SHA}")"
          r="$(curl --max-time 12 -fsSL "${U}trusted-river-runtime-v1.js?v=11&accept=${GITHUB_SHA}")"
          [[ "$l" == *'__fsSmoothMapLoadingV7'* && "$l" == *'hydro-smooth-v2.js?v=6'* ]]
          [[ "$y" == *'__fsHydroSmoothV7'* && "$y" == *'isStyleLoaded'* && "$y" == *'__fsHydroLayerReady'* ]]
          [[ "$r" == *'__fsTrustedRiverRuntimeV11'* && "$r" == *'BIPAD river-stations direct'* && "$r" == *'nepXY'* ]]

      - name: Browser acceptance
        env:
          APP: https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"; test -n "$CHROME"
          mkdir -p /tmp/mapaccept && cd /tmp/mapaccept; npm init -y >/dev/null 2>&1; npm install --no-save puppeteer-core@24.31.0 >/dev/null 2>&1
          APP="$APP" CHROME="$CHROME" node <<'JS'
          const puppeteer=require('puppeteer-core'),wait=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--enable-unsafe-swiftshader']});
            const p=await b.newPage();p.setDefaultTimeout(120000);await p.setViewport({width:1280,height:900});
            const errors=[];p.on('pageerror',e=>errors.push(String(e)));p.on('console',m=>{if(['error','warning'].includes(m.type()))console.log('PAGE',m.type(),m.text())});
            await p.goto(process.env.APP+'?accept='+Date.now()+'#map',{waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>window.__fsSmoothMapLoaded&&window.__fsHydroSmoothLoaded&&window.FloodSafeMap?.initialized,{timeout:120000});
            await p.waitForFunction(()=>window.FloodSafeHydroSmooth?.overviewCount>=6000&&window.FloodSafeHydroSmooth?.manifest?.count>=60000,{timeout:120000});
            try{await p.waitForFunction(()=>window.__fsHydroLayerReady&&window.FloodSafeMap?.map?.getLayer?.('hydro-complete-lines'),{timeout:60000})}catch(e){console.log('HYDRO DIAG',await p.evaluate(()=>({ready:window.__fsHydroLayerReady,error:window.__fsHydroEnsureError,style:window.FloodSafeMap?.map?.isStyleLoaded?.(),moving:window.FloodSafeMap?.map?.isMoving?.(),layers:(window.FloodSafeMap?.map?.getStyle?.()?.layers||[]).map(x=>x.id),sources:Object.keys(window.FloodSafeMap?.map?.getStyle?.()?.sources||{})})));throw e}
            await p.waitForFunction(()=>window.__fsRiverRealtimeState?.source==='BIPAD river-stations direct'&&window.__fsRiverRealtimeState?.currentCount>0,{timeout:90000});
            await p.waitForFunction(()=>window.FloodSafeMap?.stationCatalogCount>=200,{timeout:30000});await wait(1000);

            const live=await p.evaluate(()=>{const S=window.FloodSafe.state,R=window.__fsRiverRealtimeState,m=window.FloodSafeMap.map,h=m.getSource('hydro-complete')?.serialize?.()?.data?.features||[],g=m.getSource('gauges')?.serialize?.()?.data?.features||[],v=(o,k)=>{for(const x of k)if(o?.[x]!==undefined&&o?.[x]!==null&&o?.[x]!=='')return o[x];return null},n=x=>Number.isFinite(Number(x))?Number(x):null,stage=o=>{const l=n(v(o,['waterLevel','water_level'])),w=n(v(o,['warningLevel','warning_level','_lastWarningLevel'])),d=n(v(o,['dangerLevel','danger_level','_lastDangerLevel'])),r=String(v(o,['_officialStatus','status'])||'').toUpperCase();if(l!==null&&d!==null&&d>0&&l>=d||/DANGER|RED/.test(r)&&!/BELOW\s+DANGER/.test(r))return'danger';if(l!==null&&w!==null&&w>0&&l>=w||/WARNING|ORANGE/.test(r)&&!/BELOW\s+WARNING/.test(r))return'warning';if(/WATCH|RISING|INCREASING|YELLOW/.test(r))return'watch';return'normal'};const ages=(S.stations||[]).map(o=>Date.now()-+new Date(v(o,['_measurementTime','waterLevelOn','water_level_on','measuredOn','measurementTime'])||0)),ab=(S.stations||[]).filter(o=>stage(o)!=='normal').map(o=>String(v(o,['title','river_name','riverName','station_name','name'])||'')),matched=new Set(h.filter(f=>['watch','warning','danger'].includes(f.properties?.live_status)).map(f=>String(f.properties.live_station||''))),all=S.allRiverStations||[],ros=all.find(o=>/Roshi Khola at Kavre/i.test(String(v(o,['title','name'])||'')));return{source:R.source,current:R.currentCount,catalog:R.catalogCount,catalogCoords:R.catalogWithCoordinates,mapCatalog:window.FloodSafeMap.stationCatalogCount,gauges:g.length,districts:window.FloodSafeMap.districtCount,overview:window.FloodSafeHydroSmooth.overviewCount,total:window.FloodSafeHydroSmooth.manifest.count,hydro:h.length,maxAge:ages.length?Math.max(...ages):null,unmatched:ab.filter(x=>x&&!matched.has(x)),roshi:{raw:ros?.point?.coordinates||null,norm:ros?window.FloodSafeRiverRealtime.coords(ros):null},paint:JSON.stringify(m.getPaintProperty('hydro-complete-lines','line-color')),hint:document.getElementById('mapHint')?.textContent||''}});
            console.log('LIVE',JSON.stringify(live));
            if(live.current<1||live.catalog<200||live.catalogCoords<200||live.mapCatalog!==live.gauges||live.mapCatalog<200)throw Error('station coverage '+JSON.stringify(live));
            if(live.districts!==77||live.overview<6000||live.total<60000||live.hydro<1000)throw Error('river coverage '+JSON.stringify(live));
            if(live.maxAge>1210000)throw Error('stale current reading '+live.maxAge);
            if(!live.roshi.norm||live.roshi.norm[0]<79.5||live.roshi.norm[0]>89||live.roshi.norm[1]<26||live.roshi.norm[1]>31)throw Error('coordinate normalization '+JSON.stringify(live.roshi));
            if(live.unmatched.length)throw Error('abnormal official river not coloured '+JSON.stringify(live.unmatched));
            if(!live.paint.includes('#ff7a00')||!live.paint.includes('#ff2d20'))throw Error('palette missing');
            if(/≤\s*[45]m|≤\s*[४५]m/.test(live.hint))throw Error('old freshness UI '+live.hint);

            const perf=await p.evaluate(async()=>{const src=window.FloodSafeMap.map.getSource('hydro-complete');let setData=0,events=0;const orig=src.setData.bind(src);src.setData=(...a)=>{setData++;return orig(...a)};const f=()=>events++;window.addEventListener('fsriverlinestatus',f);let gap=0,last=performance.now(),end=last+5000;await new Promise(done=>{function frame(now){gap=Math.max(gap,now-last);last=now;if(now>=end)return done();requestAnimationFrame(frame)}requestAnimationFrame(frame)});window.removeEventListener('fsriverlinestatus',f);src.setData=orig;return{setData,events,gap}});console.log('PERF',JSON.stringify(perf));if(perf.setData>1||perf.events>1||perf.gap>650)throw Error('map jank '+JSON.stringify(perf));

            const target=await p.evaluate(()=>{const m=window.FloodSafeMap.map,fs=m.getSource('hydro-complete')?.serialize?.()?.data?.features||[],c=m.getCanvas();for(const f of fs){const a=f.geometry?.type==='LineString'?f.geometry.coordinates:null;if(!a?.length||!String(f.properties?.name||'').trim())continue;const q=a[Math.floor((a.length-1)/2)],pt=m.project(q);if(pt.x>40&&pt.y>40&&pt.x<c.clientWidth-40&&pt.y<c.clientHeight-40)return{x:pt.x,y:pt.y,id:f.properties.id,name:f.properties.name,q,feature:f}}return null});if(!target)throw Error('no river target');
            await p.mouse.click(target.x,target.y);await p.waitForSelector('#riverDetailSheet:not([hidden])',{timeout:15000});const d=await p.evaluate(()=>({grid:document.querySelectorAll('#riverDetailSheet .sheetGridGL>div').length,meta:document.querySelectorAll('#riverDetailSheet .sheetMetaGL p').length,text:document.getElementById('riverDetailSheet')?.textContent||'',state:window.__fsLastRiverDetail}));if(d.grid<8||d.meta<10||!d.state?.name||!/20|२०/.test(d.text))throw Error('click detail incomplete');

            await p.evaluate(t=>{window.__orig=(window.FloodSafe.state.stations||[]).slice();window.__set=x=>{const z=new Date().toISOString();window.FloodSafe.state.stations=[{title:t.name,waterLevel:x,warningLevel:5,dangerLevel:8,_measurementTime:z,waterLevelOn:z,_measurementTimeTrusted:true,_current20m:true,_stationCoordinate:t.q,point:{coordinates:t.q},dataSource:'acceptance'}];window.FloodSafeRiverLine.rebuild(true)};window.__set(6)},target);
            const expect=async s=>p.waitForFunction((id,s)=>(window.FloodSafeMap.map.getSource('hydro-complete')?.serialize?.()?.data?.features||[]).some(f=>String(f.properties.id)===String(id)&&f.properties.live_status===s),{timeout:15000},target.id,s);await expect('warning');await p.evaluate(()=>window.__set(9));await expect('danger');await p.evaluate(t=>window.FloodSafeRiverDetail.show(t.feature,{lng:t.q[0],lat:t.q[1]}),target);await wait(250);const danger=await p.evaluate(()=>({s:window.__fsLastRiverDetail,c:window.FloodSafeMap.map.getPaintProperty('hydro-complete-selected','line-color')}));if(danger.s?.status!=='danger'||danger.s?.gauge?.level!==9||danger.c!=='#ff2d20')throw Error('danger reaction '+JSON.stringify(danger));
            await p.evaluate(t=>{const z=new Date(Date.now()-21*60*1000).toISOString();window.FloodSafe.state.stations=[{title:t.name,waterLevel:9,warningLevel:5,dangerLevel:8,_measurementTime:z,waterLevelOn:z,_measurementTimeTrusted:true,_current20m:false,_stationCoordinate:t.q,point:{coordinates:t.q}}];window.FloodSafeRiverLine.rebuild(true)},target);await expect('unknown');await p.evaluate(()=>{window.FloodSafe.state.stations=window.__orig||[];window.FloodSafeRiverLine.rebuild(true)});
            if(errors.some(x=>/SyntaxError|TypeError|FloodSafe smooth map runtime failed/.test(x)))throw Error('browser errors '+JSON.stringify(errors));
            console.log('PASS FloodSafe realtime map');await b.close();
          })().catch(e=>{console.error(e);process.exit(3)});
          JS
