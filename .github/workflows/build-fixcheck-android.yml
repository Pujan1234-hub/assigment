name: Build FixCheck Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'fixcheck/**'
      - 'fixcheck-app/**'
      - '.github/workflows/build-fixcheck-android.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fixcheck-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare tested FixCheck web source
        run: npm run prepare:web
      - name: Generate Android project
        run: npx cap add android
      - name: Sync web assets
        run: npx cap sync android
      - name: Apply FixCheck icon
        run: |
          npm run make:icons
          node scripts/android-brand.mjs
      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FixCheck-Android-debug
          path: fixcheck-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload full Android Studio project
        uses: actions/upload-artifact@v4
        with:
          name: FixCheck-AndroidStudio-project
          path: |
            fixcheck-app/android/**
            !fixcheck-app/android/.gradle/**
            !fixcheck-app/android/**/build/**
          if-no-files-found: error
