name: FloodSafe Human Status Sync

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_floodsafe_people.py'
      - '.github/workflows/floodsafe-human-status-sync.yml'

permissions:
  contents: write

concurrency:
  group: floodsafe-human-status
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest Human Status metrics
        run: python scripts/update_floodsafe_people.py
      - name: Commit changed Human Status
        shell: bash
        run: |
          if git diff --quiet -- data/floodsafe-people-status.json; then echo 'No Human Status change'; exit 0; fi
          git config user.name 'FloodSafe Human Status Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/floodsafe-people-status.json
          git commit -m 'Update Human Status metrics'
          git pull --rebase origin main
          git push origin HEAD:main
