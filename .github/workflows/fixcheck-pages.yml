name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - sw.js
      - auto-update.js
      - portfolio-floodsafe.js
      - fixcheck/**
      - team-tracker/**
      - floodsafe-nepal/**
      - .github/workflows/fixcheck-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare public site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          cp index.html _site/index.html
          cp sw.js _site/sw.js
          cp auto-update.js _site/auto-update.js
          cp portfolio-floodsafe.js _site/portfolio-floodsafe.js
          cp -R fixcheck _site/fixcheck
          cp -R team-tracker _site/team-tracker
          cp -R floodsafe-nepal _site/floodsafe-nepal

          printf '%s' "$GITHUB_SHA" > _site/build-version.txt

          # Public portfolio wording should reflect hands-on product work, not attribute the work to AI.
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('_site/index.html')
          s=p.read_text()
          s=s.replace(
              'AI-assisted development helps move from idea to prototype quickly, but product quality still depends on the problem definition, user flow, testing and honest limitations.',
              'I develop each product through hands-on design, building, testing and repeated refinement, with the focus on solving the problem clearly and making each version more useful.'
          )
          s=s.replace(
              'I use modern web tools and AI-assisted workflows to move from idea to testable prototype quickly.',
              'I turn ideas into testable prototypes through hands-on design, building, testing and iteration.'
          )
          s=s.replace('AI-assisted development','hands-on development')
          s=s.replace('AI-assisted workflows','hands-on development workflows')
          s=s.replace('AI-assisted','hands-on')
          s=re.sub(r'\bAI\b','software',s)
          p.write_text(s)
          PY

          # Main portfolio always loads the latest product module and checks for new deployments.
          sed -i 's#</head>#<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"></head>#' _site/index.html
          sed -i 's#</body>#<script src="./portfolio-floodsafe.js?v=2"></script><script src="./auto-update.js?v=2"></script></body>#' _site/index.html

          # FloodSafe patches must be present on first page load; do not wait for a service-worker update cycle.
          python - <<'PY'
          from pathlib import Path
          for ver in ('v23','v24'):
              p=Path('_site/floodsafe-nepal')/ver/'index.html'
              if not p.exists():
                  continue
              s=p.read_text()
              h=p.parent/'v23-hotfix.js'
              if h.exists():
                  tag='<script src="./v23-hotfix.js?v=4"></script>'
                  if tag not in s:
                      s=s.replace('</body>',tag+'</body>')
              ux=p.parent/'v23-ux.js'
              if ux.exists():
                  tag='<script src="./v23-ux.js?v=1"></script>'
                  if tag not in s:
                      s=s.replace('</body>',tag+'</body>')
              river=p.parent/'v23-river-map.js'
              if river.exists():
                  tag='<script src="./v23-river-map.js?v=1"></script>'
                  if tag not in s:
                      s=s.replace('</body>',tag+'</body>')
              p.write_text(s)
          PY

          # Stable FloodSafe URL automatically serves the highest numbered version folder.
          LATEST_FLOOD=$(find floodsafe-nepal -maxdepth 1 -mindepth 1 -type d -name 'v[0-9]*' -printf '%f\n' | sort -V | tail -1)
          if [ -n "$LATEST_FLOOD" ] && [ -f "floodsafe-nepal/$LATEST_FLOOD/index.html" ]; then
            cp -R "_site/floodsafe-nepal/$LATEST_FLOOD/." _site/floodsafe-nepal/
            echo "Stable FloodSafe URL now serves $LATEST_FLOOD"
          fi

          if grep -Eqi '\bAI\b|AI-assisted|artificial intelligence' _site/index.html; then
            echo 'AI attribution still present in public portfolio'
            exit 2
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify stable links and auto updater
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://pujan1234-hub.github.io/assigment
          for i in $(seq 1 25); do
            if curl -fsSL "$BASE/?t=$RANDOM" -o /tmp/home.html && curl -fsSL "$BASE/build-version.txt?t=$RANDOM" -o /tmp/version.txt && curl -fsSL "$BASE/floodsafe-nepal/?t=$RANDOM" -o /tmp/flood.html && curl -fsSL "$BASE/floodsafe-nepal/v23/?t=$RANDOM" -o /tmp/v23.html; then
              if grep -q 'portfolio-floodsafe.js?v=2' /tmp/home.html && grep -q 'auto-update.js?v=2' /tmp/home.html && grep -q 'बाढी सुरक्षा नेपाल' /tmp/flood.html && grep -q 'v23-hotfix.js?v=4' /tmp/v23.html && grep -q 'v23-ux.js?v=1' /tmp/v23.html && grep -q 'v23-river-map.js?v=1' /tmp/v23.html && test -s /tmp/version.txt; then
                if grep -Eqi '\bAI\b|AI-assisted|artificial intelligence' /tmp/home.html; then
                  echo 'AI attribution leaked into live portfolio'
                  exit 2
                fi
                echo 'Stable links, FloodSafe hotfix/UX/river map, automatic updater and portfolio wording verified'
                exit 0
              fi
            fi
            sleep 3
          done
          echo 'Stable link verification failed'
          exit 1
