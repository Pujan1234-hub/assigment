name: FloodSafe V25 Realtime Gate
on:
  push:
    branches: ["main"]
    paths:
      - "floodsafe-nepal/v25/**"
      - ".github/workflows/v25-browser-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: floodsafe-v25-realtime-gate
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for current production
        run: |
          set -euo pipefail
          BASE='https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/'
          ok=0
          for i in $(seq 1 60); do
            curl --max-time 10 -fsSL "${BASE}?ci=${GITHUB_SHA}-${i}" -o /tmp/index.html || true
            if grep -Fq 'map-v6.js?v=2' /tmp/index.html && grep -Fq 'language-pure.js?v=3' /tmp/index.html; then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1
          curl --max-time 12 -fsSL "${BASE}map-v6.js?ci=${GITHUB_SHA}" -o /tmp/map-v6.js
          node --check /tmp/map-v6.js
          grep -Fq '__fsMapV10' /tmp/map-v6.js
          grep -Fq 'gaugeFallback' /tmp/map-v6.js
          grep -Fq 'selectAt' /tmp/map-v6.js
      - name: Browser exact map regressions
        env:
          BASE: https://pujan1234-hub.github.io/assigment/floodsafe-nepal/v25/
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"; test -n "$CHROME"
          mkdir -p /tmp/floodsafe && cd /tmp/floodsafe
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24.31.0 >/dev/null 2>&1
          BASE="$BASE" CHROME="$CHROME" node <<'JS'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage']});
            const page=await browser.newPage();page.setDefaultTimeout(60000);page.setDefaultNavigationTimeout(60000);
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(process.env.BASE+'?ci='+Date.now(),{waitUntil:'networkidle2'});
            await page.waitForSelector('#riverMapV3');
            await page.waitForFunction(()=>window.FloodSafeMap&&window.FloodSafe?.state?.stations?.length>0,{timeout:30000});
            await page.click('#langBtn');await page.waitForFunction(()=>document.documentElement.lang==='en');
            const en=await page.evaluate(()=>({weather:[...document.querySelectorAll('.weatherGrid small')].map(x=>x.textContent),outside:document.querySelector('#outsideNotice strong')?.textContent||'',outsideText:outsideNoticeText.textContent,zoom:mapZoomIn.textContent}));
            if([en.outside,en.outsideText,en.zoom,...en.weather].some(x=>/[\u0900-\u097F]/.test(x)))throw Error('Nepali mixed in English '+JSON.stringify(en));
            const tests=[['Myagdi',28.5782,83.5343],['Sindhuli',27.164,86.328],['Jhapa',26.5763,87.9019]];
            const results=[];
            for(const [key,la,lo] of tests){
              await page.evaluate(([la,lo,key])=>window.FloodSafeMap.choose(la,lo,key),[la,lo,key]);
              await page.waitForFunction(()=>document.querySelectorAll('.riverV3').length>0&&document.querySelectorAll('.flowTraceV3').length>0,{timeout:8000});
              const r=await page.evaluate(()=>{const f=document.querySelector('.flowTraceV3');return{rivers:document.querySelectorAll('.riverV3').length,flows:document.querySelectorAll('.flowTraceV3').length,hint:mapHint.textContent,animation:f?getComputedStyle(f).animationName:'none',focus:window.FloodSafe?.state?.kind}});
              if(r.rivers<1||r.flows<1||r.animation==='none'||r.focus!=='map')throw Error(key+' failed '+JSON.stringify(r));
              results.push([key,r]);
            }
            if(errors.length)throw Error('page errors '+JSON.stringify(errors.slice(0,5)));
            console.log('PASS exact reported locations',{en,results});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(3)});
          JS
