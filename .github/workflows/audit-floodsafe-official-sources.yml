name: Audit FloodSafe Official River Sources

# 2026-09-20 Kathmandu gauge coordinate verification trigger
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/audit-floodsafe-official-sources.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Compare BIPAD catalog, BIPAD latest and DHM live stream
        shell: bash
        run: |
          set -u
          python3 - <<'PY'
          import json, re, html, urllib.request, socket

          BASE='https://bipadportal.gov.np/api/v1/'
          targets=['Balkhu','Balambu','Dhobi','Chabahil','Kapan','Manohara','Balkumari','Nagmati','Sundarijal','Gaurighat','Bishnumati','Gongabu','Samakhusi','Samakhushi','Sangla','Sangle','Salinadi','Sankhu']
          headers={'User-Agent':'FloodSafeNepal-source-audit/0.8.70','Accept':'application/json,text/html,*/*','Cache-Control':'no-cache'}
          socket.setdefaulttimeout(18)
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=18) as r:
                  return r.read().decode('utf-8','replace')
          def fetch_json(label,url):
              try:
                  j=json.loads(get(url))
                  rows=j.get('results') or j.get('data') or (j if isinstance(j,list) else [])
                  print(f'{label}_HTTP_OK count={j.get("count") if isinstance(j,dict) else None} first_page={len(rows) if isinstance(rows,list) else -1} next={j.get("next") if isinstance(j,dict) else None}')
                  return j, rows if isinstance(rows,list) else []
              except Exception as e:
                  print(f'{label}_ERROR {type(e).__name__}: {e}')
                  return {},[]
          def flatstr(o):
              try:return json.dumps(o,ensure_ascii=False).lower()
              except:return str(o).lower()
          def pick(o,*keys):
              if not isinstance(o,dict):return None
              f=o.get('fields') if isinstance(o.get('fields'),dict) else {}
              for k in keys:
                  if k in o and o[k] not in (None,''):return o[k]
                  if k in f and f[k] not in (None,''):return f[k]
              return None
          def point_of(r):
              if not isinstance(r,dict): return None
              f=r.get('fields') if isinstance(r.get('fields'),dict) else {}
              return r.get('point') if r.get('point') not in (None,'') else f.get('point')
          def coord_of(r):
              p=point_of(r)
              try:
                  if isinstance(p,str):
                      s=p.strip()
                      if s.startswith('{') or s.startswith('['): p=json.loads(s)
                      else:
                          m=re.search(r'POINT\s*\(\s*([-+0-9.]+)\s+([-+0-9.]+)\s*\)',s,re.I)
                          if m:return float(m.group(2)),float(m.group(1))
                  if isinstance(p,dict):
                      if isinstance(p.get('coordinates'),(list,tuple)) and len(p['coordinates'])>=2:return float(p['coordinates'][1]),float(p['coordinates'][0])
                      la=p.get('lat',p.get('latitude')); lo=p.get('lon',p.get('lng',p.get('longitude')))
                      if la is not None and lo is not None:return float(la),float(lo)
                  if isinstance(p,(list,tuple)) and len(p)>=2:return float(p[1]),float(p[0])
              except: pass
              return None
          def keyrow(r):
              return {
                'stationIndex':pick(r,'stationIndex','station_index','stationSeriesId','station_series_id','stationId','station_id'),
                'name':pick(r,'river_name','riverName','station_name','stationName','title','name'),
                'district':pick(r,'districtName','district_name','district'),
                'waterLevel':pick(r,'_lastWaterLevel','waterLevel','water_level','currentWaterLevel','current_water_level','currentLevel','current_level'),
                'warning':pick(r,'_lastWarningLevel','warningLevel','warning_level','warningThreshold','warning_threshold'),
                'danger':pick(r,'_lastDangerLevel','dangerLevel','danger_level','dangerThreshold','danger_threshold'),
                'time':pick(r,'waterLevelOn','water_level_on','measuredOn','measured_on','measurementTime','measurement_time','observationTime','observation_time','observedAt','observed_at','datetime','timestamp','_measurementTime'),
                'status':pick(r,'status','status_name','alertStatus','alert_status','riskLevel','risk_level'),
                'point':point_of(r),'coord':coord_of(r)
              }
          def dump_targets(label,rows):
              for r in rows:
                  s=flatstr(r)
                  if any(t.lower() in s for t in targets):
                      print(label+'_TARGET',json.dumps(keyrow(r),ensure_ascii=False,sort_keys=True))
          catalog_j,catalog=fetch_json('CATALOG',BASE+'river-stations/?limit=2000')
          latest_j,latest=fetch_json('LATEST',BASE+'river-stations/?latest=true&limit=2000')
          dump_targets('CATALOG',catalog); dump_targets('LATEST',latest)
          valid_catalog=[r for r in catalog if coord_of(r)]
          valid_latest=[r for r in latest if coord_of(r)]
          print(f'COORD_COVERAGE catalog={len(valid_catalog)}/{len(catalog)} latest={len(valid_latest)}/{len(latest)}')
          def norm(v):return re.sub(r'[^a-z0-9]+','',str(v or '').lower())
          def station_key(r):
              ix=pick(r,'stationIndex','station_index','stationSeriesId','station_series_id','stationId','station_id')
              nm=pick(r,'river_name','riverName','station_name','stationName','title','name')
              return ('i:'+norm(ix)) if ix else ('n:'+norm(nm))
          ck={station_key(r) for r in catalog}; lk={station_key(r) for r in latest}
          print(f'BIPAD_PARITY catalog_rows={len(catalog)} catalog_unique={len(ck)} latest_rows={len(latest)} latest_unique={len(lk)} catalog_not_latest={len(ck-lk)} latest_not_catalog={len(lk-ck)}')
          try:
              dhm=get('https://dhm.gov.np/hydrology/realtime-stream?_floodsafe_audit=1')
              trs=re.findall(r'(?is)<tr[^>]*>(.*?)</tr>',dhm)
              dhmrows=[]
              for tr in trs:
                  cells=[]
                  for c in re.findall(r'(?is)<t[dh][^>]*>(.*?)</t[dh]>',tr):
                      txt=re.sub(r'(?is)<[^>]+>',' ',c); txt=html.unescape(txt).replace('\xa0',' '); cells.append(re.sub(r'\s+',' ',txt).strip())
                  if len(cells)>=6 and cells[0].isdigit():dhmrows.append(cells)
              print('DHM_LIVE parsed_rows=',len(dhmrows))
              for c in dhmrows:
                  s=' | '.join(c)
                  if any(t.lower() in s.lower() for t in targets):print('DHM_TARGET',s)
          except Exception as e:
              print('DHM_ERROR',type(e).__name__,str(e))
          print('AUDIT_DONE')
          PY
